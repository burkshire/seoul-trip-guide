刚刚好。",[]],["【避雷黑榜（慎买！）】",[]],["芝士烤龙虾：价格刺客！一个要 2 万韩元（近 100 人民币），芝士味很淡，龙虾肉疑似冻货。",[]],["高价网红糖葫芦：主街有些摊位卖 50 元左右的糖葫芦，味道普通还贵，不如去便利店买现成的。",[]],["椰子虾：巨油！口感糊糊的很腻，虾肉也没什么味道，吃完容易反胃。",[]],["路边烤虾：烤的时候喷火情绪价值拉满，但味道一般，且很难判断新鲜度，建议慎选。",[]]]},{"id":1432,"title":"大创明洞站店","area":"明洞","chapter":"2⃣️ Day 2（11.29｜周日）：明洞（2免税店+午饭+26）","blocks":[["5.26 「🛍️｜大创明洞站店」（可以去dundun店，不用爬楼梯，大平层）",[]],["🕙 10:00 - 22:00（21:30 左右开始催客）｜💳微信支付宝✅｜满 15,000 韩元可退税",[]],["购物袋：买的东西多一定要买大号可重复使用的购物袋，结实耐用",[]],["推车不能上电梯，买得多的话建议拿购物篮。",[]],["【楼层分布与逛法】",[]],["建议直接坐电梯直冲 12 楼，再一层层往下逛，这样不走回头路。",[]],["12F 旅行饰品区：有旅行收纳袋、行李牌、发饰、袜子等，很适合旅游时临时补货或买伴手礼送朋友。",[]],["11F 工具手工区：各种修理工具、DIY 材料、汽车用品，被称为“临时救命区”，缺什么都能淘到。",[]],["10F 宠物园艺区：宠物小玩具、零食、假花、花盆，适合给家里的毛孩子带份小礼物。",[]],["9F 露营运动区：简单的户外折叠用品、运动辅助装备，很有韩国特色。",[]],["8F 浴室清洁区：拖鞋、粘毛器、一次性拖地工具、清洁用品，留学生和租房党必逛。",[]],["7F 家居收纳区：各种收纳盒、磁吸挂钩、香薰，能极大提升居家幸福感。",[]],["6F 餐具陶瓷区：韩系风格的碗盘、杯子、泡面锅，很适合刚来韩国租房的人置办生活用品。",[]],["5F 零食饮料区：韩国本地小零食、泡面、茶饮、咖啡，价格比外面划算，适合囤货当伴手礼。",[]],["4F 卡通儿童区：三丽鸥、米菲等可爱小物件、派对用品，小朋友和少女心爆棚的人会很爱。",[]],["3F 文具数码区：手账贴纸、胶带、手机支架、数据线、包装用品，适合手账爱好者和数码党。",[]],["2F 美妆个护区：整层都是彩妆、面膜、化妆工具、湿敷棉片，很多韩国本地女生爱用的平价好物。",[]],["1F 结账区：当季新品和统一结账区，买完东西直接在一楼结账。",[]],["【必买爆款推荐】",[]],["湿敷棉片、腮红膏、特色零食、收纳小包/毛绒卡套、餐具（玻璃餐具虽然好看但太重，不好托运，谨慎购买）",[]],["文具与伴手礼：ins风贺卡信封（约5元/个）、咕卡贴纸、收纳压缩袋、转接插头、洗漱包、分装袋、折叠凳。",[]],["",["323.webp"]],["",["324.webp"]],["",["325.webp"]],["",["326.webp"]],["电热睫毛夹（可托运）",[]],["",["327.webp"]],["",["328.webp"]],["粉：破皮前｜黄：破皮后",[]],["",["329.webp"]],["遮瑕",[]],["",["330.webp"]],["",["331.webp"]],["照片冰箱磁铁",[]],["",["332.webp"]],["",["333.webp"]],["",["334.webp"]],["衣服清洁剂",[]],["",["335.webp"]],["6. 🚇（路程15min）3号线｜明洞 ➡️ 三角地｜会贤方向 4站｜8号口🚶314m",[]]]},{"id":1474,"title":"🥩 昌火豚（창화돈）","area":"三角地","chapter":"2⃣️ Day 2（11.29｜周日）：明洞（2免税店+午饭+26）","blocks":[["7. 「晚饭｜🥩 昌火豚（창화돈）」20:50",[]],["🕙 16:00-20:50",[]],["【必点菜品推荐】",[]],["昌火豚招牌猪肉拼盘（창화돈 세트）：招牌必点！包含五花肉 170g + 颈肉 180g + 横膈膜肉 120g + 猪皮 60g，共 530g，两人吃刚刚好。肉经过 168 小时低温熟成和 1-2 日干式熟成交叉处理，肉香浓郁、口感层次丰富。",[]],["炭烤猪皮（껍데기）：他家的灵魂！猪皮用自家调制酱汁烤制，一口下去有淡淡的胶香，越嚼越出味，后调是浓郁的骨汤脂香。蘸着炒糯米粉吃，口感惊艳。",[]],["柴火五花肉（장작 오겹살）：肉先经过橡木柴火熏香初烤，再端上来二次炭火复烤，外皮微焦酥脆，内部柔软多汁。",[]],["泡菜汤、炒饭",[]],["拌冷面：冰凉酸爽，清甜解腻，吃完烤肉来一碗非常舒服。",[]],["",["336.webp"]]]},{"id":1484,"title":"3⃣️ Day 3（11.30｜周一）：林荫道（5）｜汝矣岛｜狎鸥亭（5+2🍸）｜江南","area":"其他商圈","chapter":"3⃣️ Day 3（11.30｜周一）：林荫道（5）｜汝矣岛｜狎鸥亭（5+2🍸）｜江南","blocks":[["3⃣️ Day 3（11.30｜周一）：林荫道（5）｜汝矣岛｜狎鸥亭（5+2🍸）｜江南",[]],["10:00出门",[]]]},{"id":1486,"title":"JOJO刀削面 조조칼국수","area":"其他商圈","chapter":"3⃣️ Day 3（11.30｜周一）：林荫道（5）｜汝矣岛｜狎鸥亭（5+2🍸）｜江南","blocks":[["1. 【早饭｜JOJO刀削面 조조칼국수】",[]],["🕙10:00 - 21:30",[]],["【探店小贴士】",[]],["提前取号：圣水店人气很旺，建议提前在 Catch Table 上远程取号，快到号了再过去，不用在现场干等。市厅店人相对少，可以直接 Walk in。",[]],["菜单极简：全店只有蛤蜊汤、刀削面、海鲜葱饼三个菜，都有中文菜单，扫码点餐，对游客非常友好。",[]],["一人食友好：分量很扎实，一个人点一碗蛤蜊汤或刀削面加一份葱饼就能吃饱，不需要强制拼单。",[]],["支付方式：支持信用卡，部分门店可能不支持微信/支付宝，建议带好现金或信用卡。",[]],["口味偏清淡：整体是韩式海鲜的清鲜微辣风格，如果你平时习惯重油重辣，可能会觉得味道偏淡，但搭配他家的免费辣椒蘸酱吃就很完美。",[]],["葱饼偏油：海鲜葱饼虽然好吃，但吃到后面可能会觉得有点油，建议搭配蛤蜊汤或者点一杯饮料解腻。",[]],["面条口感：手工刀削面比较劲道，但如果在汤里泡太久会失去口感，上桌后尽快吃完。",[]],["【必点菜品推荐】",[]],["蛤蜊汤（조개국）：看似清汤刮水，实则鲜掉眉毛！蛤蜊给得超多，颗颗饱满爆汁，汤底微辣清爽，一口下去非常开胃。很多食客觉得单点这碗汤就值回票价。",[]],["海鲜葱饼（해물파전）：店里的“王者”！外皮煎得超级焦脆，咬下去能听到“嘎嘣脆”的声音。上面铺满了虾仁、章鱼和扇贝肉，料非常足。建议点微辣，蘸着特制酱汁吃更香。",[]],["蛤蜊刀削面（조개칼국수）：手工现切的厚面，口感劲道有嚼劲。汤底和蛤蜊汤一样鲜甜，里面还配有应季蔬菜。不过有食客反馈面条泡久了会软，建议趁热吃。",[]],["🚌【45min】240 【永东大桥北端｜04189】6站到【狎鸥亭站4号口｜23105】🚶592m",[]]]},{"id":1501,"title":"2. *【林荫道】","area":"林荫道","chapter":"3⃣️ Day 3（11.30｜周一）：林荫道（5）｜汝矣岛｜狎鸥亭（5+2🍸）｜江南","blocks":[["2. *【林荫道】",[]]]},{"id":1502,"title":"ALAND","area":"林荫道","chapter":"3⃣️ Day 3（11.30｜周一）：林荫道（5）｜汝矣岛｜狎鸥亭（5+2🍸）｜江南","blocks":[["2.1 「🛍️｜ALAND」",[]],["🕙12:00-21:00",[]]]},{"id":1504,"title":"Kary Market（캐리마켓）","area":"林荫道","chapter":"3⃣️ Day 3（11.30｜周一）：林荫道（5）｜汝矣岛｜狎鸥亭（5+2🍸）｜江南","blocks":[["2.2 「🧒｜Kary Market（캐리마켓）」",[]],["🕙11:00-21:00｜💳 微信支付宝✅",[]],["【楼层分布与必逛区域】",[]],["1楼：咖啡厅 + 蒙奇奇专区 + heavenly jelly 鞋子。满墙的蒙奇奇，还有超火的 Hello Kitty 联名款。",[]],["2楼：家居与生活小物。香薰、身体护肤、厨房用品、家居收纳、成人居家服。",[]],["3楼：婴幼童专区。很多可爱又高级的新生儿及小童产品，代理的玩具和童装品牌很精致，Bebe de Pino 这最好试码。",[]],["4楼：大童潮流基地。适合大孩子的服饰、帽子、鞋子等配饰挺全的（尺寸 110-160）。",[]],["夹层隐藏彩蛋：1-2楼夹层有成人防晒及护肤产品；2-3楼夹层有 郑瑄茉 儿童系列，专为宝宝打造的防晒和敏感肌洗护用品，颜值与实力并存。",[]],["【逛店与避坑小贴士】",[]],["注意尺码差异：韩国的童装尺码偏小，建议按“身高 + 5cm”来选码更稳妥。",[]],["理性种草：虽然东西很可爱，但有些玩偶和周边价格也不低，建议先看好再下手，不要冲动消费。",[]],["价格亲民：童装和家居小物的价格非常友好，很多单品在 100-300 元人民币左右。",[]],["退税政策：汝矣岛现代百货店支持当场退税；新沙洞总店结账时需要在店里自助机扫码，离境前再去机场扫码拿退税款，流程稍微复杂一点，建议提前留好时间。",[]],["支付方式：支持国内信用卡、支付宝和微信支付，对游客非常友好。",[]],["【必买热门品牌与单品】",[]],["Monchhichi（蒙奇奇）周边：Kary Market 的招牌！各种造型的毛绒玩具、挂件、钥匙扣，还有韩国限定款（比如金色蒙奇奇），萌趣值拉满，喜欢可爱小物的人绝对逛到不想走。",[]],["Bebe de Pino：韩国很火的童装品牌，衣服精致又高级，在店里可以随便试穿，尺码齐全。",[]],["nununu：主打舒适和设计的童装品牌，面料柔软，款式简约耐看，宝妈们非常爱买。",[]],["儿童运动鞋：有 彪马、三叶草 等品牌的儿童款，款式多且尺码全，适合给家里的小朋友囤货。",[]],["WECHIK洗护用品：韩国高品质洗护品牌，设计感强，打折时囤洗衣液和洗洁非常划算。",[]]]},{"id":1524,"title":"GENTLE MONSTER","area":"林荫道","chapter":"3⃣️ Day 3（11.30｜周一）：林荫道（5）｜汝矣岛｜狎鸥亭（5+2🍸）｜江南","blocks":[["2.3 *「🕶️｜GENTLE MONSTER」",[]],["注意防调包：在免税店或专柜试戴时，注意保管好自己的物品；结账时检查眼镜是否有瑕疵，确认镜腿内侧序列号与防伪标签一致。",[]]]},{"id":1526,"title":"AVOUAVOU","area":"林荫道","chapter":"3⃣️ Day 3（11.30｜周一）：林荫道（5）｜汝矣岛｜狎鸥亭（5+2🍸）｜江南","blocks":[["2.4 *「AVOUAVOU」",[]],["https://avouavou.com｜贵贵套装",[]]]},{"id":1528,"title":"Marie mon dieu","area":"林荫道","chapter":"3⃣️ Day 3（11.30｜周一）：林荫道（5）｜汝矣岛｜狎鸥亭（5+2🍸）｜江南","blocks":[["2.5 *「Marie mon dieu」",[]],["https://mariemondieu.com/",[]],["【💰 价格参考】",[]],["大部分款式折合人民币 800-1000元 左右（一般九折后不到900）。",[]],["可以用支付宝支付。",[]],["【⚠️重要提醒】",[]],["码数偏小： 多位买家反馈要买大半码到一码，平时穿38的建议试38.5或39。",[]],["材质选择： 羊皮牛皮款更舒适，漆皮款前期可能磨脚。",[]],["鞋跟可定制： 部分款式可以选 2cm 或 5cm 跟高，买的时候问店员。",[]],["高脚背友好： 评论里多人提到鞋头宽，高脚背也能穿。",[]],["🚇 【40min】3#新沙站｜蚕院方向2站【高速巴士客运站】换乘9#｜3站【汝矣岛站】3号口🚶724m",[]]]},{"id":1539,"title":"3. 【汝矣岛百货】","area":"汝矣岛","chapter":"3⃣️ Day 3（11.30｜周一）：林荫道（5）｜汝矣岛｜狎鸥亭（5+2🍸）｜江南","blocks":[["3. 【汝矣岛百货】",[]],["🕙10:30-20:00（每个月不定期公休，记得查一下）",[]],["🚇地铁：5/9号线至汝矣岛站（3号出口首选：地下通道直达商场B2）",[]],["5号线汝矣渡口站一号口出来，直接转身向后走，不过十字路口直接右转直走就到啦。",[]],["【外国人专属福利（一定要去 6 楼薅羊毛）】",[]],["领取优惠券：到商场后，先直奔 6 楼 Global Lounge 外国人服务台，黑色取票机取号，国际会员服务台会有各种优惠券讲解。出示护照可以领取外国人专属折扣券、免费咖啡券或冰淇淋兑换券（消费满 5 万韩元即可兑换）。",[]],["先去六楼扫一个二维码，之后在网页搜对应品牌有无优惠，有的话直接出示页面和护照付款即可",[]],["银联/支付宝优惠：节假日期间，银联卡、支付宝和微信支付常有境外满减或返现活动，结账前一定要问店员确认。",[]],["【退税攻略】",[]],["大部分店铺单笔消费满 15,000 韩元即可当场退税，结账时主动出示护照原件，直接付免税价。",[]],["自助退税机：B2 层设有自助退税机，买完东西可以直接去机器上操作，非常方便。",[]],["注意机场核验：在市区退完税后，回国在仁川机场的自助退税机上扫描护照或退税单完成最终申报。如果没做这一步，退税款可能会被从担保的信用卡里扣回。",[]],["单笔上限：市区当场退税的单笔上限通常是 100 万韩元。如果买的东西超过 100 万，一定要分开结账。",[]],["【楼层分布与必逛区域】",[]],["",["337.webp"]],["",["338.webp"]],["",["339.webp"]],["",["340.webp"]],["",["341.webp"]],["",["342.webp"]],["",["343.webp"]],["",["344.webp"]],["B2（本土潮牌集合层）：这是最好逛的一层！EMIS、Matin Kim、Open YY、Low Classic、SATUR、Rockfish、「29cm home」、🥞CHEFFLÉ 치플레舒芙蕾 等韩国本土潮牌全集中在这里，款式新且尺码全。还有自助退税机，买完直接退。（阿迪达斯：提前在 6楼 外国人服务台领游客优惠券（阿迪达斯常有第二件7折活动），叠加退税更划算。）",[]],["B1（美食市集与伴手礼）：把首尔很多网红店都集合在了一起。London Bagel Museum、Artist Bakery 盐面包、Golden Piece 药果、Milestone Coffee等，不用去原店排长队，在这里直接买。",[]],["1F（奢侈品与美妆）：LV、香奈儿、宝格丽 等国际大牌，以及 Gentle Monster、Tamburins 等网红店。中庭还有超大的室内瀑布，非常出片。（dior夏季限定眼影#855 460r）",[]],["2F - 3F（男女时装与轻奢）：Acne Studios、Y-3、ALO 等潮流和轻奢品牌，适合慢慢淘衣服和包包。",[]],["4F（运动户外与家居）：Patagonia、Arc'teryx、Salomon、Montbell 等户外品牌集中区，还有各种提升幸福感的家居好物。",[]],["5F（Sounds Forest 空中花园）：商场里的室内森林，有草坪和天窗采光，逛累了在这里歇脚。",[]],["6F（外国人服务台与餐饮）：可以办理退税、领取外国人专属优惠券，还有各大餐厅",[]],["「5F｜拓麻歌子快闪」",[]],["",["345.webp"]]]},{"id":1574,"title":"水芹菜烤肉","area":"汝矣岛","chapter":"3⃣️ Day 3（11.30｜周一）：林荫道（5）｜汝矣岛｜狎鸥亭（5+2🍸）｜江南","blocks":[["4. 「🥩｜水芹菜烤肉」",[]],["🕙12:00-24:00",[]],["【必点菜品推荐】",[]],["水芹菜烤五花肉（미나리 삼겹살）：招牌必点！五花肉烤到边缘焦香，铺上满满的水芹菜一起烤。水芹菜吸满猪油后清香解腻，口感层次分明，是它家的灵魂吃法。",[]],["薄切急冻五花肉：薄薄一片的五花肉烤到微焦，蘸着特制的生鸡蛋酱吃，口感脆嫩，很多食客评价是\"首尔最好吃的薄五花\"。",[]],["水芹菜韩牛：如果预算充足可以点，韩牛搭配水芹菜一起吃，肉香和草本香融合，层次感拉满。",[]],["拌冷面：冰凉酸爽，清甜解腻，吃完烤肉来一碗非常舒服，很多食客评价不输专门的冷面店。",[]],["直火炒饭：用烤盘里剩下的五花肉油脂和泡菜汁炒饭，粒粒分明，香迷糊了，是完美的灵魂收尾。",[]]]},{"id":1582,"title":"5. 【狎鸥亭】","area":"狎鸥亭","chapter":"3⃣️ Day 3（11.30｜周一）：林荫道（5）｜汝矣岛｜狎鸥亭（5+2🍸）｜江南","blocks":[["5. 【狎鸥亭】",[]]]},{"id":1583,"title":"ALO","area":"狎鸥亭","chapter":"3⃣️ Day 3（11.30｜周一）：林荫道（5）｜汝矣岛｜狎鸥亭（5+2🍸）｜江南","blocks":[["5.1 *「🛍️｜ALO」",[]],["【逛店与避坑小贴士】",[]],["尺码偏大：ALO 的版型普遍偏大一码，平时穿 S 的姐妹建议尝试 XS，买之前一定要试穿。",[]],["试衣间排队：狎鸥亭和汉南洞的试衣间经常需要排队，部分门店限时 5-10 分钟，一次拿 5 件。",[]],["黑色纸袋掉色：有博主反馈 ALO 的黑色纸袋会掉色，如果买了浅色鞋子或衣服，注意不要和纸袋长时间接触，以免染色。",[]],["不要盲买：部分款式（如灰色裤子）可能会显三角区，建议穿无痕内裤试穿，确认效果再买单。",[]],["价格优势：算上退税和汇率，整体价格比国内官网便宜 20%-30%，相当于国内 8.5-9 折。",[]],["退税政策：大部分门店（如狎鸥亭、汉南洞、汝矣岛现代百货）单笔满 15,000 韩元即可退税。结账时主动出示护照原件，拿好退税单去机场自助机办理（注意：部分门店可能不给当场退税，需确认）。",[]],["满额赠品：单笔满 40 万韩元（约 2000 元人民币）会送品牌大号托特包，容量大又实用，结账前一定要问店员！",[]],["支付方式：百货店（如汝矣岛现代、乐天）通常支持支付宝、微信和银联卡；但部分独立旗舰店（如汉南洞、狎鸥亭）可能只支持信用卡或韩元现金，建议备好 Visa/Mastercard 信用卡。",[]],["【必买热门单品推荐】",[]],["Airlift 和 Airbrush 系列 Leggings：灵魂爆款！穿上超级显腿型，包裹性好且不勒肉，韩国限定色和热门色在旗舰店最全。",[]],["Sway Bootcut Sweatpant（微喇运动裤）：超级显腿细腿长，面料柔软舒适，170cm 穿也完全没问题，退税后大概 700 多元人民币，性价比极高。",[]],["针织裙与保暖上衣：秋冬必备，比如白色针织裙和炭灰色保暖上衣，搭配 Leggings 或打底裤，日常出街也超好看。",[]],["德训鞋：麂皮材质，复古又百搭，部分门店有货，但尺码经常断，看到合适的码数要果断下手。",[]],["运动内衣与帽子：高压缩交叉带运动内衣支撑性好，帽子和包包也是出片神器，适合凑单买。",[]]]},{"id":1599,"title":"Cooking library","area":"狎鸥亭","chapter":"3⃣️ Day 3（11.30｜周一）：林荫道（5）｜汝矣岛｜狎鸥亭（5+2🍸）｜江南","blocks":[["5.2 「🥘｜Cooking library」（周一店休）",[]],["🕙12:00-21:00",[]],["1F 简餐🥪｜2F 图书馆 📚｜3F 烹饪工作室 🧑‍🍳｜4F 私人餐饮  🍽️",[]]]},{"id":1602,"title":"SINOON","area":"狎鸥亭","chapter":"3⃣️ Day 3（11.30｜周一）：林荫道（5）｜汝矣岛｜狎鸥亭（5+2🍸）｜江南","blocks":[["5.3 「🛍️｜SINOON」",[]],["🕙12:00-20:00｜💳 微信支付宝✅｜https://sinoon.co.kr/",[]],["【逛店与避坑小贴士】",[]],["注意店员服务：有博主反馈店里会有店员全程跟着服务，虽然热情但可能会让 i 人（内向者）感到不自在。如果不想被跟着，可以礼貌地表示想自己先逛逛。",[]],["价格参考：均价在 6万-30万韩元（约合人民币 300-1600 元）。T 恤和上衣大概 300-500 元，裙子和外套大概 800-1500 元。在韩系设计师品牌里性价比还不错。",[]],["折扣活动：狎鸥亭店经常有当季折扣，部分单品能到 6 折或 8 折，遇到打折季入手非常划算。",[]],["当场退税：单笔满 15,000 韩元即可当场退税！结账时主动出示护照原件，直接付免税价。",[]],["注意面料与版型：它家很多单品主打轻盈面料和灵动褶皱，部分裙子可能偏透或偏薄，建议亲自去试衣间上身试试，不要盲目拍码数。",[]],["【必买热门单品推荐】",[]],["蕾丝碎花连衣裙：它家的灵魂爆款！灵动褶皱和柔和线条设计，上身自带松弛感，单穿就是韩剧女主，适配咖啡探店、逛街约会等多种场景。",[]],["拼色针织衫/衬衫：标志性的拼色设计搭配经典 Logo，温柔又带点怪趣，日常通勤或轻社交都很百搭。",[]],["标志性小熊帆布包：品牌的小熊形象 “Nooni Bear” 非常可爱，帆布包质感好且百搭。",[]],["不规则剪裁半身裙：东西融合的结构设计，版型修饰身材，搭配简单的 T 恤就能轻松拿捏韩系松弛感。",[]]]},{"id":1615,"title":"阿迪达斯","area":"狎鸥亭","chapter":"3⃣️ Day 3（11.30｜周一）：林荫道（5）｜汝矣岛｜狎鸥亭（5+2🍸）｜江南","blocks":[["5.4 「🛍️｜阿迪达斯」",[]],["🕙11:00-22:00｜很多韩国设计款",[]]]},{"id":1617,"title":"VIVAIA","area":"狎鸥亭","chapter":"3⃣️ Day 3（11.30｜周一）：林荫道（5）｜汝矣岛｜狎鸥亭（5+2🍸）｜江南","blocks":[["5.5 「🥿｜VIVAIA」",[]],["🕙11:00-20:00｜💳 微信支付宝✅｜https://www.vivaia.kr/",[]],["【逛店与避坑小贴士】",[]],["1-2楼是鞋款试穿，3楼有休息茶歇区，4楼还有超好拍的法式花园天台。店里提供免费量脚服务，还有中文店员，沟通零障碍。",[]],["一定要试穿：VIVAIA 的鞋子虽然舒服，但不同款式的码数可能有差异（比如 37.5 的脚，有的款穿 37，有的穿 38），而且店里提供量脚服务，一定要亲自上脚试穿，不要盲目按平时的码数买。",[]],["断码严重：热门款（尤其是 Jennie 同款小红鞋和银色芭蕾鞋）非常抢手，经常断码。建议 11 点刚开门就去抢，去晚了可能只能看样品。",[]],["理性种草：它家主打舒适和环保，鞋底偏软，如果你喜欢硬底或高跟的支撑感，可能需要慎重选择。",[]],["价格亲民：鞋子均价在 22万韩元左右（约合人民币 1100 元），退税后大概 900-1000 元人民币。",[]],["当场退税：单店满 15,000 韩元即可当场退税！结账时主动出示护照原件，直接付免税价。",[]],["【必买热门单品推荐】",[]],["红色玛丽珍鞋：Jennie 同款灵魂爆款！正红色超级显白，方头设计不挤脚。",[]],["针织平底鞋：包裹性很好，像袜子一样贴合脚型，圆头和方头都有，通勤逛街百搭不出错。",[]],["运动风芭蕾鞋：把芭蕾风和运动鞋结合，鞋底软弹，暴走首尔一整天都不累脚，银色款超级百搭。",[]],["DIY鞋饰配件：店里有很多漂亮的鞋扣、蝴蝶结和鞋带，可以自己动手给基础款鞋子换个风格。",[]]]},{"id":1631,"title":"WORKSOUT","area":"狎鸥亭","chapter":"3⃣️ Day 3（11.30｜周一）：林荫道（5）｜汝矣岛｜狎鸥亭（5+2🍸）｜江南","blocks":[["5.6 「🛍️｜WORKSOUT」",[]],["🕙12:00-20:30｜微信支付宝✅｜https://www.worksout.co.kr/",[]],["【逛店与避坑小贴士】",[]],["1楼是球鞋和主线街头服饰，2楼是休闲工装户外款式和设计师线，3楼是滑板专区。",[]],["试穿建议：它家很多偏街头和工装的单品版型偏大，建议亲自去试衣间上身试试，不要盲目拍码数。",[]],["核对账单：有博主反馈结账时偶尔会被多收钱，建议自己先算好总价，结账时仔细核对小票再付款。",[]],["当场退税：单笔满 15,000 韩元即可当场退税！结账时主动出示护照原件，直接付免税价。",[]]]},{"id":1638,"title":"ZEST","area":"狎鸥亭","chapter":"3⃣️ Day 3（11.30｜周一）：林荫道（5）｜汝矣岛｜狎鸥亭（5+2🍸）｜江南","blocks":[["5.7 「🍸｜ZEST」⏰ 提前预约",[]],["🕙18:30-2:00（周六日15:00开门）",[]],["这是一常年霸榜 亚洲 50 佳酒吧（曾位列亚洲第 2、全球第 16）的创意鸡尾酒吧，主打“零浪费”理念，用韩国本土食材（如济州柑橘、韩式米酒、咖啡渣等）做创意特调，氛围感极佳。",[]],["【预约与到店避坑指南】",[]],["定金退还规则：有博主反馈 CatchTable 的定金有时不会自动退回，如果到店消费后 3-10 个工作日还没收到退款，建议直接给店里打电话或发 IG 私信催促。",[]],["限时入座：如果你是通过 Walk in 或者候补捡漏到的座位，店员可能会告知你有时间限制（比如 90 分钟内必须喝完），进店后先确认好时间，别喝得太慢导致被请离。",[]],["语言无障碍：店里的 Bartender（调酒师）英文都非常好，沟通完全没问题，可以大胆让他们根据你喜欢的口味推荐特调。",[]],["支付方式：店内支持信用卡（Visa/Mastercard）和 Apple Pay，但不支持现金和支付宝/微信支付，记得带卡或开通手机支付。",[]],["【CatchTable 提前抢号（最稳妥）】",[]],["这是官方最推荐的预约方式，适合行程确定的朋友。",[]],["下载 APP：在手机上下载 CatchTable（国行应用商店可下载，支持英文界面）。",[]],["抢号时间：通常提前一个月放号，周末的座位非常抢手，建议定好闹钟，在放号瞬间去抢。",[]],["支付定金：预约时需要绑定信用卡支付定金（通常为每人 3万韩元）。到店消费后，定金会自动原路退回，不会额外扣费。",[]],["注意退改：如果行程有变，一定要在 APP 上提前取消，否则定金可能会被扣除。",[]],["预约与排队：非常火爆！建议提前一个月在 CatchTable 上预约（周末秒满）。如果没约上，可以 18:30 刚开门去 Walk in 排队，或者晚上 23:00 之后去碰运气。",[]],["价格与支付：鸡尾酒均价 27,000 韩元/杯（约 135 元人民币），无服务费。支持信用卡，不支持现金和支付宝/微信支付。",[]],["【必点招牌】",[]],["",["346.webp"]],["🥒Daiquiri No.6 ｜朗姆｜济州猕猴桃利口｜青柠｜黄瓜｜菠萝｜椰子芝麻油｜店里的招牌必点—超级热带水果风味Daiquiri端上来的那一刻就闻到了非常清爽的黄瓜味入口猕猴桃、菠萝的甜中和了青柠的酸涩回口其实可以尝到一点点芝麻油的味道非常清爽适口的一杯开胃酒",[]],["",["347.webp"]],["🌽Corn Star Martini ｜烤红薯烧酒｜玉米与番茄盐水｜百香果｜细叶芹｜虽然说是PornStar Martini的改编但我觉得更像Tomartini本以为玉米的味道会非常浓郁但更多尝到的是番茄的酸感所以一定要吃一口杯壁的玉米啫喱再喝就会尝到玉米谷物的香气混合着番茄的咸鲜和百香果的果香",[]],["",["348.webp"]],["🍯Urban Bees｜金酒｜干雪莉酒｜柑橘｜薰衣草｜首尔单镇蜂蜜｜尝起来是薰衣草的花香混合着柑橘的酸感蜂蜜的甜被干雪莉和柑橘平衡后整体不会很甜腻在Bee's Knees的基础上加入了一些花香层次更丰富薰衣草的味道还是蛮重的不喜欢的要慎点",[]],["",["349.webp"]],["👨‍🌾Harvest Hour｜济州小米烧酒｜玉米须｜柑橘｜黄甜椒｜藏红花｜黑芝麻｜大麦苗｜小米烧酒和玉米须带来了一些谷物的感觉可以尝到很明显的黄甜椒的甜杯壁沾了一圈黑芝麻碎非常醇香",[]],["",["350.webp"]],["🍉Hwachae｜金酒｜葡萄酒｜澄清西瓜汁｜香茅｜苹果薄荷｜微量气泡｜喝起来像一杯很淡的苹果薄荷气泡水澄清西瓜汁的存在感几乎没有单喝味道很寡淡以为搭配西瓜糖会更完整加进去又变得太甜唯一有一点踩雷的一杯",[]],["",["351.webp"]],["🥃Green Point被上面的冰沙球深深吸引的一杯，柚子冰沙真的做的跟小番茄一样！Negroni的改编，配上冰沙超清爽（比起后面俩也没这么清爽）",[]],["Z&T：招牌金汤力，金酒会根据季节更换不同水果（如粑粑柑、小香瓜），清爽解腻，适合做第一杯。",[]],["Daiquiri No.6：朗姆酒底，加入猕猴桃、黄瓜、菠萝和椰子芝麻油，酸甜清爽，层次丰富。",[]],["Soy Caramel：黄油洗过的波本和朗姆加酱油与焦糖，咸甜交织的焦糖谷物感，非常饱满。",[]],["Hwachae：西瓜风味的起泡酒，口感像西瓜汽水，清新解酒。",[]]]},{"id":1674,"title":"Pine&Co","area":"狎鸥亭","chapter":"3⃣️ Day 3（11.30｜周一）：林荫道（5）｜汝矣岛｜狎鸥亭（5+2🍸）｜江南","blocks":[["5.8 「🍸｜Pine&Co」",[]],["🕙19:00-2:00｜",[]],["【逛店与避坑小贴士】",[]],["隐藏入口：在 狎鸥亭罗德奥站 附近，找到 BHC炸鸡店 对面的小巷子，看到一个很窄的破铁门，走楼梯下到负一层就是酒吧。",[]],["避坑提醒：",[]],["不要以 711 为参照物，这附近有至少 3 个 711，会耽误你一个小时！",[]],["不要信 Ins 主页写的错误地址（653 Sinsa-dong），那个地方根本找不到。",[]],["一定要在路牌上找 33号，往大号方向找，看到 33 号后往左手边看就是铁门。",[]],["菜单超好玩：菜单设计成复古像素游戏界面，还可以玩小游戏，不知道喝什么可以扭蛋盲选，趣味性拉满。",[]],["点餐截止时间：小吃和炸鸡的点餐截止时间是 00:30，酒类点餐截止时间是 1:30，别去太晚错过美食。",[]],["语言无障碍：店里的调酒师和服务员英文都非常好，会详细讲解每款酒的配方和故事。",[]],["座位有限：店里只有 3 个吧台区域和几个小卡座，坐满也就 30 人左右，氛围感很好但空间比较紧凑。",[]],["价格亲民：一杯鸡尾酒约 26,000 韩元（约合人民币 130 元），人均 120-150 元人民币就能喝得很爽。",[]],["支付方式：支持 Visa、Mastercard 信用卡和韩元现金，不支持支付宝和微信支付。",[]],["",["352.webp"]],["",["353.webp"]],["【预约方式（重点！）】",[]],["Instagram 预约：关注官方账号 pineandco_seoul，通过私信或官方网页进行预约。周末的座位非常抢手，建议提前 1-2 周联系。预约不需要定金，但必须准时到店，迟到 10 分钟可能会直接取消座位。",[]],["CatchTable 或 Naver：部分时段可以通过 CatchTable 或 Naver 预约，但更新可能不及时，最稳妥的方式还是直接发 Ins 私信。",[]],["Walk in 碰运气：如果没有预约，可以在晚上 12 点以后去碰碰运气，或者在门口扫码排队。工作日去 Walk in 的成功率相对较高，排队时可以在附近逛逛。",[]],["【必点招牌鸡尾酒】",[]],["",["354.webp"]],["",["355.webp"]],["",["356.webp"]],["Bingsu（橘子冰沙酒）：绝对的灵魂爆款！顶部是一个酒渍过的小橘子，冰沙下面是金汤力，整杯喝起来毫无压力，很有趣。",[]],["Yogurt（酸奶酒）：带酒味的酸奶，碰上柠檬草，青柠和桃子的水果味，搭配了一根奶酪棒，像是在炎炎夏日大汗淋漓的时候来上一杯可尔必思冰沙的解腻感。（感觉超过20度了）",[]],["Kiwi Colada（开心果奇异果椰林飘香）：以白朗姆为基底，用奇异果替代菠萝，奶香浓郁但不会觉得腻，口感清爽，很多博主心中的全场最佳。不甜。",[]],["Cacao（巧克力威士忌）：爱喝威士忌的必点！巧克力与威士忌的搭配很丝滑，像成年人版的热可可，口感丰富，调酒师也超爱这款。",[]],["🍸 Bulgogi  ：龙舌兰+气泡水，和牛配酒。店员会拿着生肉和喷枪过来，在面前现烤，然后放到酒杯上，酒杯上还有层蘸料 可以卷在一起吃。",[]],["🍸PassionFruit：最烈的那杯，音译就是百香果酒，酸酸甜甜很好喝，上面摆的是水果果冻",[]],["*小食炸鸡特别甜。",[]]]},{"id":1707,"title":"现代百货总店","area":"狎鸥亭","chapter":"3⃣️ Day 3（11.30｜周一）：林荫道（5）｜汝矣岛｜狎鸥亭（5+2🍸）｜江南","blocks":[["5.9 「🎄｜现代百货总店」",[]],["🕙10:30-20:00",[]],["🎭 3F｜百老汇42街｜🚇 7F｜华盛顿广场地铁站｜🐈 10F｜巨型猫咪拍照区",[]]]},{"id":1710,"title":"6. 【江南】","area":"江南","chapter":"3⃣️ Day 3（11.30｜周一）：林荫道（5）｜汝矣岛｜狎鸥亭（5+2🍸）｜江南","blocks":[["6. 【江南】",[]],["🚇【37min】汝矣岛站｜鹭梁津方向 5站 ｜【宣靖陵】1号口🚶394m",[]]]},{"id":1712,"title":"T1大楼","area":"江南","chapter":"3⃣️ Day 3（11.30｜周一）：林荫道（5）｜汝矣岛｜狎鸥亭（5+2🍸）｜江南","blocks":[["6.1 「🎮｜T1大楼」",[]],["🕙12:00-20:00",[]],["📍地铁9号线 / 水仁盆唐线【宣靖陵站(선정릉역)】1号口出，沿着大路上坡走5分钟就能看到！",[]],["✨ 一楼 T1 Shop：一进门就能看到满墙的奖杯🏆，超级震撼，拍照打卡必备！周边：队服👕、帽子🧢、文具📓、包包🎒…价格不算便宜，购物袋买周边的时候会附赠/可以加购。",[]],["☕ T1 Cafe：旁边小路进去就是咖啡厅。店里有粉丝墙，Faker写给粉丝的话一定要拍一张！",[]],["⚠️ 店里只收信用卡💳，不收现金❌",[]],["🖥️ PC区｜24小时不打烊",[]],["220个座位全部配备AMD Ryzen 9800X3D + RTX 5070以上显卡，部分座位直接上RTX 5090 + 三星OLED QHD 500Hz+显示器。普通座1小时才3000韩元，会员2000韩元。",[]],["",["357.webp"]],["",["358.webp"]],["",["359.webp"]],["🚇【10min】9# 宣靖陵 新论岘方向1站｜新论岘 5号口 🚶83m",[]]]},{"id":1724,"title":"阿迪达斯江南品牌中心","area":"江南","chapter":"3⃣️ Day 3（11.30｜周一）：林荫道（5）｜汝矣岛｜狎鸥亭（5+2🍸）｜江南","blocks":[["6.2 「🛍️｜阿迪达斯江南品牌中心」",[]],["🕙11:00-22:00",[]],["【逛店与避坑小贴士】",[]],["注意尺码差异：韩版阿迪的 Samba 和 Gazelle 偏小且压脚背，宽脚和高脚背的姐妹一定要买大半码或一码，千万不要盲买，必须上脚试穿。",[]],["核对账单：有博主反馈结账时偶尔会被多收钱，建议自己先算好总价，结账时仔细核对小票再付款。",[]],["1楼是三叶草全系，2楼女装和运动内衣，3楼男装和韩国联名款，4楼是折扣区（部分卫衣和鞋子五折左右）",[]]]},{"id":1730,"title":"黑牛亭烤肉","area":"江南","chapter":"3⃣️ Day 3（11.30｜周一）：林荫道（5）｜汝矣岛｜狎鸥亭（5+2🍸）｜江南","blocks":[["6.3 「🥩｜黑牛亭烤肉」",[]],["🕙11:00-21:00",[]],["【逛店与避坑小贴士】",[]],["注意找店位置：在 B1 层，但招牌在楼上，第一次去很容易直接走到一楼敲错门，看到指示牌记得下楼。",[]],["关于预约：虽然可以到店排队，但晚上和周末排队可能需 15-30 分钟，建议提前电话或线上预约。",[]],["关于语言：店员小哥可能不太会说中文，但点餐屏有中文选项，沟通基本没问题，服务也很热情。",[]],["关于口味：他家的 4 种秘制蘸料（黑松露蒜酱、海鲜辣酱、菌菇酱、橄榄油葱酱）都很绝，但最推荐的还是直接蘸粗盐，最能品尝顶级黑牛的原香。",[]],["关于主食：除了黑面包，他家的 大酱汤饭 和 平壤冷面 也很受欢迎，但有人反馈大酱汤饭味道比较重，建议根据自己口味点单。",[]],["人均消费：大概在 300-500 元人民币左右（约 15万-25万韩元/2-3人）。",[]],["【必点招牌推荐】",[]],["套餐推荐：如果 2-3 人同行，直接点一份“黑牛两人套餐”（约 14.9万韩元）就够了，分量很足，包含了花肋眼肉、蒜香牛肋条和盐味牛肋排，性价比在江南区算很高的。",[]],["0.1% 顶级黑牛：全场 MVP！号称全韩国只有 0.01% 的 A5 级别黑牛，雪花纹理绝美。入口即化，奶香浓郁，先蘸粗盐就能吃到牛肉本身的清甜回甘。",[]],["灵魂黄油黑面包（黑金千层吐司）：他家的独创招牌！黑色竹炭千层面包可以一层层撕开，外皮酥脆内里松软。把烤好的韩牛、拉丝芝士和面包夹在一起吃，口感层次超丰富，像简易版的“惠灵顿牛排”。",[]],["蒜香牛排骨：提前腌制入味，肉质软嫩，甜咸适中，油脂丰富，包着面包吃非常香。",[]],["烤芝士：用小炉子现烤的芝士片，表面焦黄拉丝，裹着烤肉吃是热量炸弹但超满足。",[]]]},{"id":1745,"title":"NYUNYU","area":"江南","chapter":"3⃣️ Day 3（11.30｜周一）：林荫道（5）｜汝矣岛｜狎鸥亭（5+2🍸）｜江南","blocks":[["6.4 「🛍️｜NYUNYU」",[]],["🕙10:00-22:45",[]],["主打生活方式与轻熟穿搭，有家居香氛、收纳、睡衣等。服饰偏简约通勤、低饱和度的轻熟韩系风，适合不想太幼稚、追求质感的上班族。",[]]]},{"id":1748,"title":"T1网吧","area":"江南","chapter":"3⃣️ Day 3（11.30｜周一）：林荫道（5）｜汝矣岛｜狎鸥亭（5+2🍸）｜江南","blocks":[["6.5 「🎮｜T1网吧」💙",[]],["🕙24H",[]],["【江南店专属打卡亮点】",[]],["Trophy Room 荣耀殿堂：江南店独有的展示区！可以近距离看到 T1 历代冠军奖杯、选手队服和手印墙，还有 Faker 标志性“🤫”手势的 Kinetic Art 装置，拍照超级出片。",[]],["Creative Lab 定制服务：可以 DIY 球衣印号、烫印选手签名和花字（现场买衣服或自带 T1 官方衣服都可以），这是 T1 大楼店没有的服务，非常有纪念意义。",[]],["周边店不能退税（弘大🉑️）",[]],["扭蛋区：24 小时营业的扭蛋机，可以抽 T1 周边、键帽、拼图挂坠等，8000 韩币一次，非常上头。",[]],["人生四格 拍贴机：入口处有带 T1 边框的拍贴机，支持微信支付或信用卡，5000-7000 韩元/2 张。",[]],["【网吧配置与价格（非会员参考）】",[]],["超高配置：220 个座位全部配备 AMD Ryzen 9800X3D + RTX 5070 以上显卡，部分高级座位直接上 RTX 5090 + 三星 OLED QHD 500Hz+ 显示器。",[]],["空间分区：有 1 人专注房、情侣双人房、5 人团队房、10 人团队包厢，还有电竞比赛专用的 Arena 区。每个座位都配了手机支架、充电器和手柄。",[]],["价格参考：非会员约 3,000 韩元/小时（约 16 元人民币），会员约 2,000 韩元/小时。",[]],["自助上机：进门有英文界面的自助机，支持信用卡（Visa/Mastercard）或现金支付。买完时长会出一张小票，小票上的 4 位数字是开机密码，务必保管好！",[]],["选座开机：找贴有「Cleaned Up」标签的空位（表示已消毒）❌别坐靠厕所位置！味道有点上头...输入小票密码登录",[]],["💡隐藏福利：无线充电座藏在显示器后方！",[]],["离场结算剩余时间＜5分钟时桌面弹出提醒直接离开即可（系统自动扣费）餐盘放在头顶置物架。",[]],["【点餐攻略】",[]],["点餐方式：上机后电脑桌面会自动弹出点餐系统，选好后选择现金或信用卡结算，工作人员做好后会直接送到座位上。",[]],["🍜点餐系统教学：点击桌面美食图标。（耳套纸巾等都是在点餐页面哦）点单界面的最右边是结算，第一个【현금】是现金，第二个【신용카드】是信用卡。现金支付：把韩币放在键盘托架的凹槽，信用卡支付：举手示意穿黑T的工作人员，会有staff来取卡，刷完会送回来，在座位等着就好。",[]],["【选手同款主食与小吃】",[]],["Faker 海鲜面/炸酱拌面：Faker 同款，味道浓郁偏辣，拌面加了煎蛋和芝士后口感更丰富，不能吃辣慎点。",[]],["Oner 薯条/鸡肉美乃滋拌饭：薯条外酥里嫩，搭配特制酱料很好吃；鸡肉美乃滋拌饭口味偏甜，很适合不吃辣的人。",[]],["Doran 青葡萄冰茶/宫廷炒年糕：青葡萄冰茶非常甜，冰块质量很好不易化；炒年糕是经典的韩式甜辣口味。",[]],["Keria 油茶面：Keria 推荐的特色面食，口感独特，喜欢尝试新奇口味的朋友不要错过。",[]],["高汤牛骨拉面：很多网友回购的招牌，汤底浓郁，面条劲道，是韩国网吧的“灵魂食物”。",[]],["年糕烤肠：经典的韩式网吧小吃，烤肠煎得焦香，搭配甜辣年糕，解馋又管饱。",[]],["芝士球：拉丝效果很好，作为追剧或打游戏的小零食非常合适。",[]],["Faker 蓝莓奶昔/蓝莓气泡水：酸甜解腻，搭配辛辣的面食或炸物非常绝，但分量相对较小。",[]],["黄豆粉奶昔：口感浓郁，喜欢黄豆粉味道的人会觉得很香，不喜欢的可能会觉得有点怪。",[]],["",["360.webp"]],["",["361.webp"]]]},{"id":1780,"title":"Baskin Robbins","area":"江南","chapter":"3⃣️ Day 3（11.30｜周一）：林荫道（5）｜汝矣岛｜狎鸥亭（5+2🍸）｜江南","blocks":[["6.6 「🍨｜Baskin Robbins」",[]],["🕙10:00-23:00（周五六24点）",[]],["",["362.webp"]]]},{"id":1783,"title":"BHC","area":"江南","chapter":"3⃣️ Day 3（11.30｜周一）：林荫道（5）｜汝矣岛｜狎鸥亭（5+2🍸）｜江南","blocks":[["6.7 「🍗｜BHC」",[]],["🕙11:00-24:00（周五六到2:00）",[]],["【价格与支付攻略】",[]],["价格参考：单份炸鸡约 20,000-25,000 韩元（约 100-125 元），两人点一份刚好。双拼加可乐大概 3 万韩元左右（约 150 元）。",[]],["支付方式：部分门店不支持支付宝和微信支付，只能刷信用卡（Visa/Mastercard）或韩元现金。",[]],["注意等待时间：韩国炸鸡坚持现点现炸，做好通常需要 15-20 分钟，建议提前点单或做好等位的准备。",[]],["注意酱料搭配：芝士粉炸鸡通常会配一份招牌酸奶蘸酱，如果没拿到可以主动跟店员要，蘸着吃能完美平衡芝士的浓郁。",[]],["【必点招牌口味推荐】",[]],["半半炸鸡（반반）：可以选两种口味拼在一起，但部分门店会加收 2000 韩元，点单时记得确认一下。",[]],["Bburinkle（雪花芝士炸鸡）：灵魂爆款！酥脆炸鸡外撒满香浓芝士粉，搭配招牌酸奶蘸酱，甜咸交织，芝士粉多到溢出来，芝士脑袋闭眼冲！",[]],["Matcho King（酱油炸鸡）：经典韩式甜咸酱油味，酱汁浓郁，牢牢扒在酥脆外皮上，带有青阳辣椒碎和蒜丁，口味大众接受度高，盲点不会出错。",[]],["Matcho King（酱油炸鸡）：经典韩式甜咸酱油味，酱汁浓郁，牢牢扒在酥脆外皮上，带有青阳辣椒碎和蒜丁，口味大众接受度高，盲点不会出错。",[]],["芝士球（치즈볼）：吃 BHC 的仪式感一半来自于它！外皮酥脆，内里是 Q 弹能拉丝的水牛芝士球，一定要趁热吃，一口爆浆，价格约 6000 韩元（约 30 元）。",[]],["辣味香肠年糕：开胃解腻，甜辣口味和炸鸡很搭。",[]],["蒜香薯条：撒满蒜味粉，可以追加芝士粉提升风味，口感丰富。",[]]]},{"id":1798,"title":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","area":"首尔林","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）",[]],["🔔 出门带手机、护照、银行卡、充电宝。避开周末&节假日，人超多。穿好走的鞋！",[]],["穿搭：推荐深色、条纹或简约针织，尽量避开纯白色上衣。适当露肤度高、不要太紧身的衣服。",[]],["🚇首尔林（水仁·盆堂线）：5号口",[]],["🚇圣水站（2号线）",[]],["1号口：point of view｜2号口：很多咖啡店、饭店、网红鱼饼｜4号口：最大oy，直走就是主街",[]],["扶梯：1/2/3/4号口｜直梯：1/4号口",[]]]},{"id":1805,"title":"🍝rue de rivoli","area":"首尔林","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["1. 【早午饭｜🍝rue de rivoli】10:00-20:00",[]],["🕙10:00-20:00",[]],["【门店基本信息】",[]],["门口沙发：门口的沙发座位是 Ins 打卡地，非常出片，但位置有限，想坐的话建议早点去。",[]],["位置隐蔽：店在二楼，门比较隐秘，到了之后要仔细看门口的标识，走楼梯上去就行。",[]],["上菜速度：整体上菜速度挺快的，不用等太久。",[]],["一人食友好：空间大，座位多样，一个人来放松也完全没问题。",[]],["【必点菜品推荐】",[]],["辣奶油香肠通心粉（로제 떡볶이 파스타）：招牌必点！奶油酱香浓郁，带着微辣的口感，通心粉吸满汤汁后非常入味，很多食客吃完都心心念念。",[]],["可丽饼：菜单上有多种口味可选，饼皮柔软，搭配奶油和水果，颜值和味道都在线，很适合当 Brunch 的主食。",[]],["海鲜年糕：韩式辣酱搭配海鲜，口感丰富，年糕糯叽叽的，非常解馋。",[]],["海盐牛角包：外皮烤得焦脆，里面柔软，搭配黄油或果酱吃很香。",[]],["玉米土豆浓汤：口感绵密，玉米的甜味和土豆的香气融合得很好，非常解腻。",[]],["辛奇炒饭：里面有猪肉，拌着蛋一起吃很香，炒饭粒粒分明，味道刚好。",[]]]},{"id":1819,"title":"Oliveyoung N 色彩测试","area":"首尔林","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["2. 「🛍️｜Oliveyoung N 色彩测试」10:00开放预约，11:30开始",[]],["🕙10:00-21:45｜💳 微信支付宝✅",[]],["📋三个服务项目：",[]],["▪️QUICK TOUCH-UP：局部快速补妆（底妆/眼/眉/唇选一处，15分钟）",[]],["▪️COLOR FIT TOUCH：AI肤色+面部分析，搭配定制妆容（30分钟）",[]],["▪️FIND YOUR COLOR_MINI：个人色彩诊断！✅（可带妆 15分钟）",[]],["【楼层分布与逛店路线】",[]],["1F（快闪与休闲区）：进门先拿购物篮！这里有不定期的快闪店、免费人生四格拍照亭和咖啡区。",[]],["2F（彩妆与香氛主场）：3CE、dasique、fwee、hince 等本土平价彩妆全线试色。",[]],["3F（护肤与内服区）：面膜、护发、身体护理、保健品和零食区，甚至提供免费肤质和头皮诊断服务。",[]],["4F（文创与家居区）：适合挑小众伴手礼，质感家居好物、香氛和 K-POP 周边性价比超高。",[]],["【色彩测试预约】",[]],["2F 色彩测试",[]],["每天十点开放预约，最好在附近等候。色彩测试比化妆更难预约，所以两个都想预约的话，先等化妆比较好。",[]],["预约流程：1-找到P4的机器（两个项目都是在二楼项目旁边的机器上预约）2-输入韩国电话号码/用手机自带的相机扫码-填邮箱（QQ邮箱和Google邮箱都可以）3-有P6和P7的编号出现就是预约成功啦，还要记得留意前面还有几位，不要错过时间了！",[]],["两个项目的时间都需要半个多小时，最好错峰来，一定要预留好充足的时间🕒。",[]],["色彩测试会先填一份问卷。先测出冷暖色调哪个更适合，再细分亮度，根据测试结果推荐适合衣服色系-发色-化妆品-瞳色。最后也会给纸质测试结果和推荐化妆品。",[]],["两个项目做完后可以各获得一张5%的彩妆折扣券，结账的时候给店员就行，每人每天只能用一张且仅限当天使用哦。",[]],["【想买的】",[]],["",["363.webp"]],["「SCHIM喷雾」Sour Berry（酸草莓味）、Sugar Apple（苹果）、 Oriental Tea（红茶皂香）、Fig Leaf（无花果奶香）",[]],["",["364.webp"]],["「Pleuvoir护手霜」🌹 First Memory：玫瑰＋清新果香 淡淡的清甜感 后面会慢慢带一点麝香和木质感 整体很温柔🤍 Floral Musk：更清淡 更柔和一点 是淡淡的花香混着麝香的感觉~",[]],["3. 【首尔林】（12）13-19点去",[]]]},{"id":1843,"title":"SAMO ONDOH","area":"首尔林","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["3.1 「👛｜SAMO ONDOH」11",[]],["🕙周一～周五12:00-20:30，周末11:00-21:00",[]],["https://www.samoondoh.co.kr/",[]],["泫雅、崔杋圭等爱豆背过。它家包包主打轻便、大容量和高颜值，价格也很亲民",[]],["支付方式：支持信用卡，部分门店支持支付宝或微信。",[]],["云闪付优惠：使用云闪付支付可享 9 折优惠，结账前记得打开云闪付看看。",[]],["现场退税：满 150,000 韩元退税",[]],["",["365.webp"]],["",["366.webp"]],["",["367.webp"]],["逛店与避坑 Tips",[]],["选码建议：如果买 L 号大包，小个子要去店里试背一下，看看是否合适",[]],["如果追求轻便，它家包包自重都很轻，不用担心压个子。",[]],["挂件搭配：包包上有 5 个眼，可以挂各种可爱的挂件。",[]],["无拉链设计：部分热门款（如机车包）没有拉链，可以自己搭配一个小内胆包，防止东西掉出来。",[]]]},{"id":1859,"title":"Apricot Studio","area":"首尔林","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["3.2 「👧｜Apricot Studio」11",[]],["🕙 11:00 - 19:00（建议 18:00 前到店，避免跑空）",[]],["https://apricotstudios.co.kr/",[]],["支付方式：支持信用卡，部分门店可能支持支付宝或微信，建议备好信用卡。",[]],["价格区间：连体服或上衣大概在 100-200 元人民币左右，裙子和套装大概在 200-400 元人民币。",[]],["退税：如果满足退税金额（通常满 15,000 韩元），可以咨询店员是否支持退税，记得带好护照。",[]],["门店特色：店铺装修充满法式田园和甜美氛围，陈列非常精致，是韩国本地妈妈私藏的遛娃淘货地。",[]],["尺码问题：韩国童装尺码偏小，建议带宝宝的身高体重数据，或者在店里拿实物对比一下。",[]],["节日限定款：在圣诞节、复活节、儿童节等节日，会有专门的限定系列，设计感更强，但去晚了容易断码。",[]],["【想买的款】",[]],["",["368.webp"]],["",["369.webp"]],["",["370.webp"]],["",["371.webp"]],["",["372.webp"]],["",["373.webp"]],["",["374.webp"]],["",["375.webp"]],["",["376.webp"]],["",["377.webp"]],["",["378.webp"]],["",["379.webp"]],["",["380.webp"]],["",["381.webp"]]]},{"id":1885,"title":"Foret Foret（포레포레）","area":"首尔林","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["3.3 「👧｜Foret Foret（포레포레）」11（每周一休息）",[]],["🕙11:00-19:00｜💳 信用卡｜1w5退税",[]],["https://www.foretforet.com",[]],["高端海外童装集合店。它家的风格偏欧式精致，蕾丝、荷叶边、粉彩配色非常多，带有一点 Girly 感，给小朋友买衣服或送人礼物都非常有质感。",[]],["欧式精致风：店铺装修充满法式田园和甜美氛围，陈列非常精致，拍照很出片。",[]],["海外品牌集合：这里不仅仅是单一品牌，而是集合了很多偏欧洲感的高端海外童装品牌，选品非常讲究，质感很好。",[]]]},{"id":1891,"title":"LOEUVRE（오뗄 루에브르）","area":"首尔林","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["3.4 *「🛍️｜LOEUVRE（오뗄 루에브르）」11",[]],["🕙 11:00-20:00｜https://maisonloeuvre.com/",[]],["【品牌简介】",[]],["成立时间：2019 年成立，最初以包包起家，后来逐渐扩展到成衣、鞋履和配饰。",[]],["风格定位：主打法式美学与韩系简约的结合，整体风格干净、高级、有质感，偏通勤和日常穿搭，不容易撞款。",[]],["灵感来源：品牌名 \"L'œuvre\" 在法语中是\"作品\"的意思，意指创作者一生的作品。设计从现代美学和建筑中汲取灵感，",[]],["法式庭院美学：店铺整体以法式复古和温润木质结构为主，陈列极具艺术感，随便一拍都很出片，仿佛走进了莫奈笔下的欧洲小镇。",[]],["季节限定企划：LOEUVRE 经常会在门店做主题快闪或企划展。",[]],["【必买单品推荐】",[]],["全牛皮包包：这是他们家的王牌！比如 Trapeza 和 Plie 系列，100% 纯牛皮，质感极佳且非常能装。价格大概在 1000～3000 元人民币左右，性价比在设计师品牌里很高。",[]],["气质成衣：法式剪裁的粗花呢外套、廓形翻领皮衣、垂感西装裤、简约针织衫和白色半裙。版型对亚洲女生很友好，主打轻熟、温婉的 Old Money 风。",[]],["香氛与周边：店里还会出限定的香氛、茶包礼盒和帆布袋。如果遇到满额送限定周边（比如薰衣草帆布袋）的活动，一定要凑单拿下，非常适合做伴手礼。",[]]]},{"id":1903,"title":"Aviemuah（Àvie muah）","area":"首尔林","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["3.5 「🛍️｜Aviemuah（Àvie muah）」13",[]],["🕙13:00-20:00｜https://aviemuah.com/",[]],["【品牌风格与特色】",[]],["法式慵懒 + 韩系精致：整体风格偏向法式慵懒、甜酷氛围与复古少女感的结合。没有夸张的大 Logo，而是靠面料、剪裁和细节来制造质感。",[]],["低饱和色调：颜色多以白、米、灰、浅蓝、卡其等低饱和色系为主。",[]],["包容性强：版型设计对身材很友好，不挑人，日常通勤、约会、旅行都能轻松驾驭，属于长期主义单品。",[]],["店铺特色：整栋小洋房风格干净温柔，装修像小型艺术展，非常治愈。",[]],["楼层分布：1F 是姜敏京的彩妆品牌 Portré；2F 是 Aviemuah 服装店。",[]],["退税服务：门店支持退税，结账时记得带上护照，主动询问店员办理。",[]],["尺码建议：韩系设计师品牌的尺码有时偏小，建议多试一两个码，不要盲目拿平时的尺码。",[]],["【必买单品推荐】",[]],["白衬衫：他们家很会做衬衫，面料有肤感，版型出色，有很多独特的小巧思（如侧面收腰扣、双层袖口等），是店里的王牌。",[]],["小吊带与连衣裙：比如黑白撞色吊带短裙、假两件双层吊带，方领和收腰 A 字剪裁非常修饰锁骨和身材，随便搭个外套就能出门炸街。",[]],["针织衫与外套：秋冬的麂皮外套、廓形皮衣、粉咖撞色针织衫、轻薄长外套。",[]],["配饰与包包：店里的 925 银饰、耳机链、马卡龙色系包包和麂皮小包做工都很精致。",[]]]},{"id":1918,"title":"JUUNEEDU","area":"首尔林","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["3.6 「😴｜JUUNEEDU」12",[]],["🕙12:00-19:30｜https://juuneedu.com/",[]],["【品牌风格与特色】",[]],["JUUNEEDU（쥬니쥬）主打韩系温柔风的睡衣家居服，不仅面料软糯舒服，颜值也超高。",[]],["韩系温柔风：整体配色以低饱和度的奶油色、浅色系为主，融入了碎花、格纹、蝴蝶结等法式浪漫元素，穿上就是韩剧里的居家氛围感。",[]],["面料亲肤：春夏主打透气纱布、华夫格和棉麻，轻薄不闷汗；秋冬则有法兰绒和毛绒款，软糯蓬松。整体手感非常舒服，属于“居家+下楼散步”都能外穿的级别。",[]],["性价比极高：一套睡衣的价格大概在 2万～4万韩元（约合人民币 100～200 元）。",[]],["店铺环境：整栋 4 层独栋空间，采光极好，有整面落地窗，店内陈列整齐，每层风格分区清晰。",[]],["",["382.webp"]],["",["383.webp"]],["",["384.webp"]],["",["385.webp"]],["",["386.webp"]],["",["387.webp"]],["",["388.webp"]],["【必买单品推荐】",[]],["褶皱棉纱款：摸上去软软糯糯，手感类似全棉时代，但颜色更韩更可爱，是店里的王牌。",[]],["蓝色小熊睡裙：版型显修长，泡泡纱材质非常亲肤，可爱又减龄。",[]],["酒红色蝴蝶结套装：法式镶边设计，清新干净，上身很有氛围感。",[]],["情侣款与亲子款：非常适合买回去和对象、家人一起穿，或者当伴手礼送人。",[]],["家居小物：店里的洗脸发带、拖鞋、杯垫等 ins 风小物件也很可爱，适合凑单买。",[]],["【避坑与温馨提示】",[]],["尺码选择：大部分款式只有 L 码和 XL 码两个尺码，睡裙通常是 One Size。一般女生穿 L，男生穿 XL，版型比较宽松，高个子穿也不会短。店里有贴尺码表，如果不确定可以问店员。",[]],["关于试穿：大部分门店是可以试穿的，直接跟店员说就好。",[]],["面料注意：棉麻款洗完可能会有点皱；部分浅色款（如粉色）可能会微透，建议搭配深色内衣。",[]]]},{"id":1945,"title":"Matthew chang","area":"首尔林","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["3.7 「✨｜Matthew chang」12",[]],["🕙12:00-19:00｜https://matthewchangperfumes.com",[]],["【品牌风格与特色】",[]],["Matthew Chang（메튜장） 是近年来在韩国非常火的小众香氛品牌，主打清新、温柔、不撞香的“韩女氛围感”。",[]],["温柔韩女香：香味多以花果香、柑橘调为主，后调常带有淡淡的青草香或木质香，整体不甜腻、不冲鼻，闻起来就是那种“刚洗完澡+阳光晒过白衬衫”的干净感。",[]],["高颜值包装：瓶身设计极简克制，带有艺术美感，搭配同系列的洗手液、身体乳，非常适合做伴手礼。",[]],["店铺环境：艺术感和自然感结合，暖调柔光搭配质感香水瓶，像走进了一座小小的香气花园。",[]],["贴心服务：店里有会中文的中国店员。",[]],["留香时间：有博主反馈部分清新果香调的香水留香时间相对较短（大概 2-3 小时），建议多喷一点，或者搭配同系列的身体乳一起用，能延长留香时间。",[]],["",["389.webp"]],["",["390.webp"]],["",["391.webp"]],["「探索套装」自选6支 10.8mL (1.8mL x 6)",[]],["",["392.webp"]],["",["393.webp"]],["",["394.webp"]],["【热门香型推荐】",[]],["Late Bloom（红苹果香）：品牌招牌！前调是清脆的红苹果，中调融入玫瑰花瓣与绿叶，后调是黄葵子和白麝香。清新不甜腻，像果园里刚成熟的水果，超级适合夏天和初秋。",[]],["Be My Muse（梨花香）：前调是梨子、青柠和葡萄柚，中调是牡丹和铃兰，后调带点木质调。清爽微甜，像靠谱温柔的大姐姐，韩星 吴弦俊 同款。",[]],["La Limonade（柠夏初遇）：干净的柠檬加佛手柑，中调有茶香和鸢尾花，后调是麝香。像午后透进窗边的风，清爽轻盈，适合喜欢柑橘调但不想要过分酸甜的人。",[]],["Our July（橘子香）：橘子加青草加一点点木质感，就是夏天傍晚的风，有点松弛、有点自由，非常耐闻。",[]],["Cozy Heart（皂香）：干干净净、软软糯糯的皂香，像刚洗完澡的小宝宝身上的奶香感，或者刚洗好的毛毯在阳光下晒过的味道，很有安全感。",[]],["【价格参考】",[]],["30ml 正装香水：大概在 72,000 韩元（约合人民币 380 元）左右。",[]],["洗手液与身体乳：价格相对亲民，大概在 20,000～30,000 韩元左右。",[]]]},{"id":1973,"title":"Poset","area":"首尔林","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["3.8 「💌｜Poset」（周一休息）12",[]],["🕙12:00-20:00｜https://www.poset.co.kr/",[]],["【品牌风格与特色】",[]],["Poset（포셋） 是韩国手帐er和明信片控的“朝圣地”！主打设计感十足的明信片、贺卡和纸品，就像一个精致的“明信片博物馆”。",[]],["纸品天堂：汇集韩国各大设计师品牌、插画师和IP的明信片、异形卡片、贴纸、书签，风格应有尽有。",[]],["支付方式：部分门店（如圣水店）支持支付宝或微信，但偶尔会出现系统问题，建议备点韩元现金或刷信用卡更稳妥。",[]],["保持安静：店里有专门的书写区，且整体氛围偏图书馆级别的安静，逛的时候尽量小声说话，不要打扰到正在写信的人。",[]],["",["395.webp"]],["【必买单品推荐】",[]],["异形明信片：比如编织袋水果款、立体纸雕款，设计感极强，买回去当书签或送给朋友都超有 sense。",[]],["手绘插画贺卡：适合在生日、纪念日或圣诞节送给朋友，韩系手绘风非常治愈，价格大概在 2000～6000 韩元（约 10～30 元人民币）一张。",[]],["信封与封口贴：店里也有各种质感的信封、邮票和封口贴，可以搭配明信片一起买，凑齐一套寄出。",[]],["手帐胶带与贴纸：除了明信片，店里还有各种韩系胶带和贴纸，非常适合手帐爱好者囤货。",[]]]},{"id":1987,"title":"29cm kids","area":"首尔林","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["3.9 「👧｜29cm kids」10",[]],["🕙10:00-21:00｜💳 微信支付宝✅",[]],["29CM KIDS（이구키즈） 是韩国知名时尚平台 Musinsa 旗下的童装及母婴生活方式集合店。集合了 40-60 多个韩国本土小众设计师童装品牌，涵盖童鞋、餐具、教具和高端婴儿车，是首尔买童装的“必逛圣地”。",[]],["1F ：时尚童装、童鞋、配饰",[]],["B1 ：亲子生活方式区，婴幼儿教具、餐具、文具",[]],["价格：整体性价比不错。T 恤、裤子大多在 100～200 元人民币左右，连体服平均 200 元左右，套装大概 300～500 元。部分国际设计师品牌或高端款会到 1000 元+。",[]],["结账时出示护照可以直接现场退税，非常省心。",[]],["",["396.webp"]],["【必逛品牌与热门单品】",[]],["店里集合了 40 多个国内外热门品牌，从新生儿到小童的尺码基本都有：",[]],["EARTH：超火的口水巾、洗脸巾、浴袍。黑色条纹限定款和基础款经常秒空，这里能买到限定配色。",[]],["Detamy Project：设计感极强的连体衣和套装，首尔林店有专属限定配色，拍照非常出片。",[]],["se-arang：夏季超火的套装，轻薄透气，花色齐全，很多韩国妈妈在 Ins 上抢着买。",[]],["HIRO：设计感外套和套装，上架后通常很快售罄，适合追求不撞款的宝妈。",[]],["absorba：韩系温柔风，Hello Kitty 系列很可爱，面料舒服。",[]],["benebene：小裙子软糯可爱，主打韩系乖乖风。",[]],["鞋履与周边：有 UGG 雪地靴、Keenkis 登山鞋、Vans 童鞋等爆款，还有硅胶辅食餐具、便携辅食盒、针织小帽子等小物件，一站式配齐。",[]],["*门店专属限定配色（比如 Detamy Project 的首尔林限定蓝紫配色，EARTH 的黑色条纹限定款）。",[]]]},{"id":2006,"title":"Milestone Coffee","area":"首尔林","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["3.10 *「☕️｜Milestone Coffee」（周四周五休息）10",[]],["🕙10:00-20:30（周四周五休息）",[]],["支付方式：部分门店只收现金或信用卡，可能不支持支付宝和微信，建议备好现金或刷信用卡。",[]],["等位规则：如果门口有人在排队，问清是“外带排队”还是“堂食等位”，堂食需要在门口本子登记名字。",[]],["【必点推荐与避坑 Tips】",[]],["维也纳咖啡：招牌必点！上面的奶油加了雪糕打制，绵密微咸甜，下面的咖啡偏苦，千万不要搅匀，大口喝让奶油和咖啡一起滑入口中，口感最绝。",[]],["提拉米苏：口感湿润绵密，但韩系甜品普遍偏甜，如果你平时不太吃甜，建议慎重，或者分着吃。",[]],["Flat White（澳白）：如果不喜欢维也纳的甜，闭眼点澳白，豆子平衡感很好，不苦不酸。",[]]]},{"id":2014,"title":"Sabre","area":"首尔林","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["3.11 「🍴｜Sabre」11【⏰ 需要预约】",[]],["🕙11:00-20:00｜💳微信支付宝✅（部分活动可能涉及韩币结算）",[]],["【核心亮点与定制服务】",[]],["Sabre Paris 首尔林店（圣水店）是韩国非常火的法式餐具专门店，以高颜值的铆钉手柄设计和丰富的莫兰迪配色深受餐具控和家居博主喜爱。",[]],["特色：专门店种类比集合店齐全很多。支持DIY 拼色定制（手柄和器型自由搭配），还可以定制刻字。",[]],["价格参考：餐勺价格大概100+，定制拼色价格会稍高一些，比免税店折扣价（80+）略贵。",[]],["DIY 拼色定制：自由选择手柄正面和背面的颜色，30 多种莫兰迪色系可选，搭配出独一无二的餐具。",[]],["专属刻字服务：支持在筷子和汤匙上刻字（中/英文、数字甚至特殊字符）。（大概 10 分钟以内做好）",[]],["预约提醒：定制服务必须提前在 Naver Map 上预约，直接到店可能无法处理定制。",[]],["",["397.webp"]],["",["398.webp"]],["",["399.webp"]],["",["400.webp"]],["【必买系列推荐】",[]],["小酒馆系列：最经典的款式，象牙白最百搭，红格子和蓝格子很复古。",[]],["珠光系列：婴儿粉和芭比粉非常火，实物像果冻一样有光泽，少女感拉满。",[]],["POP 系列：波点和格纹手柄，颜色鲜艳，适合做伴手礼。",[]],["黄油刀与茶勺：器型小巧精致，价格相对便宜，非常适合用来凑单或送朋友。",[]],["限定款式：圣水店有专属的竹节、木纹限定款，以及网上买不到的开瓶器和迷你勺子挂件。",[]],["热门色：珠光粉、珠光紫、象牙白等热门颜色经常断货。",[]],["【折扣与专属福利】",[]],["价格对比：如果不去专门店定制，直接去免税店买现货最划算；如果追求独一无二再去圣水店定制。",[]],["打包托运：用衣服或气泡膜包好放在行李箱里托运。",[]],["满减赠品：单笔消费满 20 万韩元。通常会赠送迷你勺子挂件（盲盒颜色）或筷子拖等限定赠品。",[]],["⚠️注意：该专门店不能退税，但折扣和赠品力度有时比免税店更划算。",[]]]},{"id":2040,"title":"Ouro","area":"首尔林","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["3.12 「🛍️｜Ouro」💗13",[]],["🕙 周一～周三13:00-10:00｜周四～周日12:00-19:00｜💳 微信支付宝✅",[]],["https://ouro.kr/",[]],["店铺环境：店里按颜色分类摆放衣服，看着非常治愈。空间宽敞，试衣间不用排长队。",[]],["价格：衣服均价大概在 500 元人民币左右起跳，包包和鞋子相对便宜一些。",[]],["试穿体验：店里人相对不多，可以慢慢试穿。建议按照店员的模特图来叠穿，效果会惊艳很多。",[]],["",["401.webp"]],["",["402.webp"]],["【必买单品推荐】",[]],["ADVENTURE 双肩包：它家最火的单品！低饱和莫兰迪色，自重超级轻，背带不勒肩，通勤或逛街背都绝美。",[]],["帆布包系列：轻薄、小巧且设计感强，有很多纯色和印花款，非常适合当伴手礼送朋友。",[]],["飘带衬衫：黄皮亲测显白，飘带设计系出高级感，搭配半裙或阔腿裤都很气质。",[]],["经典半裙与连衣裙：很多款式带松紧腰和木耳边，面料舒服，上身效果比挂在架上好看很多。",[]],["方头鞋与小靴子：黑色和棕色都很百搭，上脚舒适，夏天也能穿的小靴子设计很特别。",[]],["*尺码建议：部分尺码偏小，一定要试穿后再买，不要盲目拿平时的尺码。",[]],["*很多上身比图片好看，一定要去线下试穿感受质感。",[]]]},{"id":2057,"title":"核桃饼","area":"首尔林","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["3.13 「🥮｜核桃饼」",[]],["🕙10:00-20:00｜水仁盆唐线【首尔林地铁站5号口】",[]],["人均消费：约 7,500韩元（8个迷你装）或 12,000韩元（12个）",[]],["【必点口味推荐】",[]],["黄油红豆夹心：绝对的王牌！刚出炉的时候黄油微微融化，和绵密的红豆沙融合在一起，香甜但不腻，核桃仁的脆感也加分。",[]],["奶油芝士味：很多博主推荐的味道，芝士的咸香中和了红豆的甜，口感更丰富，喜欢芝士的姐妹一定要试。",[]],["青苹果味：比较清爽的口味，酸酸甜甜，适合不喜欢太甜的人，夏天吃或者当伴手礼都很合适。",[]],["",["403.webp"]]]},{"id":2065,"title":"4. 【😋圣水洞午饭～休息一下！】","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["4. 【😋圣水洞午饭～休息一下！】",[]]]},{"id":2066,"title":"DAYLIT","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["4.1 「🍲｜DAYLIT」14点后别去～有午休",[]],["🕙周一～周三11:30-14:00，17:00-20:30｜周四～周日11:30-20:30",[]],["⚠️ 强烈建议提前在 Catch Table 或 Naver Map 上预约，周末不预约可能要等位很久。",[]],["Daylit（데이릿） 是首尔超火的韩式融合料理餐厅，把传统韩料做出了高级感和创意，环境也很出片。",[]],["特色：半地下室设计，深绿色调加四叶草装饰，很有韩式街头潮流感。菜品丰富，适合朋友聚餐或约会。",[]],["营业时间：平日 11:30-21:30（14:30-17:00 休息）；周末 11:30-21:30（无休息）。",[]],["位置在地下：圣水店在 B1 层，看到不锈钢招牌和四叶草标志就对了。",[]],["信号问题：圣水店在 B1，手机信号可能不太好，点餐和支付时注意留意网络状态，建议提前准备好信用卡。",[]],["扫码点餐：店内扫码点餐，地下信号可能不太好，建议提前连上店里Wi-Fi。",[]],["【必点菜品推荐】",[]],["",["404.webp"]],["",["405.webp"]],["",["406.webp"]],["直火猪蹄刀削面（직화족발국수）：招牌必点！猪蹄炙烤得很香，肉质软糯，搭配筋道的刀削面，甜辣口很解馋。（猪蹄面会问要不要加香菜，如果不吃香菜一定要提前说“고수 없음”。）",[]],["老泡菜生拌牛肉卷（묵은지육회마끼）：用酸爽的老泡菜代替海苔，裹着鲜甜的牛肉和紫苏叶，一口下去酸甜鲜香，不能吃生牛肉的人也能接受。",[]],["芒果芥末炸鸡：外酥里嫩的炸鸡块淋上特调芒果酱，果香解腻，鸡肉多汁，很多人说这是全场最佳。",[]],["法式火腿奶油乌冬面（全场最佳）：15,800 韩元。奶香浓郁但完全不腻，汤底偏汤状，没有厚重的糊嘴感。里面有剥壳的虾、火腿和风干番茄，顶上撒点辣椒油增香，怕腻星人也会一口接一口。",[]],["脆年糕锅：外脆内软不黏糊，微甜口感像炸油条加炸马蹄，配上汤汁可以光盘。",[]],["火腿芝士奶酱土豆饼：18,800 韩元。外脆内软的土豆饼搭配咸香的火腿和浓郁的芝士奶酱，层次丰富，很适合当配菜或下酒菜。",[]],["隐藏吃法：猪蹄面吃到后面如果觉得腻，可以加一份米饭拌进剩下的酱汁里，或者点一份清爽的凉拌鸡丝中和一下。",[]],["口味预警：猪蹄面整体偏甜辣口，如果你平时不吃甜辣，建议搭配清爽的饮料或点一份凉拌菜解腻。",[]],["【价格与支付方式】",[]],["人均价格：大概在 18,000～22,000 韩元（约 90～110 元人民币），分量足，两个人点两道菜就够。",[]],["支付方式：支持信用卡，但不支持支付宝和微信支付，建议备好韩元现金或刷信用卡。",[]]]},{"id":2091,"title":"심퍼티쿠시 szimpatikus","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["4.2 「🍝｜심퍼티쿠시 szimpatikus」15点午休",[]],["🕙11:30-21:00（15:00 - 17:00午休）｜📍星巴克旁边大楼上 3 楼",[]],["Szimpatikus（심퍼티쿠시） 是首尔超火的“漂亮饭”西餐厅，店名是匈牙利语，意为“令人喜欢的”。它家主打欧亚融合创意料理，落地窗超好拍，菜品口味也很符合亚洲人喜好，是约会、聚餐和过生日的绝佳选择。",[]],["特色：超大落地窗可以看到圣水洞的城市夜景和地铁高架桥穿梭，傍晚来有“落日飞车”的感觉。环境高级，非常适合情侣约会和闺蜜聚餐。",[]],["人均价格：不喝酒的话人均 30,000～40,000 韩元（约 150～200 元人民币）",[]],["支付方式：支持信用卡，但可能不支持支付宝和微信支付，建议备好韩元现金或刷信用卡。",[]],["预约方式：强烈建议提前在 Catch Table 或 Naver Map 上预约，尤其是想坐窗边位置的话。预约会收每人 10,000 韩元的定金，买单时直接抵扣。",[]],["【必点菜品推荐】",[]],["",["407.webp"]],["바질드레싱 모짜렐라 샐러드｜罗勒酱马苏里拉沙拉（推荐程度🌟🌟🌟🌟🌟）新鲜水果蔬菜+马苏里拉奶酪+清爽的罗勒醋汁",[]],["",["408.webp"]],["숯불 닭 목살 곤드레 리조또｜炭火鸡颈肉烩饭（推荐程度🌟🌟🌟🌟)青柠泡沫+烤鸡肉+青阳辣椒（但是青阳辣椒有点辣，然后吃到后面会有点小腻）",[]],["",["409.webp"]],["",["410.webp"]],["辣椒橄榄油明太鱼籽意面（招牌必点）：微辣的辣椒油搭配咸香浓郁的明太鱼籽奶油酱，层次丰富，越吃越香，很多博主都强推。",[]],["牛排奶油烩饭：牛排熟度刚好，肉质软嫩多汁，搭配香浓顺滑的奶油烩饭，一口下去非常满足，奶香和肉香融合得很好。",[]],["蒜香虾挞：超好吃的小挞，里面是蒜香虾，口感酥脆，作为前菜非常惊艳。",[]],["龙虾玫瑰意面：龙虾肉紧致新鲜，酱汁浓郁，摆盘非常漂亮，拍照很出片。",[]],["提拉米苏：分量很大，两个人点一份就够。如果是过生日，可以跟工作人员要一个小蜡烛，氛围感直接拉满。",[]]]},{"id":2110,"title":"Darobe（다로베）","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["4.3 「🍕｜Darobe（다로베）」",[]],["🕙11:30 - 20:00（15-17午休）",[]],["Darobe（다로베） 是首尔林和圣水洞附近一家超有人气的意大利风味餐厅，主打现烤火炉披萨和特色意面。它家氛围感很好，非常适合约会或闺蜜聚餐。",[]],["提前预约：如果是周末或节假日去，强烈建议提前在 Naver Map 或 Catch Table 上预约，避免等位太久。",[]],["排队预警：店里空间稍小，人气很高，周末和饭点经常需要等位。建议一到店先登记排队，然后去首尔林散散步再回来，不用一直站着等。",[]],["人均价格：大概在 20,000～30,000 韩元（约 100～150 元人民币），披萨约 19,000～25,000 韩元，意面约 23,000～25,000 韩元。",[]],["支付方式：支持信用卡，部分门店可能支持支付宝或微信，建议备点韩元现金。",[]],["点单方式：店内点单，现点现做，上菜需要等一会。",[]],["【必点菜品推荐】",[]],["",["411.webp"]],["",["412.webp"]],["",["413.webp"]],["*口味提醒：有博主反馈它家的面整体煮得偏硬（意大利口感），而且偏咸，如果你口味比较清淡，可以提前跟店员沟通。",[]],["Darobe 火腿披萨（招牌必点）：上面的火腿（Jambon）特别好吃，搭配松露油和罗勒，香气十足。披萨边缘烤得蓬蓬的，口感和香气都很棒，配一杯冰啤酒刚刚好。",[]],["布拉塔奶酪披萨：披萨上搭配半熟鸡蛋和布拉塔奶酪，完美融合。半熟蛋没有腥味，每个材料都配合得很好，是店里的第一名热门菜品。",[]],["野生蘑菇奶油意面（Porcini Crema）：使用不常见的圆筒形意面，搭配野生蘑菇和浓郁奶香的酱料，咀嚼感很好，蘑菇非常嫩。",[]],["培根番茄意面（Amatriciana）：经典的培根番茄酱料，味道浓郁，适合喜欢酸甜口味的人。",[]],["玫瑰虾意面（Langostino）：如果你喜欢玫瑰意面或者虾，一定要尝一尝。味道完美，虽然分量不大但很精致。",[]]]},{"id":2129,"title":"No more pizza","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["4.4 「🍕｜No more pizza」",[]],["🕙11:00-20:10",[]],["点单方式：门口有自助点餐机，支持中文界面，操作很简单。",[]],["支付方式：自助点餐机通常不支持支付宝和微信支付，需要刷信用卡（Visa/Master/银联）或现金。",[]],["不用收拾：堂食的话，店员会送餐过来，吃完不需要自己收拾垃圾，直接走就行。",[]],["【必点口味与隐藏吃法】",[]],["点单技巧：可以点半半双拼（两个口味拼在一起），这样能一次尝到两种味道。",[]],["玉米薯片大虾披萨（招牌必点）：aespa 同款！大虾饱满弹牙，玉米清甜，上面还有脆脆的烧烤薯片，甜辣交织，口感层次超级丰富。（可以和店员说少点辣：「고추는 적게 넣어 주세요.」）",[]],["培根土豆披萨：土豆超级软糯，培根烤得脆香，搭配芝士的奶香，不辣且很满足，适合不能吃辣的人。",[]],["罗勒马斯卡彭意式团子披萨：欧美客人常点款，马斯卡彭奶酪奶香浓郁，意式团子哏啾啾的，芝士超满。",[]],["红薯泥边（强烈建议加）：点披萨时额外加 3000 韩元选红薯泥边，外圈挤满香甜的红薯泥，很多博主说这个边比披萨本身还好吃！",[]],["烤鸡翅：外皮微焦带着黄油奶香，肉质鲜嫩，微辣入味，点披萨时顺便加一份鸡翅非常搭。",[]],["【价格与尺寸参考】",[]],["P（Personal，4片）：约 13,800 韩元（约 65 元人民币），适合 1-2 人。",[]],["R（Regular，6片）：约 19,800 韩元起（约 92 元人民币），适合 2-3 人。",[]],["L（Large，8片）：约 26,800 韩元起（约 125 元人民币），适合 3-4 人。",[]]]},{"id":2145,"title":"5. 【圣水洞】（104）","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5. 【圣水洞】（104）",[]]]},{"id":2146,"title":"AMA（아마）","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.1 *「🍫｜ AMA（아마）」12:00-20:00",[]],["🕙12:00-20:00｜💳 信用卡/现金",[]],["迪拜巧克力专门店！标志性的绿色门头非常吸睛，店里职员全部现场手工制作，隔着玻璃就能看到制作过程。包装精致，非常适合买回去当伴手礼。",[]],["店里没有座位｜店里有中文菜单，可以向店员要～",[]],["【必点口味推荐】",[]],["定制款巧克力：35,000 韩元/个。可以自选巧克力底（开心果/黑巧/白巧）、果酱（开心果/花生）和卡达伊夫面丝（酥脆/柔软）。店员最推荐的是双重开心果（chewy湿软内馅）的版本。",[]],["Pi-Pi-Saeng（开心果巧克力）：以开心果巧克力为底，包裹着 100% 手工磨制的纯开心果酱与酥脆的生面卡达伊夫，香甜浓郁，每咬一口都是咔嚓咔嚓的极致酥脆感。",[]],["Dark-Pi-Saeng（黑巧开心果巧克力）：黑巧克力的醇厚苦甜搭配浓郁开心果酱与卡达伊夫生面，追求经典层次感的首推这款。",[]],["迪拜软糯曲奇（두쫀쿠）：7,000 韩元/个。软糯的曲奇里面填入满满的开心果酱，咬一口酱会流出来，建议稍微冷藏一下再吃，口感更好。",[]],["冷藏口感更好：曲奇和巧克力稍微冷藏一下再吃，开心果酱不会流得到处都是，口感也更棒。",[]],["",["414.webp"]]]},{"id":2158,"title":"Rest & Recreation","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.2 「🛍️｜Rest & Recreation」11:00-19:30",[]],["🕙11:00-19:30｜💳 微信支付宝✅｜https://restandrecreation.com",[]],["【逛店指南与必买单品】",[]],["男女通用休闲设计师品牌，主打韩系 Clean Fit 简约风。",[]],["🛗：1F：RR BEAUTY 彩妆｜2-3F：女装，4F：男装",[]],["*尺码偏小：RR 版型偏小，很多上装是均码但偏紧。",[]],["麻花针织上衣：配色好看，版型修身，加上小 Logo 设计，非常显气质，是秋冬必入款。",[]],["卫衣与棒球帽：他家有很多在别处找不到的独特配色，卫衣搭配同色系棒球帽，休闲又酷飒。",[]],["喇叭运动裤：超长款喇叭运动裤，侧边竖排字母点缀，搭配短上衣很显比例。",[]],["彩妆副线：1 楼的 RR BEAUTY 有唇蜜、腮红膏等，包装和配色都很好看，适合买伴手礼。",[]],["【价格与支付方式】",[]],["价格区间：单品大概在 200～800 元之间，卫衣、针织衫等秋冬款在约 250～1300 元。",[]],["退税服务：支持现场退税，结账时记得带上护照。",[]]]},{"id":2171,"title":"THE COLDEST MOMENT","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.3 「🛍️｜THE COLDEST MOMENT」（周四五休息）11:00-20:00",[]],["🕙11:00-20:00｜https://thecoldestmoment.com/",[]],["THE COLDEST MOMENT（简称 TCDMT） 是韩国休闲设计师品牌，标志性的海星 Logo 和日系松弛感穿搭让它成了很多韩星和博主的私服首选。",[]],["价格区间：短袖和上衣基本在 300 元人民币左右，下装（裤子/裙子）在 500 元人民币以上，配饰在 100～200 元人民币之间。在设计师品牌里性价比很高。",[]],["支付方式：支持信用卡，部分门店支持支付宝或微信，建议备好韩元现金或刷信用卡。",[]],["退税服务：支持现场退税，结账时记得带上护照。",[]],["【品牌风格与必买单品】",[]],["TCDMT 主打日系休闲 + 无性别中性风，版型宽松舒适，男女都可以一起逛，随便搭搭就很有韩系氛围感。",[]],["🛗 1F：基础款和配饰｜2F：男装&新款",[]],["尺码建议：它家是男女通穿的中性风，版型偏宽松。女生如果追求修身效果可以选小一码。",[]],["搭配建议：它家的衣服单看很简约，但叠穿和搭配配饰（帽子、包包）后层次感很强。",[]],["海星卫衣/T 恤：标志性的海星 Logo 设计，配色通常是低饱和的灰调、卡其或暖色系，简约但不无聊。",[]],["条纹海星卫裤：很多博主和明星（如 李沅禧）穿过，休闲又舒服，侧边或屁股上有海星小标志。",[]],["工装裤与夹克服：秋冬新款的工装裤和夹克服很受欢迎，深棕色或灰黑色特别酷。",[]],["配饰系列：帽子（平檐帽、鸭舌帽）、双肩包（条纹款、双面可背）、小腰带等。",[]]]},{"id":2187,"title":"MOONSUN（문선）","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.4 「🛍️｜MOONSUN（문선）」12:00-20:00",[]],["🕙12:00-20:00｜https://moon-sun.co.kr/",[]],["🛗 3F：MOONSUN 主线，款式最全｜2F：副线品牌 SATUR，主打韩国秋冬衣橱，可以一站式逛完。",[]],["韩国超火的小众设计师品牌，主打极简轻奢风和“平衡与留白美学”。以高品质面料和极简设计著称，剪裁精致，把男性化和女性化的轮廓融合得恰到好处，日常休闲又巨百搭。",[]],["支付方式：支持信用卡，部分门店可能支持支付宝或微信支付，建议备好信用卡。",[]],["退税服务：支持现场退税，结账时记得带上护照。",[]],["【价格区间】",[]],["T 恤/针织：约 90,000～150,000 韩元（约 450～750 元人民币）。",[]],["衬衫/外套：约 150,000～250,000 韩元（约 750～1250 元人民币）。",[]],["【品牌风格与必买单品】",[]],["搭配建议：它家的衣服单看很简约，但叠穿和搭配配饰后层次感很强，建议多试几套找找灵感。",[]],["波点针织开衫：羊毛混纺提花面料，摸起来舒服还耐穿，复古感拉满，秋冬必备。",[]],["机能风皮衣外套：黑色款又酷又辣，版型超好，上身气场全开，很多博主都推荐。",[]],["蓝白条纹衬衫：棉服融合设计，休闲又百搭，不挑人，谁穿谁好看。",[]],["灰色波点套装：配上毛毛半身裤，复古感满满，韩系氛围感直接拉满。",[]],["抓绒上衣与格纹半裙：蓝绿色抓绒上衣搭配蓝格纹半裙是主打 Look，温柔又带点小个性，秋冬穿完全不显厚重。",[]],["副线 M.C（MOONSUN COTTON）：主打天然棉/麻/莫代尔，基础条纹 T 恤、水洗棉开衫、细褶牛仔，价格更亲民，适合追求舒适质感的日常穿搭。",[]]]},{"id":2204,"title":"SATUR","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.5 「🛍️｜SATUR」20💙12:00-20:00",[]],["🕙12:00-20:00｜💳 信用卡｜https://satur.co.kr/",[]],["【品牌关系与风格】",[]],["姐妹品牌：SATUR 是 MOONSUN 的副线品牌。如果说 MOONSUN 是极简轻奢风，那 SATUR 就是轻松、年轻、带点韩系复古感的休闲风。名字来自“Saturday”，主打“把周六的松弛感穿在身上”。韩系极简 + 复古休闲风，版型干净，很多爱豆（比如 RIIZE）和明星都爱穿。",[]],["男女同款：大部分款式都是男女同款，版型宽松舒适。",[]],["退税服务：支持现场退税，结账时记得带上护照。",[]],["【必买单品推荐】",[]],["",["415.webp"]],["",["416.webp"]],["",["417.webp"]],["",["418.webp"]],["",["419.webp"]],["",["420.webp"]],["",["421.webp"]],["",["422.webp"]],["",["423.webp"]],["",["424.webp"]],["",["425.webp"]],["",["426.webp"]],["",["427.webp"]],["",["428.webp"]],["",["429.webp"]],["",["430.webp"]],["",["431.webp"]],["",["432.webp"]],["",["433.webp"]],["",["434.webp"]],["",["435.webp"]],["",["436.webp"]],["",["437.webp"]],["",["438.webp"]],["",["439.webp"]],["",["440.webp"]],["",["441.webp"]],["",["442.webp"]],["",["443.webp"]],["",["444.webp"]],["【价格区间】",[]],["T 恤/卫衣：约 200～400 元人民币。",[]],["外套/夹克：约 500～1000 元人民币。",[]],["裤子：约 300～600 元人民币。",[]],["拉链连帽夹克：SATUR 的标志性单品，面料适配多气候场景，连帽廓形自带休闲质感，上身利落又自在。",[]],["四 S 镜像 Logo 棒球帽：品牌标志性设计，辨识度极高，复古又百搭，男女都能戴。",[]],["休闲宽松牛仔直筒裤：经典不过时，柔韧肌理藏住松弛感，直筒剪裁平衡随性与精致。",[]],["薄荷蓝卫衣：低饱和度的薄荷蓝，上身轻快清爽，搭牛仔裤或白色裙子都很好看，秋天穿特别提气色。",[]],["蒙奇奇联名款：SATUR 和 Monchhichi 的联名系列超可爱，有短袖、挂件等，适合做伴手礼送朋友。",[]],["基础 Logo T 恤：微阔版型加棉感材质，单穿或内搭都显瘦，性价比很高。",[]],["短款卫衣与 T 恤：版型好，不挑身高，搭配牛仔裤或运动裤就是完美的 Clean Fit，价格也很友好。",[]],["麂皮防风棉服：秋冬爆款，质感好又保暖，上身很有氛围感。",[]],["运动套装：一套穿出门慵懒又时髦，面料软糯舒适，日常随便套上就很好看。",[]]]},{"id":2259,"title":"Olive Better","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.6 「💊｜Olive Better」10:00-22:00",[]],["🕙10:00-22:00｜💳 微信支付宝✅",[]],["【逛店与避坑小贴士】",[]],["先试后买：店内提供部分商品试吃和体验，建议第一天先买一些小样或单支装试试口味和效果，最后一天再回来扫货整盒。",[]],["注意折扣标识：货架上有“1+1”或“2+1”字样的商品千万不要错过，算下来比单价便宜很多，结账时可以直接拿三个同类型的去结账。",[]],["价格亲民：很多内服补剂和健康零食的价格比国内代购便宜，单支装或条装设计非常适合旅行时先试错，再决定要不要买整盒。",[]],["当场退税：单笔满 15,000 韩元即可当场退税！结账时主动出示护照原件，直接付免税价。",[]],["可以试吃：一楼有很多试吃体验区，拿不定主意的时候先尝尝，好吃再买，避免盲踩雷。",[]],["小包装更划算：很多内服补剂和零食都有单支小样装或条状装，价格不贵，非常适合买来当伴手礼送朋友，或者自己先试水。",[]],["【必买热门清单推荐】",[]],["",["445.webp"]],["",["446.webp"]],["",["447.webp"]],["",["448.webp"]],["",["449.webp"]],["",["450.webp"]],["",["451.webp"]],["",["452.webp"]],["",["453.webp"]],["BB LAB 橄榄柠檬油饮：被 张元英 带火的“韩女续命水”！早上空腹喝帮助排毒和控糖，单支装很方便，味道清爽不油腻。",[]],["All the Better 系列软糖与条状补给：维 C 软糖、胶原蛋白软糖、红参条等，做成软糖或条状形式，好吃无负担，很多款式还有 2+1 活动，非常适合凑单。",[]],["高蛋白与低卡零食：各种颜色的蛋白棒、蓝莓全麦吐司脆片、花生酱小样、代餐麦片等，好吃不胖，是减脂期或嘴馋时的快乐老家。",[]],["助眠与情绪疗愈好物：助眠果冻、薰衣草精油、天然香氛扩香石、舒适的家居睡衣等。",[]],["Nothing Better 南瓜汁：去水肿神器，很多韩女早上必喝，搭配其他果汁一起喝味道更好。",[]],["第一天可以先买一些小样体验，之后再买大包装",[]],["六大健康分区怎么逛",[]],["Olive Better 不按传统品类分区，而是按照“吃喝玩睡”的一天生活节奏来划分，逛起来非常有代入感：",[]],["Eat Well（健康轻食）：一楼的即时补给站，有沙拉、高蛋白即食餐、低糖零食、蛋白棒。每款都标了卡路里，解馋无负担。",[]],["Nourish Well（营养补充）：维他命、益生菌、功能性保健品，很多都做成了零食化的小包装，方便每天补充。",[]],["Fit Well（运动补给）：蛋白粉、能量胶、居家训练器材等，适合喜欢运动或身材管理的人群。",[]],["Glow Well（香氛保养）：芳疗、身体保养、derma 护理等内调外护产品。",[]],["Relax Well（助眠疗愈）：无咖啡因茶饮、香氛、睡衣、助眠灯、睡眠喷雾。二楼还有 Tea Bar 每月换新茶饮免费品尝。",[]],["Care Well（日常护理）：口腔护理、女性卫生用品等细节护理好物。",[]],["橄榄油柠檬 Shot（断货王）：65% 橄榄油 + 35% 柠檬汁，张员瑛同款。早上空腹喝一条，抗氧化又饱腹，果香清爽不腻口（肠胃敏感者建议不要空腹喝）。",[]],["ILO 胶原蛋白肽：裴秀智代言，高纯度小分子，口感像果汁一样酸甜，没有腥味，一天一瓶毫无压力。",[]],["功能性软糖：蓝莓叶黄素（护眼）、酸樱桃褪黑素（助眠），QQ 弹弹像零食，包装可爱，适合当伴手礼。",[]],["低卡零食墙：蛋白棒、全麦吐司脆片、低卡贝果脆片，每款都标了卡路里，减脂期解馋无负担。",[]],["浓缩漱口液：韩网榜单第一，便携条状，加水一按就是漱口水，青苹果味很清新，适合随身携带。",[]]]},{"id":2298,"title":"LOOKAST","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.7 「🛍️｜LOOKAST」（周一休息）12:00-20:00",[]],["🕙12:00-20:00｜💳 微信支付宝✅｜https://lookast.com/index.html?select_language=KOR",[]],["“韩版 COS”！它家主打韩系极简 Clean Fit，低饱和配色加上干净利落的剪裁，上身就自带一种“不费力的高级感”，连 IU、申有娜 等爱豆都经常上身。",[]],["特色：空间设计感极强，利用斜线和镜子放大视觉，色彩严格控制在三种色调内。款式最齐全，衣服、包包、帽子一站式搭配，经常有 30%～80% 的折扣活动。",[]],["【必买单品推荐】",[]],["尺码建议：它家版型偏宽松，但如果是修身款，建议试穿后再买，不要盲目拿平时的尺码。",[]],["无袖收腰连衣裙：纯黑色系但上身温柔有气质，腰部细带收腰设计提高腰线，特别显身材比例，妥妥的韩剧职场女主风。",[]],["垂感阔腿裤：裤子版型是它家的灵魂，垂感很好，对小个子也很友好，搭配简单的 T 恤或背心就很好看。",[]],["薄荷绿针织：适合初秋的天气，配灰色半裙和发带，有一点复古感，温柔又显白。",[]],["米白色风衣：宽松版型，轻轻松松就能出门，自带高级感，是秋冬衣橱的必备单品。",[]],["基础款背心与衬衫：比如白色无袖衫、透明短袖衫，绑带设计很加分，不会贴身，穿上很凉快，日常利用率极高。",[]]]},{"id":2309,"title":"anillo","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.8 「✨｜anillo」11:00-20:30",[]],["🕙周一～周五11:00-18:00｜💳 微信支付宝✅｜https://anillo.co.kr/",[]],["Anillo（아닐로）：韩国本土超火的香氛洗护品牌，主打纯素护肤和高级小众香。它家的店铺装修是复古法式风。",[]],["【必买单品推荐】",[]],["Anillo 的香味高级不撞香，洗护产品洗完头发超级蓬松，留香时间也很长。",[]],["*试香体验：店里会提供试香卡，建议先闻香根草或木质调，再闻花香调，避免嗅觉疲劳。",[]],["*限量活动：店里经常有到店送迷你香水、消费满额 DIY 香氛钥匙扣等活动，去之前可以在小红书上搜一下当天的最新活动。",[]],["（10ml 香水大概 100+，50ml 大概 300 元以内；洗发水 450ml 大概 100-150 元）",[]],["Black Tea（黑茶香水）：MVP 级别！奶油木质茶香，像慵懒午后晒着太阳捧着一杯热红茶，温暖松弛，留香持久，10ml 只要 100 多人民币，性价比极高。",[]],["Patchouli Garden（广藿香花园）：带着泥土湿润感的草本广藿香，像晨光洒进花园，安静治愈，有刚洗完澡躺进白床单的安心感，部分款式可能是圣水店限定。",[]],["Lime Sunday（青柠周日）：青柠+松木+雪松的木质柑橘调，完全就是“周末清晨推开窗微风吹进森林”的味道，干净轻盈，夏天喷它心情都会变好。",[]],["Rosy Night（漫夜玫瑰洗发水）：年度最爱洗发水之一，玫瑰味留香能持续 24 小时，洗完头发超级蓬松，拯救扁塌发根，450ml 大概 100 元人民币左右。",[]],["头皮醋：尖嘴瓶子设计，直接倒到发缝头皮上揉搓，轻微起泡，薄荷爽感翻倍，能帮助头皮进一步清洁和去屑，非常特别。",[]],["绿色磨砂洗发水：带有磨砂颗粒的青柠味洗发水，泡沫丰富，洗完头皮清清凉凉，控油去屑效果很好。",[]],["身体磨砂膏：嫩嫩的奶油黄色，料体带弹性，磨砂舒服不刺激，泡泡丰富细腻，好过水。",[]]]},{"id":2324,"title":"NONFICTION","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.9 「✨｜NONFICTION」11:00-20:30",[]],["🕙11:00-20:30｜💳 微信支付宝✅｜https://nonfiction.kr",[]],["NONFICTION（논픽션）主打极简高级的木质调和治愈系香气。它家的包装和味道都超级有品味，买伴手礼的首选。",[]],["【必买单品推荐】",[]],["它家的香味高级不撞香，属于“发力平均、每款都做得不错”的类型，送人绝对不出错。",[]],["*价格区间：100ml 香水大概约 990 元；沐浴露 300ml约 195 元；发香喷雾 100ml 约 245 元；护手霜大概 100 多。在香氛品牌里性价比很高。（乐天免税店比价）",[]],["Gentle Night 沐浴露：无花果+白茶+雪松木+麝香，洗完澡整个人安静下来的味道，不甜腻。",[]],["Gaiac Flower 身体乳/护手霜：木质花香带一点冷感，像韩剧女主下雪天的味道，气质感拉满。",[]],["Santal Cream 身体乳/护手霜：奶感檀木香，像白衬衫加羊绒围巾，温柔高级，木质香爱好者闭眼入。",[]],["【THE ROSE】 ：玫瑰调不是俗套的甜玫瑰，是带着清冽感的清冷玫瑰香，还原了玫瑰原生的柔媚与疏离，温柔又有风骨，不爱甜香的姐妹也能轻松驾驭。",[]],["Rose Pale 发香喷雾：水油分离质地，淡雾感白玫瑰香，可以持续一整天，出门前喷一喷就是\"自带体香\"。",[]],["The Beige 身体乳：鸢尾花香混合麝香，非常温柔高级的木质花香，奶油质地滋润不粘腻。",[]],["Rose Pale 浅玫瑰洗护礼盒：洗发水+护发素套装，黑白泼墨礼盒包装颜值很高，适合当伴手礼送人。",[]],["护手霜套盒：有多种香味可选，包装精美，送人非常合适。",[]],["身体磨砂膏/洗手磨砂膏：颗粒细腻不伤皮肤，洗完滑滑的不拔干，搭配同款护手霜效果很好。",[]]]},{"id":2340,"title":"Amuse","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.10 「💄｜Amuse」11:00-20:30",[]],["🕙11:00-20:30｜https://www.amusemakeup.com/",[]],["【楼层逛店路线与体验】",[]],["1F 全系列试色 + 拍照打卡：进店就是满满的粉嫩少女风，全线产品都可以随便试色。",[]],["2F（DIY 专区 + 互动活动）：可以挑选小珠子、小配饰自己组装迷你唇釉挂件或钥匙扣。",[]],["*现场退税：门店支持现场退税，记得带上护照！",[]],["【圣水店限定与必买推荐】",[]],["迷你唇釉：只有圣水店才买得到的限定四色组合（如 Tokyo Cherry 等），体积只有普通的一半，超级 Q 萌。",[]],["Jel Fit Tint 果冻唇釉：张元英同款，水光感满满且不粘嘴。推荐 #05 Oat Muwha（燕麦摩卡，黄皮显白）和 #13 Rose Tulle（玫瑰纱，清冷少女感）。",[]],["Jel Fit Gloss 水光唇蜜：不是那种厚重浮在嘴上的 gloss，而是饱满干净的光泽，有丰唇效果，连唇纹都能隐形。推荐 #01 Oat Vanilla（香草燕麦）和 #09 Vanilla Mocha Pearl（香草摩卡珠光）。",[]],["汽水唇膏：可乐瓶造型超可爱，变色唇膏刚涂是透明的，慢慢显色，适合素颜或叠涂。",[]],["Duo Power 气垫：小粉盒主打水光肌，小白盒主打半雾面遮瑕，干皮亲妈。",[]],["Dew Serum Liquid Blush 液体腮红：非常火，质地水润，涂开是自然透亮的感觉。推荐 S04 Otomoka（经常断货的热门色）和 S03 Peach Latte（元气蜜桃）。",[]],["腮红膏：和蒙奇奇联名的游戏机造型超萌，水蜜桃和无花果色都很显白，唇颊两用。",[]],["迷你护唇膏吊饰：买正装唇釉经常送，挂在包包上既可爱又能随时补涂。",[]]]},{"id":2355,"title":"SUARE","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.11 「🛍️｜SUARE」💗💙13:00-20:00",[]]]},{"id":2356,"title":"General Idea","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.12 「🛍️｜General Idea」💗11:00-20:00",[]],["🕙11:00-20:00｜💳 微信支付宝✅｜https://generalidea.co.kr/",[]],["【品牌速览】",[]],["由韩国殿堂级设计师 崔范锡 于 2003 年创立，2009 年成为首位登上纽约时装周的韩国设计师，连续 6 次亮相四大时装周。",[]],["风格：克制的极简风与“留白”美学，注重面料质感和版型优化，主打日常实穿与高级松弛感。",[]],["受众：EXO、IVE、李钟硕 等众多韩流明星和韩剧女主常穿。",[]],["价格区间：基础款针织衫和打底衫大概在 200-300 元人民币左右，外套和毛衣在 500-1000 元。",[]],["【必买爆款推荐】",[]],["⚠️尺码注意：版型偏宽松慵懒，但如果是修身款，建议试穿一下确认肩宽和袖长。",[]],["立体 LOGO 针织开衫：标志性单品，金属立体 LOGO 点缀，麻花针织纹理，版型利落精神。",[]],["麻花针织开衫：经典圆领金扣款和 V 领款，面料柔软亲肤，自带老钱风松弛感，秋冬叠穿必备。",[]],["不易皱衬衫：剪裁精良，翻领设计搭配纵向抽褶或系带收腰，单穿或叠穿皮衣都很有氛围。",[]],["条纹 Polo 衫：复古学院风，材质轻薄透气，搭配牛仔裤或百褶裙，轻松拿捏休闲松弛感。",[]],["简约皮质外套与西装：版型极佳，线条利落，通勤或约会都能无缝切换，穿上就是大女主气场。",[]]]},{"id":2372,"title":"Cambag","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.13 *「📷｜Cambag」24H",[]],["🕙24H｜1000元韩币现金or信用卡（⚠️：机器不找零，门口换零钱机器可能会吞钱，建议优先刷卡）",[]],["价格：4000 韩币（四宫格，拍 8 张选 4 张）/ 5000 韩币（两宫格，拍 6 张选 2 张）",[]],["主打“不卡建模”和“复古胶片感”，在圣水洞和汉南洞都很受欢迎。",[]],["有黑白两种背景，四种滤镜可选（韩系清透、复古底片、朦胧柔光、黑白质感）",[]],["OEX4：自然韩系清透感，画面清晰又带氛围，适合日常妆容，拍出来白白净净。",[]],["GRD2000：色彩浓郁的复古底片风，颗粒感自然磨皮，非常适合搭配 Y2K 或鲜艳颜色的衣服。",[]],["BRT III：朦胧柔光感，高曝光自带柔肤效果，比较吃妆容，适合五官立体的人。",[]],["AMB99：黑白底片质感，90 年代电影明星的高级脸，适合摆酷飒姿势，最出片也最经典。",[]],["出片技巧：",[]],["穿深色衣服配白色背景，或浅色衣服配黑色背景，对比度强更出片。",[]],["穿亮色、浅色或露肤度高的衣服最出片。",[]],["千万不要穿纯白色衣服，在闪光灯下容易过曝。",[]],["深发色女生避开深蓝色背景，否则头发会和背景融为一体。",[]],["机位与姿势：",[]],["摄像头位置偏高，小个子女生最好穿带跟的鞋，站在增高台上，否则闪光灯打不到脸会偏暗。",[]],["动作幅度要大，多利用头发（拨三七分、假装扎头发）和随身小道具（皮筋、手机链、戒指）来缓解僵硬。",[]],["眼神管理：眼睛盯着镜头的下方（镜头底部），不要看屏幕里的自己，这样眼神更有力，显得更自信。",[]],["💡保存二维码：拍完屏幕上会出二维码，只有25秒时间，一定要当场拍照保存！ 电子版（含整张、单张、三联及第三视角侧拍视频）需要在 72 小时内扫码下载，过期就失效了！",[]]]},{"id":2391,"title":"COOR","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.14 「🛍️｜COOR」💙12:30-20:30",[]],["🕙12:30-20:30｜💳 信用卡｜https://coor.kr/product/list.html?cate_no=94",[]],["韩国极简风品牌 COOR（全称 Common Origins）确实是很多男生和喜欢中性风女生的“本命品牌”。主打“克制即个性”的静奢感，上身版型极其优秀，被称为“韩国男装杠把子”。",[]],["【品牌速览】",[]],["核心理念：回到衣服本身，追求简洁、和谐的美感。设计语言自然不造作，强调“动态合身的松弛剪裁”。",[]],["风格定位：低饱和色彩（米白、烟灰、深海蓝），注重天然珍稀面料（如进口澳毛、牦牛毛、慕斯羊绒），常被拿来和 AURALEE、COMOLI 等日系品牌相提并论，但价格更亲民。",[]],["受众：男女同款设计居多，非常适合追求 Clean Fit、长期主义衣橱和低调质感的人群。",[]],["【楼层分布】",[]],["1-2F：当季新品展示｜3F：皮衣和外套｜4F：通常有陈列品折扣区或当季促销",[]],["日常价格：衬衫约150-300 元，打底衫和 T 恤约 300-500 元，外套和皮衣约 3000-8000 元",[]],["退税：带上护照可以直接办理退税。",[]],["隐藏福利：结账时店员有时会送 15% 优惠券，可以在附近的陈列品折扣店使用。",[]],["避开高峰：下午和周末人巨多，建议赶在中午 12:30 刚开门或晚上 19:00 以后去。",[]],["【必买推荐】",[]],["",["454.webp"]],["",["455.webp"]],["",["456.webp"]],["",["457.webp"]],["*尺码建议：COOR 的版型偏松弛感，部分外套和衬衫尺码偏大，建议试穿时选小一个码；但针织衫和工装裤按正常尺码选即可。",[]],["面料注意：部分轻薄透气的纯棉或麻质款式容易起皱，穿着时需要注意打理；部分羊毛混纺打底衫可能会有一点点扎肉，建议里面穿件薄打底。",[]],["立体 LOGO 针织开衫：品牌最出圈的标志性单品，金属立体 LOGO 点缀，麻花针织纹理，版型利落精神，是韩系衣橱的百搭神器。",[]],["弯刀工装裤：版型调教得非常到位，百搭、轻薄且可玩性强，线下试穿才能感受到它的神裤属性，经常断货。",[]],["不易皱衬衫：剪裁精良，自带高级质感，翻领设计搭配纵向抽褶或细节处理，单穿或叠穿都很有氛围感，价格约 400-700 元人民币。",[]],["山羊皮皮衣：3 楼的镇店之宝，皮质柔软且版型挺括，男女同款，秋冬穿出去气场全开。",[]],["条纹 Polo 衫与长袖打底：基础款中的战斗机，版型显肩宽，材质舒适，适合日常通勤和休闲叠穿。",[]]]},{"id":2418,"title":"BLUE ELEPHANT","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.15 「👓｜BLUE ELEPHANT」12:00-22:00",[]],["🕙12:00-22:00｜https://blueelephant.co",[]],["【楼层分布与逛店指南】",[]],["1-2F：试戴与选款｜3F：Cafe 休息区",[]],["价格区间：大部分镜框和墨镜的价格在两三百元，性价比极高，被称为GM平替。（据说国内台州产，不是很喜欢就别买）",[]],["体验与出片：装修是超大的工业风艺术展馆，空间奢侈，到处都是擦得超亮的镜子，随手一拍都很出片。逛累了可以直接上三楼的咖啡厅，吃牛角可颂、喝咖啡，还有躺椅可以休息。",[]],["结账流程：试戴好喜欢的款式后，不要直接拿陈列品去结账。要把眼镜给店员，让他们用小纸片记录下对应的眼镜编号，然后去柜台拿全新的未拆封眼镜。结账前一定要检查新眼镜有没有刮痕。",[]],["支付方式：支持信用卡（Visa、Mastercard 等），部分门店也支持支付宝或微信支付，结账前可以问店员“Alipay 可以吗？”",[]],["现场退税：单店购物满 30,000 韩元即可办理退税。",[]],["注意防撞：店里有很多玻璃门和超亮的镜子，试戴走动时注意看路，别一头撞上去。",[]],["避开高峰：周末下午人比较多，建议早上 10 点刚开门或晚上 8 点以后去",[]],["【推荐款式】",[]],["",["458.webp"]],["WONDER CRYSTAL：透明水晶感镜框，视觉上轻盈透亮，自带韩系初恋的温柔感",[]],["CECIL BLACK：纯正干净的黑框，戴上秒变高级时髦冷淡风，带点酷酷的感觉",[]],["猫眼宽腿墨镜：非常显脸小，圆脸和菱形脸必备",[]],["EDIE CRYSTAL：小巧可爱的版型，带鼻托设计，架在鼻梁上非常舒服，久戴也不累",[]],["HUG NUDE BEIGE：质感不错且戴着特别轻，适合日常通勤或休闲叠穿，素颜戴也很提气色。",[]]]},{"id":2437,"title":"RAIVE","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.16 「🛍️｜RAIVE」11:00-20:00",[]],["🕙11:00-20:00｜https://raivestudio.com/",[]],["【品牌速览】",[]],["核心理念：品牌名由 RÊVE（梦想） + I（自我） 融合而成，受音乐艺术文化启发，秉持“Peace, Love, Unusual, Respect”的精神，为专注自我的女性设计。",[]],["风格定位：中性休闲和现代浪漫的碰撞，擅长用做旧工艺、复古印花和松弛剪裁打造松弛感。",[]],["明星效应：从 IU、张元英 到 迪丽热巴、高圆圆 都在穿，出镜率极高，是打造高智感文艺氛围的利器。",[]],["日常价格：T 恤和打底衫约 200-300 元人民币，卫衣约 400-500 元，牛仔裤约 800 元，外套和针织衫在 500-800 元之间。",[]],["免税店退税：在圣水洞门店购买时记得带上护照，单店满 30,000 韩元即可办理退税。",[]],["【试穿与尺码避坑 Tips】",[]],["尺码建议：RAIVE 的版型偏宽松松弛，部分 T 恤和卫衣是 Oversize 风格，建议按正常尺码选；如果是修身款或针织衫，可以试穿一下看是否贴身。",[]],["面料注意：部分针织或低饱和上衣可能会有轻微扎肉感，建议里面穿件薄打底；带屁帘的长裤质感很好，但要注意尺码是否合身。",[]],["避开高峰：周末下午圣水洞人巨多，建议早上 11 点刚开门或者晚上 18:00 以后去。",[]],["",["459.webp"]],["",["460.webp"]],["",["461.webp"]]]},{"id":2453,"title":"Point of View","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.17 *「📒｜Point of View」12:00-19:55",[]],["🕙12:00-19:55｜💳 微信支付宝✅｜https://pointofview.kr/",[]],["满 15,000 韩元退税，找店员要退税单，结账小票务必留存，回国时在机场扫码退税。",[]],["【圣水洞旗舰店三层逛店攻略】",[]],["⚠️分层结账：三层楼层需要分开结账，在哪层挑的就在哪层柜台结账。",[]],["1F TOOL（大众文具区）：",[]],["主要是自营原创文具和日产好物，比如各种笔、本子、印章、贴纸、收纳袋和 MT 胶带。",[]],["人流量最大，有些拥挤，建议快速浏览，挑中喜欢的直接拿好。",[]],["2F SCENE（复古手帐区）：",[]],["集中了大量 Traveler's Notebook（TN）新品、钢笔、各色墨水以及复古手帐本。",[]],["盖章点：二楼收银台旁和二楼通往三楼的楼梯间都有免费自助盖章点，记得带上集章本，盖的时候稍微用点力图案会更清晰。",[]],["3F ARCHIVE（策展展示区）：",[]],["像一间小型文具博物馆，陈列着各种小众收藏品、陶器和香薰，氛围感极佳，非常适合拍照。",[]],["部分展品价格偏高，主要用来观赏和感受美学。",[]],["【必买爆款推荐】",[]],["自营苹果系列：店里的灵魂元素！苹果镇纸、苹果铅笔、苹果收纳包和帆布袋都非常可爱，铅笔折合人民币才四五块钱，性价比很高。",[]],["Traveler's Notebook（TN）系列：作为 TN 韩国合作店铺，有专属印章和限定款。破菠萝皮书衣和 20 周年限定款非常抢手，去晚了容易断货。",[]],["联名系列：Point of View × Hello Kitty 联名本子和贴纸质感超好；还有和韩国本土老牌笔记本 Yangjisa 的联名，颜值高且价格友好，十几二十块一册，送人很合适。",[]],["彩色圆珠笔与印章：自营品牌的彩色笔和韩文小印章非常实用，适合做手帐拼贴和日常记录。",[]]]},{"id":2472,"title":"RIETI","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.18 「🕶️｜RIETI」11:00-21:00",[]],["🕙11:00-21:00｜https://brand.naver.com/rieti/",[]],["【RIETI（리에티）品牌速览】",[]],["核心优势：主打轻量材质（TR-90/醋酸材质），久戴不压鼻梁；镜片为低饱和灰调，防紫外线且素颜友好。",[]],["风格定位：韩系百搭、修饰脸型，涵盖复古框、窄框、金属框、猫眼款等。",[]],["门店特色：虽然门头不大，但上到二楼空间超级大，几百种墨镜和平光镜随意试戴。",[]],["价格区间：大部分在200-300 元，性价比极高。",[]],["支付方式：支持信用卡，部分门店支持微信/支付宝扫码支付",[]],["退税政策：单店购物满 30,000 韩元即可办理退税。",[]],["关于包装：RIETI 的包装仪式感拉满，有黑色云朵眼镜袋 + 白色礼盒 + 绿色手提袋。",[]],["拿全新眼镜：结账时店员会拿全新的未拆封眼镜，一定要检查新眼镜有没有刮痕再离开。",[]],["【必买爆款推荐】",[]],["RUNA（宽框墨镜）：超火的明星同款，149mm 超宽框设计，堪称“脸型魔术师”。方圆脸、圆脸、宽脸都能轻松修饰，戴上就是头包脸效果，黑色最百搭。",[]],["DORIS（猫眼方框）：徐睿知同款，带点菱角感的猫眼设计，显脸小且自带气场，稍微有点小帅的感觉，适合酷飒穿搭。",[]],["EVA（杏色圆框）：最经典的 GM 型，带一点点小棱角，颜色温柔，非常适合温柔穿搭或素颜出门，但稍微有点挑人，建议试戴。",[]],["CARLO（无边框墨镜）：全场最挑人的款式，完全酷盖风，适合跟得上潮流、喜欢个性范儿的姐妹，戴上非常有态度。",[]],["BIBI's Pick 联名系列：和 BIBI 合作的金属边框系列，打破传统墨镜概念，高智感满满，设计感极强，喜欢同款风格的话可以重点看看。",[]]]},{"id":2491,"title":"Pureda","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.19 「🛍️｜Pureda」21💗💗💗11:00-21:00",[]],["🕙11:00-21:00｜https://www.pureda.co.kr/",[]],["【品牌速览】",[]],["风格定位：温柔简约的韩系风，主打通勤、约会、气质单品，设计细节满满。",[]],["核心优势：面料舒适（很多是 100% 棉或含羊绒），版型对亚洲女生很友好。",[]],["价格区间： 秋冬外套约150-1800元人民币，上衣和衬衫百元出头，性价比很高。T 恤和打底衫约 100+ 元人民币，衬衫约 200-300 元，裤子约 300-500 元，大衣约 800-900 元。",[]],["退税政策：单店购物满 30,000 韩元即可办理退税，结账时记得带上护照。",[]],["明星同款：宋智孝 等明星都穿过她家的大衣和单品。",[]],["【必买爆款推荐】",[]],["",["462.webp"]],["",["463.webp"]],["",["464.webp"]],["",["465.webp"]],["",["466.webp"]],["",["467.webp"]],["",["468.webp"]],["",["469.webp"]],["",["470.webp"]],["",["471.webp"]],["",["472.webp"]],["",["473.webp"]],["",["474.webp"]],["",["475.webp"]],["",["476.webp"]],["",["477.webp"]],["",["478.webp"]],["",["479.webp"]],["",["480.webp"]],["",["481.webp"]],["",["482.webp"]],["",["483.webp"]],["",["484.webp"]],["",["485.webp"]],["",["486.webp"]],["",["487.webp"]],["",["488.webp"]],["",["489.webp"]],["",["490.webp"]],["",["491.webp"]],["",["492.webp"]],["",["493.webp"]],["",["494.webp"]],["",["495.webp"]],["⚠️注意尺寸：她家部分衣服是均码（One Size），建议一定要试穿。长款大衣对小个子可能偏长。",[]],["羊毛/羊绒大衣：店里的灵魂单品！版型极佳，大部分含羊绒或 100% 美丽诺羊毛，轻便保暖。米白色和雾霾蓝最显温柔，长款大概 114cm 以上，中款适合小个子，价格大概 800-900 元人民币，性价比极高。",[]],["*大衣选择秘诀：买羊毛大衣一定要选“轻”的！越轻说明羊毛含量越多，上手摸一摸柔顺度，滑滑的、上身不重的才是好大衣。如果特别重且硬挺，可能是聚酯纤维，果断不要。",[]],["4色格纹衬衫：韩国人气 TOP2 的单品！蓝色和棕色最显白，上身很有支撑度。注意红色是 100% 棉更柔软，蓝色是 30% 棉更有型，可以根据需求选择。",[]],["Roenne 衬衫：2025 年 best seller，有肩带细节设计，可以穿出更温柔、更有女人味的感觉，经常断货。",[]],["Point 休闲裤：完美修饰腿部线条的神裤！臀部和大腿部位设计恰到好处，既能展现曲线又不会过于紧绷，收腰设计让双腿看起来更修长。",[]],["提花面料衬衫：Piella（V 领显女性感）和 Ellind（短衣长包裹式设计）都是 100% 棉质提花面料，轻薄舒服，夏天穿也不闷热。",[]]]},{"id":2547,"title":"EGO by showroom","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.20 *「🧸｜EGO by showroom」12:00-20:00",[]],["🕙12:00-20:00｜💳 支付宝✅",[]],["【店铺基本信息】",[]],["三丽鸥和 Chiikawa 爱好者的“快乐老家”～",[]],["EGO 在圣水洞有两家店，离得非常近，款式还不一样，建议两家都逛到，千万别漏掉！",[]],["1 号店（街边店）：位于 연무장3길 10 1층。主要以 三丽鸥 和 Chiikawa 的玩偶挂件、周边和扭蛋机为主。这里经常能淘到一些不常见的角色（比如 Charmmy、Daniel），价格相对便宜一点，13000 韩币左右就能拿下。",[]],["2 号店（对街二楼新店）：位于 연무장3길 9-8 2층。从 1 号店出来右前方抬头就能看到橱窗。这家店面积更大，三丽鸥为主，还有轻松熊等，款式更全，长腿 Kitty 和稀有款基本都在这里。",[]],["【必买爆款推荐】",[]],["长腿 Kitty：店里的“镇店之宝”，梦幻仙女风，小麦色皮肤和芭蕾舞款超可爱，但价格偏高（100 多人民币）。",[]],["Chiikawa 与自嘲熊：各种表情的小本本、书签、挂件，价格相对亲民，适合买来当伴手礼送朋友。",[]],["三丽鸥扭蛋：店里配有扭蛋机，和朋友们一起开盲盒，经常能开出好看的小挂件，互动感很强。",[]],["稀有款玩偶：比如 Piano、豹纹 Kitty、斑马纹 Kitty 等，很多是东京款或限定款。",[]]]},{"id":2559,"title":"bbia","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.21 「💄｜bbia」11:00-21:00",[]],["🕙11:00-21:00｜💳 微信支付宝✅｜https://www.bbia.co.kr/",[]],["BBIA 的独立大店，里面集合了 BBIA、AboutTone、eglips、Edit.B 四个品牌，一站式买齐。",[]],["现场退税：单店购物满 30,000 韩元即可办理退税",[]],["【必买爆款推荐】",[]],["腮红膏：06号无花果色 超级百搭，04号薰衣草紫 去黄提亮，12号樱花粉 很韩系。",[]],["六色眼影盘：03号罗米大地盘 和 06号冷调紫白盘 很受欢迎，哑光色细腻，亮片色上眼很华丽。",[]],["卧蚕笔：13号灰棕色 画卧蚕很顺滑，18号珠光色 点缀卧蚕一绝，新手随便画都不容易出错。",[]],["哑光唇釉：慕斯质地，轻薄不厚重，色号超级多，不管什么肤色都能找到合适的颜色。",[]],["遮瑕液：用刮棒取代刷头，可以把遮瑕上得非常薄，00号纯白色 提亮效果特别好，完全不会假白。",[]]]},{"id":2569,"title":"OSOI","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.22 「🛍️｜OSOI」11:30-20:00",[]],["🕙11:30-20:00｜💳 信用卡｜https://osoi.co.kr",[]],["【逛店Tips】",[]],["尺码选择：160cm 以下的女生推荐选小号，中号可能会压个子或超过腰线。",[]],["关于自重：OSOI 的包包因为用的是真皮和金属五金，自重偏沉（尤其是大号托特包）。",[]],["不要盲目跟风：建议一定要亲自试背，走到门口自然光下看看效果再决定。",[]],["价格区间：小号1k+，中号和大号2-3k",[]],["现场退税：单店购物满 30,000 韩元即可办理退税",[]],["【必买爆款推荐】",[]],["",["496.webp"]],["",["497.webp"]],["TOTE BROCLE：机车腰带元素的大容量托特包，宽版束带搭配方形金属扣和 D 环五金，酷感机车氛围十足。内部空间巨大，适合通勤或装电脑，高个子女生背超有气场。",[]],["SHOULDER BROCLE：腰带系列腋下长包，编织皮带细节搭配金属扣和标志性钥匙挂饰。修长横向包型非常修饰身形，背起来就是韩剧女主。",[]],["SHELL DUFFEL：美式西部复古风的软质托特包，麂皮材质哑光柔和，复古氛围感直接拉满。宽长肩带单肩背负，双拉链开合，非常百搭。",[]],["SHELL BROT MINI：迷你手提包，独特复古做旧色泽，干净极简轮廓，仅搭配皮牌钥匙吊饰。小巧轻便，适合轻出行，休闲穿搭或约会背都超合适。",[]]]},{"id":2584,"title":"29cm kids","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.23 *「👧｜29cm kids」10:00-21:00",[]],["🕙10:00-21:00",[]]]},{"id":2586,"title":"BUDHI MUDRA","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.24 *「🧘｜BUDHI MUDRA」11:00-20:00",[]],["🕙11:00-20:00｜💳 信用卡/现金｜https://budhi-mudra.com",[]],["【品牌速览】",[]],["核心理念：主打自然流动的生命力，将休闲服与瑜伽服完美结合。面料多采用再生环保材质，触感极软。",[]],["风格定位：高饱和度马卡龙色/低饱和莫兰迪色，版型宽松舒适，不挑身材，日常通勤、居家或练瑜伽都能穿。",[]],["价格区间：上衣大概 200-400 元人民币，裤子大概 300-500 元人民币。",[]],["退税政策：需要到机场退税。结账时记得向店员索要退税单，并妥善保管。",[]],["关于暴汗：有瑜伽博主反馈，它家的衣服日常穿和轻度拉伸非常舒服，但如果暴汗的话，部分面料会黏在身上且有汗印。如果是高强度训练，建议慎重考虑；如果是日常普拉提或休闲穿搭，完全没问题。",[]],["穿脱后易松垮：部分针织和贴身款式穿几次后可能会有点松垮，建议手洗或轻柔机洗，不要用力拧干。",[]],["【必买爆款推荐】",[]],["Labu pants：店里的“断货王”！滑滑的面料，版型超好，非常修饰腿型。但热门色和热门码数经常秒空，去晚了基本没有。",[]],["灯笼裤：和 Labu pants 触感不同，灯笼裤面料稍微硬挺有厚度，裤型更阔，秋冬穿非常舒服，日常和练瑜伽都能驾驭。",[]],["针织背心与挂脖背心：材质柔软亲肤，颜色高级，搭配阔腿裤或瑜伽裤就是韩系松弛感穿搭，单穿或叠穿都好看。",[]],["瑜伽内衣：注意！它家的 Bra 大多没有胸垫，需要额外购买胸垫。包裹性很好，适合中低强度的瑜伽和普拉提。",[]],["联名香插：和韩国陶瓷艺术家 Moks 联名的手工陶瓷线香香插，限量款，颜值极高，适合当伴手礼送人（但经常售罄，需要碰运气）。",[]]]},{"id":2601,"title":"TIRTIR","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.25 *「🪞｜TIRTIR」10:30-21:00",[]],["🕙10:30-21:00｜💳 微信支付宝✅",[]],["价格区间：气垫正装大概 115 元人民币左右（2.6 万韩币），mini 版大概 50-60 元。",[]],["现场退税：单店购物满 30,000 韩元即可办理退税，结账时一定要带上护照，直接扣掉退税金额。",[]],["【必买爆款推荐】",[]],["经典红气垫：店里的灵魂爆款！遮瑕和持妆效果都很强，奶油肌妆感，越夜越美丽。适合干皮、混干皮，不添加香料，温和不挑皮。",[]],["银色水晶气垫：清透光泽感，低到中等遮瑕，水润贴肤。适合干皮和混干皮，皮肤状态比较干的时候用起来很舒服，带妆健身出汗也几乎不脱妆。",[]],["橙色高遮瑕气垫：主打高遮瑕和柔焦效果，几乎不会暗沉，适合油皮和混油皮。遮瑕度很高，但稍微有点厚重，更适合用来局部遮瑕或补妆。",[]],["遮瑕液：用刮棒取代刷头，可以把遮瑕上得非常薄，00号纯白色 提亮效果特别好，完全不会假白，遮黑眼圈和痘印效果明显。",[]],["拓麻歌子联名气垫：颜值超高，像个小鸡蛋一样可爱，内芯对应经典红气垫，适合当伴手礼送人。",[]],["【色号怎么选？（重点！）】",[]],["⚠️部分色号（如 21N）氧化比较快，不到半小时就会发黄。如果买这个色号，建议选比平时白一个号的，或者选择抗氧化更好的橙色款。",[]],["选色技巧：韩系气垫色号整体偏黄，如果你是偏粉调的皮肤或者比较白，一定要往浅一点的颜色选。建议直接去圣水店用肤色测试仪测一下，或者在脖子交界处试色，选和肤色融合最好的那个。",[]],["17C（瓷白）：适合中性一白，上脸自然不假白，很多博主都在推这个色号。",[]],["19N（自然白）：适合黄一白到黄二白，自然提亮，不会显得过白或过橘。",[]],["21N（象牙白）：适合黄二白，偏黄调，如果肤色偏粉或比较白，选这个可能会显得像得了黄疸。",[]],["23N（自然色）：适合黄二白到黄三白，颜色比较正，不会过白也不会过橘。",[]]]},{"id":2618,"title":"Tamburins","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.26 「✨｜Tamburins」11:00-21:00",[]],["🕙11:00-21:00｜💳 微信支付宝✅｜https://www.tamburins.com",[]],["混凝土镂空建筑搭配玻璃设计，还有下沉式空间和巨型蘑菇等艺术装置，随便拍都像韩系杂志大片。店内香氛产品线最全，适合花 1-2 小时慢慢逛和拍照。",[]],["穿搭建议：去圣水洞旗舰店打卡时，穿简约的黑白系或韩系极简风穿搭，和店铺的混凝土工业风背景会更搭。",[]],["退税与比价：市区门店（如圣水洞、新沙洞）可以凭护照当场办理退税，但免税店加上返点和金卡折扣后，价格通常会比市区专柜便宜 20%-30%。建议先去免税店看有没有货，买不到再去市区门店补货。",[]],["价格区间：14ml 蛋形香水大概 210 元人民币左右，50ml 正装香水大概 46500 韩币，护手霜 26000 韩币左右，香膏 46500 韩币。相比国内代购和海淘，在韩国线下买能省下一大笔钱。",[]],["现场退税：单店购物满 30,000 韩元即可办理现场退税。",[]],["【必买热门香型推荐】",[]],["*叠涂留香：Tamburins 的香水留香时间相对较短，建议搭配同款的香膏或护手霜叠涂，这样能让“伪体香”更持久。",[]],["一定要试香：Tamburins 的香水不太像传统商业香，很多味道刚喷出来可能会觉得有点特别，但越闻越耐闻。建议多试几款，喷在手腕上走几步，等中后调出来再决定买不买。",[]],["关于留香：14ml 蛋形香水虽然方便携带，但留香时间相对较短，需要经常补喷。如果追求持久留香，建议买 50ml 正装。",[]],["CHAMO（一丝慰藉）：奶香、麂皮和木质调融合得刚刚好，温柔不腻，秋冬喷超级舒服。",[]],["PUMKINI（南瓜椰奶）：Jennie 同款！白南瓜搭配椰奶和檀香木，像云端上的南瓜冰淇淋，清新又温暖，非常适合秋冬微凉时节。",[]],["蛋形香水（14ml）：胖嘟嘟的鹅卵石造型，超级可爱！14ml 小巧便携，放在包里随时补香，买还会送珍珠链条，斜挎出门颜值爆表。",[]],["BOTTARI 蘑菇系列：Jennie 联名系列，灵感源自蘑菇孢子。包括滚珠香氛油、固体香膏和香氛蜡烛，瓶身哑光极简，蘑菇皮革挂饰超可爱。",[]],["护手霜与香膏：CHAMO 和 BERGA SANDAL（柏木檀香）味道最好闻，包装精致，买 2 支以上通常有折扣，非常适合当伴手礼送人。",[]],["LATE AUTUMN：苦橙与雪松的结合，自带清冷知性的书卷气，像秋日阳光晒过的书本味道。喷在白衬衫或风衣上非常有氛围感。",[]],["BOTTARI：蘑菇苔藓主题的联名系列，灵感来自自然神秘感，带有秋枯木和琥珀麝香的气息，非常独特且高级，不容易撞香。",[]],["Evening Glow：前调柠檬+莳萝的清新提味中和了玫瑰的甜；中调树莓的微酸；后调广藿香+莎草的泥土香，温柔又不失魅力❤️",[]],["护手霜系列：推荐 EVENING GLOW 或 Berga Sandal。铝管包装颜值高，质地清爽不粘腻，香味持久度不错。",[]]]},{"id":2638,"title":"Dasique","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.27 「🪞｜Dasique」11:00-19:00",[]],["🕙11:00-19:00｜💳 微信支付宝✅｜https://dasique.co.kr/",[]],["现场退税：单店购物满 30,000 韩元即可办理现场退税，结账时一定要带上护照，直接扣掉退税金额。",[]],["【楼层分布与打卡攻略】",[]],["1F 彩妆区：",[]],["整层都是粉紫色的少女风装潢，产品颜值极高，眼影、唇釉、腮红、化妆镜周边品类齐全。",[]],["门口有错落布置的花簇和一面超大的落地镜，非常适合停下拍照。",[]],["进店后会有工作人员给你涂香膏，服务体验很好。",[]],["2F Café Dasique：",[]],["逛累了直接上二楼喝咖啡！窗边中间的两个座位是绝佳观景位，正对对面的 Dior 玻璃大楼，随手一拍就是韩系杂志大片。",[]],["注意：店内设有饮品寄存台，饮品不可带入一楼彩妆区域。",[]]]},{"id":2649,"title":"Afterblow","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.28 「✨｜Afterblow」11:00-20:30",[]],["🕙11:00-20:30｜https://afterblow-scent.com",[]],["Dasique旗下香氛品牌，实体店在dasique的B1。",[]],["主打高性价比和韩系清新伪体香",[]],["逛店体验：店铺风格粉嫩简约，可以随意试香。",[]],["关于退税：需要保留好购物凭证，在离韩时于机场办理退税。（免税店app🈶️）",[]],["【必买热门产品推荐】",[]],["Citrus Moon 香水：清爽的柑橘茉莉调，带点木质香，不刺鼻且非常治愈，适合日常通勤。",[]],["Love Potion 发香喷雾：奶油樱桃香，带点麝香，甜妹必备。",[]],["Aqua Tangerine 固体香膏：07号色，前调是柑橘和甜橙，后调有雪松木和麝香。",[]],["Cotton Fog 香膏：带有木棉香的皂香味，就像刚洗完澡裹着晒过太阳的棉絮一样干净舒服。",[]],["Powdery Rose 护手霜：温柔的玫瑰调，带一点点 baby 粉的奶香。质地微厚但吸收很快。",[]],["Rose Bouquet：喜欢玫瑰调可以闭眼冲。",[]],["Forest Woody：清新木质香",[]],["Cotton Fog：更适合春夏。",[]]]},{"id":2664,"title":"emis","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.29 「🧢｜emis」12:00-19:30",[]],["🕙12:00-19:30｜💳 微信支付宝✅｜https://emis.kr/",[]],["（款式可以看明洞emis）",[]]]},{"id":2667,"title":"Kuoca","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.30 「🍑｜Kuoca」11:00-20:30",[]],["🕙11:00-20:30｜💳 微信支付宝✅｜https://kuoca.com/",[]],["Kuoca（쿠오카）是2019年诞生于首尔圣水洞的韩国本土小众香氛护肤品牌，把调香做成美食菜单，包装是清新的多巴胺配色，非常适合作为伴手礼。",[]],["多要小样：店员态度通常很好，结账时可以礼貌多要几个不同味道的小样，回家慢慢试，喜欢再买正装。",[]],["联名礼盒套装：如果是要买伴手礼送人，强烈建议买套装（包含护手霜、身体乳、沐浴乳等）。店员可以帮你协商搭配味道，而且礼盒包装非常精致，买得多还能享受折扣和退税。",[]],["现场退税：圣水店支持现场退税（满 3 万韩币即可）",[]],["【必买爆款推荐】",[]],["价格区间：香水约 600-750，身体乳200+，沐浴露200，护手霜100+，喷雾约100+",[]],["护手霜的香味还原度最高、最浓郁；身体乳和沐浴露的味道相对清淡，留香时间较短；头发喷雾的留香时间比较短，建议谨慎入手。",[]],["不要盲目跟风买发喷：有博主反馈头发喷雾的味道和护手霜两模两样，且挥发极快，性价比不高。",[]],["Wild Peach 野桃系列：店里的灵魂爆款！味道像刚剥开咬一口的熟透水蜜桃，爆汁清甜不腻。推荐护手霜（留香相对最久）和身体头发喷雾（喷头发很香）。",[]],["Grapefruit Brûlée 焦糖葡萄柚：清爽的葡萄柚香气开场，带着一点烟熏感和椰子奶油的丝滑，木质柑橘调收尾，非常清新活泼，适合夏天。",[]],["Geisha Coffee 盖萨咖啡：活泼的咖啡香混合成熟水果的酸味，茉莉花香和麝香收尾，沉稳又性感。",[]],["Matcha 抹茶：悠哈抹茶牛奶糖一样的味道，中后调非常惊艳，奶香和清苦交织，喜欢奶甜调的必入。",[]],["Basil Sorbet 罗勒雪酪：清新罗勒与无花果、浆果交织，带有果香和辛香调，适合不喜欢浓香的人。",[]]]},{"id":2683,"title":"Mono masion","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.31 *「📷｜Mono masion」24H",[]],["【价格与支付方式】",[]],["价格区间：基础无美颜 5000 韩币（拍 8 张选 4 张），精致美颜款 6000 韩币（拍 10 张选 4 张，推荐选这个！），竖版长条四宫格 4000 韩币。",[]],["支付方式：支持信用卡和现金。",[]],["换零钱：如果付现金，机器只收 1000 韩元面值的零钱！门口自助换钱机，可以把 1 万或 5 万换成零钱。",[]],["【拍照攻略】",[]],["101 房间：柔和自然光，原图直出有温柔磨皮感，适合拍半身和温柔风，但人比较多需要排队。",[]],["102 房间：冷调灰度/白色背景，清冷高级白皮滤镜，拍大头照的神器，非常出片。",[]],["103 房间：光线绝美，自然柔光加奶白背景，比 101 更清晰，排队的人相对较少，是隐藏的神仙房间。",[]],["滤镜与美颜：拍完选片后会出现滤镜页面，美颜一定要选右边（High），自带自然柔肤不会假面。穿白色衣服不要加滤镜容易过曝，穿深色衣服可以加最后一个曝光滤镜。",[]],["「保姆级拍摄流程与姿势」",[]],["美颜与滤镜：机器自带两档美颜，建议直接选 High 档，柔和磨皮且不假面。选图时可以把黑白和原色交叉搭配，氛围感更佳。",[]],["穿搭建议：推荐深色、条纹或简约针织，尽量避开纯白色上衣（容易和背景融为一体）。适当露肤度高的衣服会更出片，不要穿太紧身的衣服。",[]],["站姿技巧：尽量往后贴墙站，脸会显小很多；高个女生记得稍微蹲一点，避免头顶碰到边框。不要脸贴镜头太近，容易面部过曝。",[]],["补妆准备：机器比较吃妆，进去前一定要补一下口红。",[]],["提前想好动作：付完钱机器立刻开拍，没有缓冲时间！一共连拍 10 张，每张间隔 8-10 秒，节奏非常快。",[]],["眼睛看哪里：不要看屏幕里的自己（眼神会往下），盯着镜头或者镜头上方一点，眼神更有力。",[]],["利用道具：门口有免费的墨镜、眼镜框、花朵等配饰，戴上后造型完全不一样，还能缓解僵硬。",[]],["连拍技巧：机器有半秒延迟，咔嚓后不要马上换动作，等半秒再换，不然会捕捉到很多眼神乱飘的废片。",[]],["「避坑与隐藏福利 Tips」",[]],["24 小时扫码保存：拍完打印的小票上有个二维码，一定要在 24 小时内用手机扫码下载！",[]],["选片倒计时：选片页面有 60 秒倒计时！时间走完系统会自动默认选 4 张，没法修改也不能重拍。",[]],["错峰出行：下午 2-7 点人巨多，排队可能要 30-50 分钟。建议早上 11 点前或晚上 10 点后去。",[]]]},{"id":2706,"title":"阿迪达斯Originals旗舰店","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.32 「🛍️｜阿迪达斯Originals旗舰店」11:00-22:00（周五21）",[]],["🕙11:00-22:00｜💳 微信支付宝✅｜https://www.adidas.co.kr/",[]],["【价格、退税与支付攻略】",[]],["价格区间：T 恤大概 400 多人民币，外套大概 550 左右，鞋子大概 600-800。",[]],["现场退税：满 30,000 韩元即可办理退税。",[]],["注意制作时间：如果选择 DIY 定制，结账后需要等 0.5-1 小时才能拿货，可以顺便逛逛旁边的店再回来拿。",[]],["【必买爆款与限定款】",[]],["韩国限定配色：比如 Samba 美拉德配色、薄荷绿限定款等，很多是韩国地区专属发售。",[]],["首尔丘比特限定：带有爱心刺绣和丘比特印花的 T 恤和外套，质感拉满，黑白两色都很百搭。",[]],["DIY 定制服务：店内有 DIY 机器，可以现场定制印花 T 恤（不过制作时间可能需要 0.5-1 小时）",[]],["Superstar Square Ballet 蝴蝶结芭蕾鞋：最近韩国时尚圈超火的款式，芭蕾风结合运动感。",[]]]},{"id":2719,"title":"KINFOLK","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.33 「✨｜KINFOLK」10:30-20:30",[]],["🕙一～三：10:30-20:30，四～日：10:30-21:00｜💳 微信支付宝✅｜https://kinfolknotes.com/",[]],["关于留香时间：留香时间普遍偏短（大概 2-3 小时就淡了）",[]],["多要小样：店员态度通常很好，结账时可以礼貌多要几个不同味道的小样（2ml 小样很可爱），回家慢慢试。",[]],["价格区间：30ml 约 11 万韩币（折合人民币 400-500 元），50ml 约 15 万韩币。",[]],["折扣活动：经常有“买两瓶香水减 2 万韩币”或“30ml + 10ml 加购 1.3 万韩币”的活动，买套装比单买划算很多。",[]],["免税店更划算：如果买得多，强烈建议去新罗免税店或乐天免税店买！经常有“买三赠一”等大促活动，折合下来一瓶不到 300 人民币，比线下店便宜近 100 块，而且部分免税店可以当场拿走，不用去机场提货。",[]],["现场退税：线下店满 3 万韩币可办理机场退税（结账时给退税单，回国在仁川机场扫码）。",[]],["【必买爆款推荐】",[]],["Garden Shower（🇰🇷销冠）：温柔干净的花香木调，前调葡萄柚清爽提亮，中调玉兰与玫瑰木缓缓散开，花香不甜腻，像雨后清晨的花园，非常适合作为伴手礼。",[]],["Captain's Bar（🇪🇺销冠 / BOYNEXTDOOR同款）：清新的柑橘木质香，前调柑橘和柏木，后调麝香和琥珀，像冬日暖阳下喝红酒的松弛氛围感，男女通吃，中性香首选。",[]],["Splendor in the Grass（薄荷香）：非常清新的薄荷青草香，类似于莫吉托的感觉，夏天喷超级舒服，不撞香且很惊艳。",[]],["The Grey Area：清冷中性调，松木加沉香，没有攻击性的令人舒服的木质调，不刺鼻不张扬，冷淡风本命。",[]],["Mint Notes：非常清新的薄荷味，像莫吉托一样夏天感十足，不容易撞香。",[]],["▫️Q02 ：强推！饱满的茉莉香！留香远超预期，喷在衣服上一整天都萦绕淡淡的花香，茉莉爱好者闭眼冲！",[]],["护手霜与身体乳：每款香水都有对应的护手霜，味道好闻且留香相对持久，买多支凑套装当伴手礼非常合适。",[]]]},{"id":2735,"title":"PHOTOGRAY","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.34 「📷｜PHOTOGRAY」",[]],["💳 信用卡&现金（1k纸币）",[]],["【拍摄流程与姿势技巧】",[]],["价格区：普通款（无美颜/基础边框）4k韩币，特别款（带美颜/特殊边框）5k韩币。艺人联名框7k韩币。",[]],["背景板检查：进到小隔间先查看一下背景板有没有拉下来，如果没有拉下来拍起来就是墙壁的白色了。",[]],["提前想好动作：付完钱机器立刻开拍，没有缓冲时间！每张拍摄时间只有 7-8 秒，拍 8 张选 4 张。",[]],["眼睛看哪里：不要看屏幕里的自己，盯着镜头或者镜头上方一点，眼神更有力，拍出来更有氛围感。",[]],["利用道具：店里提供了各种可爱眼镜、华丽花朵、发箍等道具。",[]],["左右翻转：拍完选图时可以选择左右翻转，如果觉得自己某一侧脸更好看，可以调整一下。",[]],["免费 AI 美颜：选图时左上角有默认开启的 P 图选项（轮廓流畅 + 瘦脸）",[]],["24 小时扫码保存：拍完打印的小票上有个二维码，一定要在 24 小时内用手机扫码下载！",[]]]},{"id":2746,"title":"consume product","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.35 *「🛍️｜consume product」12:00-20:00",[]],["🕙12:00-20:00｜https://consumeproduct.kr/",[]],["价格区间：整体均价在 500+ 人民币左右，冬装（如大衣、羽绒服）可能达到上千元。",[]],["退税政策：有网友反馈 Consume Product 不能退税",[]],["风格特点：主打温柔韩系风，带有一点芭蕾风和简约感。衣服颜色柔和，版型百搭，很适合日常通勤、约会和逛街，穿上身就是那种不费力的韩女氛围感。",[]],["【必买爆款推荐】",[]],["温柔韩系衬衫：店里的灵魂单品！面料舒适，剪裁利落，低饱和度的颜色（如米白、浅蓝、燕麦色）超级百搭，穿上就是韩剧女主氛围感。",[]],["百搭牛仔裤：版型调教得非常好，高腰设计修饰腿型，藏肉显瘦。不管是搭配短上衣还是宽松卫衣都好看，日常通勤或休闲出街都能驾驭。",[]],["质感针织衫：面料软糯亲肤，颜色高级，秋冬叠穿必备。短款版型能拉高腰线，让身材比例看起来更好。",[]],["设计师款外套：比如风衣、西装外套或皮质外套，剪裁精良，自带高级感，穿上就是大女主气场。",[]],["基础款打底衫：虽然简单，但面料和版型都很考究，作为内搭非常合适，价格也很亲民。",[]]]},{"id":2757,"title":"Verish","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5
