 Day 1（11.28｜周六）：到达&休整+圣水周边","area":"圣水洞","chapter":"1⃣️ Day 1（11.28｜周六）：到达&休整+圣水周边","blocks":[["1⃣️ Day 1（11.28｜周六）：到达&休整+圣水周边",[]],["一、【🛫️国内出发】",[]],["「1.0」成都-北京",[]],["东航MU6646｜07:20 - 10:00｜成都双流T2 - 北京大兴",[]],["🛏️｜4:20起床（最晚5:00出发）",[]],["🚖｜家——双流T2",[]],["*走国内出发，到北京才是国际出发～",[]],["「2.0」北京-首尔",[]],["东航MU2073｜11:40-14:40（当地）｜北京大兴 - 仁川T1",[]],["中转：2层国内到达后根据指示去转机过海关（可以兴先送外买到登机口 阳阳中国饭🍤虾仁烧麦）",[]],["*这程无正餐，只有沙拉🥗，建议上飞机前吃点/买点",[]],["二、【🛬️ 入境韩国】",[]],["📱流量卡（飞机上飞行模式/滑行时插卡）",[]],["人在国外后，插入国外流量卡 1、蜂窝数据勾选国外卡（副卡），关闭允许切换 2、国内卡（主号）： 关闭“数据漫游” 开启“启用此号码” 显示无信号则切换“网络选择” 3、国外流量卡（副号）： “网络选择”为本地运营商 开启“数据漫游” 开启“启用此号码”",[]],["【入境路线流程】",[]],["",["060.webp"]],["",["061.webp"]],["",["062.webp"]],["",["063.webp"]],["入境卡（出发前三天提前填好电子版or下飞机柜台填）",[]],["",["064.webp"]],["健康卡",[]],["",["065.webp"]],["三、【🚌 仁川机场——🏠住所】交通1.5H",[]],["【🚌机场大巴 6013路】",[]],["🎫Step-1｜找到巴士售票处",[]],["取完行李出关，找蓝色发光「BUS TICKETS」标识",[]],["▪️T1 航站楼：1 楼到达层，4/7/8/10 号出口旁",[]],["📱Step-2｜自助机 4 步买票",[]],["点屏幕底部【中國語】切换中文界面",[]],["输入线路号 / 搜索目的地站名",[]],["挑选班次时间（韩国当地时间）",[]],["▫️别买马上发车的班次！走到站台要预留时间，选 10 分钟之后的车。如果显示售罄没票找人工",[]],["支付出票（可微信支付），收好纸质车票",[]],["（研究一下能不能直接把回来的预约购买了。）",[]],["🚏Step-3｜找站台 + 上车流程",[]],["车票重点看两个信息：线路号 + 站台号（例5B-1）",[]],["自助机器上会写车次和座位号，不要管❗❗❗买完就去票上对应的乘车口去排队！按排队顺序上车！！😡😡😡自助机上的座位号真的很误导人",[]],["▪️站台电子屏实时更新车辆，核对好线路再排队",[]],["▪️工作人员帮忙放行李❗行李小票千万别丢，下车凭票取行李",[]],["▪️上车出示车票，无固定座位，随便坐",[]],["💺车内体验：座椅靠背可调，韩中英三语报站",[]],["🏠 Step-4｜下车",[]],["⚠️快到站记得按头顶红色下车铃！！！",[]],["",["066.webp"]],["四、*💳日常地铁：气候卡（便利店购买）",[]],["💳日常地铁：气候卡（机器/便利店购买）",[]],["气候卡的使用时间是充值当天凌晨4:04开始生效的。",[]],["*现金充值不支持5w面额",[]],["气候卡可用范围：https://english.seoul.go.kr/wp-content/uploads/2025/09/route-map.pdf",[]],["",["067.webp"]],["找图中机器购卡充值",[]],["微信支付全球有礼，双人组队刷够指定笔数拿好汇率！！🤩",[]],["五、🛍️｜圣水周边（第二天想去免税店买的可以先试）",[]],["到达后吃饭：",[]],["OliveyoungN、香水店们",[]]]},{"id":350,"title":"PAIRED","area":"圣水洞","chapter":"1⃣️ Day 1（11.28｜周六）：到达&休整+圣水周边","blocks":[["「🍸｜PAIRED」（周一店休）",[]],["🕙19:00-1:00（周五六到2:00）",[]],["店在三楼，需要爬楼梯，门口不太明显，听到楼上传来的交谈声就能找到，跟着导航走就行。",[]],["“Give me a drink with a lower alcohol content.”",[]],["「HEAVEN’S DOOR」：接骨木花＋荔枝的组合，香气比较柔和",[]],["ANTARCTICA’S NIGHT （南极的夜晚）：招牌必点！有火焰点火设计，超级出片，像蓝色烟花绽放。薄荷浸泡过的金酒，清爽不甜腻，甜酸奶油平衡得很好，度数约 13 度。",[]],["前男友（JEONNAMCHIN）：蓝莓和香草白兰地搭配桑葚，还配蓝莓挞一起吃，口感层次丰富，印象最深的一杯。",[]],["香瓜鸡尾酒：Best seller 之一，香香甜甜的香瓜味，酒味几乎尝不出来，度数只有 9 度，很适合\"小趴菜\"当开胃小酒。",[]]]},{"id":358,"title":"江南面铺（강남면옥）","area":"圣水洞","chapter":"1⃣️ Day 1（11.28｜周六）：到达&休整+圣水周边","blocks":[["「江南面铺｜강남면옥」",[]],["🕙11:00-20:45",[]],["【探店小贴士】",[]],["中文服务：明洞店和圣水店基本都有会讲中文的阿姨，点单和沟通完全没问题，还会贴心提醒哪些菜可能不合口味。",[]],["分量预警：他家的肉和饺子分量都很大！两个人点小份排骨就足够吃饱了，千万别贪心点中份。",[]],["隐藏吃法：吃不完的排骨酱汁可以加米饭做成排骨炒饭，或者用排骨肉包着紫菜和冷面一起吃。",[]],["支付方式：支持信用卡，部分门店（如明洞店）也支持微信和支付宝。",[]],["【必点菜品推荐】",[]],["招牌炖牛排骨（갈비찜）：绝对的王牌！牛肋排炖得超级软烂脱骨，酱汁是甜咸口带一点点微辣，苹果炖出来的清甜和炭烤香完美融合。小份有 7-8 块大肋排，分量超扎实，建议女生或两人吃点小份就够了。",[]],["牛肉拌冷面（비빔냉면）：吃完浓郁的排骨一定要来一口拌冷面！面条细细的但极其劲道，甜甜辣辣的调味非常清爽，完美中和了排骨的油腻，很多食客评价是“首尔最好吃的冷面”。",[]],["水冷面（물냉면）：喜欢酸甜冰爽口感的选这个，汤底清澈，面条 Q 弹，夏天吃特别解暑。",[]],["牛骨汤（갈비탕）：点炖排骨会免费赠送一锅牛骨汤！汤头清澈鲜甜，带着红枣和蔬菜的清甜，里面有牛肉碎，配米饭吃非常暖胃。",[]],["饺子汤（만두국）：里面的饺子巨大一个（像包子一样大），馅料有肉和豆皮，汤底鲜美，带着淡淡的胡椒味，冬天来一碗很满足。（饺子个头非常大，一个就顶普通饺子两三个，一个人点六个装可能会吃不完。）",[]]]},{"id":372,"title":"Han Sabal建大店","area":"圣水洞","chapter":"1⃣️ Day 1（11.28｜周六）：到达&休整+圣水周边","blocks":[["「宵夜｜Han Sabal建大店」",[]],["🕙周日～周四 17:00-1:00｜周五～周六 17:00-3:00",[]],["🚇 回家末班地铁23:30",[]],["【支付与避坑小贴士】",[]],["人均消费：约 3万-5万韩元（约合人民币 150-250 元），分量很大，性价比很高。",[]],["店内氛围：店里基本都是小圆桌，大家围坐在一起吃，喝着烧酒和啤酒聊天，非常有韩剧里的氛围感。而且韩国大排档通常不在室内抽烟，对不喜欢烟味的人很友好。",[]],["支付方式：大部分门店支持微信和支付宝，也支持信用卡和现金。个别门店的机器可能会出现刷大陆信用卡失败的情况，建议随身备一点韩元现金以防万一。",[]],["关于辣度：他家的辣炖鸡和辣炒章鱼后劲比较大！刚开始吃可能觉得只是微辣，但吃一会儿辣感会直接爆发。如果不怎么能吃辣，点单时一定要和店员强调“微辣”或“不辣”。",[]],["点单方式：部分门店支持桌边扫码点单（有中文界面），部分门店需要找服务员点单。",[]],["分量预警：他家的菜分量非常大，一份辣炖鸡或牛肠锅通常够 3-4 个人吃。两个人去的话，点一个主菜加一个吐司或鸡蛋卷就足够了，千万别贪多点太多。",[]],["【必点招牌推荐】",[]],["",["068.webp"]],["",["069.webp"]],["",["070.webp"]],["",["071.webp"]],["",["072.webp"]],["",["073.webp"]],["",["074.webp"]],["",["075.webp"]],["",["076.webp"]],["",["077.webp"]],["招牌黄油鸡蛋吐司：他家的绝对灵魂！外表煎得焦香酥脆，内里是软糯的吐司和满满的滑蛋，甜咸交织，完全不腻。建议加一点草莓酱，口感更丰富。",[]],["辣炖鸡块（닭도리탕）：鸡肉炖得非常软烂入味，里面配有土豆、胡萝卜和年糕。汤汁浓郁，强烈建议加一份拉面或粉条，吸满汤汁后一口下去直接灵魂起飞！（不要点带牛肠的）",[]],["流心鸡蛋卷：嫩到不敢用力夹，里面是流心的蛋黄，蘸着番茄酱吃超级好吃，是很多人的必点配菜。",[]],["辣炒章鱼饭团：最近很火的更新款，饭团上面覆盖了一层现烤芝士，把章鱼和饭团搅拌均匀吃，汤汁裹满碳水，香喷喷的！",[]]]},{"id":399,"title":"맛닭꼬","area":"圣水洞","chapter":"1⃣️ Day 1（11.28｜周六）：到达&休整+圣水周边","blocks":[["「🍗｜맛닭꼬」（周二店休）",[]],["🕙15:00-2:00",[]],["主打糙米裹皮烤鸡，外皮超级嘎嘣脆，肉质多汁，而且不是油炸的，吃起来完全不油腻。26种口味随便挑，一份就是一只整鸡。",[]],["【探店小贴士】",[]],["堂食 vs 外卖：堂食和外卖都可以，堂食要加 1000 韩元。如果不想等，直接点外卖打包带走，在附近的咖啡店或汉江公园坐着吃也很惬意。",[]],["搭配冰啤酒：一口脆皮烤鸡配上一口冰镇的 Cass 啤酒，爽度直接拉满，非常适合晚上和朋友小酌。",[]],["中文菜单：店里备有中文菜单，点单沟通没问题，支持信用卡支付。",[]],["【必点口味推荐】",[]],["蒜香糙米烤鸡（Sweet Garlic Brown Rice Bake）：招牌必点！外皮裹满糙米碎，烤得超级嘎嘣脆，淋上浓郁的甜蒜酱，咸甜交织，肉质还保留了满满的汁水，一口下去超满足。",[]],["现烤玄米焙烤鸡（현미베이크）：别被名字骗了！吃起来是肉非常多汁的炸鸡口感，皮是脆脆的，并不是我们常吃的那种软烤鸡，越嚼越香。",[]],["柠檬葱鸡",[]],["26种口味任选：从甜辣、蒜香到芝士、蜂蜜芥末，超多口味选择，总有一款是你的专属！建议和朋友点不同口味分享。",[]],["炖鸡 & 鸡爪 & 鸡杂：除了烤鸡，店里还有炖鸡、鸡排、鸡爪（辣）、鸡杂等其他锅物和小食类，适合想多尝几种口味的人。",[]]]},{"id":412,"title":"2⃣️ Day 2（11.29｜周日）：明洞（2免税店+午饭+26）","area":"明洞","chapter":"2⃣️ Day 2（11.29｜周日）：明洞（2免税店+午饭+26）","blocks":[["2⃣️ Day 2（11.29｜周日）：明洞（2免税店+午饭+26）",[]],["出门带手机、护照、银行卡、充电宝。⚠️小心小偷！！",[]],["🚇明洞（4号线） 🛗 扶梯：1/3/7号口，【直梯是1号口】",[]],["3号口：漫画街/南山缆车/首尔塔｜5号口：新世界免税店/南大门｜6号口：明洞主街｜7号口：主商圈",[]]]},{"id":416,"title":"早饭：「陵洞水芹菜｜능동미나리」","area":"明洞","chapter":"2⃣️ Day 2（11.29｜周日）：明洞（2免税店+午饭+26）","blocks":[["早饭：「陵洞水芹菜｜능동미나리」",[]],["🕙9:30-23:30",[]],["【探店小贴士】",[]],["自助加料：桌上有白胡椒粉和调料盘，觉得汤淡的话可以自己加白胡椒粉提味。",[]],["桌上有萝卜泡菜桶，自己夹+剪成小块即可，不咸也不会很辣，很爽口！",[]],["米饭续加：汤饭底下的米饭分量很足，如果没吃饱可以免费续加米饭。",[]],["餐具回收：吃完后需要自己把餐具拿到回收处（往厨房方向的走道尽头左边）。",[]],["支付方式：支持信用卡，部分门店可能不支持微信/支付宝，建议带好现金或信用卡。",[]],["【避坑与口味提醒】",[]],["口味偏清淡：牛骨汤走的是清爽路线，不是浓白腻口的风格。如果你平时习惯重油重辣，可能会觉得味道偏淡，但搭配白胡椒和辣椒酱就完美了。",[]],["水芹菜的味道：水芹菜有一种独特的草本清香，不是那种浓烈的芹菜味。",[]],["生食安全：生牛肉拌饭虽然好吃，但如果你平时不吃生食、肠胃比较敏感，建议不要尝试，以免拉肚子。有食客反馈吃完生牛肉后肚子不舒服，一定要量力而行。",[]],["汤底很烫：汤泡饭端上来时非常烫，尤其是底下的米饭，吃的时候注意别烫到嘴。",[]],["附近找厕所：建议去 Musinsa 大楼的负一楼，或者 Olive Young 二楼。",[]],["【必点菜品推荐】",[]],["水芹菜牛骨汤泡饭（미나리곰탕）：招牌中的招牌！透明的牛骨汤底，上面堆成小山的水芹菜，牛肉炖得软烂且没有腥味。汤底清淡但不寡淡，水芹菜的草本味让整碗汤变得非常清爽。",[]],["生牛肉拌饭（육회비빔밥）：隐藏冠军！一团生牛肉泥盖在水芹菜上，拌开之后酱油香和芝麻油香混合，口感鲜甜嫩滑，完全没有生肉的腥味。很多食客评价比汤还上头。",[]],["牛肉煎饼（육전）：外酥里嫩，蘸着水芹菜拌酱吃，越吃越香，很适合当配菜。",[]],["水芹菜牛肉特汤（Premium）：比普通版牛肉更多、水芹菜更足。",[]],["🛍️【✨免税店必买】",[]],["【香奈儿】",[]],["水光棒",[]],["双头唇釉69、152、154、174、186、188",[]],["金管唇釉（透明盖）：90、288、56",[]],["可可小姐（黑盖）：104",[]],["炫光 62、63、75、83",[]],["五色眼影：warm",[]],["唇颊两用",[]],["指甲油#151红色",[]],["",["078.webp"]],["【香奈儿 四色眼影#354】",[]],["",["079.webp"]],["延香精华油（明洞乐天会员9.5折+返点几十，到手1083.91）",[]],["【TF】",[]],["眼影：#30、#35、#02",[]],["【Dior】",[]],["高光",[]],["",["080.webp"]],["【Dior #855】（好像绝版了）",[]],["",["081.webp"]],["【Dior 眼影#649】",[]],["【MAC】",[]],["高光修容盘",[]],["【prada】",[]],["我本莫测花境版",[]],["【宝格丽】",[]],["大吉岭茶",[]],["【Dior】眼影#855",[]],["【散粉】香奈儿#10 or cpb",[]],["【Tamburins】",[]],["【Gucci】指甲油#212",[]]]},{"id":468,"title":"明洞新世界免税店","area":"明洞","chapter":"2⃣️ Day 2（11.29｜周日）：明洞（2免税店+午饭+26）","blocks":[["1. 「🛍️｜明洞新世界免税店」11.30店休",[]],["🕙9:30-20:00｜🚇4号线会贤站7号口｜货全价优，适合第一站。8-12层免税。12层办理免税会员。",[]],["提货规则：韩国本土品牌（11 楼大部分商品）当场直接带走；国际大牌&烟酒（8-10 楼）去机场提货。下单登记护照 + 离境航班信息，保存好提货单。至少提前 6 小时购买，离境当天临时买来不及运送。",[]],["如果想拿返点：结账时主动出示团号。买完一定要核对小票上的团号和离境航班信息，拍照存档。",[]],["核对小票：结账时务必现场核对小票上团号和离境航班信息，确认无误再离开，用错会影响返点结算。",[]],["【优惠活动】",[]],["",["082.webp"]],["11.1-11.30 支付宝支付优惠",[]],["【🧭 ｜楼层指南】",[]],["【12F-服务中心】办理金卡、登记返点、处理售后，同时也有电子产品和特产伴手礼。支付宝黄金会员可以直接在12楼柜台办金卡。金卡可在免税价基础上再享 85 折到 9 折（不同品牌折扣不同），买单时直接刷护照。",[]],["【11F-本土潮牌伴手礼】适合买韩国本土设计师品牌、零食特产和烟酒，非常适合作为回国伴手礼。",[]],["🛍️LOOPY、SATUR、covernat、三丽鸥、chiikawa",[]],["【10F 美妆护肤香水】：美妆护肤&香水，欧美大牌、韩系热门品牌一站式打卡，经常有满赠和额外折扣活动。",[]],["🛍️Medicube（张元英梳子快闪，到11月30日，2.9w韩元）、AMUSE、Beplain、秀肤生、Abib、dior、hourglass、碧欧泉、L:A BRUKET、Bobbi brown、Chanel、TAMBURINS、宝格丽、兰芝、IOPE、帕尔玛、LE LABO、祖马龙、Aesop、romand",[]],["「Aesop」",[]],["明洞新世界百货10F的免税区有折扣，但 B1 百货店体验更好。",[]],["结账时可以直接询问店员“有没有什么小礼物或小样可以送”。",[]],["*热门单品（如 B3C 凝霜、天竺葵沐浴露）免税店常断货，没买到直接去圣水/汉南洞线下门店。",[]],["推荐产品：",[]],["#The Noir 29（干净红茶）：非常经典的木质茶香调，常被形容为“清冷大女主”或“高级伪体香”。",[]],["天竺葵身体清洁露：他家的灵魂香味，味道非常高级清新，洗完不紧绷，是很多人来韩国必囤的单品。",[]],["澄莹精华：主打抗氧化和提亮，质地清爽好吸收，熬夜后用它去黄气效果很棒。",[]],["B3C 面霜：保湿修护力很强，质地丰润但不油腻，适合干皮和混干皮秋冬使用。",[]],["生姜滚珠：用来滚眼部或面部消肿，味道是淡淡的生姜味，非常实用。",[]],["Aurner 香水：近期非常火的网红香水，味道独特不撞香，经常需要搭配手部干洗凝胶才能买，建议去之前确认库存。",[]],["【9F 名表轻奢潮牌】：这一层涵盖了高端腕表、时尚配饰以及韩国本土热门潮牌，非常适合买墨镜和日常穿搭。",[]],["🛍️ MLB、MARITHE、Matin Kim、👓META EYE（官方经销商查询：https://www.ray-ban.com/hongkong/zh/c/store-locator）",[]],["【8F 国际顶奢】",[]],["🛍️Rockfish（提前在 12 楼办理金卡可享 9 折，叠加返点，一双芭蕾鞋到手大概 350-400 元人民币，但容易断码断货）",[]],["【1-7F 百货区】",[]],["1-3楼轻奢服饰，4楼休闲运动，5-6楼户外品牌，7楼家居生活。",[]],["*注意百货区和免税区是独立运营的，会员卡和折扣规则不同。",[]],["",["083.webp"]],["B1或2楼扶梯旁「Daniel's truth」",[]],["主打无酒精精油配方的香氛品牌，因很多韩国艺人（如边伯贤、吴世勋等）推荐而火。",[]],["香水精油留香时间很长，据说有二十多个小时，而且方便携带，包装也很有质感。",[]],["省钱攻略： 在新世界百货买可以办会员卡打95折，并且能当场退税。买两瓶通常还有额外折扣。",[]],["先试后买：强烈建议不要当场下单，可以拿试香卡等15分钟/回酒店第二天，确认喜欢再买。",[]],["叠香玩法：可以买两支不同香味叠加涂抹，店员也会很耐心地教你叠香顺序。",[]],["【必买推荐】",[]],["*精油香水分为滚珠和滴管两种，10ml 滚珠款最方便随身携带。",[]],["Bombshelluth：最火人气王，边伯贤、朴成训同款。前调佛手柑，中调茉莉，后调麝香，属于清甜果花香混合一点皂感，温柔低调，男女都适合。",[]],["Jasmine Grove：清新的茉莉花香，带着一点绿意，非常干净清爽，适合夏天或日常通勤。",[]],["Daniel's Libra：淡淡的木质调，比纯花香更有层次感，不甜腻，很有高级感。",[]],["Forest & Soul：木质调爱好者首选。前调微甜，后调慢慢透出温柔厚重木质香，越闻越喜欢，适合喜欢自然系、中性香的人。",[]],["Blue Sage Blossom：潮湿森林、植物根茎混合海盐气息，干净又野生，是特别的“清冷少年感”中性香。",[]],["【购买攻略】",[]],["原价：10ml 滚珠精油香水，原价约 59,000 - 63,000 韩元（约合人民币 280 - 300 元）。",[]],["打折优惠：他家的活动通常是买得越多折扣越大（比如买3件85折），可以直接现场退税。在新世界百货可以叠加新世界金卡（通常 95 折）和机场退税（约 7%），算下来两瓶大概 460 - 480 元人民币，单瓶折合 230 - 240 元左右，性价比极高。",[]],["赠品：买满一定金额（如 14 万韩元以上）或凑单，通常会送房间清新剂、滴管小样、试香卡保护膜等小礼品。",[]],["替换配件：盒子里自带一根玻璃棒（滴管）和一个滚珠替换头。如果滚珠用久了不好用，或者想倒出来滴在扩香石上，可以用玻璃棒引流。",[]],["使用注意：因为是精油质地，只能涂抹在脖颈、手腕、发梢等皮肤部位，千万不要涂在衣服或包包上，以免留下油渍。",[]],["防漏液：有少数网友反馈滚珠瓶如果放倒或受热可能会轻微漏液，建议买完后直立放置，不要放在高温的车里或阳光直射的地方。",[]]]},{"id":522,"title":"韩贞仙","area":"明洞","chapter":"2⃣️ Day 2（11.29｜周日）：明洞（2免税店+午饭+26）","blocks":[["「B1｜韩贞仙」",[]],["🕙10:30-20:00",[]],["【探店小贴士】",[]],["冷藏更好吃：买回家后一定要放进冰箱冷藏保存（1小时内不吃就放冰箱），冷藏后拿出来吃口感更绵密，像吃冰淇淋一样。",[]],["保质期短：生水果大福最好购买当天吃，冷藏最多放 3 天，不要常温久放，否则会变形融化。",[]],["口味评价两极：建议优先选酸奶系列，避雷纯豆沙口味。",[]],["价格偏贵：一个大概 20-35 元人民币，性价比不算高，建议尝鲜为主。",[]],["【必买口味推荐】",[]],["桃子酸奶大福：很多博主的\"YYDS\"！新鲜水蜜桃搭配丝滑希腊酸奶，桃子多汁，酸奶清爽，外皮软糯拉丝，三者结合超级好吃。",[]],["蓝莓酸奶大福：Best seller！里面是一整颗新鲜蓝莓搭配蓝莓酸奶，蓝莓不酸，酸奶清甜，口感很绝。",[]],["迪拜巧克力草莓大福：网红爆款！里面有巧克力、卡达伊夫丝和开心果，口感酥脆绵密，巧克力味浓郁，喜欢巧克力的必试。",[]],["阳光玫瑰大福：葡萄清甜不酸，搭配酸奶或豆沙都很合适，很多人评价好吃。",[]],["",["084.webp"]]]},{"id":535,"title":"Davich（Meta眼镜）","area":"明洞","chapter":"2⃣️ Day 2（11.29｜周日）：明洞（2免税店+午饭+26）","blocks":[["2. 「🛍️｜Davich（Meta眼镜）」💙",[]],["🕙9:30-20:30",[]],["【楼层分布与逛法建议】",[]],["建议从 1 楼开始慢慢往上逛，按需求分区挑选：",[]],["1F 韩国本土品牌区：主打高性价比，镜框从 1 万韩元起，适合找日常百搭的基础款和网红同款。",[]],["2F 大牌墨镜与美瞳区：集中了各大国际品牌的墨镜和眼镜，还有超全的美瞳专区（日抛、月抛、三天抛都有）。这里还有 AI 选色屏幕，能帮你测试适合的美瞳颜色。",[]],["3F 专业验光与高端品牌区：这里是做精密视力检查的地方，有 26 项 VCS 专业测试。同时还有更多高端进口品牌的镜框和墨镜可以试戴。",[]],["【专业验光服务】",[]],["26 项 VCS 专业测试：验光师上岗前都经过专业培训，不仅测度数，还会检查色觉、明暗、左右眼协调等，能精准了解你的眼部状况，确保配出来的眼镜舒适不头晕。",[]],["免费休息区：验光和等眼镜的时候，可以去 2 楼的免费咖啡休息区，有免费的饮品、咖啡和零食，还有 WiFi 和充电线，体验感很好。",[]],["【取镜时间与价格参考】",[]],["取镜时间：如果选店里现货的韩国镜片，大概 30 分钟到 2 小时就能当场加工好拿走；如果选日本超薄镜片或蔡司镜片，可能需要第二天才能取。有度数的墨镜通常需要等 1 天左右。",[]],["价格透明：所有镜框和镜片都明码标价，镜框从 1 万韩元起，镜片最低 9,900 韩元起。",[]],["优惠活动：可以关注 Naver Pay 或 PAYCO 的满减优惠，有时候能省下不少钱。",[]],["【避坑与实用 Tips】",[]],["提前沟通需求：验光时一定要和验光师仔细阐述你的日常用眼场景（比如是否经常看电脑、开车），以及戴眼镜的习惯高度，这样配出来的眼镜才最舒服。",[]],["不要盲目追求高清晰度：尤其是高度数或高散光人群，散光加足了可能会头晕，验光师会给你专业的建议，听他们的准没错。",[]],["会员记录通用：在 DAVICH 配镜后，会员记录全国通用，后续如果需要调整镜架或更换镜片，去韩国任何一家连锁店都可以。",[]]]},{"id":553,"title":"明洞乐天免税","area":"明洞","chapter":"2⃣️ Day 2（11.29｜周日）：明洞（2免税店+午饭+26）","blocks":[["3. 「🛍️｜明洞乐天免税」1.5H",[]],["🕙9:30-20:00｜9-12层免税。",[]],["韩国本土品牌（当场带走）：如 3CE、正官庄、MLB、韩系零食等，结账后可以直接带走。",[]],["国际大牌与进口品牌（机场提货）：如香奈儿、迪奥、宝格丽、欧美美妆等，结账时务必登记好离境航班信息，保存好提货单，在机场安检过后的指定提货点领取。",[]],["办理金卡：12F 服务台，凭护照和支付宝黄金及以上会员（或 Visa/银联卡）免费办理。金卡可以在免税价基础上再享 85-95 折（不同品牌折扣不同）。",[]],["挂返点团号：通过靠谱的返点公司或平台提前登记，到 12F 服务台领取当日的团号。结账时主动出示团号，小票上会显示。",[]],["【优惠活动】",[]],["🎁优惠一：享95折折扣",[]],["① 新会员注册礼：注册即赠 5 张 95 折折扣券",[]],["② 每月专属礼遇：每月自动发放 5 张 95 折折扣券",[]],["*单笔消费满10万韩元，即可使用",[]],["🎁优惠二 ：购物＋充值双重10%奖励",[]],["① 消费满10万韩元，即可享 10%奖励",[]],["*每人限享 1 次，享高至 4万韩元奖励",[]],["*参与外国旅客会员卡95折优惠后，实付满 10万韩元，方可继续享购物奖励",[]],["🎁 优惠三：🆓发卡",[]],["前往乐天百货明洞总店CHECK iN SEOUL 自助服务机",[]],["即可办理价值5,000韩元的外国旅客会员卡",[]],["",["085.webp"]],["「楼层指南」",[]],["【12F 国际高端美妆与香水】",[]],["🛍️BOBBI BROWN、TAMBURINS、AESOP、宝格丽、祖马龙、LE LABO、碧欧泉男士、DIOR、香奈儿、CT、PERFUME GALLERY",[]],["【11F 名表珠宝与部分美妆】",[]],["🛍️OLENS、Hapa Kristin、兰芝、Chanel、Olive young、CHICOR、帕尔玛、BOH、Hourglass、diptyque、NONFICTION、IOPE、VT、CLIO、MEDIHEAL、CHICOR、FWEE、numbuzin",[]],["【10F 国际顶奢大牌】",[]],["🛍️：GM",[]],["【9F 韩系潮流与本土美妆】",[]],["🛍️：Marithe、MLB（壁垒，态度恶劣！）、Miseki Seoul（直井怜代言）、amuse、秀肤生、LOOPY&Pororo、romand、bibiang、Beplain（碧菲音）",[]],["以下为百货店：",[]],["💳：1F GUCCI后面办百货会员卡，护照+邮箱。",[]],["【8F】：loopy、Rockfish、🍴Sabre（80左右）",[]],["【7F】susu&cra（童装）",[]],["阿迪：百货店优惠：如果去 汝矣岛现代百货 或 明洞乐天百货，可以提前在 6楼 外国人服务台领游客优惠券（阿迪达斯常有第二件7折活动），叠加退税更划算。",[]],["B1｜🍩「Krispy Kreme」柳智敏同款甜甜圈（微信支付宝✅）",[]],["Original Glazed",[]],["（经典原味糖霜）",[]],["Glazed Chocolate Cake",[]],["（巧克力糖霜）",[]],["Crunch Banana",[]],["（香蕉脆脆）",[]],["Milk Cream Filled",[]],["（奶霜夹心）",[]],["Lotus Biscoff",[]],["（焦糖饼干）",[]],["",["086.webp"]],["",["087.webp"]],["B1｜「🌬Shiro」",[]],["特色体验：明洞限定层叠香氛（LAYERING FRAGRANCE）系列，共有5款。可以通过店内的香气测试找到适合自己的味道，再贴上专属贴纸完成定制。",[]],["限定好物：比如融合了经典香与韩国限定香的 LAYERING WHITE LILY（白百合），或者干净温柔的 LAYERING SAVON（皂感香），非常适合做伴手礼。",[]],["闻香试香：如果不确定喜欢什么味道，可以告诉店员你喜欢的风格（如木质、花香、果香），店员会给你闻相应的试香卡片，不要直接喷在手腕上试，容易串味。",[]],["留香时间：大概 3-5 小时",[]],["【SHIRO 必买推荐】",[]],["柚子喷雾（有油/无油）：品牌人气TOP1！一喷就是刚剥开柚子的爆炸清香！有油版滋润适合秋冬，无油版清爽适合夏天。",[]],["柚子唇釉：唇釉滋润不粘腻。",[]],["柚子唇油：透明的嘟嘟唇效果，酸甜的柚子糖味，滋润度很好，睡前厚涂第二天嘴巴很嫩，白天涂口红前打底也很不错。",[]],["铃兰香水（韩国限定）：清爽又妩媚的白花调，像是首尔女生身上的味道，留香时间约6小时。",[]],["Freesia Mist（花店清香）：品牌人气 Top 1！前调是苹果和杏桃的果香，中调融入玫瑰和绿叶，后调是干净的白花与麝香。就像清晨走进花市一样清新，接受度极高，盲买不踩雷。",[]],["Savon（肥皂香）：模拟刚洗完澡的干净皂香，混合着淡淡的奶香，自带“伪体香”滤镜。非常适合日常通勤，低调又有质感。",[]],["白茶身体乳：清爽不黏腻，白茶香气如同晨露中的茶叶般清新，夏天用非常舒服。",[]],["白茶护发精油：全场最佳之一！半干时抹在发尾，淡淡茶香非常疗愈，吸收快不油腻。",[]],["护手霜 / 身体乳：保湿力无敌，不是油润感而是像敷了面膜一样柔滑，白茶和肥皂香都很受欢迎。",[]],["【价格与折扣参考】",[]],["香水：40ml 约 50,000 韩元（约 260 元人民币），50ml/100ml 价格更高。",[]],["护手霜/身体乳：约 15,000 - 20,000 韩元（约 80 - 100 元人民币）。",[]],["柚子喷雾/唇油：约 10,000 - 15,000 韩元（约 50 - 80 元人民币）。",[]],["退税：门店支持退税，结账时记得带上护照，满一定金额即可办理。",[]]]},{"id":622,"title":"🐷Myth猪蹄（미쓰족발）","area":"明洞","chapter":"2⃣️ Day 2（11.29｜周日）：明洞（2免税店+午饭+26）","blocks":[["4. 「午饭｜🐷Myth猪蹄（미쓰족발）」",[]],["【攻略】",[]],["🕙 11:00-2:00｜💳 支付宝&微信✅｜💰 人均100～150｜🀄️ 菜单有简体中文",[]],["错峰排队：饭点（12:00-13:30，18:00-20:00）和周末人很多，需要排队等位。建议下午 2-3 点或者晚上 9 点以后去，基本不用等。",[]],["团购券注意：如果在美团或点评上买团购券，一定要看清退款规则和预约时间，避免因为行程变动导致无法退款。",[]],["辣度预警：半半猪蹄里的辣酱炒猪蹄比较辣，不吃辣的朋友一定要提前和店员说“少辣”或“微辣”，或者老老实实点原味和蒜味。",[]],["分量预警：猪蹄分量真的非常大！M 份（约 45,000 韩元）够两三个人吃，两个女生点一份通常都吃不完，不要盲目点多。",[]],["🔔 趁热吃入口丝滑无比，冷了之后没那么好吃了",[]],["「必点菜单推荐」",[]],["蒜味猪蹄（마늘족발）：招牌！蒜酱是特调的甜咸口，带着淡淡的酸甜，非常清爽。",[]],["原味猪蹄：如果不吃蒜就点原味。秘方酱汁慢炖，纯粹肉香，没有猪腥味。",[]],["半半猪蹄（原味+辣酱）：纠结口味或者人多时必点！",[]],["章鱼猪蹄：新出的特色菜单，章鱼和猪蹄一起炖煮，口感更丰富。",[]],["辣白菜刀削面：猪蹄套餐免费赠送！泡菜底的汤微辣开胃，面条劲道久煮不烂，超级解腻。",[]],["蔬菜沙拉：套餐免费赠送超大一份！里面有紫甘蓝、小番茄、杏仁片等，搭配奶香酱汁，清爽解腻。",[]],["虾仁鸡蛋羹：额外推荐追加！软乎乎滑嫩嫩，入口像云朵一样，里面有很多虾仁，非常鲜美。",[]],["鱼籽拌饭：额外推荐追加！又鲜又脆，里面有满满的紫菜碎和鱼籽，自己动手捏饭团，趣味性拉满。",[]],["一定要点那个蒜酱，蘸猪蹄很香。外头一圈小菜都可以免费续，左上那个沙拉酱拌菜好吃口感类似魔芋又像海蜇。玛格利还是要冰冰凉大口喝比较美味。",[]],["「价格与分量参考」",[]],["中份猪蹄套餐：约 37,000 韩元（约 180 元人民币），包含猪蹄、蔬菜沙拉、辣白菜刀削面和全套小菜，2-3 人吃都够。",[]],["大份猪蹄套餐：约 42,000 韩元（约 200 元人民币），适合 3-4 人分享。",[]],["追加菜品：虾仁鸡蛋羹约 15,000 韩元，鱼籽拌饭约 10,000 韩元，芝士土豆饼约 9,900 韩元。",[]],["温馨提示：分量真的非常扎实，两个人点一份中份套餐就绝对能吃饱，千万不要盲目加菜。",[]],["5. 🛍️【明洞主街】（26）",[]]]},{"id":646,"title":"Eyedaq（meta验光）","area":"明洞","chapter":"2⃣️ Day 2（11.29｜周日）：明洞（2免税店+午饭+26）","blocks":[["5.1 「👓｜Eyedaq（meta验光）」",[]]]},{"id":647,"title":"Nyunyu Wholesale","area":"明洞","chapter":"2⃣️ Day 2（11.29｜周日）：明洞（2免税店+午饭+26）","blocks":[["5.2 「🛍️｜Nyunyu Wholesale」（黑色始祖店/最全能）",[]],["🕙 9:00-22:45",[]],["特色： Nyunyu 的始祖店，规模最大、产品最全！一进门就是满墙的饰品、包包和衣服，价格从十几块到一两百块不等，被戏称为“韩国版拼多多”线下集合店",[]],["适合人群：想一站式买齐衣服、配饰和伴手礼的游客，支持现场退税。",[]],["TIPS：人非常多，试衣间需要排队；结账时记得核对小票，避免重复结算。",[]],["",["088.webp"]],["",["089.webp"]],["",["090.webp"]],["",["091.webp"]],["楼层分布与必逛指南",[]],["1F 实用配饰与包包：耳环、项链、帽子、小钱包和运动鞋配饰。很多款式设计感很强，价格却只要十几块钱。",[]],["2F 少女风与发饰：主打少女和儿童区域，发卡、袜子、毛绒挂饰和包包。款式更新极快。",[]],["3F 韩系服饰与包包：韩式简约风衣服包包，很多衣服是均码（F码）。",[]],["💖4F Gift Shop：小众香氛、文创杂货、创意居家。设计感满满，非常适合用来挑伴手礼。",[]],["必买好物推荐",[]],["三丽鸥吊饰与毛绒挂饰：店里经常能淘到超多的 Sanrio 公仔和吊饰，价格比专柜便宜很多。",[]],["韩系饰品：耳环、项链、戒指款式极多，很多是设计师原创风格，质感不错且性价比高。",[]],["袜子与发饰：各种可爱图案的袜子和发圈，性价比极高。",[]],["小众香氛与香薰蜡烛：4 楼礼品区的香薰蜡烛和线香非常有设计感，包装精致。",[]],["价格与退税攻略",[]],["价格参考：饰品和发饰大多在1,000 - 30,000韩元（约5-160元人），衣服包包大概在50-200元左右。",[]],["现场退税：满 3 万韩元即可现场退税！结账时务必带上护照，主动出示给店员。",[]],["试衣与避坑 Tips",[]],["试衣规则：每次最多只能试穿 3 件衣服，而且白色衣服不能试穿。",[]],["尺码注意：衣服大多为均码（F 码）",[]],["核对小票：结账后一定要当场核对小票上的商品数量和金额，确认退税信息无误再离开。",[]],["避开高峰：周末和下午人非常多，试衣间需要排队。建议上午 11 点刚开门或者工作日下午去。",[]]]},{"id":677,"title":"OFF药店","area":"明洞","chapter":"2⃣️ Day 2（11.29｜周日）：明洞（2免税店+午饭+26）","blocks":[["5.3 「💊｜OFF药店」",[]],["🕙10:00-24:00｜💳 微信支付宝✅",[]],["【逛店与避坑小贴士】",[]],["折扣力度大：货架上直接标着原价和折后价，不用一个个问价格，对比很方便。",[]],["当场退税：单笔满 15,000 韩元即可当场退税！结账时主动出示护照原件，直接付免税价。",[]],["中文服务：店内有中英日韩四语标识，还有会说中文的店员和持证韩籍药剂师。",[]],["理性囤货：根据自己的实际需求购买，注意查看产品的保质期，确保回国后能用完。",[]],["产品线非常全，从内服保健品到常备药、护肤美妆应有尽有。全场 2~8 折，货架按功效分区，全中文标签，还有中文店员和持证药剂师一对一咨询。",[]],["【必买宝藏好物推荐】",[]],["Lacto-Fit 乐多飞益生菌：韩国国民益生菌，经常有 5 折活动！多配方可选，出门旅行重油重盐、肠胃不舒服的必囤，做伴手礼也很合适。",[]],["东亚制药 Noscarna 药膏：分不同颜色，红色治红肿痘，黄色去痘印疤痕，绿色去闭口黑头，清凉不刺激，价格比外面便宜很多。",[]],["熊猫止痒膏：绿色包装，涂在蚊子包上清凉止痒，没有激素，母婴都能用，大概 1 万韩元。",[]],["TEUNLAB RETURN 保湿舒纹身体霜：无香精配方，高密度丰润霜质，对气味敏感的孕妈妈超友好，日常当高保湿身体霜或孕期舒纹护理都很合适，150ml 大概 3.5 万韩元。",[]],["PDRN 修护眼药水：戴隐形眼镜干涩很适合，独立分装方便携带，有不同程度的清凉感可选。",[]],["韩国民膏药贴：肌肉疼痛、关节疼痛必备，10 片大概 2500 韩元，在外面买要 4000 多，性价比极高。",[]],["Juicy up 果汁饮：南瓜味（适合容易水肿的姐妹）和西梅味（帮助肠道顺畅），独立条装随身。",[]],["Handok 祛痘水：含水杨酸 2%，对闭口和痘痘有一定效果（敏感肌需建立耐受），价格非常亲民。",[]],["东亚制药 Aclean 身体祛痘喷雾：含水杨酸，适合喷前胸后背的痘痘，洗澡后喷一喷，改善身体痘印。",[]],["孙兴慜代言 安提普拉敏 舒缓乳液/镇痛贴：旅行逛街背包勒得肩膀痛、肌肉酸胀时贴一贴或涂一涂，缓解疼痛效果很好，非常适合买给长辈。",[]],["Dr.Althea 345 面霜：345 面霜修护泛红和干燥起皮效果很好，这里买比专柜便宜很多。",[]],["RE4DAY4 Dual PDRN 修护面霜：含有 PDRN 成分，适合脸上泛红或太干燥起皮时维稳，质地偏厚重，干皮和混干皮更爱。",[]],["",["092.webp"]],["",["093.webp"]],["",["094.webp"]],["",["095.webp"]],["",["096.webp"]],["",["097.webp"]],["",["098.webp"]],["",["099.webp"]],["",["100.webp"]],["",["101.webp"]],["",["102.webp"]],["",["103.webp"]],["",["104.webp"]]]},{"id":716,"title":"SINOON","area":"明洞","chapter":"2⃣️ Day 2（11.29｜周日）：明洞（2免税店+午饭+26）","blocks":[["5.4 「🛍️｜SINOON」",[]],["🕙11:00-22:00｜💳 微信支付宝✅｜https://sinoon.co.kr/",[]],["【逛店与避坑小贴士】",[]],["注意店员服务：有博主反馈店里会有店员全程跟着服务，虽然热情但可能会让 i 人（内向者）感到不自在。如果不想被跟着，可以礼貌地表示想自己先逛逛。",[]],["注意面料与版型：它家很多单品主打轻盈面料和灵动褶皱，部分裙子可能偏透或偏薄，建议亲自去试衣间上身试试，不要盲目拍码数。",[]],["价格参考：均价在 6万-30万韩元（约合人民币 300-1600 元）。T 恤和上衣大概 300-500 元，裙子和外套大概 800-1500 元。在韩系设计师品牌里性价比还不错。",[]],["折扣活动：狎鸥亭店经常有当季折扣，部分单品能到 6 折或 8 折，遇到打折季入手非常划算。",[]],["当场退税：单笔满 15,000 韩元即可当场退税！结账时主动出示护照原件，直接付免税价。",[]]]},{"id":724,"title":"MLB","area":"明洞","chapter":"2⃣️ Day 2（11.29｜周日）：明洞（2免税店+午饭+26）","blocks":[["5.5 「🧢｜MLB」",[]]]},{"id":725,"title":"COVERNAT","area":"明洞","chapter":"2⃣️ Day 2（11.29｜周日）：明洞（2免税店+午饭+26）","blocks":[["5.6 「🧢｜COVERNAT」",[]],["🕙 11:00-22:00｜💳 微信支付宝✅｜https://covernat.co.kr",[]],["COVERNAT（俗称“大C”）是韩国超火的国民街头休闲品牌，主打高性价比和扎实质感，融合了美式复古、韩系简约与日式工装风，版型干净好搭。出圈单品是C字棒球帽、赤耳丹宁裤和羽绒服。崔秀彬、叶舒华等爱豆都是常客，穿上就是妥妥的韩系大学生氛围感。",[]],["1F：男女中性经典款&宠物系列｜2F：女装&配饰｜3F：男装&免费人生四格拍照点",[]],["【必买爆款推荐】",[]],["C标棒球帽：品牌灵魂单品！几乎人手一顶，版型极好，不挑脸型。",[]],["经典 Logo 卫衣：面料软糯有型，不挑身材，男女同款，随便搭条牛仔裤就很好看。",[]],["高充绒量羽绒服：秋冬必入！充绒量超高，保暖性极好又不显臃肿，短款拉长比例，长款气场十足。",[]],["立体花朵系列与毛绒配饰：甜妹风，毛绒托特包、小耳罩、花朵挂环等小配饰非常可爱。",[]],["香水与美妆：包装很种草，味道清新，可以顺手带一两瓶当伴手礼。",[]],["赤耳丹宁裤：日式赤耳丹宁工艺，质感拉满，版型适合亚洲人身材，百搭又耐穿。",[]],["小狗衣服：超萌的宠物系列，可以买回家和狗狗穿亲子装，可爱到走不动道。",[]],["【价格与购物 Tips】",[]],["价格参考：T 恤大概 3-5 万韩元，卫衣 5-8 万韩元，羽绒服 10-20 万韩元，。",[]],["现场退税：在门店购物满 3 万韩元即可现场退税，结账时务必将护照主动出示给店员。",[]]]},{"id":740,"title":"ABC-MART Grand Stage","area":"明洞","chapter":"2⃣️ Day 2（11.29｜周日）：明洞（2免税店+午饭+26）","blocks":[["5.7 「👟｜ABC-MART Grand Stage」",[]],["🕙 11:00-22:30｜💳 微信支付宝✅",[]],["定位：ABC-MART 家族中的高级别店型（绿标），主打年轻潮流，高阶联名、城市限定、未发售款抢先上脚，款式和尺码比普通店全很多。",[]],["🏷️ 认准折扣标签：鞋子上直接贴红标的是折扣后的价格，这个价格可以免税，但不能享受其他多件折扣了。没红标的款可以凑单打折后再退税。算一算哪种更划算再决定。",[]],["尺码注意：部分品牌的鞋码可能偏大半码到一码，一定要亲自试穿，不要盲目按平时的尺码买。",[]],["💡不要只盯着鞋子：店里的运动 T 恤、宽松运动裤、帽子、袜子、包包等配饰也很全，很多颜色搭配得很高级，可以照着搭配买一套，直接省去找搭配的烦恼。",[]],["",["105.webp"]],["【楼层分布与逛店指南】",[]],["1F 平价休闲鞋 + 特价折扣区：基础款、帆布鞋性价比极高，旁边还有女鞋和服饰区。",[]],["2F 潮牌专区 + Crocs 大区域：NB、匡威、Vans、FILA 齐全，韩国限定款超多。专门的 Crocs 洞洞鞋区，各种鞋花可以慢慢挑，搭配包包、袜子、帽子一次配完整套。",[]],["3F 运动大牌 + 男女跑鞋：耐克阿迪等大牌集中地，男女跑鞋、休闲款，还有 Saucony 等小众跑鞋。",[]],["【ABC-MART 必买爆款推荐】",[]],["Adidas Samba / Gazelle：韩女超爱的德训鞋和芭蕾舞鞋，最近经常有折扣，算上退税和汇率，大概 300-400 元人民币就能拿下，比国内专柜便宜很多。",[]],["New Balance 复古系列：灰调、低饱和度的复古跑鞋（如 NB530），配日常穿搭很好搭。",[]],["Crocs 洞洞鞋：二楼有专门区域，洞洞鞋和各种鞋花都可以慢慢挑，打折款200 多块就能拿下。",[]],["Nike 热门款：比如 Nike 马蹄鞋、阿甘鞋、Jordan 1 等，折扣区经常能淘到 300 多块的热门款。",[]],["UGG 雪地靴：秋冬必入！换季大促时经常有 3-6 折，算下来非常划算，适合囤一双过冬。",[]],["【价格优势与退税攻略】",[]],["折扣叠加：门店经常有活动，比如买一双 95 折，买两双 8 折。红色价签折扣款，还能叠加退税。",[]],["现场退税：满 3 万韩元即可现场自助退税（约 8-10%），不用去机场排队！结账时务必带上护照，在收银台或自助机器上操作，直接退到支付宝或微信。",[]],["换季大促：换季时期，老爹鞋、雪地靴、洞洞鞋会出现 3-6 折，UGG 秋冬折扣力度最夯。",[]],["APP 会员券：游客也可以临时注册 ABC-MART APP 领小额优惠券，结账时叠加使用。",[]]]},{"id":764,"title":"emis","area":"明洞","chapter":"2⃣️ Day 2（11.29｜周日）：明洞（2免税店+午饭+26）","blocks":[["5.8 「🧢｜emis」",[]],["🕙 11:00 - 22:00｜💳 微信支付宝✅｜https://emis.kr/",[]],["避开高峰：周末和下午人非常多，代购也多，试衣间和镜子可能需要排队。建议上午 11 点刚开门或者工作日下午去，体验感会好很多。",[]],["📷 门口巨型玩偶：店门口有超大的 Emis 玩偶，随便一拍就是韩系街头大片。",[]],["📷 入口处的红色抢眼大沙发和工业风墙面，搭配低饱和度灰白风装修，ins 风满满，i 人也可以放心拍。",[]],["📷 1 楼的帽子按颜色摆放，视觉冲击力很强，适合拍对镜自拍。",[]],["",["106.webp"]],["",["107.webp"]],["",["108.webp"]],["",["109.webp"]],["",["110.webp"]],["",["111.webp"]],["",["112.webp"]],["",["113.webp"]],["",["114.webp"]],["",["115.webp"]],["【楼层分布与逛店指南】",[]],["1F 帽子、包包与配饰：一进门就是琳琅满目的棒球帽和包包，全部按色系陈列，强迫症看着非常舒服。1 楼是王牌专区，款式最全，支持全款式试戴试背，大头围女生也能找到合适的版型。",[]],["2F（成衣与服饰）：主打卫衣、针织、牛仔、羽绒服和休闲套装，oversize 韩系宽松版型，男女同款。还有少量宠物服饰。二楼配饰和一楼重复，建议重点看衣服。",[]],["*试穿规则：看中了喜欢的款式，直接找店员，店员会写一个小卡片给你，然后去柜台排队买单。店内超多镜子，随便拍都很出片。",[]],["【必买爆款推荐】",[]],["经典 Logo 棒球帽：品牌灵魂单品！软顶设计巨显脸小，帽檐长且修饰脸型，对大头围非常友好。黑白基础色必入，荧光色和拼色款夏天超吸睛，大概 49,000 韩元（约 250 元人民币）。",[]],["尼龙腋下小包：孔孝真同款，轻便百搭，容量够大，通勤或出游随便塞，百元价位性价比极高。",[]],["豹纹/碎花帆布托特包：韩系氛围感神器，容量大又好看，适合日常通勤或逛街背。",[]],["卫衣与外套：二楼的 oversize 卫衣和羽绒服版型很好，男女同款，适合和对象或闺蜜买情侣装。",[]],["*热门色断货快：Emis 的热门配色（如青绿色、牛仔灰拼粉色、经典黑）经常断货，看中了直接下手，别犹豫。",[]],["*试戴检查版型：试戴的样帽通常版型很好，但店员从仓库拿出来的新帽子可能会歪一点。买的时候一定要自己调整一下帽檐，检查对称度，不要直接付款走人。",[]],["【价格与现场退税攻略】",[]],["价格参考：帽子原价约 49,000 韩元（约 250 元人民币），包包和衣服在 300-600 元人民币左右。",[]],["现场退税：外国游客在门店购物单笔小票满 15,000 韩元（买一顶帽子就达到了）即可现场自助退税（约 7%-10%）结账时务必带上护照，在收银台或自助机器上操作，直接退到支付宝
