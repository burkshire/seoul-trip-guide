计不适合 可不去）",[]],["价格区间：均价在 10 万韩元左右（折合人民币 500 元左右），T 恤和吊带大概 200 - 400 元，外套和针织衫 500 - 1000 元。在设计师品牌里性价比很高。",[]],["退税方式：支持现场退税！单笔消费满 15,000 韩元即可，结账时出示护照登记，直接扣除退税金额，不需要去机场退税，非常省心。",[]],["注意营业时间：圣水店 13:00 才开门，汉南店 12:00 开门，去太早只能在门口等。",[]],["试衣间排队：因为太火，试衣间只有 2 个，周末人多的时候需要排队。建议工作日下午早点去，体验感更好。",[]],["尺码选择：他家的衣服版型大多偏宽松（Oversize），对大部分身材都很友好。",[]]]},{"id":5042,"title":"ASURA","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.18 「🛍️｜ASURA」",[]],["🕙12:00-20:00｜💳 微信支付宝✅｜https://s2asuras2.com/",[]],["Y2K 辣妹风和法式慵懒结合得刚刚好，版型修身又带点松弛感",[]],["【价格与退税攻略】",[]],["价格区间：上衣和吊带大概 300 - 800 元人民币，裤子和半裙 500 元左右，外套和风衣 1200 - 2000 元左右。在设计师品牌里性价比不错，但相比质量还是偏贵一点，建议蹲折扣活动。",[]],["退税方式：支持现场退税！单笔消费满 15,000 韩元即可，结账时出示护照登记，直接扣除退税金额，不需要去机场退税。",[]],["【避坑与实用 Tips】",[]],["尺码选择：他家的衣服版型偏修身，部分款式是均码。如果骨架较大或偏胖，建议试穿，不要盲目拿。",[]],["不要盲目买裤子：有博主反馈他家的部分裤子洗一次就严重褪色，而且洗完变硬、版型偏垮，建议谨慎入手裤子，优先选外套和上衣。",[]],["搭配建议：他家的衣服设计感很强，建议穿简约的内搭去试穿，方便叠穿和搭配他家的外套、小丝巾等配饰。可以带一件自己的薄衬衫或西装外套去店里搭配试穿。",[]],["",["671.webp"]],["",["672.webp"]],["",["673.webp"]]]},{"id":5056,"title":"GLOWNY","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.19 「🛍️｜GLOWNY」",[]],["🕙12:00-20:00｜💳 微信支付宝✅｜https://glowny.co.kr/",[]],["1 楼主要是基础 T 恤、牛仔裤、卫衣和夹克；2 楼有内衣、家居服、连衣裙和文胸背心等。",[]],["【逛店与避坑小贴士】",[]],["被大家称为“韩国版 BM”（但并没有那么平价）",[]],["试衣排队：周末去汉南洞店试衣服可能要排队，而且试衣间通常限制一次只能拿3件衣服进去试。",[]],["退税政策：店内支持退税，记得带上护照！韩国一般满3万韩元就可以退税，结账时主动把护照给店员。",[]],["尺码问题：它家风格偏甜酷少女，版型有些偏小，骨架大或者高个子的姐妹一定要去试衣间试穿。",[]],["情绪服务：很多博主反馈它家店员服务很好，会帮忙找搭配、看尺码，结账时还会在袋子上挂写有你名字的小卡片，送小礼物，体验感拉满。",[]],["【推荐单品】",[]],["基础款短袖/Baby Tee：版型超级好，不显胖，还能无痛拥有直角肩。面料带弹性且舒服，很多颜色都好看，建议多囤几个色。",[]],["刺绣牛仔裤：他家的牛仔裤版型绝了，背后的刺绣设计不夸张但很有记忆点，从背面看也很特别。",[]],["蝴蝶结小包包/家居服：少女心爆棚，搭配甜酷风或者居家穿都很舒服，和美乐蒂的联名款也很可爱。",[]],["连帽卫衣/休闲套装：面料舒适有弹性，自带韩系松弛感，日常通勤或闺蜜逛街穿都很合适。",[]]]},{"id":5070,"title":"Marithe","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.20 「🛍️｜Marithe」💗💙",[]],["🕙11:30-21:00｜💳 微信支付宝✅｜https://marithe-official.com/",[]],["风格是法式复古加韩系甜酷，高允真、Jennie 等很多爱豆都是它家的常客",[]],["【逛店与避坑小贴士】",[]],["",["674.webp"]],["",["675.webp"]],["",["676.webp"]],["",["677.webp"]],["",["678.webp"]],["",["679.webp"]],["",["680.webp"]],["",["681.webp"]],["",["682.webp"]],["",["683.webp"]],["",["684.webp"]],["",["685.webp"]],["退税政策：单笔满 3 万韩元可退税，记得带护照！结账时主动把护照给店员，可以当场退税。",[]],["三层楼超大卖场，地下一层还有童装线。",[]],["试衣排队：周末去明洞或汉南洞店试衣服可能要排队，建议错峰逛，或者去岛山店、弘大店人少一些。",[]],["尺码问题：它家版型偏宽松，但有些款（比如针织开衫）偏修身，建议去试衣间上身试试。",[]],["搭配参考：如果拿不准怎么搭，可以对着高允真的代言图搭，基本不会出错，韩系松弛感直接拉满。",[]]]},{"id":5093,"title":"ROLA ROLA","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.21 「🛍️｜ROLA ROLA」💗",[]],["🕙11:00-21:00｜💳 微信支付宝✅｜https://www.rolarola.com",[]],["【逛店与避坑小贴士】",[]],["",["686.webp"]],["",["687.webp"]],["",["688.webp"]],["",["689.webp"]],["",["690.webp"]],["",["691.webp"]],["",["692.webp"]],["",["693.webp"]],["",["694.webp"]],["",["695.webp"]],["",["696.webp"]],["",["697.webp"]],["部分衣物不能试穿：贴身针织短袖、白色 T 恤等是不允许试穿的，只能靠估码，下单前一定要看好尺码表。外套、夹克可以试穿。",[]],["注意尺码：很多款式是均码（Free Size），适合 125 斤以内的女生，125 斤以上可能会觉得紧。",[]]]},{"id":5112,"title":"이태리국시","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.22 「🍝｜이태리국시 」",[]],["🕙11:30-14:20、17:00-20:50｜💳 微信支付宝✅",[]],["【逛店与避坑小贴士】",[]],["排队等位：这家店人气很高，饭点（尤其是周末）经常需要等位，建议稍微早点去或者避开高峰期。",[]],["口味提醒：牛肠意面虽然好吃，但吃多了可能会觉得有点腻，建议搭配店里的沙拉解腻。另外，部分口味偏辣，不吃辣的姐妹记得提前和店员沟通。",[]],["限时提醒：有博主反馈他家的圣水店有用餐限时（1小时20分钟）的规定，但汉南洞店目前似乎没有这么严格，不过如果人多的时候还是建议别吃太久。",[]],["支付与预约：支持微信、支付宝和信用卡，结账很方便。虽然可以直接 Walk in，但如果是多人聚餐，建议提前在 Naver 或 Catch Table 上预约。",[]],["【推荐菜品】",[]],["",["698.webp"]],["",["699.webp"]],["强推‼️炭火大肠石锅意面🍝 ⭐️⭐️⭐️⭐️⭐️：韩式➕意式的融合口味，将韩国的烤牛肠和意大利面结合起来，牛肠烤得焦焦香香的，既有炭烤的味道，口味又比普通意面重一点，吃起来香香辣辣的。",[]],["鱿鱼海鲜石锅焗饭🥘⭐️⭐️⭐️⭐️：超大的鱿鱼🦑和虾🦐 ，下面的饭带点辣味，配着虾和鱿鱼一起吃很香。",[]],["🫘红豆提拉米苏！⭐️⭐️⭐️：像红豆冰淇淋",[]]]},{"id":5126,"title":"OPEN YY","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.23 *「🛍️｜OPEN YY」",[]],["🕙11:00-20:00｜💳 微信支付宝✅｜https://open-yy.com/",[]],["不是很日常，设计款（如果爬坡不方便可以去汝矣岛现代百货店）",[]],["【逛店与避坑小贴士】",[]],["店员态度争议：很多博主反馈汉南洞店的店员态度比较看运气，有时会遇到冷漠、爱答不理甚至双标对待的情况。如果遇到态度不好的店员，建议保持平常心，或者要求换人服务；相比之下，汝矣岛百货店的店员态度会相对好一些。",[]],["退税政策：单笔满 3 万韩元可退税，务必带上护照原件！",[]],["试穿规则：进店试衣服通常限制一次拿 3 件，且必须排队等候试衣间。一定要遵守店规，避免因为拿太多衣服被店员指责。",[]],["鞋区试穿：鞋子有专门的试穿区域，只能在这个区域试穿，不要拿着鞋子到处跑。",[]],["关于质感：有博主反馈它家部分鞋子（如芭蕾靴）性价比不高，不是真皮且可能有异味；人造皮草外套如果身材不够瘦高，上身可能会显壮。洗完领口易变。建议去实体店试穿，不要盲目跟风。",[]]]},{"id":5135,"title":"FOLNUA","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.24 「👛｜FOLNUA」💗",[]],["🕙11:30-20:00｜💳 微信支付宝✅｜https://folnua.com/",[]],["【逛店与避坑小贴士】",[]],["主打法式极简、松弛感和轻熟高级风。它家不做大 Logo，全靠版型和真皮质感取胜",[]],["一楼全是当季新款包包，二楼是服饰和更多人气包款。",[]],["包包均价在 1000-1500元 人民币左右（牛皮材质，性价比很高）；衣服 500-1000元，鞋子1000元+",[]],["退税政策：单笔满 3 万韩元可退税，结账时把护照给店员，可以当场退税（免税价）。",[]],["鞋子试穿：它家的牛皮鞋子上脚很舒服，足弓有垫，逛街走坡路也不累，但建议一定要去实体店试穿。",[]],["花束包内衬：有博主反馈花束包款式好看，但内衬手感有点粘毛，建议去店里亲自摸一下内衬再决定。",[]],["没有入驻免税店：它家目前只有线下门店和官网，没有入驻韩国免税店。",[]],["【必买推荐】",[]],["",["700.webp"]],["",["701.webp"]],["",["702.webp"]],["",["703.webp"]],["孙怡同款牛皮包（Havi哈维包）：它家的绝对招牌！软糯的荔枝纹牛皮，低饱和灰棕色或米色非常耐看，版型挺括又百搭，通勤或旅行搭休闲衣服都合适。孙怡、姜涩琪同款，方正但不太商务，搭牛仔裤、衬衫或裙子都很顺手，自重只有 315g 左右，非常轻。",[]],["大容量云朵包：自重很轻但超级能装，装下日常所有东西也不压身高，小个子背也完全没问题，非常适合秋冬搭配廓形外套。",[]],["花瓣迷你包：设计很精致，自带肩带可以腋下去背，两侧有肩带调节，系好肩带就变成更可爱的迷你版，适合搭配秋冬大衣。",[]],["百褶半裙与针织外套：衣服在普通款式上加了小设计（比如腰带搭配），上身很有质感。",[]],["芭蕾风手提包/花束包：朴秀荣、Lia 同款，软软的包型比普通腋下包更有记忆点，适合穿简单的时候拎它，整体造型马上有亮点。",[]],["大容量牛皮托特包：看着低调，但皮质和轮廓撑得住，通勤、上学、短途出门都合适，非常能装。",[]],["做旧直筒牛仔裤与格纹衬衫：偏复古休闲路线，不用费力搭配，和包放在一起穿很有完整度，版型对亚洲女生很友好。",[]]]},{"id":5158,"title":"emis Souvenir","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.25 「🐾｜emis Souvenir」",[]],["🕙12:00-19:30",[]],["emis宠物系列",[]]]},{"id":5161,"title":"LOOKAST","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.26 *「🛍️｜LOOKAST」",[]],["🕙12:00-20:00｜https://lookast.com（圣水店更好逛）",[]]]},{"id":5163,"title":"Atelier Nain","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.27 「🛍️｜Atelier Nain」💗",[]],["🕙11:00-21:00｜💳 微信支付宝✅｜https://www.nain.co.kr/",[]],["【逛店与避坑小贴士】",[]],["退税方式：部分门店不能现场退税，需要去机场退税！结账后店员会给你小票，你需要拿着小票去楼下或指定地点开退税单，然后带到机场扫码退税。",[]],["务必主动索要退税单：有博主反馈店员不会主动给退税单，结账时一定要主动问店员要退税单，并确认好退税流程，千万别漏拿，否则到了机场就退不了了。",[]],["注意服务态度：有博主吐槽汉南洞店的部分店员态度比较差，全程黑脸。如果遇到态度不好的店员，保持平常心，或者要求换人服务；相比之下，狎鸥亭店和圣水店的服务体验会更好。",[]],["白色衣服不能试穿：店里大部分白色衣服是不允许上身试穿的，只能靠估码。",[]],["一定要试穿：虽然它家版型很好，但有些款看图好看，上身可能不合适。除了白色衣服，其他款式一定要去试衣间上身试试，不要盲目拍码数。",[]],["折扣看运气：汉南洞店一楼和负一楼都有打折款，但每件折扣不一样（有的 8 折、7 折、6 折），需要问店员。负一楼的打折力度可能更大。",[]],["对比线上价格：有博主反馈它家在国内有天猫官方店，有时候线上价格比首尔实体店还便宜。",[]],["",["704.webp"]],["LIGHT BEIGE 浅象牙白色好看",[]],["",["705.webp"]],["",["706.webp"]],["还有个灰色+浅蓝边的",[]],["",["707.webp"]],["",["708.webp"]],["",["709.webp"]]]},{"id":5183,"title":"seooocookie","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.28 *「🛍️｜seooocookie」",[]],["🕙12:00-20:00｜💳 微信支付宝✅｜https://seooocookie.com",[]],["主理人是中国女生，主打精致甜妹、温柔通勤和法式复古小香风，色彩明亮但不俗气，上身非常显气质，去首尔逛它家绝对能买到不撞款的“长期主义”单品。（不是很日常）",[]],["【逛店与避坑小贴士】",[]],["上衣和下装基本在 200-800 元人民币，连衣裙和外套类在 600-1600 元之间。相比国内代购或官网，线下实体店的价格更有优势，而且部分款式可能比线上还便宜一点。",[]],["版型偏小，一定要试穿：它家衣服版型偏小，很多博主反馈超过 120 斤就很难挑款了。M 码可能都穿不上，肚子会出来。千万不要盲目拍码数，一定要去试衣间上身试试。",[]],["部分款式没样衣：店里陈列的款式有限，部分款式没有摆放样衣。可以找店员要 iPad 在官网上看图选款，仓库有的都能试穿。",[]],["注意面料厚度：它家的小香风外套和马甲面料比较厚实，如果是夏天去首尔玩，可能不太适合穿，更适合秋冬季节或国内降温时穿。",[]],["试衣间排队：汉南洞店虽然有三层，但试衣间数量有限。",[]]]},{"id":5192,"title":"cosymosy","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.29 「🍽️｜cosymosy」",[]],["🕙11:00-20:00｜https://cosymosy.co.kr",[]],["【价格与支付退税】",[]],["价格带：钥匙扣和文创小物大概在 1万-3万韩元，陶瓷餐具和首饰在 3万-8万韩元左右。",[]],["支付方式：支持信用卡和现金，部分门店可能不支持微信/支付宝，建议备好信用卡或韩元现金。",[]],["退税政策：作为小型文创杂货店，可能无法像大型商场那样当场退税，具体结账时可以向店员确认。",[]],["【逛店与避坑小贴士】",[]],["爬坡提醒：店铺在二楼，需要爬楼梯，如果手里提着很多购物袋可能会不太方便，建议轻装前往。",[]],["包装服务：店员会提供简单的包装，询问你的中文名字然后转换成韩文写在卡片上，非常有仪式感。",[]],["关注官方 Ins：可以关注他们的官方账号 @shop_cosymosy，了解最新上新和店铺动态。",[]],["*盘子很多1688同款",[]],["【必买推荐】",[]],["毛毛玩偶钥匙扣：店里的当家花旦！特别是 Jennie 同款猫咪玩偶钥匙扣和超萌的小鸡挂件，质感软萌，挂在包包上既复古又特别，很多人专门过来打卡买它。",[]],["小鸟挂件：小鸟挂件非常受欢迎，有多种颜色可选，还可以自己给它们加配饰，超级可爱。",[]],["陶瓷餐具与手作器皿：店里有很多韩国本土原创设计的陶瓷餐具、杯垫、小餐盘和杯子。",[]],["首饰与配饰：有各种精致的小众设计师银饰、长链条项链、围巾和披肩，风格偏简约带一点复古感。",[]],["文创小物：香氛、贴纸、卡片、帆布袋等，每一样都很有风格，适合买一些留作旅行纪念。",[]],["",["710.webp"]]]},{"id":5211,"title":"depound","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.30 「🛍️｜depound」💗",[]],["🕙12:00-20:00｜💳 微信支付宝✅｜https://depound.com/",[]],["【逛店与避坑小贴士】",[]],["林允儿代言💗",[]],["主打“法式松弛 + 韩系精致”的穿搭氛围感。它家没有复杂的元素堆积，靠干净利落的剪裁、优质面料和低饱和莫兰迪色系出圈，被大家称为“韩女通勤必备”和“Lamaire 平替”。",[]],["1 楼：生活杂货和发饰｜2 楼：衣服｜3 楼：包包",[]],["退税政策：单笔满 3万韩元可退税。务必带上护照原件！明洞店和汝矣岛现代百货店可以当场退税（免税价），汉南洞店结账时主动把护照给店员确认即可。",[]],["一定要试穿：它家衣服版型很好，但有些款（比如针织衫或羽绒服）上身效果可能和照片有差异，一定要去试衣间上身试试，不要盲目拍码数。",[]],["注意面料厚度：它家的秋冬外套和针织衫面料比较厚实，如果是夏天去首尔玩，可能不太适合穿，更适合秋冬季节或国内降温时穿。",[]],["部分款式没样衣：店里陈列的款式有限，部分款式没有摆放样衣。可以找店员帮忙从仓库拿或者在官网上看图选款。",[]],["【必买推荐】",[]],["",["711.webp"]],["",["712.webp"]],["",["713.webp"]],["",["714.webp"]],["Hobo腋下包：它家的招牌爆款！容量超大且自重很轻，皮质软糯，日常通勤或逛街背都绝美。",[]],["标志性帆布袋：设计简约但很有质感，价格亲民，非常适合买来做伴手礼送朋友。",[]],["针织开衫与半拉链毛衣：低饱和奶调色，软糯亲肤，叠穿巨好看。",[]],["麂皮羊羔毛外套与立领羽绒服：秋冬新款的热门款，保暖不臃肿，版型松弛不挑人，日常出门或约会通勤都好穿。",[]]]},{"id":5231,"title":"KUME","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.31 *「🛍️｜KUME」",[]],["🕙11:00-19:00｜💳 微信支付宝✅｜https://kume-studio.co.kr/",[]],["【逛店与避坑小贴士】",[]],["价格带：夏天的上衣几乎不到 1000 元人民币，下装 700-1500 元左右，外套千元不等。",[]],["退税政策：单笔满 3 万韩元可退税，务必带上护照原件！结账时主动把护照给店员，可以当场退税。",[]],["试穿体验：店里可以随便试穿，码数也比较全。试衣间只有一个，建议错峰去。",[]],["配饰也很好逛：除了衣服，店里的帽子、大号帆布包、丝巾、皮带等小配件也很有韩系氛围，可以顺手买一些做搭配点缀。",[]]]},{"id":5238,"title":"SISAO","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.32 「✨｜SISAO」",[]],["🕙10:30-20:00｜💳 微信支付宝✅｜https://sisao.kr",[]],["【🛗楼层指南】",[]],["一楼（Showroom）：环形试香空间，可以体验 SISAO 全系列的香水、身体乳、护手霜和香氛选物。",[]],["二楼（展览空间）：与韩纸照明艺术家 杨正模 合作打造的光影展区，结合光影与气味，超级出片，能同时唤醒视觉和嗅觉。",[]],["三楼（Cafe）：充满阳光的阁楼咖啡厅，整排落地窗和安静的露台非常治愈。可以品尝以 SISAO 香气为灵感特调的限定饮品（比如 Coconut 碎碎冰或柑橘气泡茶）。",[]],["【逛店与避坑小贴士】",[]],["香水（50ml）39,000 韩元（约合人民币 200 元），身体乳约 42,000 韩元，护手霜约 28,000 韩元。",[]],["退税政策：可以退税！。结账时主动出示护照原件，店员会协助办理。",[]],["进店有福利：进店通常会送一杯欢迎茶，购买香水还会赠送香水小样和身体乳小样，满额（如 50,000 或 150,000 韩元）还有限量香氛体验组赠送。",[]],["买香水送饮品券：购买产品通常会赠送三楼咖啡厅的免费饮品券，逛累了直接上楼喝咖啡，非常划算。",[]],["注意找店：汉南洞小巷子比较多，Google 地图偶尔会失灵，建议认准“梨泰院路54街 68-8”这个门牌号，或者跟着路牌找。",[]],["关于留香：有博主反馈韩国小众香水的留香时间相对较短。",[]],["【必买香味推荐】",[]],["容量选择：推荐购买 10ml 迷你装（约 39,000 韩币），方便随身携带补喷；如果自用也可以选 50ml 正装（约 185,000 韩币）。",[]],["Fig Layer（无花果与椰子）：Karina 翻包送给粉丝的同款！成熟无花果的甜润融入柔和的椰奶香，温柔慵懒，像冬日里穿着白毛衣的韩女，非常适合喜欢果香但不想太甜的人。",[]],["Tangerine Dream（柑橘茶香）：店里的主打款，佛手柑的清香搭配淡淡的伯爵茶味，清新自然，像夏日午后阳光洒进屋内的味道，适合春夏或日常通勤。",[]],["Melano Muskos（芒果麝香）：前调是成熟的浆果，后调是淡淡的剥皮芒果味混合雪松木和麝香，沉稳又清新，越到后调越好闻，非常上头。",[]],["Le Freesia（小苍兰与广藿香）：前调是淡雅的小苍兰花香，后调转为厚重的木质檀香，安神且留香持久，适合喜欢木质调的人。",[]],["Chill Rose（木质玫瑰调）：清冷且带有木质调的玫瑰香，不甜腻，非常适合搭配偏中性或简约风格的穿搭，自带一种清冷疏离的松弛感。",[]]]},{"id":5258,"title":"Cambag","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.33 *「📷｜Cambag」",[]],["🕙24H",[]],["【拍照玩法与滤镜推荐】",[]],["AMB 99（复古九宫格）：最火但也最难拍的滤镜！格数最多，需要摆很多动作，时间很紧。适合风格强烈、表情管理好的女生，拍出来非常有复古大片感。",[]],["GRD 2000（自然质感）：对衣服颜色和动作要求不高，怎么拍都好看，成图率极高，适合不想费脑子摆动作的懒人。",[]],["OEX 4（韩系果汁感）：清透效果，自带柔光，非常适合淡颜系女生，拍出来很温柔。",[]],["黑白滤镜：非常有风格，适合搭配酷一点的穿搭和妆容，但如果是穿白衣且五官不够立体，可能会拍出来糊成一团，需要找好角度。",[]],["【价格与支付避坑（重点！）】",[]],["支付问题：大部分门店支持信用卡，但有些店只收 1000 面额现金。建议提前换好韩元现金备用。",[]],["有krw5000和6000的！现金or用微信支付宝，直接选信用卡支付，然后扫码就可以",[]],["保存底片：拍完选片后，屏幕上会出现一个二维码，只有 25 秒时间，一定要用手机拍下来！72 小时内可以通过这个网址下载高清照片和视频。",[]],["【拍摄避坑与出片小贴士】",[]],["提前想好动作：拍摄时间非常紧，倒计时很快，中间没有调整时间。一定要在排队时就想好动作和表情，提前把道具放在小台子上。",[]],["注意镜头高度：镜头高度是固定的，如果身高不够，拍出来可能会变成“瞪眼”或“看鼻孔”。建议微微抬头看镜头，或者垫点东西。",[]],["不要穿纯白衣服拍黑白：黑白滤镜下，纯白衣服会过曝看不清，拍出来只有一个脑袋，建议穿有颜色或有层次的衣服。",[]],["记得拍单张：机器不仅会打印拼图，还会给单张的原片，选片的时候别忘了把喜欢的单张也选上。",[]]]},{"id":5274,"title":"Rockfish","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.34 *「🩰｜Rockfish」",[]],["🕙11:00-20:30｜https://loe-cosmetics.com/",[]],["圣水店更全，弘大更便宜。",[]]]},{"id":5277,"title":"O；DONUT","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.35 「🍩｜O；DONUT」",[]],["🕙11:00-20:30｜支持信用卡和现金，部分门店可能不支持微信/支付宝",[]],["【逛店与避坑小贴士】",[]],["一定要趁热吃：牛奶甜甜圈刚炸出来裹上牛奶粉时最好吃，放凉了外皮会变软，口感会大打折扣。买完建议立刻开吃，或者放在通风处。",[]],["注意甜度：它家的牛奶粉裹得比较厚，整体甜度偏高。如果你平时不太能吃甜，建议搭配乌龙奶茶或冰美式一起解腻。",[]],["注意排队：汉南洞店在周末和节假日人非常多，可能需要排十几二十分钟。如果不想排队，推荐去弘大店，或者选择错峰前往。",[]],["注意保存：因为是现炸且没有过多防腐剂，建议当天吃完，不要放太久，以免受潮影响口感。",[]],["【推荐口味】",[]],["招牌牛奶甜甜圈（4,500韩元/个）：它家的绝对灵魂！现点现炸，外皮酥脆到掉渣，内里蓬松柔软。最绝的是外面裹了厚厚一层特制牛奶粉，奶香浓郁且带有一丝高级的甜味，刚出炉时一定要马上吃，口感最棒。",[]],["乌龙奶茶：搭配甜甜圈的绝佳CP！口感绵密，茶味清爽，能很好地中和甜甜圈的甜腻，非常适合下午茶。",[]],["组合装：如果和朋友一起，可以买大中小不同规格的盒子装，一次性尝鲜多种口味，也很适合买回去当伴手礼送朋友。",[]],["",["715.webp"]],["",["716.webp"]]]},{"id":5293,"title":"Leterie","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.36 「👛｜Leterie」💗",[]],["🕙12:00-20:00｜💳 只能刷卡｜https://www.leterie.kr/",[]],["主打法式少女风和韩系松弛感",[]],["【逛店与避坑小贴士】",[]],["价格区间：包包大概在 280-500元 人民币，衣服在 300-800元 之间。",[]],["退税政策：单笔满 3 万韩元可退税，务必带上护照原件！结账时主动出示护照，可以当场退税。",[]],["注意尺码：它家衣服很多是均码，对 125 斤以内的女生很友好，但 125 斤以上可能会觉得紧，建议一定要去试衣间上身试试。",[]],["不要抱太高期待：有博主吐槽它家部分衣服质量一般，有线头或走线不整齐的问题，但胜在版型好、配色高级，适合看重穿搭氛围感的人。",[]],["搭配建议：它家的衣服和包包都很适合搭配韩系穿搭，比如牛仔裤、半身裙、阔腿裤，或者搭配小棉袄连裤袜和大围巾，秋冬氛围感直接拉满。",[]],["【必买推荐】",[]],["",["717.webp"]],["",["718.webp"]],["",["719.webp"]],["双面托特包：它家的绝对招牌！一面是软糯的雾面皮革，另一面是波点或豹纹帆布，一只包解锁两种风格。容量超大，13寸电脑、水杯、折叠伞随便塞，背久了也不勒肩膀。",[]],["法式小碎花上衣：结合了法式少女风和韩国本土设计，\"法里韩气\"的感觉很特别，很多女爱豆打歌或私服都在穿。",[]],["蕾丝边条纹衬衫：设计感很强，细节精致，搭配短裙或牛仔裤都很出片，温柔又减龄。",[]],["白色小抹胸与娃娃领衬衫：基础款但很有设计感，适合日常通勤或约会穿搭，百搭不出错。",[]],["多口袋学院风双肩包：容量大、颜值高，适合学生党或日常通勤背，搭配休闲装很协调。",[]]]},{"id":5312,"title":"NONFICTION","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.37 「✨｜NONFICTION」",[]],["🕙11:00-20:30｜https://nonfiction.kr",[]],["【逛店与避坑小贴士】",[]],["支付方式：支持信用卡和现金，部分门店可能不支持微信/支付宝，建议备好信用卡或韩元现金。",[]],["退税政策：单笔满 3 万韩元可退税，务必带上护照原件！结账时主动出示护照，可以当场退税。",[]],["空间美学：它家的线下空间走素雅简约路线，纯白色的空间搭配书籍和花卉，艺术美学基调很强，进去逛一圈本身就是一种享受，非常适合拍氛围感照片。",[]],["留香时间：香水的留香时间相对较短，建议多喷点，或者搭配同系列的护手霜和身体乳来延长留香。",[]],["【必买香味推荐】",[]],["Gentle Night（温柔夜晚）：它家的绝对招牌！非常治愈的木质淡香，味道耐闻且不刺鼻，很多博主都疯狂安利，盲买不踩雷。",[]],["Santal Cream（檀香奶油）：前调带一点点无花果的甜感，涂上一阵后会夹杂出木质的香气，非常治愈美好，适合喜欢木质调的人。",[]],["Simple Garden（简单花园）：清新的橙花味，无功无过但很清爽，适合春夏或者喜欢清新果香的人。",[]],["护手霜与沐浴露：它家的护手霜和沐浴露包装非常精美，留香持久、质地清爽不油腻。",[]]]},{"id":5324,"title":"overdue flair（오버듀플레어）","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.38 *「🛍️｜overdue flair（오버듀플레어）」",[]],["🕙https://overdueflair.com",[]],["主打法式复古、韩系温柔和慵懒浪漫风。他家的蕾丝单品、丝绸光泽面料和叠穿搭配非常出片",[]],["【逛店与避坑小贴士】",[]],["价格区间：上衣和下装大概在 300-800 元人民币，外套和连衣裙在 600-1500 元之间。",[]],["支付方式：支持信用卡和现金，部分门店可能不支持微信/支付宝，建议备好信用卡或韩元现金。",[]],["退税政策：单笔满 3 万韩元可退税，务必带上护照原件！结账时主动出示护照，可以当场退税。",[]],["试穿体验：它家衣服版型很好，包容度高（S-M-L 跨度覆盖身高 158-178cm），但部分蕾丝或纱纱单品可能会有一丢丢透，建议里面搭配美背或胸贴。",[]],["关注折扣活动：Showroom 偶尔会有新品折扣（比如 9 折），满额还会赠送 Jewel Pouch 等小礼物，结账前记得问问店员。",[]],["【必买推荐】",[]],["丝绸光泽感衬衫：它家的招牌面料，自带高级光泽感，垂坠度极好，搭配半裙或牛仔裤都很显气质。",[]],["蕾丝与欧根纱叠穿单品：清透但带有挺度，非常适合叠穿，浪漫又温柔，春夏和初秋穿都超美。",[]],["斜肩针织毛衣：版型修身但不紧身，露肩设计很显锁骨，搭配半裙就是妥妥的温柔韩女。",[]],["可拆卸毛领派克服：秋冬新款，轻量羽绒填充，通勤剪裁不显臃肿，毛领可拆卸，一衣多穿。",[]],["条纹抽绳裤：竖条纹设计显瘦，抽绳调节腰围，对身材包容度很高，日常通勤或约会都百搭。",[]]]},{"id":5339,"title":"Diesel","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.39 「🛍️｜Diesel」💙",[]],["🕙11:00-20:00｜https://brand.naver.com/",[]],["亚洲最大空间，必去！二楼是和韩国精品咖啡品牌 Anthracite Coffee 合作的 Diesel Café，逛累了还能喝联名咖啡。",[]],["红房子 有捷径：右侧小门，电梯坐到最下面一层下楼梯看到发光的小门出来就到小路",[]],["【逛店与避坑小贴士】",[]],["单件衣服退税后大概比国内折后便宜几百块，包包和鞋履算下来也比国内专柜划算不少。",[]],["支持微信/支付宝：大部分门店支持支付宝和微信支付，结账时直接扫码。",[]],["退税政策：单笔满 3 万韩元可现场退税，务必带上护照原件！结账时主动出示护照，直接付免税价。",[]],["试穿体验：汉南洞店空间很大，人没有圣水那么拥挤，可以慢慢试穿挑选。店员态度很好，有会中文的店员帮忙搭配，i 人也不用担心。",[]],["牛仔定制服务：汉南洞店有专属的牛仔定制服务区，可以体验专属定制，再也不怕撞衫，记得预留时间体验。",[]],["关于尺码：Diesel 的尺码偏欧美，部分款式偏修身或偏大，建议一定要去试衣间上身试试，不要盲目拍码数。",[]],["【必买推荐】",[]],["",["720.webp"]],["",["721.webp"]],["",["722.webp"]],["",["723.webp"]],["",["724.webp"]],["",["725.webp"]],["",["726.webp"]],["",["727.webp"]],["做旧水洗牛仔裤：Diesel 的招牌！从经典五袋款到当季新品全都有，做旧水洗和剪裁非常修饰腿型，Y2K 复古感拉满。",[]],["1DR 包：品牌标志性包包，容量大且百搭，银色或牛仔材质的款式在韩女中非常火爆，经常断货。",[]],["镂空辣妹上衣与抹胸：针织开衫、镂空设计和修身抹胸，上身非常显身材，很多韩娱女爱豆（如 Kiss of Life Natty、SEVENTEEN Hoshi）的同款都在他家。",[]],["厚底老爹鞋与复古短靴：厚底设计不仅增高还能拉长腿部线条，搭配牛仔裤或裙子都很酷。",[]],["细腰带与墨镜：小配饰非常适合做穿搭点睛，价格相对亲民，买几条腰带或墨镜送朋友也很合适。",[]]]},{"id":5366,"title":"MONCLOS","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.40 「🧴｜MONCLOS」💗",[]],["🕙11:00-20:00｜https://monclos.com/",[]],["【逛店与避坑小贴士】",[]],["护手霜和唇部精华大概在几十到一百多人民币，洗护套装和防晒性价比很高。",[]],["支付方式：支持信用卡和现金，部分门店可能不支持微信/支付宝，建议备好信用卡或韩元现金。",[]],["退税政策：单笔满 3 万韩元可退税，务必带上护照原件！结账时主动出示护照，可以当场退税。",[]],["社恐友好：店员态度很好，不会贴身狂推，有会中文的小姐姐帮忙沟通，纯社恐也能自在逛店。",[]],["DIY 需要时间：做串珠挂件需要一点时间挑选和串珠，建议预留 15-20 分钟慢慢挑，不要赶时间。",[]],["香味选择：它家的香味主打柔和克制，偏向木质调和香草麝香，如果你喜欢浓烈花香可能不太适应，建议进店先试香再决定。",[]],["【必买推荐与 DIY 玩法】",[]],["客制化串珠护手霜：这是它家的王牌项目！你可以自由挑选编织绳子，搭配爱心、气球小狗、蝴蝶结、耳机等限定坠饰，还能用字母串珠拼上你的名字缩写或纪念日（最多 10 个字母）。护手霜质地清爽不粘手，自带雨林木质香，做完直接挂在包包上当装饰，回头率满分，做伴手礼也超级有面儿。",[]],["护手霜：分为木质调（黑管）和花果香（蓝管）等香调。质地清爽不粘腻，吸收快，添加了乳木果油和黑樱桃萃取，保湿效果好且带有高级淡香。",[]],["发丝香氛喷雾：能带来温柔的高级香调，增加发丝光泽。",[]],["多肽丰唇精华：蜜桃裸调水光感，上嘴润润的，颜值和实用性都在线，包里随时带着补涂很方便。",[]],["天鹅绒蓬松洗发水与护发精油：分干性和油性发质，质地清爽不油，香味高级，毛躁发质用着很不错。",[]],["PDRN防晒：轻薄不搓泥不假白，集防晒、妆前打底、提亮于一体，日常通勤很实用。",[]],["无火香薰与衣物除味喷雾：香味柔和克制，没有人工香精的尖锐感，适合买来送人或者自己用。",[]]]},{"id":5383,"title":"现代卡音乐图书馆","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.41 *「🎵｜现代卡音乐图书馆」（周一店休）",[]],["🕙12:00-21:00",[]],["【游客免费注册与试听流程】",[]],["虽然这里是现代信用卡的会员空间，但对外国游客非常友好，不需要韩国手机号也能轻松搞定：",[]],["一楼注册：到一楼前台（Reception）告诉工作人员你想听黑胶。他们会让你扫码下载 Dive App（蓝底红字），用邮箱注册即可，不需要韩国手机号。注册后会给你一张 Pass Card。",[]],["存包上楼：把包包、相机等大件物品寄存（通常只能带手机和 Pass Card 上楼）。",[]],["选唱片：上到二楼，在角落的 iPad 上搜索你想听的歌手或专辑，或者直接在架子上盲选。一次最多选 3 张唱片。",[]],["沉浸式试听：把唱片交给前台工作人员，他们会告诉你座位号，并教你怎么操作黑胶唱机。戴上耳机，享受 30 分钟的音乐时光（如果没听完，时间到了可以重新排队拿号再听）。",[]],["【楼层分布与体验亮点】",[]],["1F（开放式咖啡厅与黑胶店）：一楼是面向所有人开放的咖啡厅，光影效果极佳，适合点杯咖啡发呆。旁边还有一家叫 Vinyl & Plastic 的黑胶唱片售卖店，可以随便逛，部分唱片也能试听。",[]],["2F-3F（黑胶图书馆）：这是核心的试听区。2 楼是一机一桌的试听座位，像自习室一样安静，每桌都有两只耳机，可以和朋友一起听。3 楼有整面墙的音乐书籍和杂志，甚至收藏了从 1967 年至今全套的《滚石》杂志。",[]],["B1（Understage）：地下是一个小型的 Live House 空间，偶尔会有独立乐队演出或黑胶派对。",[]],["【必听风格与选歌建议】",[]],["风格丰富：馆藏以摇滚、爵士、蓝调、灵魂乐、古典为主，也有韩国独立音乐和 K-Pop 复古唱片。",[]],["盲选惊喜：如果不知道听什么，可以直接在架子上随手抽一张。按年代和曲风分类，从 50 年代的经典到近年的独立音乐都有，盲听经常能发现宝藏。",[]],["热门歌手：经常能翻到 Lana Del Rey、David Bowie、Fleetwood Mac、Paul Kim 甚至 泰妍 的卡带和黑胶。",[]],["【避坑与实用小贴士】",[]],["一定要存包：二楼通常不允许带大包和相机进入，只能带手机拍照，所以一定要在一楼存包。",[]],["避开高峰期：周末下午人比较多，可能需要排队等座位。建议周二至周四的下午 1 点刚开门时去，人少体验最好，有博主反馈人少的时候店员甚至会让你听一个小时。",[]],["关于拍照：二楼和三楼可以拍照，但请保持安静，不要打扰到其他正在沉浸听歌的人。",[]],["不要和隔壁搞混：旁边还有一家 Hyundai Card Art Library（艺术图书馆），那个也需要注册 App 才能进，主打当代艺术书籍，两个馆可以一起逛。",[]]]},{"id":5404,"title":"HDEX","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.42 *「🏃｜HDEX」",[]],["🕙11:00-20:00｜💳 微信支付宝✅｜https://hdex.co.kr/",[]],["主打“运动休闲 + 设计感”，版型对亚洲人非常友好",[]],["【逛店与避坑小贴士】",[]],["运动内衣和 T 恤大概在 100-300 元人民币，瑜伽裤和外套在 300-600 元左右，性价比很高。",[]],["退税政策：单笔满 3 万韩元可现场退税，务必带上护照原件！结账时主动出示护照，直接付免税价。",[]],["一定要试穿：它家版型偏修身显线条，但尺码包容性很强（XS-L 码都有）",[]],["不要只当健身服穿：它家很多衣服设计感很强，日常通勤、逛街、喝咖啡穿都毫无违和感。",[]],["关注限定款：弘大店有弘大限定款，狎鸥亭店有独家单品，去之前可以想好要去哪家店淘限定款。",[]],["【必买推荐】",[]],["SKIN 系列（无钢圈无痕运动内衣）：它家的王牌！舒适度极高，运动时完全不会勒，日常通勤穿也很舒服，很多博主都疯狂安利。",[]],["25SS Assist 系列 Leggings：髋部设计超级显腰线，版型修身但不紧绷，把身材比例拉得很长，梨形身材也能轻松驾驭。",[]],["高弹罗纹连体衣：紧身收腰巨显比例，很多女爱豆（如 IVE 李瑞、柳智敏）同款，单穿或内搭都好看，韩系氛围感拉满。",[]],["宽松落肩 T 恤：美式酷女孩风格，遮肉又显瘦，男生女生都能穿，金珉奎同款 T 恤和帽子也超级帅气。",[]],["复古迷彩风外套：日常穿搭有它一秒点睛，搭配同色系短裤或卫裤，又酷又飒。",[]]]},{"id":5419,"title":"SCENTICA","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.43 「✨｜SCENTICA」",[]],["🕙11:00-20:00｜💳 微信支付宝✅｜https://scentica.co.kr",[]],["【逛店与避坑小贴士】",[]],["15ml 约 35,000 韩元（约 170 元人民币），50ml 约 73,000-78,000 韩元（约 350-380 元人民币）",[]],["退税政策：单笔满 15,000 韩元即可退税，务必带上护照原件！",[]],["100% 中奖扭蛋机：门口通常有扭蛋机活动，100% 中奖，能抽到香水小样、护手霜等礼物。",[]],["满额送 DIY 挂件：消费满 7 万韩元，可以体验 DIY 护手霜挂件，自己选字母拼上名字。",[]],["买 15ml 送收纳袋：入手 15ml 香水会送一个超有质感的品牌皮革收纳袋或小钱包。",[]],["明信片集章活动：在安国店盖章后去汉南洞店买限定香型，还能享受 9 折优惠，具体可以问问店员。",[]],["免费试香无推销：店里提供试香卡，可以慢慢闻、慢慢挑，店员不会贴身狂推，i 人逛起来也很舒服。",[]],["集章跨店折扣：记得问店员要明信片盖章，集完章去另一家分店买限定香水可以享受 9 折优惠。",[]],["【必买香味推荐】",[]],["SAFLEAT 54（汉南洞限定）：清冷皂香混合木质调，像雨后清冷的首尔街头，高级小众、男女通杀，完全不撞香，是汉南店必入的王牌。",[]],["INKHIVE 21（安国店限定）：前调微苦，后调是沉香木的木质香，非常有质感，清冷中性香。",[]],["BEIJI 70（安国店限定）：韩式甜米酿香气，清甜软糯，温柔韩系氛围感拉满，非常适合女生。",[]],["AVENQUA 25（釜山广安里限定）：如果去釜山玩，一定要买这支！清新的海洋海风调，裹挟着梨和柑橘的果香，像海边拂过的微风。",[]],["ROSE MUSC（玫瑰白麝香）：没有艳俗的甜腻感，软乎乎奶香玫瑰，温柔慵懒感拉满，贴肤伪体香。",[]],["BRUTEA 12：木质茶咖啡香，像现磨咖啡夹杂着冷冽金属感，后调有甜感，类似“温暖壁炉”。",[]],["Young Rose：带点青涩感的新鲜玫瑰，搭配紫罗兰和白麝香，精致但不老气。",[]],["SAFLEAT 54 汉南洞限定：中性香，前调清新绿意洁净织物感，中调柔和雪松治愈皂香，后调麝香木质",[]],["FLEUR ECLOS盛放之花：温柔干净柔润玫瑰，前调清甜杏香，中调芍药淡玫瑰，后调白麝香",[]],["ROSE MUEC玫瑰麝香：柔和内敛玫瑰麝香，前调清冽果香，中调玫瑰交织紫罗兰，后调白麝香包裹花香",[]],["SANTAL VERT青檀：清新沉稳青绿檀木调，简约高级中性木质香。前调草本，中调檀香，后调木质",[]],["EAU DE JARDIN花园之水：清新治愈绿意水生调，前调露水柑橘绿叶，中调铃兰青草，后调苔藓雪松草木",[]],["BERGAWOOD 柏木苦橙：苦橙木质，微苦中性香。前调清苦佛手柑，中调温润柏木，后调沉静原木",[]],["CITRON 香橼：鲜活柑橘调，夏日首选。前调香橼，酸涩果皮香，中调草本和果香，后调白麝香",[]],["PUR MAUVE纯紫堇：柔媚朦胧温柔知性花香。前调鲜果，中调鸢尾紫罗兰，后调麝香包裹花香",[]],["OUD BLONDE浅金乌木：温柔乌木调，中性轻奢香。前调暖果，中调丝滑乌木，后调香草木质",[]],["VETIBER岩香根：清冷泥土草本调，中性冷感，湿润泥土气息。前调草本泥土，中调香根草，后调原木。",[]],["LE VACANCES假日漫游：阳光海岛，清新度假感。前调海盐柑橘，中调热带白花，后调椰香木质。",[]],["PECHE MOIR暗桃暮色：柔雾蜜桃果香调。前调多汁蜜桃，中调桃香+花香，后调麝香",[]],["SOLEIL NUD裸光暖阳：暖调阳光花果木质香。前调鲜活柑橘，中调温柔黄花，后调奶香木质麝香。",[]]]},{"id":5451,"title":"肉丸休息室","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.44 「🍝｜肉丸休息室」",[]],["🕙11:30-15:00、17:00-21:00｜💳 信用卡/现金",[]],["【逛店与避坑小贴士】",[]],["爱豆同款打卡：在综艺《两个傻小子》第三季中，N.Flying 的 宰铉 曾来这里吃过同款意面，追星女一定要去打卡留念！",[]],["适合不想排长队的人：相比汉南洞其他网红餐厅，他家的排队情况相对较好，如果临近闭餐时间去，甚至有机会直接包场，体验感拉满。",[]],["分量超大：他家的意面和拼盘分量都非常大，建议人多一起点，或者做好打包的准备，千万别被精致的图片骗了胃口。",[]],["【必点招牌推荐】",[]],["",["728.webp"]],["",["729.webp"]],["【拼盘】肉球+鸡翅+洋葱圈+薯条+烤吐司+洋白菜+玉米粒+小汉堡包 酱料是番茄酱+奶酪酱",[]],["奶油肉丸拼盘：他家的绝对招牌！肉丸个头很大，吃起来完全无淀粉感，肉质鲜嫩多汁，搭配浓郁的奶油酱汁，口感超级丰富。",[]],["番茄肉丸意面：综艺同款！番茄酱汁酸甜开胃，肉丸吸满了汤汁，意面劲道好吃，分量超级大，一个人吃可能都吃不完。",[]],["炒饭与烤鸡翅：很多博主推荐的隐藏搭配，炒饭粒粒分明，鸡翅烤得焦香入味，非常适合做配菜解腻。",[]]]},{"id":5465,"title":"Cerric","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.45 「🛍️｜Cerric」",[]],["🕙11:00-20:00｜💳 微信支付宝✅｜https://cerric.co/",[]],["主打“自由、大胆和酷感”，风格简约实用又带点甜酷街头感（张元英、韩素希、Jennie）",[]],["可以导航找楼下的 RonRon 咖啡厅，从 RonRon 大门隔壁的小门进去上二楼就是 Cerric。",[]],["【逛店与避坑小贴士】",[]],["上衣大概 200-500 元人民币，下装 500-700 元，外套 1000+",[]],["退税政策：单笔满 3 万韩元可现场退税，务必带上护照原件！结账时主动出示护照，直接付免税价。",[]],["一次只能试穿 3 件：为了节约大家试衣服的时间，店里规定一次只能拿 3 件衣服进试衣间。",[]],["注意面料触感：有博主反馈部分裤子面料可能会微微扎人，如果皮肤比较敏感，建议一定要去试衣间上身感受一下，或者在里面穿个打底。",[]],["【必买推荐】",[]],["蕾丝吊带与叠穿内搭：它家的灵魂单品！棕色蕾丝吊带和薄荷绿挂脖上衣非常火，随便叠穿一件 T 恤或开衫，韩系氛围感直接拉满。",[]],["宽松落肩卫衣：炭灰色和浅灰色最经典，领口大且带抽绳设计，可以正着穿也可以当斜肩穿，面料软糯舒适，张元英同款机场穿搭。",[]],["带屁帘的休闲长裤：裤型超级舒服，弹力腰围不限身材，带屁帘的设计很特别，穿起来偏松弛效果，梨形身材也能轻松驾驭。",[]],["环保皮草外套与棉服：秋冬新款非常惊艳，立领穿起来很酷，斜拉链设计方便穿脱，版型宽松不臃肿。",[]],["大容量堆堆帽：帽型立体，可以自己做堆叠造型调整，搭配任何衣服都很出片。",[]],["棒球帽/星星耳机：和 aeae 类似的配饰线，出片率很高。",[]],["立体花苞背心：设计感很强，夏天穿简单又时髦。",[]],["工装裙/牛仔裤：版型很正，搭配他家的上衣随便一搭就很有韩系氛围感。",[]]]},{"id":5484,"title":"Newmix","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.46 「☕️｜Newmix」",[]],["🕙11:00-20:00｜💳 微信支付宝✅｜https://newmixcoffee.com/ko",[]],["【价格与退税攻略】",[]],["价格区间：一盒（10条装）大概 14,900 - 17,900 韩元（折合人民币 70 - 90 元）。",[]],["退税方式：支持现场退税！单笔满 15,000 韩元出示护照登记，直接扣除退税金额。",[]],["支付方式：支持韩币现金、信用卡、支付宝和微信，对中国游客非常友好。",[]],["满赠活动：有时买 2 盒送购物袋、买 3 盒送袋子+挂件+杯子，结账前记得问店员。",[]],["【避坑与实用 Tips】",[]],["先试喝再买：店里所有口味都提供免费试喝，先尝尝再决定，避免踩雷。",[]],["冲泡别放水太多：盒子侧面有注水量标识，一定要按刻度线加水！",[]],["周末避开排队：建议周中下午 2 点左右去，基本不用排队。",[]],["【必买热门口味推荐】",[]],["椰椰拿铁：汉南洞限定！椰子清甜与咖啡醇厚完美融合，清爽不腻，冰镇后喝绝了。",[]],["炒米味：经典口味！淡淡的谷物焦香混着咖啡香，清香不甜腻，低卡又养胃。",[]],["抹茶拿铁：抹茶控闭眼入！茶香浓郁丝滑，没有廉价的甜腻感，搭配曲奇绝绝子。",[]],["香蕉牛奶味：神还原韩国便利店香蕉牛奶的味道，奶 fufu 的香甜，咖啡新手也爱喝。",[]],["哈密瓜冰淇淋味：汉南店限定/免税店专供！神还原韩国经典 Melona 哈密瓜冰棒。",[]],["Air 低糖原味：减糖版，咖啡味更明显，适合不喜欢太甜或正在控糖的人。",[]]]},{"id":5503,"title":"AMIDI","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.47 「🛍️｜AMIDI」",[]],["🕙11:00-20:00（周六日12点开始营业）｜💳 信用卡｜https://amidi.co.kr/Shop",[]],["【逛街小贴士】",[]],["全部500+，款式ok但是价格偏贵",[]],["主打复古法式少女风与韩系松弛感，善用低饱和亮色和叠穿设计，慵懒又可爱。Jennie、泰妍 等爱豆都经常上身，被大家称为“韩女私藏的宝藏品牌”。",[]],["价格区间：均价在 13-15 万韩元左右（约 600-800 元人民币），上衣、半裙、短裤都在这个区间，大衣和外套会稍贵一些。",[]],["搭配建议：他家的衣服设计感很强，擅长叠穿，建议穿简约的内搭去试穿，方便搭配他家的开衫、小丝巾等配饰。",[]],["亮点：虽然开在地下层，但外墙有巨大的品牌海报，很好找。进去后简直是购物天堂，空间设计简约又不失氛围感，大面积纯色海报门头超级出片。",[]],["体验：款式最全，包括当季新品和折扣款。店员小姐姐超级 nice，会主动帮忙搭配，把试穿的衣服呈现到最好状态。所有衣服都是 Made in Korea，质量非常好，而且可以现场退税！",[]],["【必买单品推荐】",[]],["针织小开衫/马甲：AMIDI 的叠穿灵魂，配色清新显白，软糯舒适，早秋刚需，单穿或叠穿都很有韩味。",[]],["气球阔腿裤/屁帘裤：王牌裤型，版型利落，遮胯藏肉能力强，对小个子非常友好，不用担心拖地。",[]],["假两件叠穿上衣：不用费心搭配，韩味直接拉满，走量款，随便搭一条裤子就很好看。",[]],["波点半裙/拼接半裙：温柔氛围感满满，约会通勤都合适，下摆拼接设计很有记忆点。",[]]]},{"id":5517,"title":"anoetic","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.48 「🛍️｜anoetic」",[]],["🕙12:00-20:00｜https://anoetic.kr",[]],["平价包包战斗机（可以拍照识图一下 小心买到山寨款大牌……）",[]],["【逛店与避坑小贴士】",[]],["注意线下溢价：有博主反馈，Anoetic 在汉南洞实体店的线下价格，会比在韩国本土购物 App（如 Stylenanda 等）上贵不少（有时差价接近一半）。如果时间充裕且懂韩语，可以在 App 上下单；如果只想在实体店试背体验，建议多对比一下再下手。",[]],["试穿体验：店里提供试穿服务，建议多试几款包包找到最适合自己的背法和颜色。",[]],["【必买推荐】",[]],["小香风链条双肩包：它家的绝对招牌！菱格链条设计，质感在线，被大家称为“南韩小香风平替”。有两种背法，既能当双肩包也能改成单肩包，实用性满分。",[]],["云朵包：米银色非常百搭，背上一整个夏日温柔，容量大且自重轻，日常通勤或逛街背都绝美。",[]],["机车包：皮革材质，容量超大且自重很轻，可休闲可通勤，很多博主都在背。",[]],["双色/豹纹双面背托特包：一面低调素面，翻过来是豹纹或花色，一个包两种风格，性价比极高。",[]],["字母T恤与针织衫：除了包包，它家的衣服也很值得买。正肩版型的字母T和软糯的针织衫，价格只要 100 多人民币，版型很显瘦。",[]]]},{"id":5529,"title":"enzoblues","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.49 「🛍️｜enzoblues」",[]],["🕙12:00-20:00｜💳 微信支付宝✅｜https://enzoblues.com/",[]],["把复古休闲和北欧少女风融合得刚刚好，低饱和的配色和超舒服的面料，穿上就是那种“不费力的时髦感”",[]],["【避坑与实用 Tips】",[]],["价格区间：秋冬款均价500+",[]],["均码设计：他家的衣服很多是均码（Free Size），靠宽松剪裁和橡皮筋调节，对大部分身材都很友好，但高个或微胖女生建议亲自试穿，不要盲目拿。",[]],["面料特性：他家的布料主打亲肤舒适，但部分针织或轻薄面料需要注意洗护，避免用力搓揉或勾丝。",[]],["退税方式：现场开具退税单！单笔消费满 3 万韩元即可退税，离境时去机场扫描退税。",[]],["【必买热门单品推荐】",[]],["万能黄裤子：他家的灵魂爆款！微喇设计加上胯部宽松剪裁，超级显腿直腿细，手感软糯，搭配任何上衣都好看，韩代和博主都在抢着买。",[]],["条纹 T 恤与 Polo 衫：条纹爱好者狂喜！色彩多样活泼，粉、黄、紫、灰都有，带有韩式小亮色点缀，单穿或叠穿都很有层次感。",[]],["格纹半裙与连衣裙：复古中带点清新，蓝色格纹和紫色格纹特别出片，版型对普通人很友好，日常通勤或出游穿都合适。",[]],["拼色针织围巾与冷帽：秋冬配饰必入！色彩柔和丰富，叠穿在外套上瞬间提升整体穿搭的质感，价格也很亲民，非常适合当伴手礼。",[]],["空气感薄外套：春夏秋三季都能穿，宽松舒适，防晒又百搭，把慵懒的松弛感拿捏得死死的。",[]]]},{"id":5543,"title":"GROVE","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.50 *「🛍️｜GROVE」",[]],["🕙11:00-20:00｜💳 微信支付宝✅｜https://grovestore.com",[]],["平价版 Miu Miu，主打法式复古与甜酷学院风。（小贵，款没有很喜欢的）",[]],["【实用 Tips】",[]],["两层楼的空间，主楼偏法式少女和温柔 Miu 风，侧边二店偏轻熟气质和简约通勤。整体配色清新低饱和，逛店幸福感很高，是韩女最爱打卡的店之一。",[]],["价格区间：上衣大约 10万 - 20万韩元（折合人民币 500 - 1000 元），裤子和裙子 20万韩元左右，外套和针织会再高一些。",[]],["退税方式：单笔消费满 3 万韩元即可退税，离境时去机场扫描退税。",[]],["试衣间较小：汉南洞店只有两个试衣间，空间比较小。",[]],["热门款断货：因为太火，热门款和常见尺码很容易 sold out，有时候需要登记 waiting list。",[]],["面料注意：有博主反馈他家的部分针织有点微扎，反而棉 T 和背心更舒服。建议去店里亲自摸一下面料，试穿后再决定。",[]]]},{"id":5553,"title":"AWESOME NEEDS","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.51 「👒｜AWESOME NEEDS」（周一、周二休息）",[]],["🕙13:00-20:00｜https://awesomeneeds.com",[]],["先找到超火的 Milestone Coffee，沿着咖啡店往最右边的弄堂里走，走到尽头看到黄色房子旁边的楼梯上 2 楼就是。",[]],["【逛店与避坑Tips】",[]],["找店提示：看到 Milestone Coffee 咖啡店后，往右手边支路走到底就能看到，位置稍微有点隐蔽。价格区间：帽子大概在 400-800 元人民币之间，版型和质量对得起价格。",[]],["支付方式：支持信用卡和现金，部分门店可能不支持微信/支付宝，建议备好信用卡或韩元现金。",[]],["退税政策：单笔满 3 万韩元可退税，务必带上护照原件！结账时主动出示护照，可以当场退税。",[]],["一定要试戴：虽然版型好，但每个人的头型和脸型不同，建议多试几顶，看看报童帽、冷帽和鸭舌帽哪个更适合自己。",[]],["注意材质：部分针织冷帽放在包里摩擦容易起球，买回来后注意收纳，不要和粗糙的物品放在一起。",[]],["灯光偏暗：店内的灯光比较昏暗，试戴时可能会觉得帽子颜色或质感有偏差，建议拿到门口自然光下再确认一下。",[]],["【必买推荐】",[]],["报童帽：他家的招牌爆款！帽型立体，对方圆脸超级友好，戴上秒显脸小，随便搭配一件大衣或卫衣就很有韩系街头感。",[]],["针织冷帽与堆堆帽：秋冬氛围感的关键！材质软糯（部分含羊绒和羊毛），帽型深且挺括，大头围也友好，保暖又出片。",[]],["豹纹两用马术帽：设计感很强，搭配简约的穿搭瞬间提升整体造型的时髦度，非常适合拍照。",[]],["格纹鸭舌帽：经典百搭，帽檐长度刚好修饰脸型，日常通勤或逛街戴都毫无违和感。",[]],["毛毛帽子：冬季限定爆款，毛茸茸的质感超级可爱，戴上就是韩系甜妹，很多博主都疯狂安利。",[]]]},{"id":5569,"title":"Sienne","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.52 「🛍️｜Sienne」（周一休息）",[]],["🕙11:00-18:30（13-14点午休）｜💳 微信支付宝✅｜https://sienneboutique.com",[]],["法式复古温柔风。（同一栋建筑里有高端线 antt sienne 和首饰店 fotl）",[]],["【价格与退税攻略】",[]],["价格区间：整体均价在 5万 - 15万韩元（折合人民币 250 - 750 元）",[]],["二层和三层还有它的副线 antt sienne、首饰店 fotl 和另一家衣服店 INSILENCE，可以一站式逛完。",[]],["专属折扣：关注 Sienne 的小红书官方账号，结账时出示可以打 9.5折！",[]],["退税方式：现场开具退税单，离境时去机场扫描退税。",[]],["面料特性：部分衬衫和针织面料虽然质感好，但容易有轻微褶皱或起球，买回家后建议轻柔手洗或干洗，不要用力搓揉。",[]],["尺码注意：他家的版型大多偏宽松（Oversize），小个子和高个子都能穿好看。如果不习惯太宽松的，可以试穿小一码。",[]],["【必买热门单品推荐】",[]],["",["730.webp"]],["",["731.webp"]],["60支棉Oversize衬衫：他家的招牌！深棕色和绿色非常显白，面料不易起皱，袖子长长的穿或者卷起来都好看，搭配牛仔裤或塞进裙子里都很高级。",[]],["羊驼毛混纺针织：秋冬必入！50% 羊驼毛含量，暖和柔软不扎人，珍珠纽扣设计经典耐看，叠穿在褶皱 Tee 外面非常优雅。",[]],["蕾丝背心：强推的内搭单品！单穿或当内搭都很不错，不会透副乳，设计感满满。",[]],["玫瑰花半身裙：腰围是皮筋设计，包容度很高，内衬有弹性，搭配针织或风衣都很优雅。",[]],["设计感丝巾：配色绝美，虽然实物颜色可能比图片深一点，但戴上非常提升整体穿搭的质感，很适合当伴手礼。",[]]]},{"id":5588,"title":"Line de Hannam","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["4. 【晚餐】Line de Hannam",[]],["🕙11:30-15:30 / 17:00-20:00｜⚠️ 需要NAVER/catch table预约",[]],["🚌【1站 10min】 3011/6211 【首尔市技术教育院中部.blue广场】 到【顺天乡大学医院·汉南五岔路口】",[]],["🚶步行800m｜12min",[]],["【预约与避坑小贴士】",[]],["提前预约：尤其是顶楼露台位和靠窗位，非常抢手！建议提前在 Catch Table 上预约，并备注想要预留的座位。",[]],["人均消费：约 2万-4万韩元（约合人民币 100-200 元）",[]],["支付方式：支持信用卡和韩元现金，部分门店可能不支持银联卡或微信/支付宝。",[]],["注意着装：虽然是休闲餐厅，但因为是欧式复古风，建议穿得稍微精致点（比如小裙子或韩系通勤装）",[]],["【楼层分布与氛围】",[]],["整家店有好几层楼，每层装修风格都不一样，顶楼露台能看南山塔和汉南洞街景，日落和蓝调时分去超美。",[]],["6楼（室内复古区）：水晶大吊灯搭配欧式雕花，复古氛围感拉满，随手拍都很出片，适合闺蜜聚餐或生日约会。",[]],["7楼（挑高空间区）：跳高很高，空间宽敞，适合人多一起聚聚，拍照非常显大。",[]],["8楼与顶楼露台（P层）：最大的亮点！有大窗户和露天座位，傍晚可以看日落和蓝调，晚上能看南山塔夜景，氛围感直接拉满。推荐！不是完全露天的，有透明顶棚。",[]],["【必点招牌推荐】",[]],["龙虾意面：招牌必点！龙虾肉质 Q 弹，裹满浓郁酱汁的面条一口入魂，分量也很足。",[]],["海鲜千层面：里面扎扎实实有龙虾、蟹肉和虾肉，混合奶香白酱，芝士烤得香香的，配面包蘸橄榄油吃很绝。",[]],["松露土豆饼（Truffle Potato Yaki）：松露香气超级浓郁，外酥里糯，土豆脑袋直接冲。",[]],["烤贝柱：烤得香香的，口感鲜甜，很适合做前菜。",[]],["西葫芦蛤蜊面：里面满满的蛤蜊，汤底鲜美，很适合喜欢海鲜意面的人。",[]],["",["732.webp"]]]},{"id":5610,"title":"8⃣️ Day 8（12.5｜周六）：查缺补漏&在家休息","area":"其他商圈","chapter":"8⃣️ Day 8（12.5｜周六）：查缺补漏&在家休息","blocks":[["8⃣️ Day 8（12.5｜周六）：查缺补漏&在家休息",[]],["*准备好34000零钱用来坐机场大巴。",[]],["大巴预订网站：https://al.airportlimousine.co.kr/bus",[]]]},{"id":5613,"title":"hokuspokus","area":"其他商圈","chapter":"8⃣️ Day 8（12.5｜周六）：查缺补漏&在家休息","blocks":[["「🛍️｜hokuspokus」💗",[]],["🕙周六日12:00-15:00，16:00-20:00｜https://www.hokuspokus.co.kr/",[]],["【逛店与避坑小贴士】",[]],["注意试穿限制：部分热门款可能没有试穿，或者需要等店员拿取，建议提前看好想试的款式。",[]],["注意尺码：它家版型偏宽松，但有些修身款对身材有一定要求。建议亲自去试衣间上身试试。",[]],["价格亲民：在韩系小众设计师品牌里，它家的性价比非常高，大部分单品在 100-300 元人民币左右。",[]],["折扣力度大：经常有老款清仓活动，部分老款折扣力度很大，去之前可以看看店里的最新折扣信息。",[]],["支付方式：支持信用卡和韩元现金，部分门店可能不支持微信和支付宝， 叠加清新海盐气息~\n纯洁又疗愈，洗完仿佛穿上刚晒好的白衬衫那样舒服！\n这组磨砂膏颜值太高了，世是看着心情都好，据说颗粒是比前面的沐浴露款更粗，清洁力\n也更好，但因为它是开盖设计，所以我有点纠结到底要不要入手，暂且留置观察吧。","298.webp":"Careplus × Hello Kitty痘痘贴\n2片装，附赠pvc收纳袋\n采用水胶体材质，适合贴在破口痘痘上吸收分泌\n物。Olive Young大赏年度排名第一的痘痘贴，对付红\n肿痘痘很靠谱，牢牢吸附分泌物，隔绝手抠防止二次发\nYo\n这款痘痘贴其实没有特别吸引我，乍一看不就是普通的\n痘贴多了个联名吗，但有很多姐妹反馈它的粘性特别\n好，而且材质比较轻薄隐形，贴上去不会翘边，看销量\n也是非常高，这就让我有点好奇真有那么好吗？\nForment × Hello Kitty香膏\n30mL/个，有三种香味，送Kitty挂坠保护盒\n柔软干净的婴儿爽身粉香\nCotton Hug\n像干净温暖的白色床单一样的棉质皂感香\nCotton Memory\n清甜可爱的蜜桃皂香\n没看到什么姐妹评价这款香膏，难道是冷门好物吗hhh\n它的保护壳设计很戳我，说是固体香膏，一开始以为是像\n肥皂那样直接涂抹的，没想到是挤压用的，还带盖设计，\n放包里不会漏，本爱香达人很心动，感觉可以挂包上随取\n随用很方便。\nFillimilli x Hello Kitty电热睫毛夹\nFORMENT\n送假睫毛12对\n数显温控屏幕，加热定型，不是普通机械夹，卷翘维\n持时间久，可以看到实时温度，两档温度调节，对手残党\n很友好。充电快、耗电快、加热快、自重轻。细软睫毛选\n低温，粗硬睫毛选高温。但不要接触眼皮，嫁接假睫毛不\n建议使用，眼窝深和睫毛短的宝也不太适合。\n个人无感，但颜值没得说，感觉很适合买来送朋友。","299.webp":"MOREMO奇迹2X护发素\n475mL+20mL+挂件\n瓶装护发素不常见，但是会比管状的好挤出来太多了，像\n黄油一样顺滑，涂在发尾可以稍微停留按摩一会儿，官方说停\n留3分钟以上效果更好，所以可以边敷边刷剧，冲掉后头发像\n喷黄顺滑，不打结。\nMOREMO奇迹修复洗发水\n480mL+40mL+手腕带\n柑橘花香鹰香调很好闻，像干净的皂香＋橙花，质地是弹\n润精浆感，起泡很丰富，洗的时候头皮清爽不紧绷，洗完不会\n涩，吹干之后头皮也不会干痒，蓬松度也很好。\nMOREMO10秒奇迹护发精华液\n475mL+50mL+收纳包\n绿叶花香麝香调，很高级。这个真的神奇！挤出来是水\n状，一抹开变微热泡沫，再变成水膜涂层。上头感觉热热的，\n10秒冲掉，用完发质变得软软的，很顺滑，第二天用夹板和\n吹风机造型的时候都更容易更快！但也有姐妹觉得像塑料味。\nMOREMO免冲洗修护护发乳\n115mL+20mL+发夹\n这个是清甜的桃子味！湿发时涂上之后吹干即可。可以每\n天炸毛用，非常适合发尾非常干枯的姐妹，吹头发前涂在发中\n到发尾，乳霜质地但不粘腻，吹完头发超级顺，还有光泽感！\n或者用卷发棒做造型之前用，能让造型更持久~\n我很讨厌一直用同种洗发产品，所以特别喜欢收藏各种洗发水，以便将来做选择。但是我没太\n看明白这组联名区别在哪，非要入的话，我会首选免洗护发乳，比较适合我这种懒人！！！","300.webp":"Ongredients水光喷雾\n100mL喷雾+30mL妆前乳液+Kitty登山扣\n主打妆前补水与舒缓，帮助缓解肌肤干燥紧绷。皮肤缺\n水、上妆容易卡粉的时候，喷一喷就能补充水润感，让底妆看\n起来更服帖。\nOngredients 黄油妆前乳液\n220mL正装 +30mL小样+Kitty贴纸\n主打妆前补水与屏障修护，侧重维稳舒缓，帮助呵护皮肤\n屏障。精华乳液妆前三合一，皮肤状态不稳定、容易泛红的时\n候很适配，保湿力很强，更适合干皮、混干的姐妹，化妆容易\n卡粉的闭眼入。\nS.NATURE角鲨烷保湿面霜套盒\n当妆前/夜间面霜都很好用，纯补水的，男生也可以用，\n干皮补水，油皮维稳。质地清清爽爽 上脸不黏糊糊，帮助调\n节皮脂，让妆容看起来更干净，持久度也不错。\nS.NATURE角鲨烷保湿精华套盒\n50mL正装+50mL替换补充装+Kitty收纳小包\n主打补水保湿，质地清爽，适合作为日常妆前打底。这款\n很适合大干皮，男女通用。和保湿面霜两者一起用效果更好，\n是帮助肌肤更水润、更有光泽的产品。单用的话不如面霜。\n这几个基本都是主打补水用的产品，男女通用，看起来好像和市面上的妆前保湿产品没太太区\n别？还是胜在Hello Kitty联名做的太好看了\n所以依旧想拿来当送礼备选。","301.webp":"SKI const guideInput = $('guide-query');
const guideResults = $('guide-results');
const imageStatus = $('guide-download-status');

const imageUrl = (name) => new URL('guide-media/' + name, document.baseURI).href;
const imageCacheName = 'korea-guide-media:' + new URL('./', document.baseURI).href + ':v1';
const canSaveImages = 'caches' in window && 'serviceWorker' in navigator && location.protocol !== 'file:';

function normalizeGuide(text) {
  return text.normalize('NFKC').toLowerCase().replaceAll('网咖', '网吧')
    .replace(/[\p{P}\p{S}\s]+/gu, '');
}

function cleanGuideLabel(text) {
  const plain = text.trim().replace(/^\*\*|\*\*$/g, '').trim();
  const dayPrefix = /^(?:[0-9]\uFE0F?\u20E3\uFE0F?\s*)?Day\s+\d+\s*[（(][^）)]*[）)]\s*[:：]\s*/i;
  if (dayPrefix.test(plain)) {
    return plain.replace(dayPrefix, '').replace(/（\d+(?:\s*\+\s*\d+)*）/g, '').trim();
  }
  const unnumbered = plain.replace(/^\d+(?:\.\d+)*\.?\s+(?=\*?[「【])/, '')
    .replace(/^\*+(?=[「【])/, '');
  const countedSection = unnumbered.match(/^【([^】]+)】(?:（\d+）)+$/);
  return countedSection ? countedSection[1] : unnumbered;
}

function cleanGuideBlock(text, title, index) {
  const cleaned = cleanGuideLabel(text);
  if (index !== 0) return cleaned;
  if (cleaned === title) return '';
  const heading = cleaned.match(/^[「【]([^」】]+)[」】](.*)$/);
  if (heading && (heading[1] === title || heading[1].endsWith('｜' + title))) {
    return /[\p{L}\p{N}]/u.test(heading[2]) ? heading[2].trim() : '';
  }
  return cleaned;
}

const guideIndex = guideRecords.map((source) => {
  const title = cleanGuideLabel(source.title);
  const blocks = source.blocks.map(([text, images], index) => [cleanGuideBlock(text, title, index), images]);
  const record = { ...source, title, blocks };
  return {
    record,
    title: normalizeGuide(title),
    area: normalizeGuide(record.area),
    body: normalizeGuide(blocks.map(([text]) => text).join(' ')),
    imageText: normalizeGuide(blocks.flatMap(([, images]) =>
      images.map((image) => guideImageText[image] || '')).join(' ')),
  };
}).filter(({ record }) => record.blocks.some(([text, images]) => text.trim() || images.length) ||
  /[（(][^）)]*(?:休|避开|路演|预约|营业)[^）)]*[）)]/.test(record.title));

function searchGuide(query) {
  const normalized = normalizeGuide(query);
  if (!normalized) return [];
  const shortQuery = normalized.replace(/(?:营业时间|开门时间|关门时间|几点开门|几点关门|怎么去|在哪里|价格)$/, '');
  const terms = query.trim().split(/\s+/u).map(normalizeGuide).filter(Boolean);
  const hits = guideIndex.flatMap(({ record, title, body, imageText, area }) => {
    let rank = 0;
    if (title === normalized) rank = 100;
    else if (title.includes(normalized)) rank = 88;
    else if (shortQuery && title === shortQuery) rank = 84;
    else if (body.includes(normalized)) rank = 62;
    else if (terms.length > 1 && terms.every((term) => title.includes(term) || area.includes(term) || body.includes(term))) rank = 55;
    else if (imageText.includes(normalized)) rank = 35;
    else if (area.includes(normalized)) rank = 25;
    if (rank) return [{ record, rank, related: false }];
    // The guide lists the internet café and the T1 building separately.
    if (record.id === 1712 && shortQuery === 't1网吧') return [{ record, rank: 50, related: true }];
    return [];
  });
  return hits.sort((a, b) => b.rank - a.rank || a.record.id - b.record.id);
}

function addGuideImage(parent, name, title, loading = 'lazy') {
  const image = document.createElement('img');
  const status = element('button', '', 'guide-image-status');
  status.type = 'button';
  status.hidden = true;
  image.alt = title + ' · 攻略配图';
  image.loading = loading;
  image.width = 1600;
  image.height = 1600;
  image.dataset.source = imageUrl(name);
  image.src = image.dataset.source;
  image.addEventListener('load', () => {
    image.hidden = false;
    delete image.dataset.failed;
    status.hidden = true;
  });
  image.addEventListener('error', () => {
    image.hidden = true;
    image.dataset.failed = 'true';
    status.textContent = navigator.onLine ? '图片加载失败 · 点击重试' : '图片未缓存 · 联网后重试';
    status.hidden = false;
  });
  status.addEventListener('click', (event) => {
    event.preventDefault();
    event.stopPropagation();
    status.textContent = '正在重新加载…';
    image.src = image.dataset.source;
  });
  parent.append(image, status);
}

function retryGuideImages() {
  for (const image of document.querySelectorAll('img[data-failed]')) {
    image.src = image.dataset.source;
  }
}
window.addEventListener('online', retryGuideImages);
window.addEventListener('focus', retryGuideImages);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) retryGuideImages();
});

function guideCard({ record, rank, related }, index, preview = false) {
  const details = element('details', '', 'guide-hit');
  const summary = element('summary');
  const images = record.blocks.flatMap(([, names]) => names);
  let cover;
  if (images.length) {
    cover = element('span', '', 'guide-cover');
    addGuideImage(cover, images[0], record.title, 'eager');
    cover.append(element('span', images.length + ' 张攻略图', 'guide-cover-badge'));
  } else {
    details.classList.add('guide-hit-text');
  }
  const copy = element('span', '', 'guide-card-copy');
  copy.append(element('small', record.area || '首尔旅行', 'guide-card-area'));
  copy.append(element('strong', record.title));
  const hours = record.blocks.find(([text]) => text.startsWith('🕙'))?.[0];
  const excerpt = record.blocks.find(([text]) => text && !text.startsWith('🕙') &&
    !/^[【「]/.test(text) && text.length > 14)?.[0];
  const meta = related ? '相关条目' : rank === 35 ? '匹配图片中的文字' : excerpt || '查看完整攻略与实用信息';
  copy.append(element('span', meta, 'guide-card-excerpt'));
  if (hours) {
    const label = hours.slice('🕙'.length).split('｜')
      .filter((part) => !/^\s*(?:https?:|💳|💰|📍)/.test(part))
      .map((part) => part.trim()).filter(Boolean).join(' · ')
      .replace(/^24h$/i, '24 小时营业');
    copy.append(element('span', label, 'guide-card-hours'));
  }
  copy.append(element('span', '查看完整攻略 ↗', 'guide-card-action'));
  if (cover) summary.append(cover);
  else copy.prepend(element('span', '原攻略未配图', 'guide-text-label'));
  summary.append(copy);
  details.append(summary);
  const fill = () => {
    const content = element('div', '', 'guide-content');
    for (const [text, images] of record.blocks) {
      if (text) {
        if (text.startsWith('🕙')) {
          const hours = text.slice('🕙'.length).trim();
          const label = /^24h$/i.test(hours) ? '24 小时营业' : '营业时间 ' + hours;
          content.append(element('p', label, 'guide-hours'));
        } else if (/^【[^】]+】$/.test(text)) {
          content.append(element('h3', text.slice(1, -1), 'guide-subhead'));
        } else {
          content.append(element('p', text));
        }
      }
      for (const name of images) {
        const link = element('a');
        link.href = imageUrl(name);
        link.target = '_blank';
        link.rel = 'noopener';
        link.setAttribute('aria-label', '打开原攻略图片');
        addGuideImage(link, name, record.title);
        content.append(link);
      }
    }
    details.append(content);
  };
  if (index === 0 && !preview) {
    details.open = true;
    fill();
  } else {
    details.addEventListener('toggle', () => {
      if (details.open) fill();
    }, { once: true });
  }
  return details;
}

let guideHits = [];
let visibleHits = 0;
function showGuideHits() {
  const batch = guideHits.slice(visibleHits, visibleHits + 8);
  guideResults.append(...batch.map((hit, i) => guideCard(hit, visibleHits + i)));
  visibleHits += batch.length;
  $('guide-more').hidden = visibleHits >= guideHits.length;
}

function submitGuide(value) {
  const query = value.trim();
  if (!query) return;
  guideInput.value = query;
  $('guide-summary').hidden = true;
  $('guide-results-title').textContent = '「' + query + '」的攻略';
  guideHits = searchGuide(query);
  visibleHits = 0;
  guideResults.replaceChildren();
  $('guide-result-count').textContent = guideHits.length + ' 个条目';
  $('guide-summary').hidden = guideHits.length > 0;
  $('guide-summary').textContent = '攻略里没找到「' + query + '」。试试店名、商圈或更短的关键词。';
  for (const button of document.querySelectorAll('[data-query]')) {
    button.setAttribute('aria-pressed', button.dataset.query === query ? 'true' : 'false');
  }
  showGuideHits();
}

$('guide-search').addEventListener('submit', (event) => {
  event.preventDefault();
  submitGuide(guideInput.value);
});
$('guide-more').addEventListener('click', showGuideHits);

let savingImages = false;
$('guide-download').hidden = !canSaveImages;
async function updateImageStatus() {
  if (!canSaveImages || savingImages) return;
  try {
    const cache = await caches.open(imageCacheName);
    const count = (await cache.keys()).length;
    saveImages.disabled = count === guideImages.length;
    imageStatus.textContent = saveImages.disabled ? '✓ 全部攻略图片已离线保存'
      : '约 56 MB，已保存 ' + count + '/' + guideImages.length + ' 张';
  } catch {
    imageStatus.textContent = '此浏览器无法保存图片到离线。';
  }
}

  if (savingImages) return;
  savingImages = true;
  saveImages.disabled = true;
  let done = 0;
  let failed = 0;
  try {
    const cache = await caches.open(imageCacheName);
    for (let i = 0; i < guideImages.length; i += 8) {
      const urls = guideImages.slice(i, i + 8).map(imageUrl);
      const batch = await Promise.allSettled(urls.map(async (url) => {
        if (!await cache.match(url)) await cache.add(url);
      }));
      done += batch.filter((result) => result.status === 'fulfilled').length;
      failed += batch.filter((result) => result.status === 'rejected').length;
      imageStatus.textContent = '已保存 ' + done + '/' + guideImages.length + ' 张';
      if (failed && !navigator.onLine) break;
    }
    retryGuideImages();
    if (done === guideImages.length) imageStatus.textContent = '✓ 全部攻略图片已离线保存';
    else imageStatus.textContent = '已保存 ' + done + ' 张，本次未完成。联网后可以继续。';
  } catch {
    imageStatus.textContent = '无法完成离线保存，请检查网络和浏览器可用空间。';
  } finally {
    savingImages = false;
    saveImages.disabled = done === guideImages.length;
  }
});

updateImageStatus();

for (const button of document.querySelectorAll('[data-query]')) {
  button.addEventListener('click', () => submitGuide(button.dataset.query));
}
const featuredIds = [4136, 1973, 2110, 1378, 647, 3340];
const featured = featuredIds.map((id) => guideIndex.find(({ record }) => record.id === id)).filter(Boolean);
guideResults.append(...featured.map(({ record }, index) =>
  guideCard({ record, rank: 0, related: false }, index, true)));
document.documentElement.dataset.guideReady = 'true';
for (const control of document.querySelectorAll('#guide-search input, #guide-search button, [data-query]')) {
  control.disabled = false;
}
if ($('guide-load-state')) $('guide-load-state').hidden = true;
if ($('guide-load-retry')) $('guide-load-retry').hidden = true;
$('guide-result-count').textContent = featured.length + ' 个条目';

</script>
</body>
