00.webp"]],["",["501.webp"]],["",["502.webp"]],["",["503.webp"]],["",["504.webp"]],["",["505.webp"]],["",["506.webp"]],["",["507.webp"]],["",["508.webp"]],["",["509.webp"]],["",["510.webp"]],["",["511.webp"]],["",["512.webp"]],["",["513.webp"]],["褶皱芭蕾德训鞋：国内大火的款式，浅粉色缎面拼接真皮，后跟做褶皱松紧不磨脚踝。鞋底薄软轻盈，搭配牛仔裤或裙子都超好看。",[]],["交叉带芭蕾运动鞋：碳灰色最好看，浅灰色第二好看。保留了芭蕾鞋的柔美又有街头利落感，脚感不错，但一天走两万步脚后跟可能会痛。",[]],["厚底鞋：底很厚但很轻，走路不累，上脚非常可爱，适合秋冬搭配长裤或长裙。",[]],["高筒雪地靴：可可棕和黑色最百搭，充绒量足，非常保暖，秋冬必备。",[]],["系带芭蕾鞋：高跟和低跟都有，会送备用的纱质鞋带，绑在小腿上绝了，但比较挑脚型，适合腿长脚窄且脚背不高的人。",[]]]},{"id":2822,"title":"水芹菜汤饭","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.40 「🍲｜水芹菜汤饭」9:30-23:30",[]],["🕙9:30-23:30",[]],["一人食友好：完全支持一个人去吃饭，店员会安排位置，不会觉得尴尬。",[]],["点单方式：没有自助点餐机，是传统的服务员点单。菜单有中日英文，直接指给店员看即可，沟通无障碍。",[]],["支付方式：支持信用卡、现金，部分门店支持支付宝和微信。",[]],["适合做早饭！",[]],["【必点爆款推荐】",[]],["水芹菜牛骨汤饭（15,000 韩元）：招牌必点！清透的牛骨汤底，上面铺满青翠的水芹菜和炖得软烂的牛肉。汤底清爽不油腻，水芹菜带有淡淡的清香，非常适合解腻。*注意烫嘴：汤饭底下的米饭非常烫，吃的时候一定要注意，别烫到嘴巴。如果平时口味较重，可能会觉得它“清汤寡水”，建议加桌上的白胡椒粉或辣椒酱调味。",[]],["水芹生牛肉拌饭（15,000 韩元）：很多博主的“隐藏冠军”！鲜嫩的生牛肉泥搭配水芹菜丝、梨丝和香油，拌开后口感鲜甜软糯，完全没有腥味。点这份还会额外送一碗热腾腾的牛肉汤。",[]],["牛肉煎饼（半份 12,000 韩元）：外酥里嫩，一定要趁热吃。推荐用牛肉饼卷着旁边的凉拌水芹菜配菜，再蘸点调料汁，口感层次非常丰富。",[]],["特选牛杂拼盘汤饭（25,000 韩元）：可以尝到 3 种不同口味的牛肉，肉给得很扎实，水芹菜清香伴随着糯糯的肉，口感很好。",[]],["💡tips：1️⃣桌上有萝卜泡菜桶，自己夹+剪成小块即可，不咸也不会很辣，很爽口！2️⃣纸杯桶上面的🧂是胡椒粉，也是根据个人喜好添加即可～",[]]]},{"id":2834,"title":"OWM","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.41 *「💊｜OWM」10:00-22:00",[]],["🕙10:00-22:00｜💳 微信支付宝✅",[]],["【避坑与实用 Tips】",[]],["有些东西比其他药店贵",[]],["退税方式：消费满 15,000 韩元结账时出示护照登记，直接扣除退税金额，不需要去机场退税。",[]],["善用问卷柜台：进店可以先填健康/肤质问卷（有中文版），系统会给你生成专属的选品建议单，跟着单子买效率极高，还能让穿白大褂的店员帮你分装。",[]],["【必买热门单品推荐】",[]],["OPTATUM（奥塔云）：",[]],["枕头睡眠喷雾：品牌最火的产品之一。推荐 Walking Moon（柚子柑橘调，放松疲惫）和 Universe Dream（薰衣草木质调，舒缓安神），睡前喷在枕头上，助眠效果很好。",[]],["织物香水：特别是 3号木质香，被很多人称为“吃完火锅除味神器”，喷在衣服上能瞬间掩盖异味，味道清新有气质，还有同款香水版本。",[]],["",["281.webp"]],["丽素妍49面膜：OWM 销量 T.O.P.1！一片含有 49ml 精华，敷 49 分钟都不拔干。银色款主打紧致提拉，白色款偏向提亮，是韩国院线同款，熬夜急救必备。",[]],["Reju-All EP0修复霜：含有高浓度三文鱼 PDRN 成分，修护屏障效果一绝。质地扎实但不黏腻，做完美美项目后或者敏感泛红时涂它，第二天皮肤立马回暖复活。",[]],["东亚制豆乳膏：韩国本地人超爱的祛痘神器！红色针对红肿痘，绿色针对闭口黑头，橘色针对痘印。局部薄涂，舒缓维稳效果很好（注意不要全脸涂）。",[]],["Centellian眼霜：外网超红的 PDRN+ 视黄醇 + 积雪草配方，质地拉丝但味道很好闻。用按压的方式促进吸收，改善眼周细纹和干燥，第二天眼部肌肤很润。",[]],["内服补剂：skinny lab地中海番茄橄榄油（身材管理）、Qone醒可安解酒果冻（无糖）、Nothingbetter南瓜汁（消肿），都是韩女日常爱吃的健康零食。",[]]]},{"id":2851,"title":"MeiTaWang（메이타왕 / 美塔王） 海盐蛋挞","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.42 *「🍮｜MeiTaWang（메이타왕 / 美塔王） 海盐蛋挞」10:00-22:00",[]],["🕙10:00-22:00",[]],["单买：5,800 韩元/个（折合人民币约 28 元）。",[]],["分量预警：一个蛋挞足足有 150g，跟拳头一样大！建议 2 人分食一个，或者买一盒带回去慢慢吃。",[]],["支付方式：支持信用卡和现金，部分门店支持支付宝和微信。",[]],["【必买爆款与吃法推荐】",[]],["招牌海盐蛋挞：店里的灵魂爆款，只卖这一种口味！150g 的巨型厚挞，拿在手里沉甸甸的。",[]],["酥脆外皮：千层起酥黄油派皮，边缘烘烤出焦香花边，表层撒上粗海盐粒，咬下去“咔嚓”酥脆。",[]],["厚实挞芯：内馅像刚凝固的嫩豆腐，绵密顺滑，能看到天然香草籽，奶香和蛋香超级浓郁。",[]],["咸甜交织：顶部的海盐颗粒是灵魂！微咸刚好中和了挞芯的甜腻，前几口非常惊艳，完全不会齁甜。",[]],["趁热吃：刚出炉的时候外皮最脆，内馅最嫩，奶香最浓郁，一定要趁热吃！",[]],["空气炸锅加热：吃不完带回家，用空气炸锅 180°C 加热 5~8 分钟，外皮立马恢复刚出炉的冰脆感。",[]],["冷藏当冰淇淋：放凉后放进冰箱冷藏，内馅会变成冰淇淋口感，甜度降低，也非常好吃。",[]],["冷冻保存：放冷冻可保存一个月，冷藏可保存 7 天，随时拿出来加热就能吃。",[]],["关于咸度争议：有少部分网友反馈蛋挞皮“偏咸”或“齁咸”，这可能是个人口味差异。如果你平时口味偏淡，建议先买一个尝尝，觉得合适再买礼盒装。",[]]]},{"id":2866,"title":"BIBIANG","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.43 「✨｜BIBIANG」11:00-21:00",[]],["🕙11:00-21:00｜💳微信支付宝✅｜https://bibiang.com",[]],["空间超大，2楼和3楼有很多拍照区和装置艺术，氛围感拉满。款式最全，经常有满赠活动（比如买香水送身体乳、护手霜），还有会中文的店员，沟通无障碍。",[]],["关于留香时间：它家的香水味道虽然好闻，但留香时间普遍偏短（大概 1-3 小时就淡了）。",[]],["多要小样：店员态度通常很好，结账时可以礼貌多要几个不同味道的小样，回家慢慢试，喜欢再买正装。",[]],["注意喷头：有博主反馈它家的喷头用到后面可能会漏液，建议买回来后不要剧烈摇晃，存放时注意瓶口清洁。",[]],["价格区间：50ml 正装香水大概450-500 元，10ml 小瓶大概 200 多人民币。⚠️免税店价格最便宜，算下来大概 200-300 多人民币一瓶，比线下店便宜近 100 块。",[]],["⚠️注意：BIBIANG 线下门店不支持退税，只能按原价购买。如果想退税，只能去免税店买，但免税店没有赠品。",[]],["【必买爆款推荐】",[]],["Walnut Creek Green（招牌森林香）：店里的灵魂爆款！清新的木质皂香，像走在首尔街头遇到的香香姐姐，干净清爽不甜腻，男女通吃，最不容易踩雷。",[]],["Gureum（云朵香）：时隔一年半推出的新香，温柔的木棉花香带着淡淡的奶味，像被软软的云朵包裹着，干净又安心，留香大概 5-8 小时。",[]],["Colline：酸甜多汁的树莓果香，不齁甜，带一点柔美花香，非常适合少女感。",[]],["Ateecca：清冷的木质辛香调，松木和草本的结合，偏中性酷感，很适合送男朋友或喜欢清冷风的人。",[]],["Lost Wood（枯木木质香）：销量最好的木质调，味道和 祖玛珑 的海盐鼠尾草很像（低配版），淡淡的木香不冲，适合不喜欢花香果香的人。",[]],["New York in Tilly（铃兰花香）：清新淡雅的铃兰花伪体香，喷了别人以为你涂了好闻的身体乳，温柔不甜腻，非常适合送人。",[]],["Hwiamo17（纯无花果香）：新鲜无花果切开的味道，甜甜的完全不腻，纯果香，适合春天和冬日，可以说是某大牌无花果香水的平替。",[]],["Echole：野花香，第一次喷就有一种很自由很轻松的感觉，宁静与安逸。",[]],["Ylang Ylang Mood：没有刺激性，增强放松的成分抑制肾上腺素的分泌，起到抗压力的作用。",[]],["Aritz：让人想起阳光普照的花卉花园里散落的清澈柔嫩的泡沫。",[]]]},{"id":2885,"title":"OLENS","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.44 「👁️｜OLENS」10:00-22:00",[]],["🕙10:00-22:00｜💳 微信支付宝✅",[]],["【避坑与选款 Tips】",[]],["注意保质期：买日抛或月抛的时候，记得看一下包装上的保质期，尽量买生产日期新的。",[]],["价格区间：日抛大概 1万 - 2万韩元（折合人民币 50 - 100 元），月抛和半年抛大概 2万 - 4万韩元。赶上活动的时候囤日抛，算下来一片才几块钱，比国内便宜很多。",[]],["退税方式：单笔消费满 15,000 韩元即可，结账时出示护照登记，离境时去机场扫描退税。",[]],["【必买热门美瞳推荐】",[]],["泪光琉璃黑",[]],["",["514.webp"]],["Ocean Velvet（海洋丝绒）：热门款，自然扩瞳，颜色细腻，日常通勤戴完全不出错。",[]],["Spanish Real Gray（西班牙真实灰）：冷调灰色，上眼很清透，非常适合打造清冷混血感。",[]],["Realring 氧气棕：小直径锁边款，不发蓝的灰色，自然灵动，素颜或淡妆戴都好看。",[]],["Glowy 琉璃黑：单侧琥珀色高光设计，自然放大双眼，给日常妆容注入韩味，适合拍照出片。",[]],["Misty 系列 Ash Choco（迷雾巧）：灰巧色，远看接近棕黑色，近看有亚裔混血味，非常自然的日常款。",[]],["小鹿系列（小鹿棕/小鹿夜棕/小鹿巧）： Olens 的招牌自然款。直径适中，融瞳效果极好，戴上就是温柔的狗狗眼，素颜或淡妆闭眼入，完全不会夸张。",[]],["琉璃泪光系列（琉璃灰/琉璃棕）：带有双边高光设计，上眼是清透的玻璃珠质感，眼睛看起来水汪汪的。灰色系很显韩系智性美，棕色系则很温柔，适合拍照和约会。",[]],["氧气灰（Real Ring Gray）：小直径锁边款，灰色调很正，不发蓝。锁边设计让瞳孔看起来很圆润水润，素颜戴也能让眼睛瞬间亮起来。",[]],["VIVIRING Brown：经典的巧克力棕色，周围一圈锁边很明显，让瞳孔边缘特别清晰。在灯光下显得瞳孔周围亮亮的，很通透，日常通勤戴绝不出错。",[]]]},{"id":2903,"title":"Double lovers","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.45 *「🕶️｜Double lovers」11:00-21:00",[]],["🕙11:00-21:00｜💳 微信支付宝✅｜https://doublelovers.com/",[]],["现场退税：满 3 万韩币即可办理现场退税，结账时一定要带上护照，直接扣掉税金，不用去机场排队。",[]],["【必买爆款推荐】",[]],["DEWY（黑色墨镜）：上脸自带酷酷冷冷清清的女孩感，边框设计很好看，日常搭配绝不出错。",[]],["TERI（棕色框）：非常韩系且百搭，不挑脸型，眼镜本身很轻，左摇右晃也不掉，稳固性很好。",[]],["FLIRT（银色框）：带一点点猫眼设计，上脸惊艳，能修饰脸型，适合想要一点时髦感但不想太夸张的人。",[]],["DUBBY：很多博主推荐的百搭款，适合长窄脸或需要增加眼周横向宽度的脸型，正面宽但不会压颧骨。",[]],["GLO：日常又有点小时髦，不挑脸型，戴着很舒服，属于盲买不踩雷的款式。",[]]]},{"id":2912,"title":"Dear Dracena（디어드라세나）","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.46 「 ✨｜Dear Dracena（디어드라세나）」11:00-21:00",[]],["🕙11:00-21:00｜https://deardracena.co.kr/",[]],["Dear Dracena（디어드라세나）是一家主打天然植萃、纯精油风格的小众香氛与洗护品牌，因为气味治愈、门店设计像“原始洞穴”而非常受欢迎。",[]],["现场退税：满 3 万韩币即可办理现场退税，结账时一定要带上护照，直接扣掉税金，不用去机场排队。",[]],["支付方式：支持信用卡，部分门店支持支付宝和微信",[]],["【必买爆款推荐】",[]],["*留香时间相对较短（大概 2-3 小时）",[]],["价格区间：香水 100ml 约 500 多人民币，洗护产品 300-400 元左右，护手霜 100 元左右。",[]],["Deep Scenery 精油香氛喷雾：100ml 容量很亲民，清新草木调（尤加利+迷迭香+薰衣草），像走进雨后的森林。睡前喷两下在枕头上，超级助眠治愈。",[]],["Calm Again 草本护手霜：35ml 方便携带，柠檬+植物草木清香，天然无酒精。木质盖子搭配赠送的小木块，细节满分，质地轻薄不粘腻。",[]],["SEED GREEN 玫瑰护发精油：30ml 适合旅行用，清淡自然的玫瑰香，不甜不腻。涂抹在发尾很容易吸收，修护干燥发质的同时留下若隐若现的香气。",[]],["Green Moment 空气喷雾与洗发水：迷迭香+尤加利的组合，清冽草本香。洗发水用完头皮清爽、发丝蓬松，搭配发膜使用效果很好。",[]],["洗护系列（洗发水/沐浴露）：泡沫细腻，洗后头皮清爽、发丝蓬松。草本香从头治愈，价格比 Aesop 亲民很多，性价比极高。",[]],["包装服务：如果你打算买来做伴手礼，店员会提供非常用心的礼物包装服务，会系上丝带并搭配一小枝尤加利叶等植物装饰，细节满分。",[]],["语言沟通：店员的英文通常很好，沟通基本没有障碍，不用太担心韩语问题。",[]]]},{"id":2927,"title":"Repertory（레퍼토리）","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.47 「🕯️｜Repertory（레퍼토리）」11:30-20:00",[]],["🕙11:30-20:00",[]],["宝藏礼品买手店！",[]],["找店指南：门头在一个院子里，不太好找。请认准门口的小天使路牌👼或者停车场角落的小招牌。",[]],["【必买爆款推荐】",[]],["黄铜蛋糕香插：店里的“镇店之宝”！做工非常精致，介绍写着“这不是吃完就消失的蛋糕，这是可以一辈子享用的蛋糕”。大概 85,000 韩元，点香的时候超级有氛围感，送人非常体面。",[]],["手工饰品与戒指：首饰柜台的款式非常别致，造型独特不撞款。两个人在柜台前试戴，十个指头戴满造型都很好看，均价在 300-700 元人民币左右，适合买给闺蜜或自己收藏。",[]],["不锈钢小盘子与小碟组合：设计感很强，质感很好，日常用来装首饰、耳环或者做香插底座都非常合适，价格也很亲民。",[]],["皮具与布艺小物件：店里还有很多没怎么见过的韩国本土小众品牌，皮具和布艺制品关注生活中的小细节，买起来像是在寻宝。",[]]]},{"id":2936,"title":"Mak Made（막마드）","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.48 *「 🥿｜Mak Made（막마드）」13:00-20:00",[]],["纯手工真皮鞋履品牌，主打靴子、尖头单鞋和乐福鞋，质感好、舒适度极高，很多韩女和女团都会穿。",[]],["找店指南：店铺藏在主街旁边的一个隐蔽仓库角落里，半工厂半卖场。请认准门口的小天使路牌👼或者停车场角落的小招牌，进去后上二楼，千万别走错。",[]],["现场退税：支持现场退税，结账时一定要带上护照，直接扣掉税金，不用去机场排队。",[]],["【必买爆款推荐】",[]],["价格区间：成品鞋原价大概在 20 万 -32 万韩币左右（折合人民币 1000-1600 元），在手工鞋里性价比很高。",[]],["经典黑色挤皮靴：店里的断货王！高级又耐看，靴筒特别显腿细，皮质软乎乎不磨脚，搭配短裙或长裤都绝美。",[]],["设计感凉靴：夏天和初秋的宝藏单品！带筒的凉鞋款式，既有增高效果又能显腿直，上脚惊艳，完全不磨脚。",[]],["棕色短靴：复古氛围感拉满，皮质细腻，版型简约但细节精致，秋冬搭配大衣或针织裙非常出片。",[]],["尖头/方头小单鞋：适合春秋季节的日常款，做工讲究，走一天路脚都不酸，通勤或约会都能驾驭。",[]]]},{"id":2946,"title":"CARIN","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.49 「👓｜CARIN」11:00-20:00",[]],["🕙11:00-20:00｜https://www.caringlasses.com",[]],["【楼层分布与逛店路线】",[]],["1F：平价普通款｜2F：秀款与设计款｜3F：配镜区与打卡区（配蔡司镜片的专业验光区）",[]],["【配镜服务与价格攻略】",[]],["配蔡司镜片：圣水店三楼可以配蔡司镜片，验光非常专业（店员甚至能发现你的瞳孔比普通人大并给出建议）。常规版本 30 分钟就能取镜，如果度数特殊需要定制，大概需要一周工期，店员可以包邮寄回国内。",[]],["价格区间：镜框均价在 20 万韩币上下（折合人民币 1000 元左右），部分平价款在 10 万韩币左右。",[]],["支付方式：支持信用卡，部分门店支持支付宝和微信",[]],["现场退税：满 15,000 韩元即可办理机场退税，结账时一定要带上护照，拿好退税单去机场扫码办理。",[]],["DIY 挂链：买完墨镜或眼镜，一楼可以 DIY 专属字母挂链，很有纪念意义，适合当伴手礼送人。",[]],["【必买爆款推荐】",[]],["软糖系列（Air）：店里的“断货王”！自带气垫鼻托，防滑且超级轻盈。Air3 A 系列上脸显脸小、脸部流畅；Air3 S 系列是方圆框，适配大多数脸型。",[]],["Jace R：排行 NO.1 的颜值担当，不规则复古玳瑁框，360 度无死角显白，可以驾驭任何脸型，深色玳瑁色超级高级。",[]],["Vivi R：王楚然、陈都灵同款！适合大脸和大瞳距的时尚眼镜，细框设计自带高级感，素颜戴也能遮脸显气质。",[]],["书呆子系列（Arno R）：最不像书呆子的一只，框型带一点小棱角，上脸不呆板，减龄又可爱，适合喜欢学院风的女生。",[]]]},{"id":2961,"title":"Maman Gelato","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.50 「🍦｜Maman Gelato」11:30-21:00",[]],["🕙11:30-21:00｜12、14、16点前15分钟左右去，时间不合适就不去～",[]],["迪拜巧克力曲奇：“断货王”！巧克力麻薯包裹着迪拜巧克力脆脆，搭配开心果 Gelato，口感丰富、浓郁不腻。（每天只在 12:00、14:00、16:00 这三个时间段限量发售）",[]],["*排队技巧：建议提前 10-15 分钟去排队，店员会在快发售时发菜单和点单小纸条。先点单付款，然后在附近等叫号，不要走太远。",[]],["*搭配推荐：迪拜巧克力款通常会搭配最高配的开心果巧克力脆筒，外面裹满坚果碎，口感直接拉满。",[]],["【价格与规格参考】",[]],["圆筒（蛋筒）：单口味 8,000 韩元，双口味 11,000 韩元。",[]],["纸杯（Cup）：小杯（2种口味）7,500 韩元，中杯（3种口味）12,000 韩元。",[]],["打包盒：小盒（3种口味/350g）27,000 韩元，中盒（4种口味/500g）36,000 韩元，大盒（4种口味/750g）45,000 韩元。",[]],["迪拜巧克力款：16,000 韩元（限量发售，具体见下文）。",[]],["",["515.webp"]],["",["516.webp"]],["【必买爆款推荐】",[]],["关于甜度：整体主打低糖，但部分口味（如开心果巧克力）吃到最后还是会觉得有点腻。建议选纸杯拼 2-3 种口味，或者搭配冰美式解腻。",[]],["关于融化：因为没有多余添加剂，Gelato 融化得很快！点圆筒的话，一定要找店员要个小碗接着，不然化得滴一手很狼狈。拍完照就赶紧吃。",[]],["经典开心果：上面撒满开心果碎和巧克力丝，坚果香气非常浓郁，一口下去超满足，适合喜欢坚果味的人。",[]],["抹茶草莓：抹茶味浓郁但不苦，搭配酸甜的新鲜草莓和黑巧粒，清爽解腻，甜度最低，非常推荐！",[]],["大米（Riso）：带有淡淡的米香和奶香，吃起来有颗粒感，清爽不甜腻，是默默回购的隐藏神仙口味。",[]],["薰衣草味：淡淡的薰衣草花香，没有廉价香精味，甜度低，清香解暑，很适合不喜欢太甜的人。",[]],["莓果酸奶：醇厚酸奶基底裹着新鲜莓果果肉，酸甜平衡，质地绵密丝滑，超解暑。",[]]]},{"id":2981,"title":"Shiro","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.51 「✨｜Shiro」11:00-21:00",[]],["🕙11:00-21:00",[]],["日本天然系护肤香氛品牌（主打天然植物香调，酒精含量足，刚喷出来时可能会觉得有点冲，但中后调越闻越好闻。留香时间普遍偏短，大概 2-4 小时）",[]],["价格区间：香水 40mL 约 46,000 韩元，身体喷雾约 22,000 韩元，护手霜约 36,000 韩元。",[]],["现场退税：满 15,000 韩元即可办理，结账时一定要带上护照，直接扣掉税金，不用去机场排队。",[]],["支付方式：支持信用卡，部分门店支持支付宝和微信",[]],["购物袋收费：店里的包装比较简易，店员会用纸包好，但购物袋是另外收费的，建议自带环保袋。",[]],["【必买爆款与韩国限定推荐】",[]],["限定好物：这里有首尔限定款（如铃兰味、樱花味），是日本和其他地区买不到的。",[]],["柚子喷雾（有油/无油）：品牌人气TOP1！一喷就是刚剥开柚子的爆炸清香！有油版滋润适合秋冬，无油版清爽适合夏天。",[]],["柚子唇油：透明的嘟嘟唇效果，酸甜的柚子糖味，滋润度很好。",[]],["铃兰香水（韩国限定）：清爽又妩媚的白花调，留香时间约6小时。",[]],["Freesia Mist（花店清香）：品牌人气 Top 1！前调是苹果和杏桃的果香，中调融入玫瑰和绿叶，后调是干净的白花与麝香。就像清晨走进花市一样清新。",[]],["白茶身体乳：清爽不黏腻，白茶香气如同晨露中的茶叶般清新。",[]],["白茶护发精油：完头半干时抹在发尾，散发的淡淡茶香非常疗愈。",[]],["护手霜 / 身体乳：保湿力无敌，像敷了面膜一样柔滑，白茶和肥皂香（Savon）",[]],["韩国限定铃兰系列（SUZURAN）：来韩国必入的限定款！非常清新、干净且带着淡淡绿意的花香，不浓不甜。",[]],["Savon皂香身体油：干净清爽，轻薄滋润，秋冬用也很舒服。",[]],["磨砂洗手液：里面有磨砂颗粒，温和去角质，洗完不拔干。",[]]]},{"id":3000,"title":"자연도소금빵 自然岛盐面包","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.52 「🥐｜자연도소금빵 自然岛盐面包」💗9:00-22:00",[]],["🕙9:00-22:00｜💳 信用卡",[]],["（每天分 6 个时段出炉：9:00、12:30、14:00、15:30、17:00、18:30）",[]],["【口味与价格揭秘】",[]],["招牌原味盐面包：店里只卖这一种口味，一包 4 个，售价 12,000 韩币。",[]],["不要贪多：一包 4 个，黄油给得很足，偏油润。建议 2 个人分食一包，或者搭配冰美式解腻。",[]],["自助点餐机：店内没有人工点单，机器支持中文界面。",[]],["结账流程：在机器上点单付款后，会打印出一张小票，直接拿着小票交给店员，店员就会给你拿刚出炉的面包。",[]],["口感体验：底部撒了海盐烤出焦脆的硬壳，咬下去“咔嚓”酥脆；包体偏松软且有韧劲，黄油香气极其浓郁，咸甜交织完全不腻。",[]],["复烤也好吃：很多博主反馈，买回家用空气炸锅或微波炉加热 30 秒复烤后，黄油香味会再次爆发，包体依旧有韧劲。",[]]]},{"id":3010,"title":"Torriden","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.53 *「🧴｜Torriden」11:00-20:00",[]],["🕙11:00-20:00｜💳信用卡&现金｜https://www.torriden.com/",[]],["现场退税：购物满 3 万韩币即可办理机场退税（结账时给退税单，回国在仁川机场扫码）。",[]],["关于肤质：Torriden 主打基础保湿和舒缓，适合干皮、混干和敏感肌。",[]]]},{"id":3014,"title":"Hince","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.54 「💄｜Hince」11:00-21:00",[]],["🕙11:00-21:00｜https://hince.co.kr/",[]],["【必买爆款清单】",[]],["近期最火的是3万韩元盲盒（退税后 2.8 万），能开出气垫、眼影盘、唇颊两用等。盲盒分冷色调（Cool）和暖色调（Warm），挑最重的拿。",[]],["水光棒（Light / Clear）：hince 的当家花旦，100 多块的价格被很多人拿来和 香奈儿 水光棒做对比。Clear 是透明无底色，Light 带点珠光。上脸是那种很高级的韩系水光感，不粘腻，不会破坏底妆。",[]],["蓝气垫 / 粉气垫：蓝气垫主打柔雾奶油肌，粉质细腻，适合混油皮；粉气垫遮瑕力更强、色号更白，适合干皮或追求高遮瑕的姐妹。注意色号选择，15 号自然，17 号偏白。",[]],["Raw Glow 唇釉：胖胖管身超可爱，质地清透，成膜后是波光粼粼的水光感。比如 R002 晨曦蔷薇，淡水红色素颜涂也超好看。",[]],["水光腮红棒：秋冬限定玫瑰色，用手指融化后点涂在苹果肌上，能同时当腮红和高光用。",[]],["【盲盒“薅羊毛”核心攻略】",[]],["如果你冲着 3 万韩元的盲盒去，一定要看懂退税和赠品的规则，不然容易吃亏：",[]],["退税与满赠的冲突：3 万韩元的盲盒退税后是 2.8 万韩元。如果选择现场退税，因为金额不满 3 万，就拿不到满 3 万的赠品（比如大肠发圈或镜子）。如果非常想要赠品，可以选择不退税直接拿礼物，或者再凑一件小商品让总额超过 3 万。",[]],["挑最重的拿：去圣水洞或汉南洞买盲盒，一定要挑最重的拿！重的里面通常包含气垫或唇颊两用，价值更高，基本不会踩雷。",[]],["选冷色调（Cool）：很多博主反馈，冷色调（Cool）开出的色号更适合大多数亚洲女生的肤色，暖色调（Warm）容易开出偏黄的色号（比如 23 号色）。",[]],["满 2 万额外送：买 2 万韩元的盲盒或商品，通常会额外送一个正装唇颊两用，记得让店员加上。",[]]]},{"id":3028,"title":"FWEE","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.55 「💄｜FWEE」💗11:00-21:00",[]],["🕙11:00-21:00｜💳 微信支付宝✅｜https://fwee.kr/",[]],["现场退税：满 3 万韩币即可办理现场退税，结账时一定要带上护照。",[]],["【必买爆款推荐】",[]],["DIY 五色眼影盘：38 种颜色（眼影、高光、亮片、唇膏、腮红）任意搭配，外壳有银、粉、蓝、黑等钥匙扣造型，还能当吊饰挂在包上。",[]],["DIY 盘选色建议：因为格子比较小，建议多选眼影和高光，唇釉和腮红格子太小不太好用。选色时可以参考店内的“人气热卖表”，或者让店员帮忙推荐适合你肤色的颜色。",[]],["贴钻体验：Beda-zzling 贴钻装饰是圣水洞特色打卡项目，可以用水钻贴纸装饰彩妆盘外壳，但要注意贴纸粘性，贴好后尽量轻拿轻放。",[]],["3D 光泽 Cola 唇釉：镜面水光感绝美，不黏腻。热门色如 B01、B05 经常断货，质地厚实但润嘟嘟的。",[]],["唇颊两用布丁膏：软糯布丁质地，上嘴轻薄不卡纹，30+ 色号覆盖日常韩系淡妆。",[]],["Spa 提亮隔离霜：带 SPF30 防晒值，一支搞定防晒和妆前提亮，上脸清透水光肌，懒人伪素颜神器。",[]],["双色土豆泥腮红盘：粉质细腻，显色度好，日常通勤或约会都百搭。",[]]]},{"id":3039,"title":"Chaakan","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.56 「🥿｜Chaakan」11:00-22:00",[]],["🕙11:00-22:00｜💳 微信支付宝✅",[]],["1楼是 Showroom 和韩屋风格的鞋子制作展示区，很好拍；B1 是主要卖场。最绝的是 B1 有隐藏特价区，部分鞋款只要 9,900 韩元（约 50 元人民币），捡漏机会很大！",[]],["【价格与退税攻略】",[]],["价格区间：大部分鞋子在 3万 - 5万韩元（折合人民币 150 - 250 元），特价区只要 9,900 韩元。相比国内代购，直接在韩国买便宜太多了。",[]],["退税方式：单笔消费满 15,000 韩元结账时出示护照登记，离境时去机场扫描退税。",[]],["尺码偏小：他家的鞋子码数偏小一码，建议买大一码。比如平时穿运动鞋 36 码，买他家可能得拿 37 码。一定要亲自试穿，不要盲目按平时码数买。",[]],["换货限制：如果鞋子不合适需要换货，必须去同一间店换，分店之间不能换，所以买的时候一定要试好。",[]],["暴走慎选：虽然很多博主反馈鞋底软，但也有部分款式走一万步以上还是会累脚，建议试穿时多走几步感受一下。",[]],["【必买热门单品推荐】",[]],["芭蕾风小皮鞋：他家的灵魂爆款！银色、白色、黑色都很百搭，鞋底软软的，上脚就是妥妥的韩女氛围感。",[]],["玛丽珍鞋：复古又可爱，搭配短裙和袜子很绝，很多韩国女爱豆都穿过。",[]],["厚底靴与短靴：秋冬必备，显腿长又不累脚，价格才两三百块，性价比极高。",[]],["9900韩元特价区鞋款：在圣水店 B1 特价区，能淘到各种凉鞋、单鞋，不到百元就能拿下，看到喜欢的直接冲。",[]]]},{"id":3053,"title":"Maison de Myomi","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.57 *「🕯️｜Maison de Myomi」11:00-20:00",[]],["🕙11:00-20:00",[]],["宝藏 Vintage 选物店！店主亲自从欧洲淘回来的复古餐具和杂货，每一件都带着岁月的温度，逛起来就像在寻宝，非常治愈。",[]],["找店指南：店铺在二楼，门头比较低调，需要上楼梯。",[]],["价格区间：大部分小物件在 3 万 -6 万韩币左右（约 150-300 元人民币），餐具和花瓶稍贵一些。",[]],["支付方式：支持信用卡和现金，部分门店可能支持支付宝或微信",[]],["【必买爆款推荐】",[]],["欧洲 Vintage 餐盘：店里的灵魂主打！每一件都有不同的年代、花纹和故事，很难找到完全一样的第二件。",[]],["手工玻璃勺：非常精致的小勺子，大约 54,000 韩币（约 200 多人民币）一把。",[]],["Vintage 烛台与花瓶：充满岁月痕迹的复古摆件，放在家里瞬间提升氛围感，适合喜欢家居装饰的朋友。",[]]]},{"id":3063,"title":"MUSINSA Megastore","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.58 「🛍️｜MUSINSA Megastore」💗11:00-22:00",[]],["🕙11:00-22:00（面积太大，建议预留 2-3 小时）",[]],["【楼层分布与逛店路线】",[]],["1F（主视觉与快闪区）：大型品牌陈列、季节性企划区和快闪活动区",[]],["B1（高街青年与鞋履）：运动鞋区域（MUSINSA Kicks）还有包包与帽子特区。",[]],["2F（潮流女装与美妆）：MUSINSA Girls 高街女装区，以及超大的美妆专区（MUSINSA Beauty）",[]],["3F（MUSINSA STANDARD）：主打基础款，适合日常通勤和叠穿，男女装和家居区都在这里。",[]],["4F（户外机能与美食）：MUSINSA Next Outdoor 运动户外区，逛累了可以直接去 MUSINSA Food Garden 吃简餐、喝咖啡，顶楼休息区设计感很强。",[]],["【省钱、退税与薅羊毛攻略】",[]],["扫码查折扣：吊牌上的价格并非最低价！一定要用手机扫衣服上的二维码，进入网页查看是否有 5%-20% 的折扣，有Sale标签的甚至可能半价。",[]],["外国人专属福利：二楼美妆区可以领外国人美妆包",[]],["支付方式：支持信用卡，部分门店支持支付宝和微信",[]],["现场退税：单店消费满 30,000 韩元即可办理机场退税，结账时一定要带上护照，拿好退税单去机场扫码办理。",[]],["结账效率：如果不需要拿新衣服，可以在二楼帽子那边自助结账，基本不排队；如果需要换码或拿新衣服，要等店员去仓库找货，比较耗时。",[]]]},{"id":3078,"title":"CUEREN","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.59 *「👞｜CUEREN」10:00-22:00",[]],["🕙10:00-22:00｜https://cueren.com/",[]],["【价格、退税与支付攻略】",[]],["价格区间：均价在 20 万 -25 万韩币左右（折合人民币 800-1000 元）。",[]],["现场退税：汝矣岛现代百货支持当场退税；圣水店和汉南店通常是机场退税（结账时给退税单，回国在仁川机场扫码），具体结账时务必问清店员。",[]],["支付方式：支持信用卡、支付宝和微信",[]],["体验：除了买鞋，还能在中间的咖啡厅喝限定饮品，三楼还有多功能文化空间（Tannery）经常举办花艺展或快闪活动，非常适合拍照打卡。",[]],["【试穿与避坑 Tips】",[]],["关于舒适度：它家鞋子设计好看、皮质有型，但并不是所有款都“第一脚就软”。羊皮款相对柔软，但牛皮款和细带款可能会偏硬、磨脚。如果是为了逛街暴走，建议选气垫款或羊皮款；如果追求极致造型，可以接受一点磨合期。",[]],["尺码怎么选：它家尺码偏小，建议买大一码！比如平时穿 36.5，可以试 240（约 37 码）。高筒雪地靴的腿围很小，只适合瘦腿女生。",[]],["关于磨损：真皮材质（尤其是浅色款）可能会有轻微掉色或划痕，属于正常现象，日常穿注意保养即可。",[]],["检查瑕疵：有博主反馈品牌经历涨价后性价比一般，且偶尔会有皮质瑕疵。结账前一定要仔细检查鞋子是否有划痕或胶水溢出。",[]]]},{"id":3090,"title":"Musinsa Store","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.60 「🛍️｜Musinsa Store」11:00-22:00",[]],["🕙11:00-22:00",[]]]},{"id":3092,"title":"Hetras","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.61 「✨｜Hetras」11:00-22:00",[]],["🕙11:00-22:00｜💳 微信支付宝✅",[]],["🛗1-2 层试香，B1 结账，3 层可以 DIY 定制镜面香膏（满一定金额或数量赠送）",[]],["退税方式：单笔消费满 15,000 韩元直接扣除退税金额，不需要去机场退税，非常省心。",[]],["【必买热门单品与香型推荐】",[]],["香水留香时间：他家的香水主打清新自然，留香时间相对较短（大概 3-5 小时），建议随身带个小瓶补香，或者多涂点身体乳打底。",[]],["戴银饰进店：去汉南洞店或圣水洞店，记得戴银饰！有时候能免费领香氛湿巾或小礼品。",[]],["DIY 香膏：在圣水洞店，买够一定数量（比如 5 支护手霜或满 7 万韩元）可以上 3 楼 DIY 镜面香膏，自己选味道和串链子，很有纪念意义。",[]],["Hotel Wood（酒店木质香）：招牌爆款！像五星级酒店大堂的高级木质香，沉稳干净，男女皆宜，留香持久。",[]],["Daisy（雏菊）：GD 同款！清新的雏菊与洋甘菊香，不甜不腻，自带少年感，非常清爽。",[]],["Flower Park（花店/花园）：原 Flower Shop 改名，清新的柠檬玫瑰混合茉莉，像初春街边的淡淡花香，不甜腻，盲买不出错。",[]],["Artist（艺术家）：淡淡的高级香，清甜花果香融合草木绿意，尾调转为温暖木质，适合喜欢“淡香”的人。",[]],["Jeju Saryeoni Forest（济州森林）：清新的柑橘混合木质香，像在森林里散步，非常适合做室内扩香或身体喷雾。",[]],["护手霜：单支大概 8000-9900 韩元，买 5 支以上通常能打折（约 7000 韩元/支），折合人民币才 30-40 元一支，非常适合买来当伴手礼送同事朋友。",[]]]},{"id":3106,"title":"Marylebone","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.62 *「🍽️｜Marylebone」12:00-20:00",[]],["🕙12:00-20:00｜💳 信用卡现金",[]],["Marylebone（메릴러번） 是一家“藏得很深但进去就不想走”的宝藏田园复古家居杂货铺！整栋两层小院充满欧式田园氛围，餐具、文创、宠物衣服应有尽有。",[]],["【楼层分布与必买推荐】",[]],["1F（餐具与文创杂货）：田园蕾丝白瓷、手工毛毡挂件、复古餐垫与桌布",[]],["2F（宠物服饰与更多家居）：宠物小衣服、香薰与装饰画",[]]]},{"id":3112,"title":"Aesop","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.63 「✨｜Aesop」11:00-21:00",[]],["🕙11:00-21:00｜https://kr.aesop.com",[]],["*建议线下试用之后去免税店买",[]],["关于香水：免税店的香水种类最全且折扣力度大，如果打算买 Aurner 或 Steorra 等香水，优先去机场免税店；如果只想试香，汉南洞和圣水洞的线下店体验更好。（29#干净红茶）",[]],["关于赠品：韩国线下门店的赠品非常大方，结账时可以直接询问店员“有没有什么小礼物或小样可以送”，通常都会有惊喜。",[]],["关于断货：热门单品（如 B3C 凝霜、天竺葵沐浴露）在免税店经常断货，如果免税店没买到，千万别死磕，直接去圣水洞或汉南洞的线下门店碰碰运气。",[]]]},{"id":3118,"title":"LE LABO","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.64 *「✨｜LE LABO」11:00-21:00",[]],["🕙11:00-21:00｜https://www.lelabofragrances.co.kr/",[]],["现场调香与刻字：Le Labo 的核心仪式感在于“现场慢调香”。在圣水洞店购买时，店员会现场调配并打印专属标签。刻字内容限制为字母+空格+字符（共 20 字以内），且首尔门店只能刻英文或韩文。",[]],["【购买攻略】",[]],["线下店（圣水/汉南）：50ml 约 198 美元（折合人民币约 1800 元），100ml 约 258 美元。满额可送小样，支持机场退税（7%）。",[]],["免税店（新世界/乐天）：如果有金卡折扣加上返点，100ml 可能 1400 元左右就能拿下，价格最香。但缺点是热门款（如 33、13）经常断货，且不能现场刻字。",[]],["一定要上皮试香：Le Labo 很多香水（尤其是 13 和 33）在试香纸和皮肤上的味道完全不同。13 刚喷出来可能有点冲或有金属味，但上皮融合体温后就是绝美的伪体香；33 刚喷有皮革味，后调檀香才出来。一定要喷在手腕上走几步，等中后调再决定。",[]],["关于留香时间：Le Labo 的淡香精（Eau de Parfum）留香一般在 4-8 小时左右，身体乳和护手霜的留香更久。建议香水喷在衣服内侧或头发上，留香会更持久。",[]],["关于首尔限定 28：这款是柠檬生姜前调搭配茉莉和雪松的清新花香调，非常清爽。如果在北村或圣水洞买不到，也可以去机场的仁川机场免税店（如 11 号登机口旁的乐天免税店）碰碰运气，有时机场价格更优且人少。",[]],["Le labo的玫瑰31和aesop的rozu都建议上个皮再考虑买，因为两个里面都有会被皮肤放大的胡椒味，驾驭不好就会变成大家口中的狐臭了…",[]]]},{"id":3128,"title":"MANOMOS","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.65 「👓｜MANOMOS」11:00-20:00",[]],["🕙11:00-20:00｜https://manomos.com/",[]],["设计师眼镜品牌 MANOMOS（마노모스） 确实是“韩星御用”的素颜神器！BTS、边佑锡、全圆佑、张员瑛 等爱豆和明星都在戴，不仅款式低调干净、超级显脸小，而且镜框极轻，戴久了也不会压鼻梁。",[]],["【必买爆款推荐】",[]],["价格区间：均价在1800 元左右",[]],["现场退税：支持机场退税。",[]],["配度数服务：店里可以验光测度数并加工镜片。",[]],["支付方式：支持信用卡，部分门店支持支付宝和微信",[]],["PRESI 系列（细框黑边设计）：最近超流行的细框加黑边设计，偏光镜片在不同光线下颜色会有变化。",[]],["REMI 系列（复古猫眼/椭圆框）：细长的猫眼设计线条利落，能提拉脸型；圆润的椭圆边框则超级温柔，非常修饰颧骨。",[]],["RAIN C4（宋慧乔同款）：白桃裸粉色墨镜，温柔又出片，是超级好的“出片神器”，适合搭配浅色系衣服。",[]],["豹纹款墨镜：完全不挑脸型，特别显脸小。",[]],["",["517.webp"]]]},{"id":3141,"title":"NYUNYU HOUSE","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.66 「🛍️｜NYUNYU HOUSE」10:00-22:45",[]],["🕙10:00-22:45｜💳 支付宝微信✅",[]],["退税方式：机场办理退税。",[]],["核对小票：结账后一定要现场核对商品数量和金额。",[]],["【楼层分布与逛法建议】",[]],["建议从下往上或从三楼往下逛，不容易漏掉好东西：",[]],["B1 DIY 手工区：圣水店独有！可以 DIY 串珠圆珠笔、果冻鞋、钥匙扣和帽子。",[]],["1F 眼镜墨镜",[]],["2F 包包帽子：包包、帽子和家居服",[]],["3F Gift Shop：有很多独立品牌的小玩意、文创杂货、精致发饰和生活小物件",[]],["【试衣与购物规则】",[]],["试衣取号：店里人气很旺，试衣服不能直接排，需要先在排队机取号，系统会通过邮件通知，页面会显示预计等待时间（通常 30 分钟起步），建议先取号再逛其他地方。",[]],["试衣限制：白色衣服不能试穿，每人一次最多试 3 件。",[]],["尺码注意：衣服码数大多是均码（F），身材偏胖的姐妹建议谨慎选择或提前试穿。",[]]]},{"id":3156,"title":"MUSINSA Empty","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.67 「🛍️｜MUSINSA Empty」11:00-22:00",[]],["🕙11:00-22:00｜💳 微信支付宝✅",[]],["【实用 Tips 与避坑】",[]],["试衣限制：试衣间一次只能拿 3 件衣服进去试。",[]],["找店员：店员主要在结账台和试衣间附近，如果想找特定尺码或款式，直接去问店员帮忙拿。",[]],["价格注意：这家店是买手集合店，部分海外品牌（如一些国内潮牌）在这里的溢价可能比较高，建议对比一下线上价格再决定。广州牌子国内卖600块钱的外套这里敢卖3000…淘宝旗舰店双十一卖500块钱的T恤这里敢卖2000…",[]],["🛍️paes的鞋：分趾鞋品牌，上脚舒适且显腿细。xhs也可以买，记得比价",[]],["【楼层分布与逛法建议】",[]],["这家店一共 4 层，建议从 1 楼慢慢往上逛：",[]],["1F 热门品牌集合 + 快闪专区",[]],["2F 男装专区 + 搭配区",[]],["3F 女装专区 + 打卡镜子区",[]],["4F 日本潮牌 + 小众设计师品牌：日本潮牌和韩国本土小众设计师品牌，还有香薰和摆件",[]]]},{"id":3169,"title":"Stand Oil","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.68 「👛｜Stand Oil」11:00-20:00",[]],["🕙11:00-20:00｜💳 微信支付宝✅｜https://standoil.kr/",[]],["【材质与实用 Tips】",[]],["纯素皮革（Vegan Leather）：品牌全线使用优质纯素皮革，非动物材质，环保且质感细腻。最大的优点是自重极轻、耐磨防水，不用担心传统皮包娇贵沉重的痛点。",[]],["关于染色：部分深色或亮皮款式（如红色、深棕色）在刚买时可能会有轻微浮色，建议初次穿着时避开浅色衣服（尤其是白色羽绒服），穿几次后通常会好转。",[]],["试背体验：店里的旋转包墙设计很好，可以随意拿起来试背。店员态度很好，如果需要帮忙拿特定颜色或尺码，直接问他们就行。",[]],["价格区间：大部分包包在 10万 - 15万韩元 左右（折合人民币大概 500 - 800 元）。",[]],["退税方式：不支持现场退税，结账时出示护照登记，一定要收好小票，离境时去机场办理退税",[]],["【必买热门包款推荐】",[]],["",["518.webp"]],["",["519.webp"]],["",["520.webp"]],["允真包（Breezy Bag）：韩星 许允真 带火的爆款，保龄球腋下包版型。容量惊喜，能装下雨伞、粉饼和手机，大象灰和黑色最百搭，红色最出片。",[]],["法棍包：线条流畅，自带复古千禧感，肩带可调节长度，可腋下可斜挎，搭配西装或连衣裙都很有气质。",[]],["流浪包：韩 保质期：DIY 的小克重产品没有添加强效防腐剂，建议买回家后尽快用完；如果是买成品，注意查看包装上的生产日期。",[]],["退税方式：单笔消费满 15,000 韩元开具退税单，离境时去机场扫描退税。",[]]]},{"id":3265,"title":"EQL","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.73 *「🛍️｜EQL」11:00-20:00",[]],["🕙11:00-20:00｜💳微信支付宝✅｜https://www.eqlstore.com",[]],["【楼层分布与逛法建议】",[]],["1F 潮流运动：运动户外和潮流品牌，比如 Satisfy、Goldwin、Outdoor Voices 等，适合喜欢机能风和户外穿搭的姐妹。",[]],["2F 韩系设计师女装：韩国本土设计师女装品牌，风格从清冷简约到甜酷休闲都有，试穿区很舒服，很多款式国内专柜都没有。",[]],["家居生活区：店里还穿插了很多家居摆设、香氛蜡烛、特色餐具和设计感小物件。",[]],["【必逛热门品牌】",[]],["Satisfy：韩国超火的跑步潮牌，设计感极强，衣服和配饰都很出片。",[]],["Goldwin：日本高端户外品牌，机能风与日常穿搭完美结合，质感无敌。",[]],["Negative Three：他家的 nt3 靴子（尤其是尖头高筒靴）是韩女必备，超级显腿细，但经常断码，去晚了可能就没货了。",[]],["black purple：酷酷的小众品牌，包包和针织帽很百搭，特卖会时价格超级香。",[]],["Damson Madder：少女可爱感的小牌，颜色丰富，车厘子元素很受欢迎。",[]],["【价格与退税攻略】",[]],["价格区间：包包和帽子大概在 5万 - 15万韩元（折合人民币 250 - 750 元）；衣服和鞋子大概在 10万 - 30万韩元（折合人民币 500 - 1500 元）",[]],["结账前核对：因为店里商品太多，结账时一定要仔细核对商品款式和金额，确认没问题再刷卡离开。",[]],["退税门槛：单笔消费满 15,000 韩元即可申请退税，同一家店尽量合并付款到一张收据上。",[]],["退税方式：支持现场开具退税单！离境时去机场扫描退税。",[]]]},{"id":3282,"title":"3hreeto8ighty","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.74 *「🛍️｜3hreeto8ighty」12:00-20:00",[]],["🕙12:00-20:00｜💳 微信支付宝✅｜https://3hreeto8ighty.co.kr/",[]],["【品牌简介及基本信息】",[]],["名字寓意：品牌名源于韩国习语“3岁时养成的习惯到80岁时还会影响着我们”，寓意产品具有长久的适用性和经典性，致力于打造从年轻到老都能穿的衣服，而非快时尚服饰。",[]],["设计调性：主打复古简约和韩系松弛感，整体以黑白灰为主，偶尔有彩色点缀。版型和细节带有小设计，个性但不夸张，日常通勤或出游都能驾驭。",[]],["特色：门店在二楼，入口有点隐蔽，需要坐电梯上二楼。",[]],["价格区间：鞋子大概在 20万韩元左右（折合人民币 1000 元出头）；衣服大概在 3万 - 5万韩元（折合人民币 150 - 250 元）；配饰如袜子、手机壳等几十元就能买到。",[]],["折扣方式：没有退税，但凭护照可以直接打 9折，结账时记得主动出示护照。",[]],["【必买热门单品推荐】",[]],["尺码偏大：他家的鞋子普遍偏大，建议买大一码，或者搭配内增高垫。比如平时穿运动鞋 240 的，穿他家 240 可能刚好，但如果是尖头鞋，脚宽的姐妹建议往大拍一拍。",[]],["鞋底偏硬：部分鞋子（如猫爪鞋）鞋底比较硬，穿久了可能会脚疼，建议试穿时多走几步，或者买回来后自己垫个软垫。",[]],["后跟磨损：部分做旧款靴子的后跟皮太长，踩在地上容易磨损，买的时候要注意试穿感受。",[]],["衣服臀围偏窄：部分短裙或裤子的臀围设计偏窄，试穿时注意是否卡臀，不要只看腰围。",[]],["猫爪鞋：他家的招牌爆款！又酷又可爱，鞋底带点高跟，上脚很显腿细。不过鞋底稍微有点硬，穿久了可能会累，建议试穿时多走几步感受一下。",[]],["尖头短靴：设计感超强，鞋头可以折下来当半靴，也可以放起来当长靴，一鞋两穿。尖头设计很显腿长，搭配短裤长裤都好看。",[]],["黑色反光长靴：材质是反光黑，滑滑的，自带内增高，完全遮小腿肉，小个子穿也超显腿细。",[]],["芭蕾厚底机能鞋：Jennie 在演唱会上穿火的款式，厚底设计显高，机能风十足，搭配裙子或裤子都很出片。",[]],["设计感上衣：比如蝴蝶结 T 恤、带系绳的卫衣、露肩膀猫咪 T 等，版型很好，穿起来舒服又酷酷的。",[]],["工装裤与阔腿裤：版型做得很好，修饰比例，搭配短款上衣或羽绒服都很显腿长。",[]]]},{"id":3301,"title":"🛍️：POTTERY","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.75 *「🛍️：POTTERY」💙10:00-21:00",[]],["🕙10:00-21:00｜💳 微信支付宝✅｜https://www.ptry.co.kr",[]],["【品牌简介】",[]],["设计调性：主打 90 年代复古松弛感和极简基础款。没有花里胡哨的设计，但非常注重衣服的“핏（Fit）”——也就是穿在身上的线条感。",[]],["适合人群：喜欢简约、追求质感、不想穿得太夸张，或者想给男朋友/老公挑基础款的人。",[]],["价格区间：T 恤大约 8万 - 12万韩元（折合人民币 400 - 600 元）；衬衫 15万韩元左右（折合人民币 750 元）；针织衫 20万韩元左右；外套 30万韩元以上。",[]],["退税方式：支持现场开具退税单！离境时去机场扫描退税。",[]],["尺码注意：裤子可能会稍微有一点长，建议试穿时注意裤长；整体版型偏经典大气，不是那种特别紧身或特别 Oversize 的风格。（他家的衣服都不是长款或特别宽松的版型，只有两个码（1 和 2 码），小个子女生去试试可能会很惊喜。）",[]],["【必买热门单品推荐】",[]],["经典白衬衫：他家的招牌！剪裁非常利落，面料有质感，单穿或当外套都很高级，15万韩元左右就能买到很好的基础款。",[]],["西装外套：版型绝了，不挑身材，上身自带慵懒又干练的气质，搭配宽裤或裙子都好看，适合通勤或约会。",[]],["针织衫：女生针织大概在 20万韩元左右，有一件短袖针织只要 9万韩元，性价比超高。面料柔软轻薄，叠穿 T 恤或单穿都很出彩。",[]],["宽裤与工装裤：面料和剪裁都很优秀，修饰比例，搭配短款上衣或羽绒服都很显腿长。男生穿也超级帅。",[]],["男士基础款：他家的男装比女装更多一些，T 恤、衬衫、裤子都很适合上班穿，是男生基础款的天堂。",[]]]},{"id":3315,"title":"OOTJ","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.76 「👖｜OOTJ」11:30-21:30",[]],["🕙11:30-21:30｜💳 微信支付宝✅",[]],["价格区间：非常亲民！均价在 3万 - 7万韩元（折合人民币 150 - 350 元），短裤大概 200 多元，长裤 300 元左右，性价比极高。",[]],["退税方式：机场退税。",[]],["支付方式：支持韩币现金、信用卡、支付宝和微信，对中国游客非常友好。",[]],["【必买热门神裤推荐】",[]],["柳智敏同款微喇裤：最近超火的爆款！后面的口袋设计超级显翘臀，掐腰+大裤脚，上身显腰细、腿超长，有蓝色和灰色可选。",[]],["弯刀裤/香蕉裤：韩系爆款，裤腿不规则剪裁，遮胯藏肉一绝，休闲百搭，随便搭件短上衣就是韩系辣妹。",[]],["高腰直筒拖地裤：经典显瘦，面料有垂感，日常通勤或上课都能穿，170+ 的高个子女生穿出来就是超模既视感。",[]],["翻边设计感牛仔裤：今年很流行的翻边设计，前面有抽绳可以收紧腰身，自带设计感，搭配短款上衣露出腰头细节非常洋气。",[]],["做旧破洞短裤：美式复古风，中腰设计，S码最小腰围也很宽松，夏天穿超级火辣。",[]],["【尺码与避坑 Tips】",[]],["裤长偏长：他家的裤子基本都是拖地裤风格，裤长非常长。165cm 以上的高个子女生穿会非常好看；160cm 以下的小个子女生可能需要穿厚底鞋，或者接受去店里裁剪裤长。",[]],["尺码偏大：整体版型偏宽松，腰围通常在 72-78 左右。平时穿 S 码的姐妹，在他家可能穿 S 甚至觉得宽松，建议多试几个码数。",[]],["试衣间体验：试衣间很多且风格各异，一次可以拿很多件去试，店员也会热情帮忙找尺码。",[]],["男款很少：店里主要是女款，只有很小一个区域有男款牛仔裤，男生去的话款式选择不多。",[]]]},{"id":3331,"title":"MIFFY米菲专卖店","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.77 「🐰｜MIFFY米菲专卖店」10:30-19:30",[]],["🕙10:30-19:30",[]],["【必买热门单品推荐】",[]],["首尔限定牛仔米菲：他家的招牌爆款！牛仔帽+背带裤的米菲，别处很难买到。有白皮、黑皮和焦糖色可选，挂件大概 18,000 韩元（约 95 元人民币），大玩偶大概 35,000 韩元（约 167 元人民币）。",[]],["烤焦吐司米菲：棕乎乎的面包兔子，软萌到不行，非常适合做钥匙扣或挂件。",[]],["联名文具与家居好物：每一支笔、杯垫、餐具、小电风扇都可爱到犯规，价格也很亲民，几千韩币起步，非常适合挑伴手礼。",[]],["超大只毛绒玩偶：抱住就不想撒手，适合送朋友或自己收藏。",[]],["",["531.webp"]]]},{"id":3340,"title":"Sienne","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.78 「🛍️｜Sienne」12:00-19:30",[]],["🕙12:00-19:30｜💳 微信支付宝✅｜https://sienneboutique.com",[]],["【品牌简介】",[]],["设计调性：韩女私藏温柔的“法式复古”宝藏店！主打法式复古与温柔韩系风的结合。色彩运用非常大胆且高级，很多意想不到的配色让人眼前一亮，但上身又非常日常。（高性价比，款式一般）",[]],["适合人群：喜欢简约、追求质感、想要穿出温柔高级感，或者想给男朋友挑基础款的姐妹。",[]],["价格区间：整体均价在 5万 - 15万韩元（折合人民币 250 - 750 元）",[]],["退税方式：现场开具退税单。离境时去机场扫描退税。",[]],["面料特性：部分衬衫和针织面料虽然质感好，但容易有轻微褶皱或起球，买回家后建议轻柔手洗或干洗，不要用力搓揉。",[]],["尺码注意：他家的版型大多偏宽松（Oversize），小个子和高个子都能穿好看。如果不习惯太宽松的，可以试穿小一码。",[]],["【必买热门单品推荐】",[]],["",["532.webp"]],["",["533.webp"]],["60支棉Oversize衬衫：他家的招牌！深棕色和绿色非常显白，面料不易起皱，袖子长长的穿或者卷起来都好看，搭配牛仔裤或塞进裙子里都很高级。",[]],["工装裤：细节做得非常棒，版型修饰比例，搭配短款上衣或羽绒服都很显腿长。",[]],["羊驼毛混纺针织：秋冬必入！50%羊驼毛含量，暖和柔软不扎人，珍珠纽扣设计经典耐看，叠穿在褶皱 Tee 外面非常优雅。",[]],["蕾丝背心：强推的内搭单品！单穿或当内搭都很不错，不会透副乳，设计感满满。",[]],["玫瑰花半身裙：腰围是皮筋设计，包容度很高，内衬有弹性，搭配针织或风衣都很优雅。",[]],["设计感丝巾：配色绝美，虽然实物颜色可能比图片深一点，但戴上非常提升整体穿搭的质感。",[]]]},{"id":3358,"title":"Postes","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.79 「📮✨｜Postes」11:00-20:00",[]],["🕙11:00-20:00｜💳 微信支付宝✅",[]],["【必买热门香水推荐】",[]],["他家的香水全用城市命名，每一款都代表那个城市的独特香味，盲买也不容易踩雷：",[]],["From Otaru 小樽：最火的招牌款！清新的白茶香，像刚洗好的白衬衫晒过太阳，最后留下一点温柔的麝香，超级耐闻，男女皆宜。",[]],["From Manhattan 曼哈顿：清冷干净的皂香，前调柠檬胡椒很清爽，中段牡丹茉莉温柔，尾调檀香麝香沉稳，不甜不腻，非常适合做中性香。",[]],["From Istanbul 伊斯坦布尔：很多博主推荐的 Le Labo 29 平替！无花果加红茶的味道，比 29 更柔和，带点猫猫图案的包装也很治愈，非常适合女生。",[]],["From Amalfi 阿马尔菲：明亮的柑橘调，橙子和橙花的组合特别有活力，像南法海岸吹来的风，非常适合夏天。",[]],["From Saint-Tropez 圣特罗佩：薰衣草香调，味道高级不撞香，留香时间也比较长。",[]],["【超浪漫的明信片邮寄体验】",[]],["这是 Postes 最让人心动的设计，一定要体验一下：",[]],["免费试香明信片：进店可以拿一张免费的明信片，喷上你喜欢的香水试香。",[]],["真的可以寄出：写下心里的话和地址，投进门口复古的油桶邮筒里，店家真的会帮你寄出去（全球邮寄，大概一个月左右送达，而且没有邮费！）。",[]],["邮局式打包：买完香水后，店员会像邮局工作人员一样，帮香水称重、盖上专属油戳，仪式感满满。每瓶香水还会附赠对应城市的明信片。",[]],["【价格与折扣攻略】",[]],["价格区间：单瓶香水大概在 6万 - 8万韩元（折合人民币 300 - 400 元）",[]],["退税方式：支持现场开具退税单，离境时去机场扫描退税。。",[]]]},{"id":3375,"title":"The tis","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.80 *「🛍️👗｜The tis」11:00-20:00",[]],["🕙11:00-20:00｜💳 微信支付宝✅｜https://thetisofficial.com",[]],["【品牌简介与Tips】",[]],["设计调性：主打法式浪漫与芭蕾少女风的结合。以女性的浪漫想象为核心灵感，大量运用蕾丝、网纱、蝴蝶结和立体褶皱设计，自带千金贵气感，又不会觉得用力过猛。",[]],["明星同款：张元英、李瑞、IU、金冬天、朴敏英 等很多女明星在活动和私服中都穿过他家的衣服，是妥妥的“爱豆同款”收割机。",[]],["价格区间：整体偏贵，属于小众设计师品牌。上衣大概在 10万 - 20万韩元（折合人民币 500 - 1000 元），连衣裙和外套大概在 20万 - 40万韩元（折合人民币 1000 - 2000 元）。",[]],["退税方式：支持现场开具退税单，离境时去机场扫描退税。",[]],["试穿限制：周末试穿每人每次最多 2 件，同款商品不分颜色，每人最多购买 2 个。",[]],["尺码偏小：他家的版型整体偏瘦，160cm/105 斤的女生可能都要穿 M 码。",[]],["面料注意：部分纱裙和蕾丝面料可能会偏硬、偏扎，或者比较热，试穿时注意感受舒适度。",[]],["【必买热门单品推荐】",[]],["蕾丝一字肩上衣：他家的招牌爆款！胸前有胶条和胸垫设计，不用穿内衣也很舒服，搭配蓬蓬裙就是妥妥的在逃公主。",[]],["天鹅绒拼接白纱连衣裙：超级公主的一条裙子！下摆是撑起来的 V 型蓬蓬裙，非常显腰细，适合婚礼、生日派对或重要场合穿。",[]],["蝴蝶结棒球服外套：背后有珍珠设计，甜美又带点休闲感，日常通勤或约会穿都很出片。",[]],["收腰斗篷小外套：黑白两色可选，带毛毛装饰，英伦风又贵气，秋冬搭配连衣裙或牛仔裤都很绝。",[]],["蕾丝短裙：轻盈的蕾丝材质，搭配简单修身的上衣，保留少女感的同时又有点随性和精致，小个子女生穿超好看。",[]]]},{"id":3391,"title":"Daniel's truth","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.81 「✨｜Daniel's truth」11:00-14:30/17:00-21:30",[]],["🕙11:00-14:30、17:00-21:30｜💳 微信支付宝✅｜https://www.danielstruth.com/",[]],["【品牌核心特色】",[]],["无酒精精油香水：采用植物基底油融合香精，不含酒精，所以不刺激皮肤，可以涂在手腕、耳后甚至发尾。",[]],["滚珠设计：10ml 的滚珠瓶身非常有分量感，补香方便，放在包里随时拿出来滚两下，颜值极高。",[]],["可颂叠香：店里的灵魂玩法！把两种以上的香油叠加使用，调出专属于自己的香味。",[]],["价格区间：10ml 滚珠香水原价约 59,000 - 63,000 韩元（折合人民币约 300 - 320 元）。",[]],["退税方式：支持现场开具退税单，离境时去机场扫描退税。",[]],["不要当场下单：精油香水的前调和后调差异可能比较大，有些香在店里闻很绝，回家试香后才发现后调浮出皂感。建议先试香，拿试香卡走一圈，或者等第二天再决定。",[]],["避开衣服和包包：精油香水虽然不刺激皮肤，但不适合涂在衣服或包包上，可能会留下油渍或染色，只涂在皮肤和发尾即可。",[]],["注意漏液问题：有博主反馈滚珠瓶如果长时间平放可能会轻微漏液，建议买回来后竖立存放。",[]],["关注限定款：圣水店有独家发售的限定香型。",[]],["【必买热门香型推荐】",[]],["Bombshelluth（边伯贤同款）：招牌爆款！芍药加上紫色果皮精油，带一点清新的皂感，柔和又讨喜，是那种温柔低调、没有攻击性的伪体香。",[]],["Blue Sage Blossom：重度草木控必入！潮湿森林、植物根茎、海盐气息混在一起，干净又野生，是男女都能喷的中性香，自带阳光白衣少年感。",[]],["Forest & Soul：前调的花香甜味退下去后，木质调慢慢出来，不是冷硬的木头味，而是带点温柔的厚重感，越闻越喜欢，属于“后劲很大”的香。",[]],["Daniel's Aquarius：圣水店限定香！佛手柑的清爽与洋槐花、保加利亚玫瑰相遇，仿佛在盛开花朵的海岸边野餐，清冷又慵懒，非常舒服。",[]],["Olive Ridge：清新的柑橘木质调，不甜腻，非常自然，适合日常通勤或伪素颜时使用。",[]],["Jasmine Grove：Justin Jay 同款。清新的茉莉花香，带着一点绿意，非常干净清爽，适合夏天或日常通勤。",[]],["Daniel's Libra：同样是 Justin Jay 推荐款，带有淡淡的木质调，比纯花香更有层次感，不甜腻，很有高级感。",[]]]},{"id":3412,"title":"Musinsa Standard","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.82 「🛍️｜Musinsa Standard」💙11:00-22:00",[]],["🕙11:00-22:00｜💳 微信支付宝✅",[]],["韩国人私藏的“平价版优衣库”！",[]]]},{"id":3415,"title":"Low Classic","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.83 *「🛍️｜Low Classic」（周五休息）12:00-20:00",[]],["🕙12:00-20:00｜💳 微信支付宝✅｜https://www.lowclassic.com",[]],["Low Classic 被誉为“韩国 Celine”和 Lemaire 平替，主打极简廓形和高级面料感，",[]],["【品牌简介】",[]],["设计调性：2009 年创立于首尔，以“低调的经典”为核心理念。主打现代极简主义，利落剪裁、宽松廓形、中性色调，平衡了东方内敛与西方简约，是 25-40 岁女性及韩系女主穿搭的首选。",[]],["江湖地位：被媒体誉为“韩国 Celine”，也是公认的 Lemaire 和 Jil Sander 平替。Jennie、IU、欧阳娜娜 等明星都多次上身。",[]],["楼层分布：",[]],["1F（副线 LC）：主打休闲美式风格，价格更亲民，有很多基础打底衫和年轻化的单品。",[]],["2F（主线 Low Classic）：空间更有质感，衣服结构感更强，针织衫、皮夹克、风衣和包包都在这层，是逛的重头戏。",[]],["【必买热门单品推荐】",[]],["试穿注意：部分风衣和长款外套对小个子不太友好，160cm 以下的姐妹建议试穿时搭配厚底鞋；尺码整体偏宽松，如果不习惯太宽松的可以试穿小一码。",[]],["面料特性：部分针织打底衫弹性很好但容易勾丝，穿脱和日常活动时要注意避免碰到尖锐物品；部分镂空或重工工艺的衣服尺码比较迷，一定要亲自试穿。",[]],["极简风衣：他家的灵魂单品！直线剪裁，廓形松弛但不邋遢，卡其色和灰调米色闭眼选都不会错。上身自带冷淡、知性的高级感，和 Lemaire 相似度极高但价格更温柔。",[]],["垂感半裙：褶子非常利落，面料垂坠感极佳，退税前 22 万韩元左右，性价比超高。",[]],["真皮皮夹克：2000 元左右用到真皮，非常有性价比，肩宽腰细的设计，适合喜欢强气场的姐妹。",[]],["长款风衣外套：面料轻盈，但 160cm 以下的小个子可能会觉得有点撑不起来。",[]],["包包：今年超火的款式，肩带长度刚好，160cm 身高背也很合适，有大小号可选，非常百搭。",[]],["【价格与折扣攻略】",[]],["价格区间：T 恤和打底衫约 8万 - 12万韩元（折合人民币 400 - 600 元）；衬衫约 15万韩元；针织衫约 20万韩元；外套和风衣约 30万韩元以上。",[]],["专属折扣：衣架上有贴蓝色或红色标签的都是打折款。",[]],["退税方式：支持现场开具退税单，离境时去机场扫描退税。",[]]]},{
