.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.95 「🧴｜Orgredients」11:00-20:00",[]],["🕙11:00-20:00",[]],["【价格与退税攻略】",[]],["价格区间：黄油乳液大概 2万 - 3万韩元（折合人民币 100 - 150 元），面膜和喷雾大概 1万 - 2万韩元，整体性价比在韩妆里算很高的。",[]],["退税方式：结账时出示护照登记，一定要收好小票，离境时去机场扫描退税。",[]],["支付方式：支持韩币现金、信用卡、支付宝和微信，对中国游客非常友好。",[]],["【进店“薅羊毛”福利攻略】",[]],["这家店最大的亮点就是不买东西也能领正装，任务超级简单：",[]],["免费领正装：进店后填写问卷 + 关注官方 Instagram（或小红书），工作人员就会直接发给你一个品牌防水托特包 + 一支 80ml 皮肤屏障舒缓乳液（正装）！",[]],["Ongre Skin Scoop 铲铲乐：花 9,900 韩元（约 45 元人民币）购买体验券，凭小票给工作人员看，限时 10 秒钟用铲子铲乳液，铲到多少就能带走多少，有时候工作人员还会睁一只眼闭一只眼让你多铲两秒，非常解压！",[]],["Ongre Factory 抓娃娃机：付款后体验抓娃娃机，有机会直接抓走正装。",[]],["二楼美甲体验：店里二楼还提供美甲体验服务，逛累了可以顺便做个指甲。",[]],["【必买热门单品推荐】",[]],["黄油修护乳液（妆前乳）：他家的灵魂爆款！质地像黄油一样丝滑，上脸秒化水。微黏的状态能让后续粉底巨贴妆，一整天都不浮粉不卡粉。",[]],["小蓝乳与小黄乳：小蓝乳是清爽版，适合油皮、混油皮和痘痘肌；小黄乳是滋润保湿版，适合干皮、混干皮和敏感肌。",[]],["黄油奶皮面膜：膜布像奶皮一样软 fufu 地扒在脸上，精华超多，敷完皮肤像水煮蛋一样嫩，妆前急救或者晒后修护都绝了。",[]],["爱心喷雾：包装可爱，补水保湿，适合随身带着随时补水。",[]]]},{"id":3627,"title":"EPT","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.96 「👟｜EPT」💗11:00-20:00",[]],["🕙11:00-20:00（周五-日21:00）｜💳 微信支付宝✅｜https://ept.kr/",[]],["韩国特产“德训鞋”，脚感是“踩屎感”，黑白款最经典。",[]],["【楼层分布与逛法建议】",[]],["1F 鞋履与配饰区：一楼是重头戏！各种款式的鞋子、帽子、包包全都有。德训鞋、厚底帆布鞋、芭蕾休闲鞋、复古跑鞋全线配齐，还有李泰容同款海报和专属打卡区。",[]],["2F 服饰与仓库区：二楼是衣服和配饰区，T恤、衬衫、外套、帽子都有。二楼仓库做成透明玻璃设计，工业风满满，拍照很出片。",[]],["价格区间：鞋子退完税大概在 600 元人民币左右，T恤和帽子大概 1万 - 2万韩元（折合人民币 50 - 100 元），衣服大概 3万 - 5万韩元。整体性价比在潮牌里算很高的。",[]],["退税方式：支持现场退税。结账时出示护照登记，一定要收好小票，离境时去机场扫描退税。",[]],["支付方式：支持韩币现金、信用卡、支付宝和微信，对中国游客非常友好。",[]],["【必买热门单品推荐】",[]],["尺码建议：鞋子建议按平时穿的尺码购买，部分款式会稍微宽松一点点；如果不确定，一定要在店里试穿两只再买单。",[]],["",["586.webp"]],["",["587.webp"]],["",["588.webp"]],["",["589.webp"]],["德训鞋：他家的灵魂爆款！采用 DSI 双重软充设计，真皮用料扎实，版型利落不显臃肿，防滑减震，暴走首尔上万步都不累脚。",[]],["厚底发泡帆布鞋：轻盈又透气，自带一点点增高效果，夏日百搭，搭载 EPT 专属鞋垫，男女同款，尺码和配色都很全。",[]],["芭蕾玛丽珍运动鞋：马卡龙色系超级可爱，甜酷风拿捏得死死的，穿在脚上显脚小，搭配裙子或牛仔裤都好看。",[]],["oversize T恤与帽子：衣服版型简约街头风，日常百搭都不出错，和男友一起买情侣风特别适合；帽子小韩人手一顶，显脸小又出片。",[]],["*关注断货：热门颜色（如脏粉色、马卡龙色系）和常见尺码在秋冬季节很容易 sold out，看中喜欢的直接让店员拿全新的，别犹豫。",[]]]},{"id":3647,"title":"MOONSUN","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.97 *「🛍️｜MOONSUN」12:00-20:00",[]],["🕙12:00-20:00｜💳 微信支付宝✅｜https://moon-sun.co.kr/",[]],["松弛简约都市风。2楼是 SATUR，也是一个超好逛的韩国秋冬衣橱品牌。",[]],["【必买热门单品推荐】",[]],["灰色波点针织：秋冬必备单品，配上毛毛半身裤复古感拉满，版型超好，不挑身材。",[]],["蓝色机能风外套：条纹衬衫设计配上内里棉花，柔软又温暖，剪裁精致，把男性化和女性化轮廓融合得恰到好处。",[]],["黑色机能风皮衣：又酷又辣，版型利落，搭配牛仔裤或半裙都很绝，是打造甜酷风的利器。",[]],["浅蓝条纹衬衫：棉服融合男性化与女性化的轮廓，日常休闲又巨百搭，谁穿谁好看。",[]],["羊毛混纺提花毛衣：摸起来舒服还耐穿，设计感满满，不撞款，适合追求质感的姐妹。",[]],["【价格与退税攻略】",[]],["价格区间：属于韩国中高端设计师线，专柜单品千元上下。T恤/针织大概在 9万 - 15万韩元（折合人民币 450 - 750 元）；衬衫/外套大概在 15万 - 25万韩元（折合人民币 750 - 1250 元）；毛衣和皮衣大概在 1000 元人民币左右。",[]],["退税方式：单笔消费满 3 万韩元即可退税，离境时去机场扫描退税。",[]]]},{"id":3659,"title":"MAC MOC","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.98 「🥿｜MAC MOC」💗11:30-20:00",[]],["🕙11:30-20:00｜💳 微信支付宝✅｜https://www.macmoc.com/",[]],["主打“舒适设计 + 合理价格”，鞋子自重轻、鞋底软，上脚像踩在云朵上一样舒服，而且款式超级多",[]],["【价格与退税攻略】",[]],["价格区间：鞋子均价在 10万韩元左右（折合400 - 500 元），包包和配饰大概 1万 - 5万韩元。",[]],["退税方式：单笔消费满 3 万韩元即可退税，离境时去机场扫描退税。",[]],["【必买热门单品推荐】",[]],["尺码偏小：他家的鞋子码数偏小半码，建议买大一码。比如平时穿运动鞋 36 码（235mm），买他家可能得拿 37 码（240mm）。一定要亲自试穿，不要盲目按平时码数买。",[]],["关注断货：热门颜色（如米色、咖色、豹纹）和常见尺码在秋冬季节很容易 sold out，看中喜欢的直接让店员拿全新的，别犹豫。",[]],["",["590.webp"]],["",["591.webp"]],["",["592.webp"]],["",["593.webp"]],["",["594.webp"]],["",["595.webp"]],["",["596.webp"]],["",["597.webp"]],["",["598.webp"]],["",["599.webp"]],["",["600.webp"]],["",["601.webp"]],["",["602.webp"]],["雪地靴与毛毛靴：秋冬绝对的王牌！里面绒很厚但不闷，鞋型不笨重，穿起来软乎乎的。蝴蝶结点缀的款式超级少女，搭配大衣或羽绒服绝了。",[]],["玛丽珍鞋与厚底单鞋：他家的招牌设计！低饱和色系（米色、咖色、黑色）超级百搭，鞋底软且不累脚，厚底款还能悄悄显腿长。",[]],["花朵系列包包：比如 JOLMANG 托特包，把品牌标志性 Logo 和花朵元素完美融合，绗缝材质摸起来质感超高级，而且巨轻便，装得下电脑和补妆包。",[]],["巴拉克拉法帽与手套围巾：今年超火的款式！质感软糯，颜色好看，搭配雪地靴就是妥妥的“雪地天使”，非常适合买来当伴手礼。",[]],["STAYC 联名系列：如果赶上联名活动，买周边还会随机送 2 张 Photo Card 小卡，追星女孩千万别错过！",[]]]},{"id":3688,"title":"LCDC","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.99 「🛍️｜LCDC」11:00-20:00",[]],["🕙11:00-20:00（4F 9-17）｜💳支付宝微信✅｜",[]],["特色：LCDC 的名字来自 Le Conte Des Contes（故事里的故事），整体空间设计极简柔和，像美术馆一样。这里不仅是一个服装买手店，更是一个集合了咖啡、香氛、文创和生活方式品牌的复合空间。",[]],["【楼层分布与逛法建议】",[]],["这栋楼每一层都有不同的小店和快闪，建议从 1 楼慢慢往上逛，像拆盲盒一样：",[]],["1F 咖啡与快闪：一楼有一家邮政主题咖啡店 Café Ephemera，空间很大，适合逛累了坐下来休息。旁边还会有不定期的香氛或生活方式品牌快闪（比如 FRA 422 香水快闪）。",[]],["2F 服装买手店（潮人风格）：这里是 SHOP LCDC 的主场！除了 LCDC 品牌自己的最新系列，还汇集了 ASHLEY WILLIAMS、GIMAGUAS、HOMMEGIRLS 等海外和韩国本土设计师品牌。衣服按色系和风格陈列，试衣间灯光很好，随便拍都出片。",[]],["3F 文创与精品盲盒：一进门以为到了学校走廊，每一扇门后都是一个独立小空间！有 ALEXANDRE DE PARIS（法国高级发饰韩国首店）、Geulwoll（浪漫写信体验）、DEWY DESERT（手工首饰）、APOTEKA SOUL（韩国本土草本茶）等，审美极佳，非常适合作伴手礼。",[]],["4F 早午餐与甜点：逛累了可以直接上四楼吃个早午餐或甜点，补充体力再继续逛。",[]],["价格区间：作为买手集合店，价格跨度较大。设计师品牌单品大概在 8万 - 25万韩元（折合人民币 420 - 1325 元），T 恤和基础款大概 3万 - 5万韩元。",[]],["退税方式：单笔消费满 3 万韩元即可退税，离境时去机场扫描退税。",[]]]},{"id":3699,"title":"This is never that","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.100 *「🛍️｜This is never that」11:00-20:00",[]],["🕙11:00-20:00",[]],["主打 90 年代街头复古风，男女同款的设计让情侣装和闺蜜装非常好搭。",[]],["【楼层分布与逛法建议】",[]],["3F 圣水旗舰店：这是 TNT 的主场！衣服、帽子、包包、鞋子全都有。按色系和款式陈列，试衣间灯光很好，随便拍都出片。",[]],["2F Khakis 旗舰店：就在同一栋楼的二楼，也是超好逛的买手店和潮牌集合店，选品很有品味，可以安排在一起一站式打卡。",[]],["【避坑与实用 Tips】",[]],["尺码注意：他家的版型偏 oversize，尺码偏大。如果不想穿得太宽大，可以试穿小一码；男生正常码穿就刚好。",[]],["价格区间：T 恤大概 8万韩元左右（折合人民币 400 多元），卫衣大概 12万韩元（折合人民币 650 元左右），外套和羽绒服 20万韩元以上。整体比国内代购便宜 30% 左右。",[]],["退税方式：结账时出示护照登记，离境时去机场扫描退税。",[]]]},{"id":3709,"title":"Onion","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.101 「☕️｜Onion」9:00-21:30",[]],["🕙9:00-21:30",[]],["【逛店与避坑小贴士】",[]],["周末下午基本都要排长队。建议工作日下午去，或者错峰在早上 9 点刚开门、傍晚 5 点左右去。",[]],["注意菜单：部分门店没有中文菜单，建议先自己看面包再排队点咖啡结账。",[]],["人均消费：大概 50 元人民币左右（一杯咖啡 + 一个面包），在网红店里性价比算不错的。",[]],["支付方式：只能刷信用卡或准备韩元现金，建议备好现金或信用卡。",[]],["自助收餐盘：韩国咖啡店通常需要自己收餐盘，喝完咖啡记得把垃圾和餐具拿到指定回收处。",[]],["【必点招牌面包与咖啡】",[]],["Pandoro雪山面包：进店必点招牌！像小雪山一样裹满糖霜，面包体软绵拉丝，甜而不腻。",[]],["红豆黄油面包：老客必点，咸香黄油配绵密红豆，口感层次很绝，搭配咖啡刚刚好。",[]],["季节限定无花果可颂：酸甜的无花果配奶油，外皮酥脆，是季节限定的惊喜，遇到一定要尝尝。",[]],["开心果可颂：外皮酥脆，内馅坚果香浓郁，喜欢坚果口味的朋友千万别错过。",[]],["基础冰美式：中深烘坚果风味，偏酸但很清爽，搭配甜面包刚好解腻。",[]]]},{"id":3723,"title":"KIRSH","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.102 「🛍️｜KIRSH」💗10:30-20:30",[]],["🕙10:30-20:30｜💳 微信支付宝✅｜https://kirsh.co.kr",[]],["【逛店与避坑小贴士】",[]],["注意尺码：它家部分单品版型偏宽松，但有些修身款对身材有一定要求。建议亲自去试衣间上身试试。",[]],["核对账单：有博主反馈结账时偶尔会被多收钱，建议自己先算好总价，结账时仔细核对小票再付款。",[]],["折扣活动：圣水店 2 楼折扣区经常有最高 78% OFF 的活动，部分商品低至 2 折。",[]],["当场退税：单笔满 15,000 韩元即可当场退税！结账时主动出示护照原件，直接付免税价。",[]]]},{"id":3730,"title":"Matin Kim","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.103 「🛍️｜Matin Kim」💙💞11:30-20:00",[]],["🕙11:30-20:00｜💳 微信支付宝✅｜https://matinkim.com/",[]],["【价格与退税攻略】",[]],["价格区间：包包退完税大概在 600 元人民币左右，T 恤和帽子大概 1 万 - 2 万韩元（折合人民币 50 - 100 元），衣服大概 3 万 - 5 万韩元，外套 20 万韩元以上。",[]],["退税方式：单笔消费满 3 万韩元即可退税，离境时去机场扫描退税。",[]],["尺码注意：他家的版型偏 Oversize，尺码偏大。如果不想穿得太宽大，可以试穿小一码；男生正常码穿就刚好。",[]],["【楼层分布与逛法建议】",[]],["1F 包包与配饰区：一楼是重头戏！各种款式的包包、帽子、围巾全都有。黑武士包、褶皱包、灰色尼龙双肩包基本都能在这里找到，还可以直接试背感受容量。",[]],["2F 女装与试穿区：二楼是衣服区，T 恤、针织衫、外套、牛仔裤都有。按色系和款式陈列，试衣间灯光很好，随便拍都出片。",[]],["3F 男装区：三楼是男装区，男女同款的设计让情侣装和闺蜜装非常好搭，版型偏 Oversize，男生穿也超级帅。",[]],["【必买热门单品推荐】",[]],["",["603.webp"]],["",["604.webp"]],["",["605.webp"]],["",["606.webp"]],["",["607.webp"]],["",["608.webp"]],["",["609.webp"]],["",["610.webp"]],["",["611.webp"]],["",["612.webp"]],["",["613.webp"]],["",["614.webp"]],["",["615.webp"]],["",["616.webp"]],["黑武士包：他家的灵魂爆款！大号容量超好，能轻松装下笔记本电脑和补妆包，虽然有点沉但质感无敌，黑色最百搭。",[]],["皱褶包：容量不输黑武士，在黑色和白色之间犹豫的话，推荐选白色，更特别更好看，皮质质感在线。",[]],["Logo 针织外套：黑白配色很简单，但辨识度很高，配牛仔裤或黑裤都不会出错，韩币 19 万 8 千左右，折合人民币 900 多，性价比很高。",[]],["复古鸭舌帽：比如棕绿复古配色，超级百搭，不压耳朵，显脸小，很多韩女人手一顶，大概 1 万多韩元，性价比极高。",[]],["黑色垃圾袋外套：非常厚实保暖，袖口有精致的 Logo 设计，内兜还有拉链，放手机和身份证完全不怕丢，高妹可以冲，小个子可能会觉得像小孩偷穿大人衣服。",[]]]},{"id":3762,"title":"FOGSY","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.104 「🛍️｜FOGSY」11:00-20:30",[]],["🕙11:00-20:30",[]],["白色极简空间里塞满了 20+ 韩国本土设计师品牌，从 Y2K 辣妹风到简约冷淡风应有尽有，而且负一楼常年有折扣区",[]],["【楼层分布与逛法建议】",[]],["建议从负一楼开始逛，再上二楼慢慢挑，不容易漏掉好东西：",[]],["B1 折扣区（常年有活动）：地下一层是 SAKE 区，经常有 4-6 折的优惠活动！之前两三百的衣服现在可能一百多就能拿下，适合喜欢淘货和捡漏的姐妹，一进门直接冲这里。",[]],["2F 品牌集合区（核心重头戏）：二楼是正价区，汇集了 illigo、asyouare、sur、grumpy stuff 等超火的小众品牌。衣服、包包、鞋子、帽子全都有，按品牌和风格陈列。",[]],["1F 咖啡厅：一楼有一家咖啡厅，逛累了可以坐下来喝杯咖啡休息。",[]],["价格区间：内搭和基础款大概 1万 - 2万韩元（折合人民币 50 - 100 元），外套和连衣裙大概 3万 - 5万韩元（折合人民币 150 - 250 元），包包和配饰大概 1万 - 5万韩元。折扣区的价格更低，性价比极高。",[]],["退税方式：支持现场开具退税单！单笔消费满 3 万韩元即可退税，结账时出示护照登记，一定要收好小票，离境时去机场扫描退税。算上退税能省下不少钱。",[]],["支付方式：支持韩币现金、信用卡，部分店铺支持支付宝和微信（建议备点现金或信用卡以防万一）。",[]],["建议结账时仔细核对商品和金额，确认没问题再刷卡离开。",[]],["【必逛品牌与热门单品推荐】",[]],["illigo：超火的少女风品牌，复古提花拉链毛衣和山茶花露肩针织非常温柔，蝴蝶结系带加上立体花朵，约会探店拍照巨出片。",[]],["asyouare：主打韩系甜酷风，黑色和白色的基础款背心、长袖打底衫超级百搭，版型很好，叠穿在外套里露出一点边边，氛围感直接拉满。",[]],["grumpy stuff：他家的复古手表和爱心时钟项链超级火！金属感加上不规则造型，冬天穿搭很配，价格也很甜，大概 4 万韩元左右，非常适合当伴手礼。",[]],["机车包与果冻包：店里的包包款式超多，机车包质感很好，果冻包轻便又能装，颜色丰富，搭配辣妹风或休闲风都绝了。",[]]]},{"id":3779,"title":"ILLIGO","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.105 「🛍️｜ILLIGO」💗11:00-20:30",[]],["🕙11:00-20:30｜https://illigo.co.kr",[]],["女爱豆（张元英、柳智敏）私藏的“甜而不腻”少女风宝藏品牌！主打日系韩系结合的软糯少女感。",[]],["【楼层指南&逛店tips】",[]],["建议先去 B1 捡漏，再去 2F 挑新品，这样不容易错过断码的好货：",[]],["B1 折扣区（重头戏）：地下一楼是 ILLIGO 的 Archive Outlet 促销专区！经常有 1 折到 5 折的疯狂折扣，最便宜的短袖只要 9,900 韩元，毛衣和裤子大概 39,900 韩元。款式多但断码严重，需要耐心翻找，看到喜欢的赶紧试，手慢无。",[]],["2F 新品与热卖区：在 Fogsy 集合店的二楼，一进门就能看到 ILLIGO 的新品和热卖款陈列。衣服按色系和风格摆放，试衣间灯光很好，随便拍都出片。",[]],["试穿规则：和 Fogsy 集合店共用试衣间，白色衣服通常不能试穿（怕蹭粉底），其他颜色可以随便试。试完衣服需要自己挂回去，店员不会帮忙收。",[]],["退税方式：单笔消费满 3 万韩元即可开具退税单，离境时去机场扫描退税。",[]],["【必买热门单品推荐】",[]],["",["617.webp"]],["",["618.webp"]],["",["619.webp"]],["",["620.webp"]],["",["621.webp"]],["",["622.webp"]],["复古提花拉链毛衣：秋冬爆款！棕白配色自带秋日氛围感，厚实软糯，大大的口袋超实用，穿起来温柔又减龄。",[]],["山茶花露肩针织：奶呼呼的白色，蝴蝶结系带加上立体花朵设计，温柔又带点小小心机，约会探店拍照巨出片。",[]],["爱心拉链卫衣：甜酷 Y2K 感拉满，格纹爱心刺绣很有细节，宽松版型随便搭牛仔裤就很好看，张元英同款风格。",[]],["灰色斜肩卫衣：随性露肩设计，慵懒松弛感拿捏，不会太刻意，日常穿毫无压力，搭配卫裤或短裙都好看。",[]],["卡普里裤与卫裤：他家的裤子版型做得极好，显腿直又显腿长，背后的暗纹和蝴蝶结点缀很有小心机，搭配短款上衣绝了。",[]]]},{"id":3800,"title":"POLA AT HOME","area":"圣水洞","chapter":"4⃣️ Day 4（12.1｜周二）：首尔林（12）+圣水洞（104）（避开周一/四/五）","blocks":[["5.106 *「🍽️｜POLA AT HOME」12:00-18:30",[]],["🕙12:00-18:30",[]]]},{"id":3802,"title":"5⃣️ Day 5（12.2｜周三）：圣水+钟路区（15+晚上🖼️）（避开周一、二）","area":"钟路区","chapter":"5⃣️ Day 5（12.2｜周三）：圣水+钟路区（15+晚上🖼️）（避开周一、二）","blocks":[["5⃣️ Day 5（12.2｜周三）：圣水+钟路区（15+晚上🖼️）（避开周一、二）",[]],["出门带手机、护照、银行卡、充电宝。（早上简单吃点，13:30从圣水出发就行）",[]],["🚇【35min】2号线 毒岛方向｜10站【市厅站】｜8号口出 🚶204m",[]]]},{"id":3805,"title":"1. 【市厅】","area":"市厅","chapter":"5⃣️ Day 5（12.2｜周三）：圣水+钟路区（15+晚上🖼️）（避开周一、二）","blocks":[["1. 【市厅】",[]]]},{"id":3806,"title":"满足五香猪蹄","area":"市厅","chapter":"5⃣️ Day 5（12.2｜周三）：圣水+钟路区（15+晚上🖼️）（避开周一、二）","blocks":[["1.1 「🐷｜满足五香猪蹄」",[]],["🕙11:30-22:00｜连续 9 年获得米其林推荐",[]],["【逛店与避坑小贴士】",[]],["正确吃法：店员会教你怎么吃！把包菜丝在特制的酸甜蒜汁里拌一下，再和切好的猪蹄、蒜片、青椒一起包进生菜或苏子叶里吃，解腻又提香，一口下去幸福感爆棚。",[]],["注意排队：作为米其林推荐的网红老店，饭点（尤其是周末）人非常多，可能需要排队。建议 11 点刚开门或下午 2 点错峰前往。",[]],["注意营业时间：部分门店下午 3 点到 5 点可能会休息（或者猪蹄下午 3 点才出炉），去之前最好在 Naver Map 上确认一下当天的营业状态，别跑空。",[]],["自带加热板：猪蹄下面有加热板，但吃到后面可能会凉，搭配热热的饺子年糕汤刚刚好。",[]],["【价格与支付攻略】",[]],["人均消费：大概 120 元人民币左右。两人点一份双拼猪蹄套餐（包含冷面或饺子汤）分量非常大，两个女生吃都能扶墙走。",[]],["支付方式：部分门店不支持微信和支付宝，只能刷信用卡（Visa/Mastercard）或韩元现金，建议提前备好现金或信用卡。明洞店等部分门店支持自助点餐机（有中文界面）。",[]],["一人食友好：店里也有“一人包饭”套餐，一个人去吃也不会觉得尴尬。",[]],["【必点招牌推荐】",[]],["双拼猪蹄（半半口味）：灵魂必点！一半原味（五香）一半辣味。原味软糯 Q 弹，带着淡淡的卤香；辣味微甜带点花生碎，是典型的韩式口味。两个人吃一份双拼套餐就绰绰有余。",[]],["金枪鱼拌饭：很多博主强烈推荐！金枪鱼搭配特制酱料和米饭，搓成丸子一口一个，非常香，比单点主食好吃太多。",[]],["饺子年糕汤：点猪蹄套餐通常会赠送或搭配。汤头咸香鲜甜，里面有韭菜味的饺子和糯叽叽的年糕片，吃完猪蹄来一口热汤，特别舒服。",[]],["拌冷面：清爽解腻，酸甜的汤底配上劲道的面条，和软糯的猪蹄是绝配。",[]],["泡菜煎饼：外皮脆脆的，泡菜香浓郁，换着口味吃刚刚好。",[]],["🚌【20min】01A｜3站【迎秋门站】｜🚶297m",[]]]},{"id":3824,"title":"2. 【西村】（5）","area":"西村","chapter":"5⃣️ Day 5（12.2｜周三）：圣水+钟路区（15+晚上🖼️）（避开周一、二）","blocks":[["2. 【西村】（5）",[]]]},{"id":3825,"title":"comptoir de mirabelle","area":"西村","chapter":"5⃣️ Day 5（12.2｜周三）：圣水+钟路区（15+晚上🖼️）（避开周一、二）","blocks":[["2.1 「🪑｜comptoir de mirabelle」",[]],["🕙11:00-20:00｜",[]],["【基本信息与找店指南】",[]],["“欧洲风生活方式买手店”！它家搜罗了超多欧洲和韩国本土的精致好物，从餐具、布艺到发饰、家居小物，审美在线，去首尔逛它家绝对能淘到超有质感的韩系生活好物。",[]],["找店技巧：店铺在一栋建筑的二楼，门头比较隐蔽，注意看门上的营业时间，直接上二楼就能感受到满满的欧洲杂货铺氛围。",[]],["【必买好物推荐】",[]],["欧洲进口餐具：各种色彩斑斓、形状独特的餐盘、杯子和勺子，很多来自意大利和法国，颜值极高，用来装甜品或做餐桌布置超级出片。",[]],["布艺鞋与发饰：店主审美非常独到，选了很多欧洲和韩国本土的精美发饰、布艺鞋，独特又小众，很适合追求品质生活的人。",[]],["家居摆件与餐垫：从心形勺子到刺绣珍珠手工杯垫，再到各种创意小摆件，每一件都充满创意和趣味，买来做伴手礼非常拿得出手。",[]],["进口品牌好物：店里还有 Lola James Harper 的香氛、HAY 的冷门小众款篮子等，进口厂牌货品很全，适合慢慢淘。",[]]]},{"id":3835,"title":"ROLA ROLA","area":"西村","chapter":"5⃣️ Day 5（12.2｜周三）：圣水+钟路区（15+晚上🖼️）（避开周一、二）","blocks":[["2.2 「🛍️｜ROLA ROLA」",[]]]},{"id":3836,"title":"colocynth（콜로신스）","area":"西村","chapter":"5⃣️ Day 5（12.2｜周三）：圣水+钟路区（15+晚上🖼️）（避开周一、二）","blocks":[["2.3 「🛍️｜colocynth（콜로신스）」13点开门",[]],["🕙13:00-19:00",[]],["【逛店与避坑小贴士】",[]],["以低饱和的奶油色、米白、浅绿和淡紫为主，主打柔软廓形和温柔色调，没有浮夸的大 Logo，穿上就是那种“打扮了但看不出打扮”的淡淡氛围感",[]],["找店技巧：店铺在 3 楼，没有电梯，需要爬楼梯。门头比较隐蔽，注意看门上的营业时间，直接上三楼就能感受到满满的森系温柔氛围。",[]],["一定要试穿：它家有些单品（如某些上衣）单穿可能显得没精神像家居服，或者材质偏薄透，必须上身试穿看效果。而且很多款式只有一个码，不试穿直接盲买很容易踩雷。",[]],["注意材质：部分棉麻材质容易皱，有些裙子是单层偏透的，买之前要摸一下质感。",[]],["试衣间排队：店里只有一个试衣间，周末或下午人多的时候需要排队。",[]],["价格参考：均价在 400-1000 元人民币左右（T 恤和上衣约 200-400 元，裙子和外套约 500-1000 元），比 coyseio 稍微便宜一点，在韩系小众设计师品牌里性价比还不错。",[]],["退税政策：单笔满 15,000 韩元即可退税。结账时主动出示护照原件，拿好退税单和小票，去机场自助机办理（建议结账时问清楚是当场退税还是机场退税）。",[]],["支付方式：支持信用卡和韩元现金，部分门店可能不支持微信和支付宝，建议备好信用卡或现金。",[]],["【必买热门单品推荐】",[]],["蕾丝蛋糕裙：垂感极好，蕾丝拼接很有层次感，灰色或深色系非常百搭，搭配风衣或短上衣。",[]],["碎花泡泡袖上衣：复古感满满，颜色清新（如豆绿色、粉色），单穿或叠搭都好看，适合春夏和初秋。",[]],["复古风衣：带帽设计，版型利落，夹棉材质自重不重，适合小个子，穿上就是精致的法式小公主。",[]],["碎花棒球帽：绵软的顶，帽围较大，设计特别，搭配整体造型很加分。",[]],["贝母扣细节单品：很多衣服和包包上都有贝母质感的纽扣，精致又点睛，提升整体质感。",[]]]},{"id":3853,"title":"红色锤子 레드망치","area":"西村","chapter":"5⃣️ Day 5（12.2｜周三）：圣水+钟路区（15+晚上🖼️）（避开周一、二）","blocks":[["2.4 「🪑｜红色锤子 레드망치」💗",[]],["🕙10:30-20:00",[]],["【逛店与避坑小贴士】",[]],["找店技巧：门头有显眼的红色锤子标志，很好认。店里有 3 层楼，可以慢慢逛。",[]],["理性种草：店里很多家居好物颜值高，但如果是买锅具或陶瓷餐具会比较重。",[]],["注意检查瑕疵：买餐具和陶瓷制品时，记得仔细检查一下边缘和底部，有瑕疵及时让店员换货。",[]],["价格亲民：小物件（杯垫、餐垫）大概 3000-5000 韩元，碗碟杯子大概 3000-15000 韩元，桌布和床品价格稍高但性价比依然不错。",[]],["退税政策：单笔满 15,000 韩元即可退税。结账时主动出示护照原件，拿好退税单和小票，去机场办理。",[]],["支付方式：支持信用卡和韩元现金，部分门店可能不支持微信和支付宝，建议备好信用卡或现金。",[]],["【楼层分布与逛店指南】",[]],["1楼（织物与地毯区）：主要是地毯、桌布、餐垫以及各种好看的网兜和布艺。大桌布大概 5000 韩元，小杯垫大概 4000 韩元，价格非常友好，颜色丰富，看着就很治愈。",[]],["2楼（餐具控的天堂）：各种精致漂亮的碗、筷、碟子、杯子、勺子和叉子应有尽有，款式很丰富，摆放得整整齐齐。自己用或者当伴手礼送人都不错，买碟子还有折扣（买 1-3 个 9 折，4 个以上 85 折）。",[]],["3楼（床上用品专区）：款式偏简约，面料摸起来很舒服，有床单、被套、抱枕等。",[]],["【必买好物推荐】",[]],["高颜值餐垫与桌布：色彩明亮、设计感强，价格亲民，买来做伴手礼送朋友非常拿得出手。",[]],["精致碗碟与杯子：款式丰富，有简约风也有可爱风，价格大概在 3000-15000 韩元之间。",[]],["藤编收纳筐：质感很好，摆在厨房和客厅瞬间提升一个档次，适合喜欢收纳和布置房间的人。",[]],["舒适床品与抱枕：面料舒服，款式简约耐看，适合买回去提升居家幸福感。",[]]]},{"id":3872,"title":"大林美术馆","area":"西村","chapter":"5⃣️ Day 5（12.2｜周三）：圣水+钟路区（15+晚上🖼️）（避开周一、二）","blocks":[["2.5 「🖼️｜大林美术馆」（周一休息）",[]],["🕙11:00-18:00",[]],["《DCF Collection》馆藏展",[]]]},{"id":3875,"title":"KUOCA","area":"西村","chapter":"5⃣️ Day 5（12.2｜周三）：圣水+钟路区（15+晚上🖼️）（避开周一、二）","blocks":[["2.6 *「✨｜KUOCA」（圣水店最大）",[]],["🕙11:30-20:30｜https://kuoca.com/",[]],["【逛店与避坑小贴士】",[]],["野桃护手霜慎买：有博主反馈野桃味的护手霜和香水味道差异较大，护手霜上手后味道偏臭，不如香水好闻。建议先试香再买，或者改买奶油玫瑰味。",[]],["发喷留香短：头发身体喷雾虽然味道好闻，但留香时间非常短，大概十几分钟就挥发了，如果追求持久留香建议直接买香水。",[]],["注意营业时间：大部分门店 11:00 才开门，20:00 关门，别去太早吃闭门羹。",[]],["理性种草：身体乳和沐浴露的味道不如护手霜和香水，留香也短，优先买香水和护手霜。",[]],["🚇 【10min】3号线景福宫站 安国方向｜1站【安国站】｜1号口🚶242m",[]]]},{"id":3883,"title":"3. 【安国/北村】（11）18:00美术馆","area":"安国 / 北村","chapter":"5⃣️ Day 5（12.2｜周三）：圣水+钟路区（15+晚上🖼️）（避开周一、二）","blocks":[["3. 【安国/北村】（11）18:00美术馆",[]]]},{"id":3884,"title":"Mathhew Chang","area":"安国 / 北村","chapter":"5⃣️ Day 5（12.2｜周三）：圣水+钟路区（15+晚上🖼️）（避开周一、二）","blocks":[["3.1 「✨｜Mathhew Chang」",[]],["🕙11:00-19:00｜💳 微信支付宝✅｜https://matthewchangperfumes.com/",[]],["【价格与活动攻略】",[]],["价格亲民：30ml 正装香水约 72,000 韩元（税前），税后大概 69,000 韩元（约合人民币 350-400 元）。同香调的身体乳、洗手液价格也在 100-200 多元人民币，性价比极高。",[]],["经常有活动：店里经常搞“买赠”或“抽奖”活动（比如发小红书笔记抽奖送正装香水、身体乳或洗手液），结账前一定要问问店员当前有什么活动，凑单买更划算。",[]],["退税政策：单笔满 15,000 韩元即可当场退税。",[]],["免费试香：店里全系列香水都可以免费试香，建议一支一支慢慢闻，等酒精味散去后再感受中后调。",[]],["包装精美：它家的包装简约好看，买来做伴手礼送朋友非常合适，店员也会帮忙包装得很漂亮。",[]],["理性种草：身体乳和洗手液的味道不如香水浓郁，留香也短，如果预算有限，优先买香水和护手霜。",[]],["【必买热门香型推荐】",[]],["Late Bloom（迟暮芬芳）：它家最火的招牌款！前调是清脆的红苹果，中调融入玫瑰花瓣与绿叶，尾调是黄葵子与白麝香。清新不甜腻，像刚洗完澡的白衬衫少女，日常通勤喷完全不突兀。",[]],["Cozy Heart（温暖之心）：前调柑橘，后调白麝香。不是那种很甜的奶香，而是像刚洗好的毛毯、温暖阳光和干净白衬衫的味道，很舒服，很有安全感。",[]],["Fig & Bliss（悦见无花果）：秋季新香！淡淡的无花果加上柔和奶香，后面带一点点木质感，清新不甜腻，很有韩剧里秋天散步的氛围感。",[]],["La Limonade（柠夏初遇）：柠檬加佛手柑的清爽柑橘调，像刚洗完澡走在阳光下的白衬衫，越闻越温柔，非常适合夏天或想要降温感的时候喷。",[]],["A Hug（相拥）：肉桂混着雪松的暖木质调，秋冬喷像被温暖的拥抱裹住，亲和力拉满，男女都能用。",[]],["Be My Muse（灵感缪斯）：层次丰富的灵动花香调，干净皂香，像刚洗完澡后身上留下的淡淡香气，温柔且日常。",[]]]},{"id":3900,"title":"Scentica","area":"安国 / 北村","chapter":"5⃣️ Day 5（12.2｜周三）：圣水+钟路区（15+晚上🖼️）（避开周一、二）","blocks":[["3.2 「✨｜Scentica」",[]],["🕙11:00-20:00｜💳 微信支付宝✅｜https://scentica.co.kr",[]],["【逛店与避坑小贴士】",[]],["免费试香：店里全系列香水都可以免费试香，无推销。建议一支一支慢慢闻，等酒精味散去后再感受中后调。",[]],["理性种草：部分花香调（如 Freesia Dew 小苍兰）留香时间较短，属于“三步散”；木质调和皂香调的留香表现会更好。如果追求持久留香，建议优先选木质调或买 50ml 大瓶多喷衣服上。",[]],["注意辨别门店：导航到附近后记得顺着右拐小路往里走，看到女子中学再往前走。",[]],["价格参考：15ml 约 35,000 韩元（约合人民币 180 元），50ml 约 73,000-78,000 韩元（约合人民币 380-400 元）。算下来买 50ml 更划算。",[]],["满赠活动：消费满 7 万韩元可体验 DIY 字母钥匙扣挂件，还能送护手霜；买 15ml 香水通常送皮质收纳小包或零钱包。",[]],["扭蛋活动：进店即可参与 100% 中奖的扭蛋机活动，不用买东西也能拿小礼物。",[]],["集章折扣：在店里领取明信片盖章，去其他分店购买对应门店限定香可享受 9 折优惠。",[]],["当场退税：单笔满 15,000 韩元即可当场退税！结账时主动出示护照原件，直接付免税价。",[]],["【热门香型推荐】",[]],["安国店限定 INKHIVE 21：水墨烟熏墨感木质香，前调微苦，后调是沉稳的沉香木，非常有气质，适合喜欢清冷木质调的人。",[]],["安国店限定 BEIJI 70：韩式甜米酿香气，清甜软糯，温柔韩系氛围感拉满。",[]],["Young Rose：带点青涩感的新鲜玫瑰，搭配紫罗兰和白麝香，精致但不正式，日常通勤很合适。",[]],["Peach Moir：清甜不腻的鲜桃子香，带点轻微酒感，成熟温柔，不喜欢甜腻香的人也能接受。",[]],["AVENQUA 25：海洋木质调，带着柑橘和梨的清新果香，像海风拂过，非常清爽。",[]],["BRUTEA 12：木质茶咖啡香，像现磨咖啡夹杂着冷冽金属感，后调有甜感，类似“温暖壁炉”。",[]],["SAFLEAT 54 汉南洞限定中性香，前调清新绿意洁净织物感，中调柔和雪松治愈皂香，后调麝香木质",[]],["FLEUR ECLOS盛放之花：温柔干净柔润玫瑰，前调清甜杏香，中调芍药淡玫瑰，后调白麝香",[]],["ROSE MUEC玫瑰麝香：柔和内敛，前调清冽果香，中调玫瑰交织紫罗兰，后调白麝香包裹花香",[]],["SANTAL VERT青檀：清新沉稳青绿檀木调，简约高级中性木质香。前调草本，中调檀香，后调木质",[]],["EAU DE JARDIN花园之水：清新治愈绿意水生调，前调露水柑橘绿叶，中调铃兰青草，后调苔藓雪松",[]],["BERGAWOOD 柏木苦橙：苦橙木质，微苦中性香。前调清苦佛手柑，中调温润柏木，后调沉静原木",[]],["CITRON 香橼：鲜活柑橘调，夏日首选。前调香橼，酸涩果皮香，中调草本和果香，后调白麝香",[]],["PUR MAUVE纯紫堇：柔媚朦胧温柔知性花香。前调鲜果，中调鸢尾紫罗兰，后调麝香包裹花香",[]],["OUD BLONDE浅金乌木：温柔乌木调，中性轻奢香。前调暖果，中调丝滑乌木，后调香草木质",[]],["VETIBER岩香根：清冷泥土草本调，中性冷感。前调草本泥土，中调香根草，后调原木。",[]],["LE VACANCES假日漫游：阳光海岛，清新度假感。前调海盐柑橘，中调热带白花，后调椰香木质",[]],["PECHE MOIR暗桃暮色：柔雾蜜桃果香调。前调多汁蜜桃，中调桃香+花香，后调麝香",[]],["SOLEIL NUD裸光暖阳：暖调阳光花果木质香。前调鲜活柑橘，中调温柔黄花，后调奶香木质麝香",[]]]},{"id":3931,"title":"baskin robbins","area":"安国 / 北村","chapter":"5⃣️ Day 5（12.2｜周三）：圣水+钟路区（15+晚上🖼️）（避开周一、二）","blocks":[["3.3 「🍨｜baskin robbins」",[]],["🕙10:00-21:30｜https://www.baskinrobbins.co.kr/menu/list.php?category=A",[]],["【逛店与避坑小贴士】",[]],["试吃服务：拿不准口味可以直接问店员试吃，自由搭配球数。",[]],["单球价格：最小球约 3900 韩元（约 20 元人民币），一个小球一个人吃完全够。",[]],["10 球 Mini 拼盘：约 6900-7000 韩元（约 35 元人民币），一次能尝 10 种口味，非常适合选择困难症，但部分门店口味是随机的。",[]],["套餐更划算：推荐买“套餐”，比如包含 4-5 种口味的盒装冰淇淋（Quarter/Family Size），外加一盒泡芙或饼干，非常适合当伴手礼或家庭分享。",[]],["31 分钟无限畅吃：江南店在周一到周五 14:00-17:00 有 31 分钟限时畅吃活动，7500 韩币实现冰淇淋自由（不能打包，只能店内吃完）。",[]],["云闪付优惠：提前在云闪付领券，扫码付享 9 折，非常划算。",[]],["支付方式：自助点单机有中文界面，支持国内信用卡和支付宝/微信支付，丝滑付款。",[]],["【韩国限定必吃口味】",[]],["走进韩国 BR，一定要试试这些脑洞大开的独家口味，回国就吃不到了：",[]],["三清洞韩屋概念店（全韩国只有一家）：只有这里能吃到的独家菜单：黑芝麻软冰淇淋（配一小瓶香油淋上去）和 蜂蜜黄油玉米冰淇淋。",[]],["妈妈是外星人（엄마는 외계인）：绝对的王牌！混合了黑、白、牛奶三种巧克力，里面还有脆脆的巧克力球，连 车银优 都超爱，闭眼点都不踩雷。",[]],["弹牙年糕黄金组合（쫀떡궁합）：最“韩”的口味！黄豆粉、黑芝麻冰淇淋配上 Q 弹的年糕块，口感非常独特，喜欢糯叽叽的必冲。",[]],["奇异的棉花糖（이상한 나라의 솜사탕）：颜值担当。梦幻的粉蓝黄三色，加了跳跳糖，入口会有“噼里啪啦”的刺激感，拍照超级出片。",[]],["蓝色冲浪者海滩：海盐味很明显，配上焦糖酱和较大的巧克力块，一口下去非常惊艳，是很多人心里的第一名。",[]],["健康低糖版（Lessly Edition）：2025 年新推出的低卡低糖系列，热量和糖分各降低约 45% 和 39%，适合怕甜和减脂期的朋友。",[]]]},{"id":3949,"title":"LIBER（리베르）","area":"安国 / 北村","chapter":"5⃣️ Day 5（12.2｜周三）：圣水+钟路区（15+晚上🖼️）（避开周一、二）","blocks":[["3.4 「✨｜LIBER（리베르）」",[]],["🕙11:00-20:00｜https://liber-seoul.com/",[]],["【逛店与避坑小贴士】",[]],["注意辨别门店：北村安国店位置稍微隐蔽，导航到附近后记得顺着小路走，看到木质调的门头就对了。",[]],["品牌理念：专为都市旅行者设计，用香气捕捉城市情绪和日常灵感。味道偏向干净、柔和、没有攻击性，是典型的“韩女/韩男身上的温柔气息”。",[]],["免费试香：店里全系列香水都可以免费试香，无推销，沉浸式挑香超舒服。建议一支一支慢慢闻，等酒精味散去后再感受中后调。",[]],["理性种草：EDP 香精的留香时间大概 4-5 小时，如果是追求超长留香，可以多喷在衣服上；如果追求持久，可以搭配同香调的身体乳使用。",[]],["爱豆同款：TWS 申惟、道勋，TXT 休宁凯 等都在用，尤其是它家的 SNOW SAI 和 CLOUD SAI，被大家称为“初雪香水”和“云端体香”。",[]],["木质调的装修风格搭配阳光，安静又有气质。店员会讲中文，还会用韩式传统丝巾帮你打包礼物。",[]],["价格亲民：30ml 正装香水约 200 多元人民币，100ml 衣物香氛喷雾也只要 200 出头。",[]],["刻字服务：瓶身支持免费刻字，送人非常有仪式感。",[]],["韩式包装：店员会用传统丝巾或精美包装纸帮你打包。",[]],["满赠与活动：店里常有买赠活动（比如买香水送身体乳或护手霜），结账前问问店员有什么活动。",[]],["当场退税：单笔满 15,000 韩元即可当场退税！结账时主动出示护照原件，直接付免税价。",[]],["【必买热门香型推荐】",[]],["SNOW SAI（初雪皂香）：它家的灵魂爆款！清新的皂香 + 淡淡的桃子与柑橘果香，尾调是小苍兰和茉莉白花。就像刚洗好的白衬衫在阳光下晒干的味道，清冷又温柔，男女都能喷。",[]],["CLOUD SAI（云端柔香）：温柔的柔润花香交织软糯麝香，气息轻盈不厚重，走动时若有若无地萦绕在身边，氛围感拿捏得刚刚好，非常适合日常通勤。",[]],["Woody Gawa（温润木质）：沉静温润的木质气息，没有甜腻的脂粉味，贴肤自然，越闻越舒服，适合喜欢中性香和清冷感的人。",[]],["Art Book（书卷花香）：带着书卷般淡雅朦胧的花香，干净皂香与温柔气息结合，低调又好闻，留香时间也很在线。",[]],["除了香水，店里还有香氛喷雾（盖烤肉味神器）、精油滚珠、枕头喷雾和香薰蜡烛。价格非常亲民（30ml 香水大概两百多人民币），性价比极高。",[]]]},{"id":3969,"title":"Anthracite","area":"安国 / 北村","chapter":"5⃣️ Day 5（12.2｜周三）：圣水+钟路区（15+晚上🖼️）（避开周一、二）","blocks":[["3.5 「☕️｜Anthracite」",[]],["【品牌小档案】",[]],["名字含义：“Anthracite”意为无烟煤，象征着咖啡深度烘焙后的纯粹色泽，也奠定了它家以风味醇厚、均衡的经典意式深烘拼配豆为核心的特色。",[]],["点单特色：在店里点单时，你可以先选饮品，再自选浅烘、中烘、深烘的咖啡豆，这种“先选豆再冲煮”的先锋方式，在首尔咖啡圈非常出圈。",[]],["它家不仅曾荣登 Big 7 Travel “亚洲五十佳咖啡馆”第 8 名，更是韩国本土极具代表性的独立烘焙品牌。",[]],["【逛店与避坑小贴士】",[]],["注意营业时间：建议上午去，下午 2-4 点是人潮高峰期，想拍窗边神图建议赶早。",[]],["注意玻璃门：望远店的入口是一扇巨大的玻璃感应门，端着咖啡进出时千万注意不要撞玻璃上。",[]],["保持安静：店里氛围非常安静，很多韩国本地人会带电脑办公或看书，拍照时请保持安静。",[]],["先找位再点单：店员通常会让你先确认好位置，然后再去点单，不要一进门就盲目排队。",[]],["避峰建议：上午 9-11 点人最少，拍照喝咖啡都清净；周末下午人流高峰可能需要等位。",[]],["咖啡价格：一杯美式或拿铁约 5,500-7,000 韩元（约合人民币 30-40 元），手冲咖啡 7,000 韩元左右。",[]],["咖啡豆价格：500g 装的咖啡豆大概 150 元人民币左右，挂耳套装也很适合买回国送人。",[]],["支付方式：大部分门店支持支付宝和微信支付，也支持信用卡和韩元现金。",[]],["注意退税：咖啡店通常不能退税，买咖啡豆也是直接带走，没有退税单，大家不要跑空。",[]],["【必点招牌与必买咖啡豆】",[]],["夏目漱石（Natsume Soseki）：它家最火的招牌豆！中度烘焙，由埃塞俄比亚、哥伦比亚、危地马拉拼配，带有橙子、果香、杏仁和牛奶巧克力风味。做美式清爽干净，带点茶感，美式爱好者的首选。",[]],["黄油三重奏（Butter Fat Trio）：中深烘焙，拼配了 5 个产地的豆子。闻起来是浓郁的坚果和可可调性，喝起来微甜且均衡，做拿铁超级香醇，奶咖爱好者的必点款。",[]],["空气与梦（L'air et les songes）：中浅烘焙，带有明亮的黄桃、柑橘和花香，做热拿铁会有浅浅的花果香，非常清新。",[]],["威廉·布莱克（William Blake）：深度烘焙，带有浓郁的黑巧克力与黑加仑风味，口感醇厚，适合喜欢深烘和纯黑咖啡的人。",[]],["氮气冷萃：夏天必点！口感像丝滑奶油，绵密气泡感很微妙，清爽解腻完全不苦涩。",[]],["柚子艾草蛋糕：艾草蛋糕胚自带淡淡草本香，搭配清爽柚子奶油，层次柔和不甜腻，超级推荐。",[]]]},{"id":3991,"title":"Collins","area":"安国 / 北村","chapter":"5⃣️ Day 5（12.2｜周三）：圣水+钟路区（15+晚上🖼️）（避开周一、二）","blocks":[["3.6 「✨｜Collins」💗",[]],["🕙11:00-19:30｜https://smartstore.naver.com/collins/",[]],["【必买推荐】",[]],["经典组合装：一盒 5 款香，适合选择困难户，一次集齐经典味道。",[]],["首尔限定款：清冷花香木质调，像深夜走在江南街头的微凉空气，虎雀图设计很好看。",[]],["甜品系列：盐面包、抹茶拿铁、樱桃冰淇淋等，闻起来像甜品店，很治愈。",[]],["蔬果香系列：番茄、哈密瓜、西瓜、甜玉米，非常有创意，甜玉米款暖暖的带点奶香。",[]]]},{"id":3998,"title":"MLB","area":"安国 / 北村","chapter":"5⃣️ Day 5（12.2｜周三）：圣水+钟路区（15+晚上🖼️）（避开周一、二）","blocks":[["3.7 「🧢｜MLB」",[]],["🕙11:00-20:00｜https://www.mlb-korea.com/",[]],["【逛店与避坑小贴士】",[]],["注意试戴限制：在免税店买帽子，浅色帽子和毛线帽通常不让试戴，只能凭感觉选码；专柜和旗舰店可以随便试戴，建议去专柜试好码数再去免税店买",[]],["买帽子可以免费定制刺绣（英文名或韩文名），还能 DIY 韩国传统挂饰，首尔只有这家有。",[]],["MLB 的帽型分软顶（CP66/CP77）和硬顶（CP85），大小标对脸型的修饰效果完全不同。千万别盲买，一定要去线下店亲自试戴找感觉。",[]],["专柜价格：棒球帽原价大概 3.6万-3.9万韩元（180-200 元），卫衣和外套大概 5万-10万韩元。",[]],["免税店折扣：新世界免税店经常有 7 折活动，算下来一顶帽子只要 110-140 元人民币，返点更划算。",[]],["退税政策：专柜和旗舰店单笔满 15,000 韩元即可当场退税或机场退税，结账时主动出示护照原件。",[]],["【必买热门单品推荐】",[]],["CP77 软顶棒球帽：它家的灵魂爆款！帽型超级修饰脸型，显头小。碳灰粉标、黄色 NY 字母、樱花粉 LA 字母都很火，闭眼入都不踩雷。",[]],["白色猫耳毛线帽：秋冬氛围感神器！软乎乎的超好搭，戴上直接变甜妹，很多博主和韩女都在戴，但经常断码，去晚了可能只剩样品。",[]],["老爹鞋：增高显瘦神器，鞋底舒服不磨脚，搭配牛仔裤或短裙都很出片。不过老爹鞋在免税店经常断码，建议去专柜或旗舰店试穿。",[]],["迷你托特包：容量刚好能装下手机和口红，搭配卫衣或大衣都很百搭，是日常通勤和逛街的实用好物。",[]],["蕾丝边运动衫：运动风里带点少女感，宽松大 T 和短款上衣版型特别舒服，韩系松弛感拿捏得死死的。",[]]]},{"id":4013,"title":"Cosmic Mansion","area":"安国 / 北村","chapter":"5⃣️ Day 5（12.2｜周三）：圣水+钟路区（15+晚上🖼️）（避开周一、二）","blocks":[["3.8 「✨｜Cosmic Mansion」",[]],["🕙11:00-14:30/15:30-19:30｜💳 微信支付宝✅｜https://himargiela.cafe24.co",[]],["【逛店与避坑小贴士】",[]],["价格亲民：香水（50ml）大概 7万-8万韩元（约合人民币 350-400 元），护手霜（40g）约 1.5万韩元（约 70 元），亚麻香包约 1.6万韩元（约 80 元）。",[]],["当场退税：北村店单笔满 15,000 韩元即可当场退税！结账时主动出示护照原件，直接付免税价。",[]],["选卡片仪式感：结账时店员会提供一张明信片，并在上面喷上你购买的同款香水。",[]],["二楼超好拍：北村店的二楼空间安静且设计感强，窗外就是传统韩屋。",[]],["理性种草：它家的香薰蜡烛扩香能力相对较弱，更推荐买香水、护手霜和香包，留香和实用性更好。",[]],["【必买热门香型推荐】",[]],["Full Moon（满月）：品牌主打香！薰衣草 + 牡丹 + 兰花 + 麝香，中性的花香调，没有脂粉感，睡前闻非常放松，适合做香包挂在卧室。",[]],["Girl with Rose（玫瑰女孩）：葡萄柚 + 保加利亚玫瑰 + 琥珀，清新不甜腻的玫瑰调，带有独特的少女气质，是韩女身上那种淡淡的伪体香。",[]],["Another Morning（清晨）：小苍兰 + 郁金香 + 雪松，像晨光般清新的花木气息，干净温柔，适合日常通勤。",[]],["Linen & Musk（亚麻与麝香）：亚麻 + 白麝香 + 佛手柑，像阳光晒过后的洁净衣物味道，温暖舒适，非常适合做车载香包或衣柜香包。",[]],["Mens Wear（男装）：佛手柑 + 浆果 + 檀香 + 香草 + 琥珀，干净冷感的中性香，像“穿白衬衫的安静男生”，男女都能喷。",[]],["推荐产品：除了香水，他家的亚麻香包（约50元人民币）和护手霜（约70元人民币）性价比极高，香味浓郁且持久，非常适合买来送闺蜜。香水小样套装也很适合旅行携带。",[]]]},{"id":4028,"title":"LE LABO","area":"安国 / 北村","chapter":"5⃣️ Day 5（12.2｜周三）：圣水+钟路区（15+晚上🖼️）（避开周一、二）","blocks":[["3.9 「✨｜LE LABO」",[]],["🕙10:00-20:00｜https://www.lelabofragrances.co.kr",[]],["【逛店与避坑小贴士】",[]],["注意辨别门店：北村店位置稍微隐蔽，导航到附近后记得顺着小路走，看到韩屋门头就对了。",[]],["建筑与氛围：门店直接开在一栋约 300 年历史的传统韩屋里，保留了青瓦坡顶、旧木结构和庭院。将 LE LABO 的克制实验室感与韩屋的侘寂风完美结合，非常安静出片。",[]],["店内提供 15ml、50ml 和 100ml 现货，支持现场手工调香和免费刻字（20个字符以内），还会送香水小样、护手霜小样和一杯咖啡。",[]],["免费试香与咖啡：店里全系列香水都可以免费试香，店员态度很好，允许喷在皮肤上实测。买完香水还能去店里的 Le Labo Café 换一杯咖啡，在韩屋里小坐一下非常惬意。",[]],["理性种草：Le Labo 的留香时间普遍不算长（大概 4-5 小时），它家追求的是贴肤的淡香。如果追求超长留香，建议多喷在衣服上，或者搭配同香调的身体乳使用。",[]],["专柜价格参考：首尔限定 28 号 50ml 约 50 万韩元（退税后约 2200-2500 元人民币），100ml 约 73 万韩元（退税后约 3000 元不到）。常规款 50ml 约 204 美元。",[]],["现场调香仪式感：在北村旗舰店购买，瓶身标签会注明“Compounded（调制）”而不是普通的“Labelled（仅贴标）”，这种现场灌装的感觉非常特别。",[]],["20% 续香优惠：带用完的原装空瓶（EDP 浓香水，50ml 及以上）回店，同款香水可以打 8 折补香。",[]],["退税流程：北村旗舰店不能当场退税，需要拿好退税单和小票，在机场办理退税。",[]],["Le labo的玫瑰31和aesop的rozu都建议上个皮再考虑买，因为两个里面都有会被皮肤放大的胡椒味，驾驭不好就会变成大家口中的狐臭了…",[]],["【必买热门香型推荐】",[]],["首尔限定 Citron 28（香橼 28）：绝对的王牌！清冽柠檬混着鲜锐生姜，慢慢漫出淡雅茉莉，收尾是麝香雪松的暖意。不甜腻且留香持久，像这座城市热闹之下克制的质感，只有首尔门店全年有货。",[]],["Santal 33（檀香 33）：经典中的经典，一半是老檀木的沉稳，一半是淡淡皮革肌理，高级且安心，适合喜欢木质调的人。",[]],["Another 13（别样 13）：若有似无的伪体香，刚喷出来可能觉得没味道，离开门店后反而能闻到淡淡的甜香，非常温柔。",[]],["Rose 31（玫瑰 31）：带有马鞭草和柑橘调的玫瑰，不甜腻，清透自然，非常适合日常通勤。",[]]]},{"id":4046,"title":"NUDARA","area":"安国 / 北村","chapter":"5⃣️ Day 5（12.2｜周三）：圣水+钟路区（15+晚上🖼️）（避开周一、二）","blocks":[["3.10 「✨｜NUDARA」（周二店休）",[]],["🕙11:00-20:00｜💳 微信支付宝✅｜https://nudara.co.kr/",[]],["【品牌小档案】",[]],["名字含义：NUDARA 由“Nude（纯粹、本真）”和“Aroma（香气）”组合而成，主打不刻意、不张扬的隐藏美。",[]],["环保设计：瓶身缠绕布艺标签，礼盒内衬采用蘑菇菌丝体可降解材料替代泡沫，极简牛皮纸盒包装。",[]],["留香表现：整体留香时间大概在 6-8 小时，越闻越高级，属于那种“贴肤伪体香”的类型。",[]],["限定香型：三清洞店有专属限定香（如 Haran 三清洞限定柑橘），一定要去店里试闻！",[]],["【逛店与避坑小贴士】",[]],["注意辨别门店：三清洞店位置稍微隐蔽，导航到附近后记得顺着小路走，看到木质调的门头就对了。",[]],["价格亲民：30ml 正装香水约 7万韩元（约合人民币 350-400 元），护手霜、香包、香氛蜡烛等小物件大概 1万-2万韩元，性价比极高。",[]],["免费试香：店里全系列香水都可以免费试香，无推销，沉浸式挑香超舒服。建议一支一支慢慢闻，等酒精味散去后再感受中后调。",[]],["理性种草：部分花香调（如 Orchetal）刚喷出来时皂感或柠檬味较重，建议等中后调出来再决定。",[]],["当场退税：单笔满 15,000 韩元即可当场退税！结账时主动出示护照原件，直接付免税价。",[]],["韩式包装：店员会用传统丝巾或精美包装纸帮你打包，拿出去送礼体面感直接拉满。",[]],["【必买热门香型推荐】",[]],["三清洞门店限定款：前调是清爽的橘子气息，后调转为温润的木质调，青橘皮的微苦搭配韩屋原木的清风感，自然柔和，线上买不到。",[]],["Woodmavel（雾影无花）：它家的灵魂爆款！无花果裹挟温润木质，前调是绿茶和百里香，后调是雪松木和苔藓。干净高级的木质调，男女都能喷，朴灿烈 同款，清冷氛围感拉满。",[]],["Orchetal（青苹初见）：青柠、青苹果搭配郁金香和白麝香，干净清爽的“盐系少年感”，像刚洗完的白衬衫，非常适合日常通勤。",[]],["Tintash（辛香茉莉）：茉莉搭配依兰和温暖琥珀，带一点辛香料的层次感，不甜腻且留香持久，日常聚餐都很合适。",[]],["Zestypia（椰岸橙光）：椰子水、肉桂和朗姆酒的复合味道，像冬日里的热红酒，温暖有围炉感，非常适合秋冬。",[]],["Fig Pesto（青绿无花果叶）：青绿无花果叶搭配麝香，前调清新，尾调温暖厚重，很有自然气息。",[]]]},{"id":4067,"title":"NONFICTION","area":"安国 / 北村","chapter":"5⃣️ Day 5（12.2｜周三）：圣水+钟路区（15+晚上🖼️）（避开周一、二）","blocks":[["3.11 *「✨｜NONFICTION」（汉南洞店最好逛）",[]],["🕙11:00-20:30｜💳 微信支付宝✅｜https://nonfiction.kr/",[]],["【品牌小档案】",[]],["风格定位：极简冷淡风，主打清冷木质调、水生调和清新草木调。拒绝刺鼻浓烈，每一款都温柔有层次，是典型的“韩女身上的伪体香”。",[]],["空间美学：店内采用雾面石灰粉刷墙面搭配高光泽深红色瓷砖地板，冷调极简装修，没有多余装饰，走进店里就像踏入静谧的艺术展厅，拍照巨出片。",[]],["产品线：除了淡香精，还有身体护理（沐浴露、身体乳）、护手霜、发香喷雾和居家香氛。",[]],["【逛店与避坑小贴士】",[]],["免费试香：店里全系列香水都可以免费试香，无推销，沉浸式挑香超舒服。建议一支一支慢慢闻，等酒精味散去后再感受中后调。",[]],["理性种草：部分花香调刚喷出来时可能味道较冲，建议等中后调出来再决定。它家追求的是贴肤的淡香，留香时间大概 4-6 小时，如果追求超长留香，建议多喷在衣服上或搭配同香调的身体乳。",[]],["价格亲民：30ml 正装香水约 7万韩元（约合人民币 350-400 元），50ml 约 10万韩元。护手霜、发喷、身体护理产品大概 1万-2万韩元，在韩系小众香氛里性价比很高。",[]],["当场退税：单笔满 15,000 韩元即可当场退税！结账时主动出示护照原件，不用去机场排队。",[]],["【必买热门香型推荐】",[]],["Simple Garden（简单花园）：它家的灵魂爆款！清新的橙花与草木香交织，干净通透，像雨后花园的微风，男女都能喷，非常百搭。",[]],["Gentle Night（温柔夜晚）：木质调，沉稳又温柔，带着淡淡的暖意，非常适合秋冬或晚间放松时喷。",[]],["Santal Cream：招牌木质奶香，檀木感明显，搭配身体乳用，全身都是淡淡的伪体香，非常适合喜欢清冷木质调的人。",[]],["White Shirts：干净的皂感木质香，像刚洗完的白衬衫，日常通勤喷它绝对不会出错。",[]],["Lapsang Song：房间喷雾，带有一点烟熏感的木质调，层次厚、氛围感强，越闻越舒服。",[]],["【GAIAC FLOWER】盖亚花香（也叫野玫瑰）带点烟熏感的东方花香调，野玫瑰的温柔与愈创木的醇厚交织，甜而不腻，带着一丝若有若无的神秘感，约会喷它，氛围感直接拉满。",[]],["【THE ROSE】 玫瑰调不是俗套的甜玫瑰，是带着清冽感的清冷玫瑰香，还原了玫瑰原生的柔媚与疏离，温柔又有风骨，不爱甜香的姐妹也能轻松驾驭。",[]],["橙花：清爽不甜腻，带有微微的皂感，像刚洗完的白衬衫，日常通勤喷完全不突兀。",[]],["玫瑰发香喷雾：纯粹的淡玫瑰香，没有香精味，淡雅治愈，留香也很持久，随身带着随时补涂。",[]],["护手霜：质地润而不腻，很好推开，吸收速度超快，用完双手软软嫩嫩的，味道和香水一脉相承。",[]]]},{"id":4089,"title":"MMCA 国立现代美术馆","area":"安国 / 北村","chapter":"5⃣️ Day 5（12.2｜周三）：圣水+钟路区（15+晚上🖼️）（避开周一、二）","blocks":[["3.12 「🖼️｜MMCA 国立现代美术馆」18:00💗",[]],["🕙10:00-18:00（周三&六18:00-21:00免费）",[]],["徐道获展览",[]]]},{"id":4092,"title":"Artist Bakery","area":"安国 / 北村","chapter":"5⃣️ Day 5（12.2｜周三）：圣水+钟路区（15+晚上🖼️）（避开周一、二）","blocks":[["3.13 「🥐｜Artist Bakery」20:00",[]],["🕙7:30-20:00",[]],["【必买口味推荐】",[]],["柠檬白巧盐面包：很多博主的“二刷首选”！凑近闻就有柠檬皮的清香，咬下去面包体扎实，白巧化在嘴里，中间的柠檬酱微酸，和巧克力甜味中和，完全不腻。",[]],["招牌鲜奶盐面包：Best seller！奶油微微奶香，面包体松软带嚼劲，底部脆脆的，属于越吃越好吃的类型。",[]],["蒜香海盐卷：拿到刚出炉的时候最绝！蒜香炸开，满嘴油润感，而且是韩式甜咸口，不是纯咸的蒜味，很惊艳。",[]],["双重巧克力海盐卷：巧克力奶油做得很轻，入口松松的，巧克力味道浓郁，无脑拿不踩雷。",[]],["土豆芝士 & 碱水盐面包：打包带走用微波炉加热一下，外壳酥脆内心柔软，碱水款更有嚼劲，很惊喜。",[]],["隐藏吃法：买一份店里的洋葱奶油抹酱，搭配蓝莓盐面包一起吃，咸甜交织，被很多韩国人夸是“咸甜永动机”。",[]],["周边超可爱：店里有手绘质感的小狗周边、黑白大号布袋和纸袋，质量很好，买面包顺便带个周边当伴手礼很合适。",[]],["搭配热饮：可以点一杯奶油蘑菇汤（芝士浓郁还拉丝）或咖啡，和盐面包搭配着吃，但咖啡出品评价一般，建议去附近的咖啡店喝。",[]],["趁热吃最好：盐面包刚出炉的时候外皮最脆，如果买回来放凉了，用微波炉或空气炸锅稍微加热一下，口感会恢复。",[]],["【排队与取号攻略】",[]],["Catch Table 扫码排号：安国店人非常多，必须用 Catch Table 扫码排号。外带比内用快很多，如果只想买面包，直接选外带（Take away），不用等内用座位。",[]],["内用要等很久：周末内用可能要等 2 - 4 个小时，很多游客和韩国人都是打包带走，在附近找个咖啡店或韩屋坐着吃。",[]],["汝矣岛店不用排长队：如果不想在安国店排长龙，直接去汝矣岛现代百货 B1 店，人少很多，堂食位置也多，逛街顺便买很方便。",[]]]},{"id":4108,"title":"Oreno Ramen（오레노라멘）","area":"安国 / 北村","chapter":"5⃣️ Day 5（12.2｜周三）：圣水+钟路区（15+晚上🖼️）（避开周一、二）","blocks":[["3.14 「🍜｜Oreno Ramen（오레노라멘）」20:30前",[]],["🕙11:00-21:30｜米其林拉面",[]],["【逛店与避坑小贴士】",[]],["先拿号再逛街：饭点（中午 12-2 点，晚上 6 点后）排队是常态，有时候要等 30 分钟以上。最实用的技巧是先去机器点单拿号，然后去附近逛逛，等快到号了再回来，店员会安排入座。",[]],["注意叫号方式：叫号是用韩语念数字，可以多留意屏幕上的号码或礼貌地询问店员。",[]],["价格亲民：拉面 12,000-13,000 韩元/碗，加溏心蛋 1,000 韩元，加叉烧/鸡肉 3,000 韩元。",[]],["支付方式：自助点餐机主要支持信用卡和韩元现金。部分门店可能不支持微信或支付宝。",[]],["自带溏心蛋：每碗面本身就自带一个溏心蛋和几片鸡胸肉，不需要额外花钱单点鸡蛋。",[]],["解腻小菜：汤头比较浓郁，吃到后面可能会觉得有点腻，店里的玫粉色腌萝卜和玄米绿茶非常解腻。",[]],["一人食友好：店里通常有吧台座位，一个人去点一碗面加个蛋，再续点米饭，吃得饱饱的。",[]],["卫生间：部分门店（如合井总店）的卫生间在出门右转的楼层，进店前可以留意一下指示牌。",[]],["【基本信息与招牌推荐】",[]],["招牌双雄：全店只有两款面，都是 12,000-13,000 韩元（约合人民币 60-70 元）。",[]],["鸡白汤拉面（토리빠이탄）：奶白醇厚的鸡汤底，浓郁但不死咸，鸡肉软嫩，溏心蛋入味。",[]],["辣味鸡白汤（카라빠이탄）：在原味汤底上加了辣味，微辣提鲜，口感更丰富。",[]],["隐藏吃法：一定要尝尝里面的溏心蛋，蛋黄是完美的果冻质感；低温慢煮的鸡胸肉也非常嫩。吃完面后，可以找店员免费续面、续汤、续米饭，还会送清爽的泡菜解腻。",[]],["免费续加：吃到一半觉得不够，直接跟店员示意就可以免费续面、续汤、续米饭，而且续面还会额外给一块鸡肉，性价比直接拉满！",[]],["自助点单：进店后在门口的自助点餐机（Kiosk）上点单付款，机器有图片，虽然主要是韩语界面，但很好理解。",[]]]},{"id":4126,"title":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）",[]],["10:00出门，出门带手机、护照、银行卡、充电宝。",[]],["【出发路程约1H】🚇 2号线弘益大学3号口出，步行1.1km",[]]]},{"id":4129,"title":"1. 【延南洞】（15）","area":"延南洞","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["1. 【延南洞】（15）",[]]]},{"id":4130,"title":"糯大麦盐面包","area":"延南洞","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["1.1 「🥐｜糯大麦盐面包」",[]],["🕙8:30-22:00",[]],["出炉时间：8:00｜10:30｜12:00｜13:30｜15:00｜16:30｜18:00",[]],["",["623.webp"]],["",["624.webp"]],["",["625.webp"]]]},{"id":4136,"title":"ilgi","area":"延南洞","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["1.2 「☕️｜ilgi」💗 11点开门，周日店休",[]],["🕙 周一～周四 11:00-17:20｜周五～周六 12:00-19:20（周日休息）",[]],["일기（意为“日记”）绝对是延南洞超治愈的宝藏日式咖啡店！招牌的黑胡椒土豆法式吐司咸甜交织，店主还会亲手画可爱的小卡送客，被很多人称为“首尔版 wife and husband”，去首尔一定要去坐坐。",[]],["【逛店与避坑小贴士】",[]],["周末必须预约：周五和周六晚上 6 点前基本都需要预约（分场次，比如 14:00-15:40），如果直接去大概率要排队或者被劝返。周日店休，千万别在周日去。",[]],["分量较小：他家的吐司分量偏小，一个人吃可能刚好，两个人吃建议点两份，或者搭配一份沙拉。",[]],["手绘 Coupon 福利：结账时店主会画一张超可爱的小卡（coupon），集齐一定数量还能兑换饮料。",[]],["店内细节：店里很安静，桌上有铅笔和便签可以涂鸦留言，窗边位置阳光很好，超级出片。店外还有小线香和手写小诗，氛围感拉满。",[]],["【必点招牌推荐】",[]],["",["626.webp"]],["",["627.webp"]],["",["628.webp"]],["黑胡椒土豆法式吐司：他家的绝对灵魂！法式吐司外酥里嫩，铺着温热的绵密土豆奶油酱汁，最上面撒上店主亲自现磨的黑胡椒。咸甜交织的口感完全不腻，土豆的颗粒感和吐司的松软完美融合。",[]],["鱼籽土豆泥沙拉吐司：顶上的沙拉很轻盈脆口，和绵密的土豆泥搭配在一起，口感层次非常丰富。",[]],["黑咖与柠檬苏打水：黑咖是深烘的，搭配咸甜的吐司刚好解腻；柠檬苏打水清爽解渴。",[]]]},{"id":4152,"title":"Y2K大头贴","area":"延南洞","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["1.3 「📷｜Y2K大头贴」",[]],["🕙10:30-1:00",[]],["左边机器更Y2K，右边机器更高清。",[]],["拍之前选数量，1张6000韩元的就行，会让选6张背景，拍6张最后选4张。拍的照片都是小小的，会重复出现。",[]],["拍照速度很快，拍完可以在照片上画画，160s时间限制。",[]],["打印一张就够用，选择排版，输入邮箱获得电子版。",[]],["用自助机器换代币可以扭小挂件，换币机器可以现金或者刷卡，把照片装进去，挂在包包上。",[]],["",["629.webp"]],["",["630.webp"]],["",["631.webp"]],["",["632.webp"]]]},{"id":4164,"title":"Made by","area":"延南洞","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["1.4 「📔｜Made by」",[]],["🕙11:00-22:00｜六层独栋，店里有直梯，不用疯狂爬楼梯，能硬逛一个小时以上。",[]],["【支付与避坑小贴士】",[]],["支付方式：店里不可以用微信或支付宝付款，只能刷 Visa/Mastercard 信用卡或者用韩元现金。",[]],["关于退税：有博主反馈这家店不能退税，所以价格就是标价，买的时候注意控制预算。",[]],["注意品控：部分本子可能会有掉纸屑的情况，建议在线下亲自翻翻看内页再决定。",[]],["快闪活动：店里经常有 IP 快闪和集章活动，去之前可以看看他们的 Instagram 确认一下当天的活动。",[]],["【必买推荐】",[]],["",["633.webp"]],["",["634.webp"]],["",["635.webp"]],["韩系贴纸与胶带：它家的灵魂！有各种 IP 文创贴纸、盐系素材、风景拼贴素材，低饱和色系超级多，一张贴纸大概 2000-3000 韩元，虽然有点小贵但真的很难忍住不囤。",[]],["手帐本子与内页：各种空白、点线、日程本，还有 TN本皮 和 DIY 挂件素材，选品很有审美。",[]],["徽章吧唧与钥匙扣：韩系呆萌风、美式复古风都有，买几个挂在包包上或者当伴手礼送朋友都很合适。",[]],["免费自拍打印：弘大店门口有免费的热敏纸自拍打印机器，拍完直接打印出来。",[]]]},{"id":4180,"title":"CHEFFLÉ 치플레","area":"延南洞","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["1.5 「🥞｜CHEFFLÉ 치플레」",[]],["🕙11:00-19:30",[]],["【必买口味推荐】",[]],["淡奶酪原味（Classic）：招牌必点！入口即化，奶香浓郁但完全不齁甜，口感像云朵一样绵密，盲买不踩雷。",[]],["焦糖味（Caramel）：表面有一层焦糖脆壳，可以用小勺子敲着吃，焦糖的微苦中和了芝士的甜，层次感很丰富。",[]],["济州岛抹茶（Matcha）：抹茶味爱好者首选！抹茶的微苦和芝士的香甜平衡得刚刚好，不会觉得腻。",[]],["巧克力味（Chocolate）：巧克力味很浓郁，里面的芝士馅还是半熟状态，一口下去超满足。",[]],["迪拜巧克力芝士蛋糕球（치쫀쿠）：现代首尔店限定新品！里面整块放进舒芙蕾芝士蛋糕，使用 100% 开心果原酱和卡达伊夫面，酥脆又绵密，限量售卖。",[]],["【探店与伴手礼小贴士】",[]],["冷藏更好吃：买回家后一定要放进冰箱冷藏保存（可以放 3 天），冷藏后拿出来吃口感更绵密。",[]],["搭配饮品：如果是在百货店里吃，可以搭配一杯冰美式或奶茶，解腻又舒服。",[]]]},{"id":4191,"title":"Gleamingday弘大水獭","area":"延南洞","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["1.6 「🦦｜Gleamingday弘大水獭」💗",[]],["🕙12:00-21:00",[]],["",["636.webp"]],["",["637.webp"]],["",["638.webp"]]]},{"id":4196,"title":"ROYAL WATER","area":"延南洞","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["1.7 「✨｜ROYAL WATER」",[]],["🕙12:00-21:30｜💳 微信支付宝✅｜https://rwf.kr/",[]],["【逛店与避坑小贴士】",[]],["30ml 常规款 35,000 韩元（约 170-180 元人民币），10ml 便携装更便宜。薄巧限定款 49,000 韩元。",[]],["买三送一：店里经常有“买 3 瓶 30ml 正装，送 1 支 10ml 小样”的活动，小样可以自选味道。",[]],["这家店不能退税",[]],["试香方式很特别：直接打开盖子闻烧瓶口就可以了，很卫生也很方便。",[]],["关于留香：它家主打 2 倍高浓香精配方，喷在皮肤上能留香 8 小时左右，但喷在衣服上留香相对较弱。想留香更久可以喷在手腕、耳后。",[]],["包装精美：店里提供礼盒包装，买来做伴手礼送朋友非常合适，店员还会帮忙喷一点香味在身上。",[]],["【必买热门香型推荐】",[]],["🍫001 Min Cho（薄巧限定）：薄荷巧克力味！前调是清凉薄荷，后调是微甜巧克力，融合得刚刚好，非常特别（注意：这款是限定款，价格稍贵且可能不参与常规活动）。",[]],["🍞「002 Bread 面包」：真的很特别，喷出来是温暖柔软的烘焙香气，不是甜腻路线，反而像走进面包店那种干净又治愈的味道",[]],["10号 Fig Bliss：高级的木质奶香无花果，不是水果甜，而是“无花果叶+奶感木头”的气味，安静又温柔，越闻越上头。",[]],["🪻31号 Pink Water：清透的葡萄柚和木瓜果香，带一点点柔和花香，不甜腻，像洗完澡后很干净的感觉，非常适合夏天。",[]],["38号 Yuzu Oasis：超级干净的韩系柚子香，像白衬衫和阳光的味道，清爽高级，男女都能用。",[]],["54号 Iso E Super：被很多博主称为 Le Labo Another 13 的平替！自然温柔的木质体香，低调但特别耐闻，喷在皮肤上留香很久。",[]]]},{"id":4212,"title":"JUUNEEDU","area":"延南洞","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["1.8 「😴｜JUUNEEDU」",[]],["【逛店与避坑小贴士】",[]],["不能试穿：因为是贴身睡衣，店里不允许试穿。只能靠摸面料和看尺码表来盲买。",[]],["尺码选择：大部分款式只有 L 和 XL 两个码（睡裙是均码 One Size）。160cm 左右、125斤以内的女生穿 L 码，165cm 以上或微胖女生穿 XL 码。男生也可以穿 XL 码当情侣款。",[]],["注意面料打理：棉麻款容易皱，这是设计本身的质感，但千万不要用烘干机，否则严重缩水拽都拽不回来！建议正常机洗后平铺晾干。",[]],["注意品控：有博主反馈部分基础款洗几次后容易起球，但碎花款或褶皱棉款相对耐穿。建议去店里亲自摸一下面料再决定。",[]],["【必买推荐与面料解析】",[]],["褶皱棉睡衣：它家的灵魂面料！摸起来软糯亲肤，透气不闷汗，虽然容易有点皱，但穿着睡觉超级舒服，是很多人回购的首选。",[]],["春夏纱布/华夫格：轻薄透气，适合夏天或初秋，穿在身上像被云朵包裹一样，不粘身。",[]],["秋冬法兰绒/毛绒款：软糯蓬松，保暖性好且不掉毛，秋冬在家穿幸福感极高。",[]],["情侣款/闺蜜款：配色温柔高级，不土不廉价，买两套和对象或闺蜜一起穿，拍照非常出片。",[]],["Family亲子空间：3楼有专门的小宝宝睡衣和孕妈妈睡衣，尺码齐全，面料同样舒适，适合全家一起挑。",[]]]},{"id":4224,"title":"Visual Aid","area":"延南洞","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["1.9 「🛍️｜Visual Aid」",[]],["🕙11:00-21:00｜💳 微信支付宝✅｜https://visualaid.kr/product/｜虞书欣同款买手店",[]],["【价格与折扣攻略】",[]],["价格区间：小几百到上千人民币都有，T 恤和帽子大概 200-500 元，外套和连衣裙 600-1200 元。",[]],["退税政策：单笔满 15,000 韩元即可退税，务必带上护照原件！结账时主动出示护照，直接付免税价。",[]],["【逛店与避坑小贴士】",[]],["找店技巧：店铺在地下 1 层，门头可能不太显眼，跟着导航找的时候注意看路边的指示牌，或者找旁边的咖啡店作为参照物。",[]],["货量多但排列紧：店里衣服量很大，货架排得比较紧，拍出来的衣服可能显得有点挤，耐心多翻一翻。",[]],["店员英语一般：有博主反馈店员英语不太好，但态度很好，而且支持微信支付宝，沟通基本没问题。",[]],["注意辨别真假：弘大附近有很多仿冒店，如果看到\"50% 折扣\"的 Visual Aid 一定要警惕，正品不会打这么低的折扣。认准官方门店地址，不要贪便宜。",[]]]},{"id":4234,"title":"Photogray","area":"延南洞","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["1.10 「📷｜Photogray」",[]],["🕙24H",[]],["【拍照与避坑小贴士】",[]],["价格：一次拍摄 7000 韩元（约 34-35 元人民币），至少打印 2 张，可以加印不能减少。",[]],["支付方式：支持 Visa/Mastercard 信用卡和韩元现金。注意：如果付现金只收 1000 面额的纸币，店里通常有自助大额钞换钱机；不支持银联卡、微信和支付宝。",[]],["机器设置：机器有中文选项，对游客非常友好，操作起来没有障碍。",[]],["提前准备好姿势：付款确定的一瞬就会开始倒计时，每个动作限时 8 秒，且有两次机会。一定要提前和同伴商量好姿势，不然倒计时结束可能还没摆好。",[]],["可以加贴纸特效：加不加贴纸特效是两种感觉，加贴纸更有韩系氛围感，建议多尝试几种风格。",[]]]},{"id":4242,"title":"Youssoful","area":"延南洞","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["1.11 「✨｜Youssoful」",[]],["🕙11:00-21:30｜💳 微信支付宝✅｜https://youssoful.kr",[]],["【逛店与避坑小贴士】",[]],["它家主打 25%-30% 的纯香精浓度（Extrait de Parfum），留香时间长达 8-10 小时",[]],["MBTI 选香：店里会有性格测试来帮你推荐适合的香型，可以直接让店员帮忙测一下。",[]],["注意前中后调：它家香水前调可能会有一点点冲（比如葡萄柚的酸涩感），但过十几分钟中后调出来后会非常温柔，建议喷在手腕上等一会儿再闻。",[]],["护手霜也超好闻：除了香水，它家的护手霜香味很正、持香久，非常适合买来当伴手礼。",[]],["免税店对比：如果时间充裕，可以去免税店对比一下价格，配合金卡折扣和返点，价格会更划算。",[]],["退税政策：可以退税，结账时出示护照原件即可，部分门店是直接免税价结算。",[]],["【必买热门香型推荐】",[]],["Saint Moritz（圣莫里茨）：“崔胜澈站姐香”！前调是清爽的葡萄柚，中调是带着绿意的无花果，后调是温柔的白麝香。不是甜腻的水蜜桃，而是清冷又温柔的韩女体香，秋冬穿大衣喷它氛围感拉满。",[]],["Emporia Cotton（帝国棉）：超高级的伪体香代表！淡雅花香混合干净麝香，再带一点点绿感，像刚洗完的白衬衫，温柔舒服，非常适合日常通勤。",[]],["Berry Sexy（莓果诱惑）：朴时宇翻包自用香！苹果、草莓搭配玫瑰和奶油感，甜甜的又不失精致，适合喜欢甜系香气的女生，喷完就是可爱大小姐。",[]],["Coco Hawaii（夏威夷可可）：椰子奶香混合柠檬果肉的汁水，带着微苦的清凉感，像在海边吹着海风，非常适合春夏和度假。",[]],["Rothes（罗伊斯）：干燥沉稳的木质调，柔和地散发出来，有点像 伊索 的风格但更有呼吸感，男女都能喷，清冷又高级。",[]],["Puglia Ostuni（意大利小镇）：像是夏天穿白裙在意大利小镇散步，混合了柑橘的微酸、青草的清爽和柔软的木香，不甜不腻，非常提气质。",[]]]},{"id":4258,"title":"Paupli","area":"延南洞","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["1.12 「✨｜Paupli」",[]],["🕙12:00-20:30｜💳 微信支付宝✅｜https://pau-pli.com/",[]],["【逛店与避坑小贴士】",[]],["主打“日常香气”（Daily fragrance routine），味道偏干净清爽的伪体香，不冲鼻不张扬。",[]],["香水大概在 49,000 - 75,000 韩元（约合人民币 250-380 元），护手霜和香氛袋更便宜，性价比很高。",[]],["满额赠礼：店里经常有阶梯满额活动（比如近期三周年活动），消费满一定金额可以参与抽卡或拿赠品，最高能拿到 75ml 香水正装！",[]],["打卡薅羊毛：关注官方社交媒体账号通常能领 2ml 迷你香水小样，发布动态还能获赠正装香氛袋，不买东西进来闻香也能拿小样。",[]],["慢慢试香：它家的香水前调可能有一点点冲，但中后调出来后会非常温柔，建议喷在手腕上等十几分钟再闻，不要急着做决定。",[]],["护手霜超适合做伴手礼：它家的护手霜质地润而不腻、吸收快，香味和香水同系列，包装精致。",[]],["免费拓印明信片：店里可以免费制作一张拓印明信片，把自己喜欢的香味记忆用特别的方式带回家。",[]],["【必买热门香型推荐】",[]],["No.9 Joy Garden（佛手柑/粉红玫瑰/香草）：很多人回购的招牌！清爽的佛手柑和粉红玫瑰开场，后调落到柔软的香草里，像走进一个正在晒太阳的花园，干净又温柔。",[]],["No.10 Honey Blooming（蜂蜜/茉莉/雪松木）：三周年重磅新香！湿润泥土里的温柔花香交织蜂蜜的自然甜意，微带烟熏感，甜而不腻，安静又深邃，非常适合秋冬。",[]],["No.11 Zesty Coco（柑橘/胡萝卜/椰子/无花果）：另一款新香！胡萝卜和柑橘的鲜爽开场，慢慢过渡到顺滑的椰子奶香，独特又充满元气，不容易撞香。",[]],["No.3 Overjoyed（香蕉/甘蔗/檀香木）：夏日甜甜感，带着淡淡的木质调，清爽不齁甜。",[]],["No.2 Before Dating（草莓/茉莉/麝香）：像草莓蛋糕般甜美纯真的微甜悸动，约会喷它氛围感拉满。",[]],["4号御姐香：偏木质调或柚子调，带有一种成熟、清冷的氛围感，适合喜欢低调伪体香的女生。",[]]]},{"id":4275,"title":"LOE","area":"延南洞","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["1.13 「✨｜LOE」",[]],["🕙11:30-21:00｜💳 微信支付宝✅｜https://loe-cosmetics.com/",[]],["【逛店与避坑小贴士】",[]],["B1层是无人试香区，可以慢悠悠沉浸式试香。试好拿卡片去 1 楼结账，能现场刻字。",[]],["免费刻字：在线下门店买香水，可以免费在瓶盖上激光刻字（支持英文、韩文、数字、标点符号和 emoji 图案），最多 14 个字符，不支持汉字。几秒钟就刻好，仪式感满满，非常适合当伴手礼送朋友。",[]],["价格对比：线下门店 50ml 约 46,000-49,000 韩元，退税后大概 200-300 元人民币。但是，如果在 新罗、乐天 等免税店 App 上提前下单，价格可能只要 114-160 元人民币左右，比线下便宜很多！",[]],["购买建议：如果需要刻字，一定要去线下门店买；如果不刻字且追求极致低价，建议提前在免税店 App 上下单，去机场提货。",[]],["留香时间较短：有博主反馈它家香水留香时间大概只有 2-4 小时（这是平价淡香水的通病），建议多喷点，或者搭配它家的同系列护手霜和香氛喷雾来延长留香。",[]],["护手霜很惊喜：除了香水，它家的护手霜滋润度好、不油腻且留香持久，价格也很亲民（约 14,000 韩元），非常适合买来送人。",[]],["支付与退税：支持微信、支付宝和信用卡。单笔满 15,000 韩元即可当场退税，结账时直接付免税价。",[]],["【必买香型推荐】",[]],["White Shirt（白衬衫）：人气王！干净清爽的皂香，像刚洗完晒过太阳的白衬衫，男女都能用的中性香，BTS 田柾国和 TXT 崔秀彬同款。",[]],["Peach & Tea（桃子茶）：甜甜的冰镇桃子果茶香，清新不腻，非常适合春夏，TXT 崔然竣同款。",[]],["Sincere Wood（沉静松木）：清冷柔和木质调，清凉松叶加柔和檀香，被很多人称为 Le Labo 33 的平价替代，越闻越稳，适合秋冬。",[]],["Harsh Green（粗粝的绿）：还原了花店修剪完花枝后的青草味，充满汁水的绿意，非常特别，适合喜欢独特绿意的人。",[]],["Rose Chiffon（玫瑰轻纱）：清冷的玫瑰调，交织粉玫瑰与栀子花，淡淡的香味轻盈甜美，不甜腻，很适合夏天。",[]],["Sunny Breeze（晴天微风）：清新的柠檬柚子与柑橘木质香，自带阳光海风感，干净治愈。",[]],["Lazy Vanilla（慵懒香草）：尾调特别喜欢的干净皂香，持久度在 LOE 里算意外不错的，值得入手。",[]]]},{"id":4293,"title":"Mono mansion","area":"延南洞","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["1.14 「📷｜Mono mansion」",[]],["【价格与支付方式】",[]],["价格：基础无美颜 5000 韩元/组，精致美颜 6000 韩元/组（推荐选美颜，自然柔和不假面），竖版四宫格 4000 韩元。",[]],["支付方式：支持 Visa/Mastercard 信用卡和韩元现金。注意：如果付现金只收 1000 面额的纸币，机器不找零，门口通常有自助换钱机。",[]],["中文界面：机器屏幕支持中文选项，对游客非常友好。",[]],["【拍摄流程与姿势攻略】",[]],["提前想好动作：付款后立刻启动倒计时，每个动作限时 8-10 秒，一共连拍 10 张，最后选 4 张打印。",[]],["眼睛看镜头底部：不要盯着屏幕里的自己看，眼神会偏下。看着摄像头底部或镜头下方，眼神会更有力量，显得更自然。",[]],["站远一点：稍微退后几步，动作幅度大一点更出片，避免脸部变形。",[]],["选图倒计时：选图时屏幕右上角有 60 秒倒计时，不要犹豫，时间一到系统会自动默认选前 4 张，没法修改！",[]],["24 小时保存电子版：拍完打印出来的小票左上角有二维码，必须在 24 小时内扫码下载高清原图和拍摄视频！过期就失效了，视频里还可以截图当 Live 图。",[]]]},{"id":4304,"title":"Carlyn","area":"延南洞","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["1.15 「👛｜Carlyn」",[]],["🕙11:00-19:00｜https://www.carlynmall.com/",[]],["【逛店与避坑小贴士】",[]],["价格区间：大部分包包3-5万韩元（150-250 元），部分热门款或新款在 500-700 元左右。",[]],["退税政策：弘大旗舰店是机场退税（结账时给护照，拿小票和退税单去机场退），不是当场退税。一定要保管好小票和退税单，去机场时别忘了退！",[]],["支付方式：支持 Visa/Mastercard 信用卡和韩元现金。部分门店可能不支持银联卡或微信/支付宝，建议备好信用卡或韩元现金。",[]],["注意面料打理：云朵款（绗缝尼龙）可以水洗，很好打理；光面款用湿巾擦擦就行；绒面款像磨砂皮手感，弄上清水擦干不会有印子，但要注意防脏。",[]],["有时还会有满额赠送挂件或参与抽奖的促销活动，付款前可以问问店员有没有当前活动。",[]],["【必买热门款式推荐】",[]],["COZY 云朵饺子包：它家的绝对招牌！软糯的饺子包型，自重很轻，容量适中，不卡身高。乳白色和浅香槟色最火，是百搭神器。",[]],["SOFT 云朵腋下包：孙胜完同款！贝壳包型，侧面有小口袋，肩带长且可调节，冬天穿厚衣服也不会卡袖子，单肩斜挎都好看。",[]],["DAPE 双肩包：IVE 李瑞同款！收缩包口设计，顶部有提手，迷你版对小个子更友好。背起来像把云朵和棉花糖背在身上，可爱又酷。",[]],["BREAD 波士顿包：容量最慷慨，单肩通勤、手提周末都合适，适合装平板或日常大件物品。",[]],["FLIP 翻盖包：磁吸翻盖设计，梯形轮廓干净利落，容量和便利性都在线，通勤背非常显气质。",[]]]},{"id":4318,"title":"AK PLAZA","area":"延南洞","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["1.16 「🏬｜AK PLAZA」💗🚾",[]],["🕙11:00-22:00（周六日10:30开始营业）",[]],["【🛗楼层逛店指南】",[]],["1F（美妆与文创）：Chicor 美妆店（新世界旗下，本土与海外品牌都有，支持退税）、Artbox 文创杂货，以及经常换新的 IP 主题快闪店（近期有守护甜心快闪）。",[]],["2F（追星与 IP 天堂）：WITHMUU K-pop 专辑与应援棒专卖店（追星女孩必去）、Sanrio 三丽鸥文房具 POP UP STORE、NICK&NICOLE 韩系服饰。",[]],["3F（生活与 IP 周边）：无印良品（MUJI）、Supy弘大店、轻松熊、角落生物周边、眼镜与文具店。",[]],["4F（快时尚与动漫）：SPAO 韩国国民快时尚、动漫展览、各类动漫周边。",[]],["5F（二次元与餐饮）：大型动漫周边店、潮玩手办、漫画 Cafe、韩餐与日料。",[]],["【支付与避坑小贴士】",[]],["支付方式：大部分店铺支持银联卡、Visa/Mastercard 信用卡。",[]],["关于退税：部分店铺（如 Chicor、Artbox）支持退税，记得结账时主动出示护照原件；但部分 IP 周边店或快闪店可能不支持退税，付款前一定要问清楚。",[]],["注意比价：部分 IP 周边（如轻松熊盲盒、谷子）的价格可能比日本或国内代购贵，建议理性消费，不要看到就盲目上头。",[]],["注意品控：在买文创本子或贴纸时，建议亲自翻翻看内页和品控，确认满意再买。",[]]]},{"id":4333,"title":"2. 【弘大】（40）（3）","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2. 【弘大】（40）（3）",[]]]},{"id":4334,"title":"Hongseu八爪鱼 홍스쭈꾸미","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.1 「🐙｜Hongseu八爪鱼 홍스쭈꾸미」（1H，15:00前吃完～）",[]],["🕙11:30-2:00｜💳 微信支付宝✅",[]],["【价格与实用小贴士】",[]],["按人头收费：套餐是按人数收费的（比如 16,000 韩元/人），几个人就必须点几份的套餐，里面包含章鱼锅和最后的飞鱼籽炒饭。",[]],["错峰就餐：这家店非常火，饭点（晚上5-8点）排队可能长达1-2小时。如果想少排队，建议在下午3-5点之间去，或者刚开门的11:30就去拿号。",[]],["提前取号排队：这家店非常火，周末和饭点去通常需要排队取号。门口会有一张表，在上面写上名字等着服务员出来叫号划名。建议稍微错峰去，或者到了先取号，再去附近逛逛，等快到号了再回来。",[]],["微辣也很辣：韩国辣酱的后劲比较大，如果你平时不太能吃辣，一定要选“微辣（Less Spicy）”。",[]],["衣服会留味：辣炒章鱼的味道非常大，吃完衣服和头发上都会腌入味。建议穿不容易吸味的衣服，或者把外套脱下来放在店里的储物柜/座椅里。",[]],["服务速度：因为生意太好，有时候服务员会比较忙，可能不会主动帮你翻炒，需要自己叫服务员。",[]],["大众点评活动：有博主反馈在大众点评上发 4 张图以上的好评，可能会有一些小优惠或赠送饮料，去之前可以看看最新的活动。",[]],["【必点招牌推荐】",[]],["",["639.webp"]],["",["640.webp"]],["",["641.webp"]],["五花肉小章鱼锅：店里的绝对招牌！章鱼新鲜 Q 弹，五花肉肥而不腻，裹满浓郁的韩式辣酱，越吃越上头。辣度可选，但即使是微辣（Less Spicy）对不太能吃辣的人来说也挺辣的，建议备好解辣饮料。",[]],["飞鱼籽炒饭：这是章鱼锅的灵魂！吃到剩下1/3酱汁时，记得喊店员“볶음밥 해주세요”（帮忙炒饭）。店员会把米饭、飞鱼籽和海苔碎倒进锅里翻炒，颗粒爆浆，带着焦香和甜辣味，非常好吃。",[]],["芝士土豆饼：外酥里嫩，单吃或者蘸着章鱼锅的辣汁吃都绝配，很多食客吃完都会念念不忘。",[]],["蒸蛋：口感 Q 弹，可以用来解辣，不过吃到后面边缘可能会焦糊发苦，建议趁热吃。",[]],["鱼饼汤：很多博主推荐，热乎乎的鱼饼汤很鲜，适合在辣炒章鱼的时候搭配着喝，解辣又暖胃。",[]]]},{"id":4355,"title":"Granhand","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.2 「✨｜Granhand」22",[]],["🕙13:00-22:00｜💳 微信支付宝 ✅｜https://granhand.com/",[]],["【逛店与避坑小贴士】",[]],["免费 DIY 刻字：买香水可以免费在瓶身上定制英文字母或爱心（10 个字以内），现场就能印好。非常适合做伴手礼，仪式感满满。",[]],["现场退税：单笔满 15,000 韩元即可当场退税，结账时主动出示护照原件，直接付免税价。",[]],["关于留香时间：它家香水主要是 EDT（淡香水），留香时间相对较短（大概 2-4 小时）。建议不要只喷在皮肤上，可以喷在头发、衣服或枕头上，留香会更久。",[]],["试香技巧：店里香薰味比较杂，直接闻容易晕。建议喷在试香纸上，拿到门口或外面逛一圈再闻，等酒精味散去后中后调出来再决定。",[]],["核对账单：有博主反馈部分门店结账时可能会算错价格，建议结账时仔细核对小票再付款。",[]],["确认规格：不是所有香味都有 100ml 和 200ml 的塑料瓶，有些热门款（如 Cococay）可能只有玻璃瓶。买之前一定要和店员确认好规格。",[]],["免费凉茶：弘大店的 B1 层有免费的特色凉茶，入口是柠檬和薄荷的清新，后调有甘草的清甜。",[]],["【🫙三个系列怎么选】",[]],["Multi Perfume（塑料瓶）：性价比首选！100ml 约 3.5万韩元，200ml 约 4.5万韩元。DK 同款就在这个系列，留香相对较短，适合当居家香或喷衣服不心疼。",[]],["Perfume（玻璃瓶）：留香适中，130ml 约 5.5万韩元。味道偏花果香，包装更精致，适合做伴手礼。",[]],["Signature（玻璃瓶）：味道最浓郁，50ml 约 11万韩元。适合喜欢浓香型、追求留香时间的人。",[]],["【必买热门香型推荐】",[]],["Susie Salmon（单打王 & DK 同款）：清新的花果香混合淡淡的木质调，前调是柠檬和柑橘，后调是檀香和白麝香。不甜腻，男女都能喷，日常用超级合适。",[]],["Marine Orchid（韩国网销 No.1）：清冷柔和的海洋花香调，像海风吹过森林般的清新感，生人勿近但又很有品味，非常适合喜欢清冷风的人。",[]],["Cococay（芒果椰子）：浓郁的热带水果糖香，芒果、树莓混合椰子香，甜美明媚的少女感。注意这款通常只有玻璃瓶，味道较浓，喜欢甜香的人必入。",[]],["Lucien Carr（奶味木质调）：温润干净的木质调，带着一点柠檬的清新，和 Diptyque 无花果淡香 有异曲同工之妙，非常适合秋冬穿大衣时喷。",[]],["Nube（清爽茶香）：特别清爽的茶香味，茉莉 + 玫瑰 + 铃兰 + 香草，甜而不腻，很恬淡，适合喜欢清新感的人。",[]],["Violette：带有绿意的紫罗兰花香，温柔不甜腻，尾调是沉静的木质香，有种清冷疏离的松弛感。",[]]]},{"id":4376,"title":"Morning Glory（모닝글로리）","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.3 「📔｜Morning Glory（모닝글로리）」🚾22",[]],["🕙10:00-22:00（周日11:00-21:30）｜https://www.morningglory.co.kr",[]],["🛗【楼层分布与必逛推荐】",[]],["一楼（基础文具与自有品牌）：以 Morning Glory 自有品牌的文具、基础工具、各种笔和胶带为主。靠近楼梯的地方有个小台子，可以自己挑选喜欢的饰品做成挂件，还能找到一些韩剧同款文具。",[]],["二楼（设计师 IP 集合市集）：这才是重头戏！二楼像一个小型的手帐集市，有 150+ 个不同的 IP 和设计师品牌（如 Libet、Boniroom 等热门作者）。每个 IP 都有单独的小隔间，按颜色分类摆放，贴纸、胶带、便签、手帐装饰应有尽有。",[]],["休息区与免费厕所：二楼设有休息区，入口处有公共饮水机，逛累了可以坐下休息。最赞的是店里提供免费厕所。",[]],["【逛店与避坑小贴士】",[]],["贴纸、便签、胶带等小物件大概在 1000-3000 韩元（约合人民币 5-15 元），性价比很高。",[]],["支付方式：支持信用卡和韩元现金。",[]],["关于退税：这家店不支持退税，所以直接按标价购买即可，不用纠结退税流程。",[]],["核对账单：有博主反馈结账时偶尔会被多收钱，结账时仔细核对小票再付款。",[]],["慢慢逛：二楼的 IP 和款式非常多，很容易挑花眼，慢慢逛找灵感。",[]]]},{"id":4388,"title":"Object","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.4 「📔｜Object」💗（1H）21",[]],["🕙11:00-21:00｜💳 微信支付宝✅｜https://insideobject.com/",[]],["🛗【楼层分布与必逛推荐】",[]],["1楼（主题快闪展厅）：一楼主打季度主题快闪，会定期更换不同文创 IP 展。目前（2026年10月-11月）正在展出韩国艺术家 Soft Thumbnail 的“13个家族”布偶装置展，超级出片！进门就能挑到精致的贴纸、明信片和小卡。",[]],["2-3楼（核心文创杂货区）：这两层是店铺主要区域，汇聚了 150+ 个韩国本土设计师品牌。包含手帐胶带、笔记本、挂件、帆布包、服饰配饰和居家小杂货。整体审美统一耐看，自用、送礼都适配。",[]],["4楼（DIY手作专区）：四楼是超小众的 DIY 区域，可以亲手定制小物件！支持刺绣、贴布等 DIY 创作，能选包包、杯套或挂绳作为载体，现场熨烫出专属挂件，体验感拉满。",[]],["【逛店与避坑小贴士】",[]],["贴纸、明信片等小物件大概 1000-3000 韩元，帆布包、陶瓷杯等大概 2万-4万韩元。",[]],["退税政策：可以退税！单笔满 3万韩元记得结账时主动询问店员拿退税单，去机场自助机办理退税。",[]],["预留充足时间：Object 有四层楼，且每层风格不同，建议预留至少 1-2 小时慢慢逛，很容易挑花眼。",[]],["核对账单：有博主反馈结账时偶尔会被多收钱，建议结账时仔细核对小票再付款。",[]]]},{"id":4399,"title":"Sappun","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.5 「🥿｜Sappun」22",[]],["🕙12:00-22:00｜💳 微信支付宝✅｜https://www.sappun.co.kr/",[]],["*林荫道店最大，时间不富裕可以不逛这家。",[]],["【逛店与避坑小贴士】",[]],["主打韩式极简 + 全天舒适 + 高性价比，被大家称为“韩女国民平价女鞋”。",[]],["注意尺码：韩国鞋子普遍偏窄，部分款式可能偏小。建议试穿时选大半码，或者下午脚微微胀的时候去试穿，这样最准。",[]],["试穿体验：一定要去试衣间（试鞋区）上身走几步试试，感受鞋底的软弹度和鞋头的宽度。",[]],["当场退税：单笔满 15,000 韩元即可当场退税！结账时主动出示护照原件，直接付免税价。",[]],["核对账单：有博主反馈结账时偶尔会被多收钱，建议结账时仔细核对小票再付款。",[]]]},{"id":4408,"title":"NyuNyu","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.6 「🛍️｜NyuNyu」2245",[]],["🕙11:00-22:45",[]]]},{"id":4410,"title":"Chaakan","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.7 「🥾｜Chaakan」22",[]],["🕙12:00-22:00｜💳 微信支付宝✅｜https://chaakan.co.kr/",[]],["【价格与支付退税】",[]],["大部分鞋子在 3万-5万韩元（约合人民币 150-250 元），特价区甚至只要几十块钱。",[]],["支持微信/支付宝：大部分门店支持支付宝和微信支付，结账时直接扫码。",[]],["退税政策：单笔满 15,000 韩元即可当场退税，结账时主动出示护照，直接付免税价。",[]],["【逛店与避坑小贴士】",[]],["尺码偏小：有博主反馈它家部分款式（尤其是芭蕾风）偏小一码，建议买大一码。",[]],["一定要试穿：但不同款式的脚感有差异，千万不要盲目拍码数，一定要去试衣间上身走几步试试。",[]],["注意材质：有博主反馈它家部分鞋子是 PU 材质而非真皮，但考虑到这个价格，性价比依然很高，建议去店里亲自摸一下材质再决定。",[]],["满赠活动：圣水店经常有满赠活动（比如买 2 件送托特包，买 3 件送拖鞋），结账前记得问问店员。",[]],["【必买款式推荐】",[]],["芭蕾风玛丽珍鞋：它家的绝对招牌！软底设计，上脚超级舒服，银色、黑色、红色蝴蝶结款都超火，搭配裙子或牛仔裤都很出片。",[]],["厚底增高鞋：很多博主都在穿，6 公分的增高设计很显腿长，而且鞋底软乎乎的，暴走一天也不累脚。",[]],["复古雨靴：配色超绝，不仅防水还很有设计感，下雨天穿它出门拍照依然很韩系。",[]],["秋冬长靴与短靴：皮质软糯，版型修饰腿型，价格比国内专柜便宜很多，性价比极高。",[]],["特价区捡漏：圣水店的 B1 层有隐藏特价区，全部鞋子只要 45,000 韩元（约合人民币 200 元）！",[]]]},{"id":4427,"title":"Olens","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.8 「👁️｜Olens」",[]]]},{"id":4428,"title":"emis","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.9 「🧢｜emis」2230",[]],["🕙10:30-22:30",[]],["有弘大限定帽子。",[]],["材质丰富：包含刷毛（Brushed）、灯芯绒、天鹅绒、针织和小 Logo 刺绣款，质感比经典款更高级。",[]],["配色高级：主打美拉德色系，如奶咖、燕麦、棕色、炭灰等，低调耐看。",[]],["EMIS TAG BRUSHED BALL CAP：这是限定系列里最火的一款，没有以前夸张的大 Logo，帽子后面有小小的刺绣标，非常低调百搭。",[]],["首尔限定刺绣款：部分新款背面有“SEOUL”英文刺绣，呼应首尔限定主题，黑色配粉标、棕色配蓝标，细节感拉满。",[]],["试戴检查版型：试戴的样帽通常版型很好，但店员从仓库拿出来的新帽子可能会歪一点。买的时候一定要自己调整一下帽檐，检查对称度，不要直接付款走人。",[]]]},{"id":4436,"title":"Chicor","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.10 *「💄｜Chicor」2330",[]],["🕙11:00-23:30｜https://chicor.com",[]]]},{"id":4438,"title":"Musinsa Store","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.11 「🛍️｜Musinsa Store」23",[]],["🕙11:00-23:00",[]],["这是最经典的韩潮品牌集合店，聚集了 100 多个本土小众设计师品牌（如 insilence、abnormal、aeae 等）。楼层分区清晰，B1 和 1-3 层偏街头潮牌，4 层偏通勤韩女风。经常有不定时打折，黑五期间折扣力度极大，适合想淘独特设计款、追求个性穿搭的人。",[]]]},{"id":4441,"title":"Kakao Friends","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.12 「🧸｜Kakao Friends」22",[]],["🕙10:30-22:00",[]]]},{"id":4443,"title":"Jopok炒年糕 홍대조폭떡볶이","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.13 「🍢｜Jopok炒年糕 홍대조폭떡볶이」1:30",[]],["🕙11:30-1:30",[]],["【点餐与支付攻略】",[]],["自助点餐机：门口自助点餐机上点单付款，机器有中文翻译，操作非常简单。点完拿小票等叫号取餐。",[]],["支付方式：支持信用卡和韩元现金。部分博主反馈不支持银联卡、微信和支付宝。",[]],["一人食友好：店里座位很多，靠路边还有围起来的区域，一个人去点一份炒年糕加鱼饼汤就能吃饱。",[]],["免费鱼板汤：店里提供免费的鱼板汤，可以无限续加。吃完辣炒年糕后喝一碗，非常解辣解腻，舒服到想哭。",[]],["自助服务：进店后自己找位置，点餐后等叫号。用餐结束后，需要自己把餐具和餐盘拿到回收台放好，这是韩国很多平价小店的规矩，记得配合一下。",[]],["【逛店与避坑小贴士】",[]],["自己回收餐盘：吃完后需要自己把托盘和餐具送到餐盘回收处。",[]],["注意售罄：因为人气很旺，去晚了有些热门菜品（比如血肠、炸物）可能会售罄，建议早点去。",[]],["辣度提示：如果不太能吃辣，可以点单时备注“微辣”或“少辣”。",[]],["核对账单：有博主反馈结账时偶尔会被多收钱，建议结账时仔细核对小票再付款。",[]],["【必点招牌推荐】",[]],["辣炒年糕：店里的灵魂！年糕软糯 Q 弹，裹满浓郁的甜辣酱汁，味道浓郁但不会太辣。",[]],["鱼饼汤：热乎乎的鱼饼汤是炒年糕的绝配！鱼饼厚实 Q 弹，吸饱了鲜美的汤汁。",[]],["血肠（米肠）：QQ 弹弹的口感，搭配炒年糕的酱料吃别有一番风味，很多博主都推荐。",[]],["炸物拼盘：外皮酥脆香气逼人，里面还藏着血肠和各种炸料，层次感丰富，完全不油腻。",[]],["紫菜包饭：料很足，和炒年糕搭配着吃，能很好地中和辣味，吃得非常爽。",[]]]},{"id":4462,"title":"泡泡玛特","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.14 「🧸｜泡泡玛特」22",[]],["🕙11:00-22:00｜💳 微信支付宝✅",[]],["【楼层分布与必买推荐】",[]],["1 楼（最新系列与 SP 专区）：C 位留给 Skullpanda（SP）系列，比如超火的“星星人”系列、四幕戏系列等。还有各种毛绒挂件、法棍包、斜挎包和手办，韩国限定萌粒和吊卡也常在这里。",[]],["2 楼（热门 IP 大合集）：Dimoo、Hirono（小野）、Crybaby（哭娃）以及 Labubu 的一二代和世界杯系列等。盲盒、大娃、场景摆件和毛绒挂饰种类非常全，很多国内断货的款式这里能补上。",[]],["【逛店与避坑小贴士】",[]],["不要摇盒：店内规定不允许摇盒，但允许拍照。",[]],["价格参考：常规盲盒约 16,000 韩元（约 80 元人民币），毛绒挂件约 24,000-35,000 韩元（约 120-175 元人民币），大娃和场景摆件约 40,000-80,000+ 韩元。",[]],["支付方式：支持微信支付和支付宝，也支持信用卡和韩元现金，对游客非常友好。",[]],["机场退税：单笔满 15,000 韩元即可退税。结账时出示护照原件，拿好退税单和小票，机场退税。",[]]]},{"id":4473,"title":"Reclow","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.15 「🛍️｜Reclow」23",[]],["🕙10:30-23:00｜💳 微信支付宝 ✅｜https://reclow.com/",[]],["【逛店与避坑小贴士】",[]],["价格亲民：墨镜和光學镜框最低只要 2 万多韩元（约合人民币 100 出头），大部分款式在 2万-5万韩元之间，雨靴大概 4.5万韩元（约 230 元）。算上汇率和退税，比国内代购便宜很多。",[]],["当场退税：单笔满 15,000 韩元即可当场退税！结账时主动出示护照原件，直接付免税价。",[]],["注意尺码：雨靴的 36-39 码经常售罄，如果脚型偏大或偏小，建议早点去挑；眼镜一定要亲自试戴，确认不夹头、不压脸再买。",[]],["中文服务：弘大店有会讲中文的店员，沟通无障碍，服务也很细致温柔。",[]],["核对账单：有博主反馈结账时偶尔会被多收钱，建议自己先算好总价，结账时仔细核对小票再付款。",[]],["【必买热门单品推荐】",[]],["蔡亨源同款黑框：极简高级的韩系版型，巨修饰方圆脸和高颧骨，上脸瞬间脸型流畅，镜架超轻，久戴不压鼻。",[]],["折叠墨镜：可以折成手掌大小，轻便便携，眼镜盒内置小镜子，收纳超方便，颜值和实用性拉满。",[]],["PIRPIR 太阳眼镜：经典百搭黑框，超级“显脸小”神器，素颜出门也能轻松拿捏韩系氛围感。",[]],["VEVE 无框眼镜：Y2K 智性风，自带精致冷感氛围，适合搭配西装或简约 T 恤，提升整体穿搭质感。",[]],["轻便携雨靴：莫兰迪色系，设计简约大气，打破传统雨靴的“村感”，雨季必备。",[]],["毛茸茸配饰：围巾、手套、耳包和包包，软糯亲肤，多巴胺配色非常可爱，适合秋冬。",[]]]},{"id":4488,"title":"阿迪达斯弘大品牌中心","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.16 「🛍️｜阿迪达斯弘大品牌中心」22",[]],["🕙11:00-22:00（周五～周日10:30开门）｜💳 微信支付宝✅｜https://www.adidas.co.kr/",[]],["【逛店与避坑小贴士】",[]],["楼层分布：1-2 层主要是三叶草服饰、运动外套和配饰；3 层是鞋款集合区。",[]],["机场退税：单笔满 15,000 韩元即可退税。（注意：弘大店是机场退税，一定要保管好单据）",[]],["价格参考：Samba 白色/黑色约 179,000 韩元，其他颜色约 139,000 韩元；外套一般在 600-700 元人民币左右。算上汇率和退税，比国内专柜划算一些。",[]],["注意尺码：韩版阿迪的版型有些偏小，尤其是上衣和外套，建议试穿时拿大一号。",[]],["试穿规则：一般会限制一次性拿 3 件进去试。如果确定要买，拍下试穿的吊牌照片，最后去 1 楼收银台买单时展示照片即可。",[]],["【必逛亮点与限定款】",[]],["韩国限定款：店里有很多国内没上市的限定款，比如 三叶草 的丘比特联名系列（爱心元素卫衣、上衣）、SL72 OG 限定鞋款等，来首尔千万别错过。",[]],["热门单品：Samba 德训鞋（白色和黑色热门色容易断码，建议早点去）、华夫格外套（黑白两色码数全）、豹纹系列和黑色薄纱半裙，搭配运动鞋非常出片。",[]],["DIY 印花服务：1 楼可以拿新衣服去 2 楼付费印名字或图案，大概 20 分钟就能搞定，还能凑单满减，非常有纪念意义。",[]]]},{"id":4500,"title":"MUSINSA STANDARD","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.17 「🛍️｜MUSINSA STANDARD」23",[]],["🕙11:00-23:00｜延南洞那家最大，时间不够就不逛了",[]],["自有品牌，韩国优衣库，平价版8秒。",[]],["特色：很多韩国本地人和博主公认“最好逛”的一家。裤子版型非常全，男女装尺码都很齐。",[]],["适合人群：想一次性试穿各种基础款、找合适裤长和版型的人，尤其是男生买休闲裤首选这家。",[]]]},{"id":4505,"title":"SHOOPEN","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.18 「👟｜SHOOPEN」22",[]],["🕙11:00-22:00｜💳 微信支付宝✅｜https://shoopen.elandmall.co.kr",[]],["【逛店与避坑小贴士】",[]],["鞋子大多在 1万-5万韩元（约合人民币 50-250 元），包包和配饰大概 2万-4万韩元。",[]],["当场退税：单笔满 15,000 韩元即可当场退税。",[]],["注意尺码：韩版鞋码可能偏小或偏大，建议一定要亲自试穿，不要盲目拍码数。",[]],["自助试穿：店里是自助模式，展示架下有各尺码的鞋盒，试完记得放回原位，保持店铺整洁。",[]],["核对账单：有博主反馈结账时偶尔会被多收钱，建议结账时仔细核对小票再付款。",[]],["【必买款式推荐】",[]],["德训鞋：它家的热门款，上脚非常舒适，鞋底有软垫，有“踩屎感”。",[]],["玛丽珍鞋与平底单鞋：款式更新快，皮质软糯，搭配裙子或牛仔裤都很出片，适合日常通勤和约会。",[]],["勃肯鞋与毛毛拖：秋冬必备，魔术贴设计穿脱方便，保暖又百搭，很多韩国女生都在穿。",[]],["云朵包与波点包：肩带软噗噗的，看着很轻，适合日常背，价格大概 200 多元人民币。",[]],["袜子与帽子：顺带卖的配饰也很便宜，可以凑单买几双好看的袜子或帽子当伴手礼。",[]]]},{"id":4519,"title":"8seconds","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.19 「🛍️｜8seconds」2230",[]],["🕙11:00-22:30｜💳 微信支付宝 ✅｜https://www.ssfshop.com/8Seconds/main",[]],["【逛店与避坑小贴士】",[]],["T 恤和基础款大概 100 多元人民币，针织衫和外套大概 200-500 元人民币，10 万韩币左右就能配齐全身穿搭，性价比超高。",[]],["风格定位：韩系简约风，不像有些快时尚过于学生气，更偏轻熟有质感。既有日常休闲款，也有很多适合上班通勤的轻职业装。",[]],["试衣服需要取号：试衣服需要取号（没有手机号可以找店员帮忙取号），建议先挑好衣服去取号，在等待期间继续逛其他楼层。",[]],["注意尺码：韩版衣服版型偏宽松，但部分单品（如西装外套）是落肩设计，建议试穿时注意肩宽和袖长，不要盲目拍码数。",[]],["注意透光问题：部分浅色或薄款衣服（如白衬衫、碎花裙）对着阳光可能会透，建议穿 Nu Bra 或打底，买之前对着光检查一下。",[]],["携程 9 折券：打开携程 APP 搜索“8seconds”，可以看到门店专属的 9 折优惠券。",[]],["当场退税：单笔满 15,000 韩元即可当场退税。",[]],["核对账单：有博主反馈结账时偶尔会被多收钱，建议结账时仔细核对小票再付款。",[]],["【必买热门单品推荐】",[]],["蓝色针织上衣：饱和度高的蓝色超级提气色，单穿或叠穿都好看。",[]],["灰色波点水桶包：好装又百搭，灰色波点比黑色更有味道，通勤逛街都能背。",[]],["经典 Oversized 西装外套：落肩设计很修饰身材，质感在线，适合日常通勤或约会穿。",[]],["软牛仔直筒裤：面料舒服，版型显瘦显腿直，是打造韩系松弛感的必备单品。",[]],["羊毛开衫与毛衣：秋冬上新了 Cashmia 系列，贴身穿完全不扎，袖口和领口细节做得很好。",[]]]},{"id":4537,"title":"MUSINSA Kicks","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.20 「👟｜MUSINSA Kicks」💗23",[]],["🕙11:00-23:00｜💳 微信支付宝✅",[]],["【逛店与避坑小贴士】",[]],["一定要试穿：不同品牌的码数偏差很大，比如 Rockfish 可能偏小，Puma 芭蕾鞋前部较窄。",[]],["扫码看折扣：每双鞋上都有二维码，用微信扫一扫就能看到实时的折扣价，非常透明。",[]],["当场退税：单笔满 15,000 韩元即可当场退税！结账时主动出示护照原件，直接付免税价。",[]],["价格参考：Rockfish 打折加退税后大概 300-400 元人民币，Puma 芭蕾鞋大概 320 元左右。",[]],["【必买品牌与热门款推荐】",[]],["Rockfish 芭蕾鞋与德训鞋：3 楼的重头戏！很多博主都在推，打折后加上退税，300-400 多人民币就能拿下，比国内专柜和明洞新世界便宜很多。",[]],["Puma 芭蕾鞋：1-2 楼有售，颜色超多，黑粉配色上脚非常好看，打折后价格也很香。",[]],["Adidas 与 Nike：有各种热门鞋款和限定款，比如 Adidas Samba 和华夫格外套，经常有折扣活动。",[]],["ASICS 与 Salomon：适合喜欢户外机能风和暴走舒适度的姐妹，款式全且价格划算。",[]],["KHIHO：韩国本土小众品牌，设计感强，价格亲民，适合追求不撞鞋的姐妹。",[]]]},{"id":4550,"title":"MUSINSA BEAUTY","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.21 「💄｜MUSINSA BEAUTY」💗23",[]],["🕙11:00-23:00｜💳 微信支付宝✅｜https://www.musinsa.com/main/beauty",[]],["【逛店与避坑小贴士】",[]],["当场退税：单笔满 15,000 韩元即可当场退税！结账时主动出示护照原件，直接付免税价。",[]],["核对账单：有博主反馈结账时偶尔会被多收钱，建议自己先算好总价，结账时仔细核对小票再付款。",[]],["【楼层分布与逛店指南】",[]],["这家店整整有 4 层（B1-3F），面积超大，建议从下往上逛：",[]],["B1 层（Beauty Onnuri 药局）：这是它家的精髓！和韩国知名药局合作的专区，有专业药剂师常驻（部分会说中文），可以买到很多 Olive Young 没有的药局级护肤、美容产品和保健品，沟通无障碍。",[]],["1F（彩妆 & 香氛 & 隐形眼镜）：汇聚了彩妆、香水、香氛和隐形眼镜。设有 Touch-up Bar 可以现场补妆试色，美瞳区还有屏幕可以虚拟试戴，不用真的戴进眼睛就能看效果。",[]],["2F（护肤 & Hair/Body Care）：护肤品、头发护理、身体护理产品都集中在这里。很多最近很火的韩国小众护肤品牌（如 DERMA FACTORY、WELLAGE）都能在这里找到。",[]],["3F（ASNEESUM Cafe & Terrace）：逛累了直接上楼休息！这里有咖啡厅和露台，最特别的是还有机器人咖啡师制作咖啡，还能在露台拍氛围感大片。",[]],["【必买小众宝藏品牌推荐】",[]],["这里有很多平时在网上刷到但怕踩雷的品牌，现在能直接上手试了：",[]],["ODDTYPE：Locksy Jelly Tint 果冻唇釉和 Unseen Balloon Tint 超人气，颜色温柔，上嘴很自然。",[]],["finv：星河气垫 最近超火！水光和哑光两种妆感分开做，带 SPF50 防护，上脸轻薄不厚重。",[]],["GLYF：四色高光盘 粉质细腻，亮片颗粒很细，上脸自然透亮，蓝色款用来提亮眼头超级好看。",[]],["2aN：Better Me 眼影盘 配色好看，粉质优秀，适合日常消肿和打造韩系氛围感。",[]],["Hwick Seoul：韩女感彩妆棒 和 高光棒，直接上脸晕开很方便，适合不太会用粉状腮红的新手。",[]],["marinavi：莞岛海域褐藻积雪草面霜，果冻质地但很轻盈，敏感肌用着温和舒服，换季维稳很绝。",[]]]},{"id":4569,"title":"弘大路演","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.22 「🪩｜弘大路演」🤩（17:30-21:30）",[]],["【观看指南】",[]],["黄金时段：周五、周六的 18:00 - 22:00 是演出最多、氛围最炸的时候，人流量也最大。",[]],["工作日：17:30 - 21:00 陆续开演，场次相对较少，但人少体验更好。",[]],["避雷提醒：千万不要中午去！白天几乎没有街头艺人演出。另外，下雨天大部分户外表演会直接取消，去之前一定要看好天气预报。",[]],["注意保暖：晚上风大，尤其是秋冬季节，建议多带件外套，可以带个折叠小坐垫或垫张纸坐在地上。",[]],["提前解决生理需求：看完表演再找厕所可能会排队，建议去之前先解决好，并备好充电宝。",[]],["【核心表演区与交通】",[]],["Red Road（红路步行街）：这是韩国最有名的街头公演地，红色铺装路面就是核心舞台。",[]],["交通定位：地铁 2 号线/机场线 弘大入口站 9 号出口，出来左转步行 1-3 分钟即可到达。",[]],["备选定位：如果 9 号口人太多挤不上去（周五周六晚上 9 号出口人多到非常拥挤），可以走 8 号口过街过来，或者导航到 H&M 或 好丽斯咖啡（할리스커피），咖啡店门口地上画着椭圆形的就是路演场。",[]]]},{"id":4580,"title":"works out","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.23 *「🛍️｜works out」2030",[]],["🕙12:00-20:30｜💳 微信支付宝✅｜https://www.worksout.co.kr/",[]],["【价格与退税攻略】",[]],["价格优势：大部分单品比国内买手店便宜 100-200 元人民币左右，打折季（如 7 月）很多单品价格非常香。",[]],["当场退税：单笔满 15,000 韩元即可当场退税。",[]]]},{"id":4585,"title":"Ason","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.24 「🛍️｜Ason」21",[]],["🕙12:00-21:00｜https://ason.kr",[]],["【逛店与避坑小贴士】",[]],["试衣间排队：周末人很多，试衣间一次只能拿 2 件衣服进去试。",[]],["注意尺码：它家的版型偏瘦，对身材有一定要求（尤其是上衣和修身款）。",[]],["注意面料：部分针织款或毛绒款（比如格纹裙）可能容易起球，买之前可以摸一下样品。",[]],["参考官网图：店里很多衣服前面会挂着官方的穿搭图，试衣服的时候可以直接参考，非常方便。",[]],["均价： 200-600 元人民币左右。",[]],["退税政策：建议结账时主动问清楚店员，并保管好小票和退税单。",[]],["支付方式：支持信用卡和韩元现金，部分门店可能不支持微信/支付宝，建议备好信用卡或韩元现金。",[]],["【必买热门单品推荐】",[]],["流浪包/Hobo包：它家最出圈的单品！软皮材质，自带复古机车风，容量大且自重轻。棕色和白色最火，但经常断货，去晚了可能只能看样品。",[]],["神裤（直筒/微喇/镰刀裤）：ason 的裤子版型一绝，超级显腿直显腿长。黑色微喇裤和经典直筒牛仔裤是必入款，梨形身材也能轻松驾驭。",[]],["斜肩罩衫/短袖：低饱和度的黑白灰和淡粉色，布料舒服，可以斜肩穿也可以当防晒衫。",[]],["刺绣贝壳包/铆钉包：设计感很强，带点甜辣风，非常适合日常通勤或约会背。",[]],["一字肩针织裙/格纹半裙：修身显瘦，细节感很好，适合秋冬叠穿在卫衣或厚外套里面。",[]]]},{"id":4602,"title":"Aland","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.25 「🛍️｜Aland」2230",[]],["🕙11:30-22:30｜https://a-land.co.kr",[]],["1楼有文创区和咖啡厅，2楼是男装，3楼是女装。风格偏年轻潮流，价格也很亲民。",[]]]},{"id":4605,"title":"NYUNYU House","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.26 「🛍️｜NYUNYU House」2245",[]],["🕙11:00-22:45",[]]]},{"id":4607,"title":"KT&G 想象空间","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.27 「🏬｜KT&G 想象空间」21",[]],["🕙11:00-21:00",[]],["【楼层分布与逛店指南】",[]],["这栋大楼设计感极强，清透玻璃窗搭配水泥原色，每一层都有不同的惊喜：",[]],["1F（文创杂货与手作）：核心购物区！汇聚了超多韩国本土设计师的手作文创、原创贴纸、插画周边、潮玩和平价伴手礼。还有超全的三丽鸥、Chiikawa、兔花花（Usahana）等 IP 周边。",[]],["2F（免费艺术展）：青年艺术家展览、绘画、装置艺术免费参观！空间很大，非常适合拍氛围感大片，逛完文创顺便看展，体验感拉满。",[]],["3F（艺术商店与咖啡厅）：可以收藏的画作、版画、摆件等，还有高层的咖啡厅和休息露台，适合逛累了喝咖啡、拍窗边人像。",[]],["B1（Live Hall 与影院）：韩国独立音乐的地标！可以容纳 400 人站席，配有高音质音响系统，经常举办独立乐队、说唱等小型公演。还有艺术影院和绘画手作工作室。",[]],["【逛店与避坑小贴士】",[]],["免费艺术展：2F 的艺术展是免费参观的，但部分特展（如 3-5F 的独立乐队特展）可能需要提前在 Naver 预约，去之前可以查一下当期展览。",[]],["注意辨别门店：一定要认准“상상마당（想象空间）”的招牌。",[]],["支持微信/支付宝：大部分门店支持支付宝和微信支付，结账时直接扫码。",[]],["退税政策：单笔满 15,000 韩元即可当场退税（部分门店），或者拿退税单去机场办理。",[]],["看演出买票：如果想去 B1 的 Live Hall 看独立乐队演出，需要提前在 Melon Ticket 或 YES24 Ticket 买票，一般提前两个月到两周开票。",[]]]},{"id":4621,"title":"Fallett","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.28 「🛍️｜Fallett」22",[]],["🕙12:00-22:00｜💳 微信支付宝✅｜https://fallett.co.kr/",[]],["【逛店与避坑小贴士】",[]],["主打韩系甜酷 + 鬼马少女风，又甜又酷，不幼稚。它家最出圈的是猫咪元素 T 恤和做旧棒球帽",[]],["找店指南：这家店在Covernat 楼上（和 Covernat 在同一栋楼，Covernat 在 1F 和 B1F，Fallett 在 2F），以 Covernat 或 HAHA 烤肉店 为参照物就很好找。",[]],["价格亲民：大部分衣服在 5万-10万韩元（约合人民币 250-500 元）之间",[]],["注意尺码：它家部分单品偏宽松，但有些修身款对身材有一定要求，建议亲自试穿，不要盲目拍码数。",[]],["注意面料：部分针织款或毛绒款可能容易起球，买之前可以摸一下样品确认质感。",[]],["支持退税：可以打退税单子，单笔满 15,000 韩元即可当场退税。",[]],["【必买热门单品推荐】",[]],["猫咪元素 T 恤：它家最出圈的爆款！各种可爱的猫咪印花和做旧设计，减龄又百搭。",[]],["球衣风 T 恤与卫衣：双面撞色印花、透气网眼拼接设计，运动少女风拉满，搭配工装裤或短裙都很酷。",[]],["卡通针织衫：猫咪、彩虹、爱心提花设计，宽松版型加上软糯质感，秋冬叠穿氛围感直接拉满。",[]],["做旧棒球帽：街头感满满，搭配任何衣服都很出片，是街拍热门单品。",[]],["名画涂鸦外套：把经典名画重新设计融合在图案中，大胆创新，适合想要表达个性的酷女孩。",[]],["阔腿牛仔裤：梨型身材的\"神裤\"，完美遮挡胯部，不显胯大，尺码友好，基本都能穿。",[]]]},{"id":4637,"title":"coysieo","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.29 「🛍️｜coysieo」21",[]],["🕙12:00-21:00｜💳 微信支付宝✅｜https://coyseio.com/",[]],["【逛店与避坑小贴士】",[]],["一楼是基础热销款，二楼有专门的 038主线和家居系列（其他店没有）。",[]],["结账时主动询问店员是否支持当场退税或机场退税。",[]],["注意尺码：它家部分单品偏宽松，但有些修身款对身材有一定要求。很多博主推荐 2 码比较合适，如果不确定一定要去试衣间上身试试。",[]],["试衣间限制：部分门店（如汝矣岛店）一次只能试 2 件衣服，弘大店人多的时候也需要排队。",[]],["注意面料：部分针织款或毛绒款可能容易起球，部分裙子（如浅色口袋裙）容易起皱，买之前可以摸一下样品，或者问问店员面料成分。",[]],["质量预期：他家的设计感和氛围感很足，但部分网友吐槽过线头多、缝合瑕疵等问题，买的时候记得仔细检查一下。",[]],["核对账单：有博主反馈结账时偶尔会被多收钱，建议结账时仔细核对小票再付款。",[]]]},{"id":4647,"title":"This is never that","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.30 「🛍️｜This is never that」21",[]],["🕙11:00-21:00｜https://thisisneverthat.com/",[]]]},{"id":4649,"title":"Sansangear","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.31 「🛍️｜Sansangear」21",[]],["🕙12:00-21:00",[]],["【逛店与避坑小贴士】",[]],["注意尺码：它家主打中性 Oversize 风，版型偏大。国内穿 L 码的，在韩国可能穿 S 或 M 码就够了，建议根据自己的体型和想要的宽松度选码，不要盲目拍大码。",[]],["融合户外机能、科技工装与街头美学。",[]],["试穿建议：羽绒服和夹克一定要去试衣间试试，看看肩宽和长度是否合适；它家的试衣间设计感很强。",[]]]},{"id":4656,"title":"AAKAM","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.32 「🛍️｜AAKAM」21",[]],["🕙12:00-21:00｜https://aakam.kr/",[]],["主打 80-2000 年代的复古做旧、Grunge 风和机能元素，版型宽松不挑人",[]],["注意尺码：它家一开始是做男装的，所以大部分尺码偏大，女生穿稍微有点挑身高。如果身材偏娇小，可能需要系腰带或选择偏修身款；建议亲自去试衣间上身试试，不要盲目拍码数。",[]]]},{"id":4660,"title":"ROH SEOUL","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.33 「👛｜ROH SEOUL」",[]],["【逛店与避坑小贴士】",[]],["主打极简主义和实用美学，Jennie、金高银 等明星私下上身过。",[]],["材质与风格：坚持使用植物鞣制的天然牛皮和麂皮，摸起来软糯又有韧性，越用越有复古光泽感。整体风格中性、现代、随性，属于那种背个三五年都不过时的“长期主义”单品。",[]],["二楼超好拍：二楼的家居展厅空间非常出片，阳光洒进来的时候氛围感极佳。",[]],["注意自重与容量：他家的包包主打“自重轻、容量大”，但不同款式自重还是有差异的，建议亲自上身试背，感受肩带的舒适度。",[]],["价格参考：包包均价在 1000-1600 元人民币左右（约 20万-30万韩币），靴子和鞋款价格也在千元上下。在韩系设计师品牌里，性价比非常高。",[]],["退税政策：建议结账时主动询问店员是当场退税还是机场退税。",[]],["支付方式：支持信用卡和韩元现金，部分门店支持支付宝和微信支付。",[]],["【必买热门单品推荐】",[]],["麂皮波士顿包：秋冬超火的爆款！有牛皮和麂皮两种材质可选，低饱和藏蓝或棕色超级复古，大容量且自重轻，单肩背轻松拿捏韩式慵懒感。",[]],["真皮大托特包：打工人和学生的通勤神器！容量超大，15 寸电脑轻松放下，皮质软糯有韧性，线条干净，搭配大衣或针织衫非常显气质。",[]],["经典水桶包：带有独特的皮革扣设计，既能点缀又能收紧包口，上身线条利落，有 3 个尺寸可选，中号最百搭不压身高。",[]],["Jennie同款尖头靴：除了包包，他家的靴子也非常值得试穿！皮质柔软，上脚舒服且修饰腿型，亮面款和麂皮款都很适合秋冬搭配裙子和裤子。",[]],["单肩 Hobo 包：肩带与包身通过打结方式连接，在极简轮廓中营造自然体积感，随性又高级，日常出门随手一抓就能背。",[]]]},{"id":4675,"title":"LMC.","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.34 「🛍️｜LMC.」21",[]],["🕙11:30-21:00｜💳 微信支付宝✅｜https://lostmanagementcities.com/",[]],["【逛店与避坑小贴士】",[]],["它家主打美式复古街头风，版型宽松不挑人，男女同款，甜酷和慵懒风都能轻松拿捏，被很多人称为“韩国街头风天花板”。",[]],["价格参考：T 恤和帽子大概在 5万-8万韩元（约合人民币 250-400 元），卫衣和外套在 10万-20万韩元（约合人民币 500-1000 元）。",[]],["折扣活动：弘大店经常有季节性折扣（如 26SS 中期折扣最高 30% OFF），而且满一定金额（如 7万韩元）还会赠送限定周边（如 SEOUL HOODIE BEAR 手机支架），送完即止，结账前一定要问问店员。",[]],["退税政策：单笔满 15,000 韩元即可当场退税或机场退税（弘大店部分情况需要去机场退）",[]],["注意尺码：LMC 主打中性 Oversize 风，版型偏大。国内穿 L 码的，在韩国可能穿 S 或 M 码就够了。",[]],["【必买热门单品推荐】",[]],["首尔限定卫衣/T 恤：弘大店专属的 SEOUL EDITION 系列，胸前有独特的首尔限定 Logo 或兔子印花，版型收腰显瘦，甜酷风拿捏得死死的，线下才能买到，千万别错过！",[]],["经典棒球帽/毛线帽：LMC 的帽子版型超好，戴上瞬间显头小！做旧感和质感都在线，颜色丰富，是性价比最高的入门款，随便搭都出片。",[]],["水洗牛仔外套：美式复古风的灵魂单品！做旧水洗工艺非常有层次感，版型宽松不挑人，男女都能穿，搭配短裙或工装裤都很酷。",[]],["尼龙薄防风夹克：春夏秋三季都能穿，材质轻盈且防风，纯色简约设计，共有卡其棕、灰蓝等多种颜色可选，通勤或轻户外都能驾驭。",[]],["豹纹印花卫衣：单看有点狂野，但上身就是美式复古甜心，意外地百搭，搭配牛仔裤就是纯正的街头酷盖风。",[]]]},{"id":4689,"title":"Miseki seoul","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.35 「🛍️｜Miseki seoul」",[]]]},{"id":4690,"title":"Marie mon dieu","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.36 「🥿｜Marie mon dieu」（周日店休）20",[]],["🕙11:00-20:00（周一到18:00）",[]]]},{"id":4692,"title":"Venhit","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.37 「🛍️｜Venhit」💗💙21",[]],["12:00-21:00｜https://venhit.co.kr",[]],["【品牌小档案】",[]],["风格定位：主打轻亚风 + Y2K 辣妹感，甜酷拿捏得刚刚好，不会过于夸张，日常出门完全能驾驭。",[]],["爱豆同款：TWS 金道勋、MINJU、NCT WISH、ILLIT 等超多爱豆都穿过它家。",[]],["设计亮点：迷彩元素、天使翅膀印花、铆钉刺绣、做旧细节，随便搭一件就很有态度。",[]],["粉色迷彩外套是线下限定款。",[]],["支持退税：可以退税，结账时主动出示护照原件，拿好退税单和小票，去机场自助机办理。",[]],["支付方式：支持信用卡和韩元现金，部分门店支持支付宝和微信支付。",[]]]},{"id":4701,"title":"aeae","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.38 「🛍️｜aeae」20",[]],["🕙12:00-20:00｜https://ae-ae.kr/",[]],["店面更大、陈列更萌，帽子款式最全，还能买到扭蛋环保袋（记得把壳子还回去）和星星限定耳机。",[]]]},{"id":4704,"title":"depound","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.39 「🛍️｜depound」20",[]],["🕙12:00-20:00｜https://www.depound.com/",[]],["主打“法式松弛 + 韩系精致”的穿搭氛围感。它家没有复杂的元素堆积，靠干净利落的剪裁、优质面料和低饱和莫兰迪色系出圈，被大家称为“韩女通勤必备”和“Lamaire 平替”。",[]],["合井店是一栋三层小洋房，空间超大，试衣服完全没人打扰，i 人天堂。",[]],["1 楼是生活杂货和发饰，2 楼是衣服，3 楼是包包最全的区域。",[]],["体验：店后面还有一个小花园可以拍照。平时有 5-7 折的折扣区，性价比极高。",[]],["价格区间：包包大概在 100-300 元人民币，衣服在 300-1000 元左右，在设计师品牌里性价比非常高。",[]],["支付方式：百货店和常规店支持退税，记得带护照；奥莱店一般不能退税。",[]],["尺码注意：它家版型偏宽松，但部分衣服尺码偏小，建议去实体店试穿，尤其是外套和裙子。",[]],["【必买单品推荐】",[]],["帆布拼皮托特包：品牌最火的单品！蝴蝶结设计自带法式浪漫，自重超轻，百元就能拿下。",[]],["网格包：今年超火的爆款，简直 Lamaire 网格包的平替，性价比非常高，上身很有质感。",[]],["麂皮通勤西装外套：剪裁利落，面料有质感，随便搭个 T 恤和牛仔裤就很好看，打工人必备。",[]],["针织打底衫与 Oversized 衬衫：面料软糯亲肤，版型宽松无束缚，低饱和色系上身自带温柔慵懒滤镜。",[]],["编织渔夫帽：对头大星人特别友好，搭配任何衣服都能提升整体氛围感。",[]]]},{"id":4719,"title":"Jichoi","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.40 *「🛍️｜Jichoi」（周一二三店休）19",[]],["🕙13:00-19:00｜https://jichoi.net/",[]],["【品牌小档案】",[]],["风格定位：主打都市机能感与制服体系，融合简约廓形与干练线条。它家不仅有硬核的机能风，还推出了很多带有玩偶 JITO 元素的“萌宅感”单品，甜酷拿捏得刚刚好。",[]],["爱豆同款：NewJeans 全员、世理奈 等超多爱豆都穿过它家，是韩女和留学生超爱的小众宝藏品牌。",[]],["【逛店与避坑小贴士】",[]],["价格参考：上衣大概 200-500 元人民币，下装 500-700 元，外套 800-1000 元，玩偶和挂件大概 200-300 元。",[]],["退税政策：建议结账时主动询问店员是当场退税还是机场退税。",[]],["支付方式：支持信用卡和韩元现金，部分门店不支持微信和支付宝。",[]],["部分商品仅展示：店内有些制品是仅展示不售卖的，想买萌物或衣服一定要和店员确认清楚。",[]],["结账台小惊喜：在合井店买单时，结账台会有一堆巨萌的小挂件小摆件可以送，买完记得问问店员有没有赠品。",[]],["【必买热门单品推荐】",[]],["JITO 兔子玩偶与周边：它家的灵魂爆款！超级可爱的兔子玩偶、饺子钥匙扣、小布包和挂件，很多韩女都会买去搭配包包。去合井店买玩偶，店员还会送花篮和小布包，仪式感拉满。",[]],["绿苹果卡通短袖：萌宅感满分，设计简约又有特色，穿上就是随性的松弛感，非常适合日常出街。",[]],["机能风拉链短袖帽衫：黑色拉链设计搭配运动裤和劳保鞋，都市少女的轻亚风拿捏得死死的，NewJeans 同款造型。",[]],["箱褶半裙与斗篷单品：机能风带点学院感，比较实穿多变，适合叠穿，蓝色调单品非常显白。",[]],["毛巾材质帽子与方巾：配饰也超有设计感，方巾搭配短袖非常出片，上面的徽章买短袖还会送。",[]]]},{"id":4736,"title":"DOMA 도마","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.41 「🥩｜DOMA 도마」2250",[]],["🕙12:00-22:50",[]],["【逛店与避坑小贴士】",[]],["店员全程帮烤：不用自己动手！店员会熟练帮忙把控火候，很多店员会英文，中国游客沟通零压力。",[]],["注意排队：作为弘大常年排队的老店，周末和节假日饭点人非常多，建议 11 点刚开门就去，或者错峰前往，避免等位太久。",[]],["排队方式：门口通常有大长队，一定要在门口的白板写上名字和人数排队！店员会出来点名，人不在现场会被直接擦掉名字。",[]],["支付方式：支持信用卡和韩元现金，部分门店可能不支持支付宝和微信，建议备好现金或信用卡。",[]],["【必点招牌推荐】",[]],["雪花牛肉拼盘：新手直接冲！一次性吃到多种部位的牛肉，雪花纹理超漂亮，肥瘦比例刚刚好，烤到外皮焦香内里巨嫩。",[]],["独家香草盐：DOMA的灵魂蘸料！不是普通的盐，而是加了香草的秘制调料，蘸烤肉吃解腻又增香，吃多完全不齁，很多游客临走前还会买几罐回国。",[]],["招牌大酱汤：被无数人种草的秘制大酱汤！汤汁浓郁醇厚，里面加了豆腐、牛肉粒和青辣椒，泡米饭直接炫一碗，配烤肉吃是绝配天花板。",[]],["生拌牛肉/生牛肉拌饭：肉质新鲜软糯，拌饭酱汁浓郁入味，口感清爽不腻，和烤肉搭配吃口感层次直接拉满。",[]],["无限续小菜：店里的小菜种类超级丰富，甚至有酱蟹、蜂蜜烤南瓜、泡菜和各类韩式小菜随便吃，性价比直接拉满。",[]],["特色蘸料：一定要蘸店里的独家薄荷盐或香草盐，解腻又增香，是这家的灵魂。",[]],["小菜续加：他家的辣酱蟹、蜜南瓜和泡菜等小菜可以无限续加，非常解腻，吃到喜欢的小菜也可以单独再加一份。",[]]]},{"id":4751,"title":"형님저요（黄仁勋同款）","area":"弘大","chapter":"6⃣️ Day 6（12.3｜周四）：弘大（15+40）（避开周日一二。周五/六路演多）","blocks":[["2.42 「🥩｜형님저요（黄仁勋同款）」",[]],["🕙15:00-1:00（店不大，下午五点后要排队，八点后去人少一点）",[]],["",["642.webp"]],["",["643.webp"]],["【探店小贴士】",[]],["明星同款打卡：店里有很多大佬和明星的签名照，黄仁勋坐过的桌子也有签名，可以找店员拍照打卡，追星女孩狂喜。",[]],["中文菜单：店里备有中文菜单，点单沟通没问题，支持信用卡支付。",[]],["店员帮烤：大部分座位有店员帮忙烤肉，火候掌握得很好，你只需要坐着等吃就行。",[]],["位置好找：就在弘大主街附近，逛完街顺路去吃非常方便，晚上弘大氛围很好，吃完还能去喝一杯。",[]],["【必点菜品推荐】",[]],["鲜牛肋条（신선우갈비）：招牌必点！牛肋条烤到边缘微焦，带有淡淡的奶香味，肉质鲜嫩多汁，很多博主和明星都夸好吃。",[]],["五层五花肉（오층삼겹살）：五花肉烤得滋滋冒油，外皮焦脆、内里软嫩，包着生菜和蒜片吃非常过瘾。",[]],["烤猪皮（돼지껍질）：非常有特色的菜品，烤到焦脆 Q 弹，口感像零食一样，但经常卖得快，去晚了可能点不到。",[]]]},{"id":4764,"title":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）",[]],["要爬坡！穿舒服的鞋！建议穿简约的内搭，方便试穿外套。带护照退税。",[]],["10:00出门",[]],["40min｜【2号线 圣水】毒岛方向｜5站 ➡️ 【新堂】换【6号线】2站➡️【药水】2号口",[]]]},{"id":4768,"title":"金猪饭店｜금돼지식당","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["1. 【午餐】🥩金猪饭店｜금돼지식당",[]],["🕙11:30-23:00｜💳 信用卡/现金｜米其林必比登推荐的猪肉专门店",[]],["【排队与取号攻略（重点！）】",[]],["现场扫码取号：到店后在门口的机器上扫码（使用 CatchTable 系统）登记手机号取号。",[]],["赶早拿第一批号：在 11:15 之前（比如 11:00）就到门口机器扫码取号，争取第一批进去。",[]],["下午错峰去拿号：避开中午 11:30-13:30 和晚上 17:30-20:00 的绝对高峰期。可以在下午 3 点左右去拿号，那时候人相对少一些，等位时间会缩短。",[]],["利用手机远程排队：在门口机器扫码注册 CatchTable 账号（建议用邮箱注册，不要留国内手机号，可能收不到通知）。取号后可以去附近逛街，快轮到你的时候会有邮件或电话通知，不用傻坐在店里。",[]],["实时看进度：取号后可以在手机上实时查看前面还有多少桌，不需要干坐在店里等。",[]],["二楼有签名墙：二楼吧台位能近距离看店员烤肉，墙上有很多明星（如权志龙、Lisa、Jisoo 等）的签名和留言，追星女孩记得去打卡。",[]],["全程帮烤：每桌都有专属店员帮忙烤肉，火候拿捏得很准，不用自己动手，坐着等吃就行。",[]],["注意烫嘴：肉烤好后直接放在铁盘上端上来，建议稍微放凉一下或者在葱醋蘸汁里涮一下再吃。",[]],["【必点招牌推荐】",[]],["五花肉与猪颈肉：他们家严选约克夏、蓝瑞斯和杜洛克杂交的 1+ 等级 YBD 猪肉，肉质 Q 弹、油花细腻且没有腥味。烤得外焦里嫩，蘸点盐就能吃出肉香。",[]],["罗勒叶包肉：一定要试！用新鲜的罗勒叶包着烤肉吃，带有一种类似木调香水的清新味道，完全解腻，很多博主都说是“打开新世界大门”的搭配。",[]],["烤猪皮：烤得滑嫩又 Q 弹，不费牙。搭配店里的韩式葱香酱油和黑糖黄豆粉蘸料，一半咸香一半香甜，有种吃甜品的错觉。",[]],["灵魂泡菜汤与拉面：泡菜汤非常酸爽开胃（韩国泡菜汤普遍偏酸），里面的肉很入味。套餐里搭配的拉面吸饱了汤汁，筋道好吃，是完美的收尾。",[]],["厚切黑猪五花肉：招牌必点，选用高品质 YBD 纯种猪肉，肥瘦相间。烤到外皮焦脆、内里爆汁，蘸盐或包着罗勒叶吃非常解腻。",[]],["后颊肉：肉质细嫩，带有独特的油脂香，烤好后搭配泡菜吃很绝。",[]],["火山鸡蛋羹：像火山一样蓬松的蛋羹，拌上底下的汤汁，非常入味。",[]],["烤肉罗勒叶：特色配菜，微烤一下包着肉吃，清香解腻，是这家店的灵魂吃法。",[]],["【价格与套餐参考】",[]],["双人套餐：约 8万 - 10.6万韩元（约合人民币 400-550 元），包含猪颈肉、后颊肉、五花肉、烤时蔬、泡菜汤和拉面，两个人吃刚刚好。",[]],["三人套餐：约 14.8万韩元（约合人民币 770 元），分量更足，适合 3 个朋友一起去。",[]],["人均消费：大概 200-260 元人民币，在米其林推荐的烤肉店里性价比还算不错。",[]]]},{"id":4792,"title":"LOW CLASSIC","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["2. *【逛逛｜LOW CLASSIC】",[]],["🕙12:00-20:00｜https://www.lowclassic.com",[]],["【品牌风格与江湖地位】",[]],["极简高级：2009 年由三位首尔女生创立，主打“低调的经典”。干净线条、松弛廓形、中性色调，平衡了东方内敛与西方简约。它家被很多买手和博主称为 Lemaire 的平替，主打极简廓形和高级面料感。",[]],["明星同款：超模 Rosie Huntington-Whiteley 超爱它家的风衣，Jennie、欧阳娜娜、IU 也都穿过它家的经典单品，是韩系女主穿搭的首选。",[]],["性价比：相比 Lemaire 和 Celine，它家的价格更友好，是入门高级极简风的绝佳选择。",[]],["【楼层分布】",[]],["B1：Cafe Wildduck，复古时髦的 Brunch 咖啡厅，有室内和户外空间，适合逛累了去喝杯咖啡。",[]],["1F：LC STORE 和开放式 Lounge，空间松弛，有休息区和露台，适合短暂停留。",[]],["2F：Low Classic 主线服饰和杂货，质感更佳，还有本土香氛品牌 수집미학 的空间。",[]],["3F & 4F：品牌设计工作室和更多服饰区域，空间宽敞，人不多，拍照很舒服。",[]],["【价格与退税攻略】",[]],["价格参考：T 恤和打底衫均价500+，风衣和外套大概 2k+，包包大概 1000-2000 元。",[]],["折扣活动：换季时经常有 8 折到 85 折的活动（衣架上有贴红标），羊毛大衣八折后税后 2000 不到。",[]],["当场退税：单笔满 15,000 韩元即可当场退税！结账时主动出示护照原件，直接付免税价。",[]],["【必买热门单品推荐】",[]],["立领系带风衣：它家的灵魂爆款！直线剪裁，廓形松弛但不邋遢，卡其色或灰调米色闭眼选。上身效果冷淡、知性、有钱但不张扬，和 Lemaire 相似度极高。",[]],["Oversize 西装：利落剪裁，适合通勤和日常，搭配阔腿裤就是妥妥的韩系大女主。",[]],["垂感阔腿裤：面料高级，版型修饰腿型，随便搭一件基础款 T 恤都很有质感。",[]],["极简针织衫：低饱和色系，贴身但不紧绷，秋冬叠穿必备。",[]],["折叠立方体迷你包 & 面包型手提袋：包包设计感强，容量实用，搭配任何衣服都出片。",[]],["15min【6号线 药水站】波堤岭站方向｜2站 ➡️ 【汉江镇站】｜3号口出",[]],["3. 【汉南洞】（52）（定位可能会乱飘，可以提前截图地图/靠感觉走）",[]]]},{"id":4816,"title":"The Barnnet","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.1 「🛍️｜The Barnnet」",[]],["🕙11:00-20:00｜https://the-barnnet.com/",[]],["注意面料质感：它家部分基础款面料手感一般，建议去店里亲自摸一下面料再决定，不要盲目跟风。",[]]]},{"id":4819,"title":"Milestone","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.2 「☕️｜Milestone」",[]],["🕙10:00-20:00",[]],["【避坑与排队指南】",[]],["堂食必须等位登记：如果想进店坐，不能直接排队点单，要在门口的小本本上登记姓名和人数，等店员叫号有位置了，才能进去排队点单。外带的话直接进去点单就行，不用等位。",[]],["支付限制：只收韩元现金或 Visa/Mastercard 信用卡。",[]],["甜品偏甜：韩国的甜品普遍比国内甜，如果平时不太能吃甜，建议单点咖啡，或者搭配无糖的冷萃。",[]],["【必点招牌推荐】",[]],["维也纳咖啡（Vienna Coffee）：他家的绝对灵魂！上面铺着厚厚一层绵密咸甜的鲜奶油，下面是浓郁的浓缩咖啡。千万不要搅拌，先挖一口奶油，再喝一口咖啡，苦甜交织，口感醇厚丝滑，完全不腻。",[]],["提拉米苏：空气感很强，入口即化，微甜不腻，和维也纳咖啡是神仙搭配。不过因为太火，下午去经常卖完，想吃的建议上午去。",[]],["燕麦拿铁：如果不喜欢奶油的甜腻，点一杯燕麦拿铁也很惊艳，豆奶的谷物香气和咖啡融合得刚刚好，回味带着坚果香。",[]],["",["644.webp"]],["",["645.webp"]]]},{"id":4832,"title":"Aesop","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.3 「✨｜Aesop」",[]],["🕙11:00-21:00｜💳 微信支付宝✅",[]],["【避坑与实用 Tips】",[]],["确认退税单：买完一定要让店员录入护照信息并开好退税单，千万别把小票弄丢。",[]],["关注赠品活动：汉南洞和西村店的赠品最丰富，买之前可以问问店员“现在有什么活动或赠品吗”，有时候能拿到正装或限定帆布袋。",[]],["特色：拥有韩国首个定制化面部护理室，外表是石板灰砖，内部用大量回收红砖打造，氛围感拉满。店员服务超级好，会耐心帮你试用产品，赠品非常大方（有博主反馈买了 3000 多直接送了一瓶正装洗面奶！）。满 40 万韩元还会送限定首尔帆布袋。",[]],["虽然价格没有免税店那么低，但赠品非常大方，经常能拿到正装洗面奶或一堆实用小样。",[]],["免税店：新世界或乐天免税店经常有折扣（如 2 件 7 折、3 件 8 折），加上返点，价格极其香。但部分免税店需要机场提货，部分可以当场退税，结账时记得问清楚。",[]],["【必买热门单品推荐】",[]],["Aurner 香水：非常典型的木质花香调，前调有白花和洋甘菊，中后调过渡到茶香和木质香，层次分明，很多喜欢 Le Labo 29 的人都会爱上这款。",[]],["天竺葵身体去角质露：颗粒感适中，洗完皮肤很滑，味道是清新的草本柑橘调。",[]],["B3C 面霜：修护屏障的神器，质地扎实但不黏腻，适合敏感肌和秋冬保湿。",[]],["澄颖精华：提亮肤色、改善暗沉，搭配按摩手法吸收很快，熬夜党必备。",[]],["护手霜套装：价格亲民，味道好闻，非常适合买来当伴手礼送同事和朋友。",[]]]},{"id":4846,"title":"Hetras","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.4 「✨｜Hetras」",[]],["🕙11:00-21:00｜💳 微信支付宝✅｜https://hetras.co.kr/",[]],["【避坑与实用 Tips】",[]],["限定福利：有汉南洞限定手工香水（粉粉亮片绒布包装，果香+牡丹花香），别的地方买不到。另外，佩戴银饰进店可以免费领香氛湿巾，还能体验 DIY 刻字名字印章。",[]],["香水留香时间：他家的香水主打清新自然，留香时间相对较短（大概 3-5 小时）。",[]],["注意保质期：记得看一下包装上的生产日期，尽量选新的。",[]],["满赠活动：买满 7 万韩元可以自选一个挂件，买满 15 万或 20 万韩元还会送限定帆布袋或带轮子的购物车，结账前记得问店员当前有什么活动。",[]],["特色：地下一层有超大的“航海时代大帆船”装置，沉浸感极强！最重要的是有汉南洞限定香味（Robe White 等），别的地方买不到。买满金额还能定制印章，体验感满分。",[]],["【价格与退税攻略】",[]],["护手霜：单支大概 8000-9900 韩元，买 5 支以上通常能打折（约 7000 韩元/支）。国内38/58一支，但经常断货",[]],["香水：大概 4万-6万韩元（折合人民币 200-400 元），比国内专柜便宜很多。",[]],["室内香薰：大概 25800 韩元/3 瓶（500ml），通常必须 3 个同一味道才能一起购买。",[]],["价格优势：线下实体店买护手霜（5 支以上）和 1L 装的身体乳/沐浴露（约 9500 韩币）性价比极高，比在 Olive Young 单买划算很多。",[]],["退税方式：支持现场即刻退税！单笔消费满 15,000 韩元即可。",[]],["【必买热门香型推荐】",[]],["汉南洞限定香水（Hanam 739-8）：灵感来自汉南洞的门牌号。味道是清透水润的桃子香混合柠檬与茉莉，带着一丝慵懒的小暧昧，非常适合春夏，包装也是汉南洞限定版。",[]],["Hotel Wood（酒店木质香）：招牌爆款！像五星级酒店大堂的高级木质香，沉稳干净，男女皆宜，留香持久，非常适合秋冬。",[]],["Daisy（雏菊）：GD 同款！清新的雏菊与洋甘菊香，不甜不腻，自带少年感。",[]],["Artist（艺术家）：淡淡的高级香，清甜花果香融合草木绿意，尾调转为温暖木质，适合喜欢淡香的人。",[]],["Flower Park（花店）：原 Flower Shop 改名，清新的柠檬玫瑰混合茉莉，像初春街边的淡淡花香，不甜腻，盲买不出错。",[]],["Hug Soap（拥抱皂香）：干净温暖皂香，像刚晒过太阳的被子，适合喜欢伪体香的人，温柔又舒服。",[]],["Jeju Saryeoni Forest（济州森林）：清新的柑橘混合木质香，像在森林里散步，非常适合做室内扩香或身体喷雾。",[]],["Santal Fresh（清新檀香）：木质调， Le Labo 33 平替，很疗愈，适合喜欢雪松和檀香的人。",[]]]},{"id":4869,"title":"Musinsa Standard","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.5 「🛍️｜Musinsa Standard」",[]],["🕙11:00-21:00",[]]]},{"id":4872,"title":"misekiseoul","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.6 *「🛍️｜misekiseoul」💗💙",[]],["🕙11:30-20:00｜💳 微信支付宝✅｜https://www.misekiseoul.kr",[]],["【避坑与实用 Tips】",[]],["T 恤和帽子大概在 200-400 元人民币，卫衣和针织衫 400-800 元，外套和连衣裙 600-1200 元。相比国内代购，线下实体店价格更有优势。",[]],["退税政策：单笔满 15,000 韩元即可退税，务必带上护照原件！汉南洞店和龙山店可以当场退税，免税店则是直接免税价。",[]],["注意面料特性：有博主反馈他家的部分上衣面料偏薄，初次水洗可能会有浮毛，建议买回家后轻柔手洗或干洗，不要用力搓揉。",[]],["尺码选择：他家的衣服很多是 1 码和 2 码，部分低腰长裤不能参考腰围，要参考胯围和臀围。如果卡码，建议买大一码，或者带一条自己合身的低腰裤去店里对比数据。",[]],["试穿注意：部分小飞袖或露肩款式对圆身、大臂粗的女生不太友好，容易显胖，一定要亲自试穿。",[]],["退税方式：实体店购买支持现场退税（单笔消费满 15,000 韩元），不需要去机场退税。",[]],["【必买推荐】",[]],["斜腰带中长裙：标志性斜腰带设计，饱满伞裙轮廓加百褶肌理，学院感拉满，秋冬搭配短款大衣。",[]],["侧开襟叠层靴型裤：斜向剪裁加裤脚开衩微喇版型，超级拉长腿部线条，轻机能风，日常通勤适配。",[]],["连帽双扣短外套：秋冬刚需短款毛呢外套，双排扣加连帽设计，灰色和黑色两个经典配色，从换季一直可以穿到深冬。",[]],["褶皱手提包：软 fufu 的小羊皮质感，自带自然褶皱肌理，保龄球包的长条轮廓搭配两侧拉链口袋，实用度拉满，清冷韩系小姐姐即视感。",[]],["Rei 同款黑白灰卫衣：简约但不简单，版型无敌，随便搭牛仔裤或半身裙就很有氛围感。",[]]]},{"id":4887,"title":"SW19","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.7 「✨｜SW19」",[]],["🕙11:00-21:00｜💳 微信支付宝✅｜https://sw19official.com/",[]],["【价格与免税店“薅羊毛”攻略】",[]],["实体店价格：12ml 大概 36,000 韩元（折合人民币 190 元左右），50ml 大概 50,000 韩元（折合人民币 250-300 元左右）。支持现场退税，单笔满 15,000 韩元即可，结账出示护照直接扣税。",[]],["免税店更划算：在实体店试香，然后去 新罗免税店 或 乐天免税店 的 APP 下单，凑单后 50ml 可能只要 100 元人民币左右。",[]],["【避坑与实用 Tips】",[]],["留香时间较短：SW19 的香水主打清新自然，留香时间大概在 3-5 小时左右，其中 Midnight 留香相对较短。建议随身带个小瓶补香，或者多喷一点在衣服和围巾上。",[]],["关注赠品活动：汉南洞店经常有买香水送同口味冰淇淋、DIY 串珠挂件或爱豆小样的活动，结账前记得问店员当前有什么福利。",[]],["特色：空间更大，有旋转时钟装置和拍照区。最绝的是店里可以品尝到和香水味道对应的意大利冰淇淋（Gelato），五感立体体验香气！店员会说中文，服务很贴心，经常有新品打折或送爱豆小样、DIY 挂件的活动。",[]],["【必买热门香型推荐】",[]],["他家的香水以“一天中不同时间的气味变化”为灵感，每一款都对应着不同的氛围感，盲买也不容易踩雷：",[]],["Midnight（午夜）：边伯贤、尹净汉 同款！主打麝香与木质调，混合着淡淡的奶味和檀香。清冷又温暖，像首尔夜晚的风，非常适合作为“伪体香”，男女皆宜。",[]],["3pm（下午三点）：前调是清爽的柑橘和佛手柑，中后调过渡到雪松、茉莉和白麝香。干净松弛，不甜腻，适合一年四季日常喷，随身带 12ml 小支超方便。",[]],["5pm（下午五点）：新品玫瑰香调，带有果香和木质香的混合，浓郁但不厚重。甜而不腻，喷上后显得优雅温柔，非常适合秋冬或约会时使用。",[]],["8am（早晨八点）：超级治愈的晨光清香，带着雪松和麝香的温暖感，像清晨醒来躺在柔软床上、打开窗户看到阳光的感觉，干净又平静。",[]],["6am（清晨微风）：非常清新的花香木质调，像清晨公园里的空气，温柔又治愈，送人超级有仪式感。",[]],["Bed & Room Spray（枕边喷雾）：除了香水，他家的床品喷雾也很火，比如温柔的奶香味，睡前喷在枕头上，感觉做梦都是香甜的。",[]]]},{"id":4905,"title":"TANNAT","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.8 「🛍️｜TANNAT」（周一、二休息）",[]],["🕙12:00-20:00｜💳 微信支付宝✅｜https://tannat.kr/",[]],["【价格与退税攻略】",[]],["上衣大概100 - 300 元人民币，裙子和裤子 300 - 500 元，外套 500 - 1000 元左右。",[]],["退税方式：支持现场退税！单笔消费满 15,000 韩元即可，不需要去机场退税。",[]]]},{"id":4910,"title":"SAN SAN GEAR","area":"汉南洞 / 梨泰院","chapter":"7⃣️ Day 7（12.4｜周五）：汉南洞/梨泰院（52）（避开周一、周二）","blocks":[["3.9 「🛍️｜SAN SAN GEAR」💙",[]],["🕙11:00-20:00｜https://sansangear.com/",[]
