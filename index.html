<!doctype html>
<html lang="zh-CN" data-app-version="home-19">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#24ab8b">
  <title>首尔开门指南</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%2324ab8b'/%3E%3Cpath d='M12 31V11h16v20m-16 0h16m-5-10h1' stroke='%230b392d' fill='none' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./site.js?v=images-15"></script>
  <script defer src="./stores.js"></script>
  <script defer src="./app.js?v=home-17"></script>
</head>
<body class="hours-page">
  <main>
    <header class="hero">
      <div class="hero-copy">
        <div class="eyebrow"><span class="pin" aria-hidden="true"></span> SEOUL · STORE HOURS</div>
        <h1>首尔开门指南</h1>
        <p id="offline" role="status">正在准备离线使用…</p>
      </div>
      <a class="map-entry" href="./guide.html" aria-label="打开首尔百事通">
        <img src="./seoul.svg" alt="粉色首尔地图" width="268" height="211">
      </a>
    </header>
    <section class="filters" aria-label="筛选营业店铺">
      <label><span>商圈</span><select id="area"><option value="">全部商圈</option></select></label>
      <label><span>时间</span><select id="time"><option value="">当前时间</option></select></label>
      <label id="custom-field" hidden>今天的韩国时间<input id="custom-time" type="time"></label>
    </section>

    <section class="results" aria-labelledby="results-title">
      <div class="section-top">
        <h2 id="results-title">营业中</h2>
        <span id="count" class="count" aria-live="polite"></span>
      </div>
      <div class="columns" aria-hidden="true"><span>店铺</span><span>关门时间</span></div>
      <ul id="shops" class="shops"></ul>
      <p id="empty" class="empty" hidden>这个时刻没有查到营业的店。可以试试其他时间或商圈。</p>
      <details id="other" class="other" hidden>
        <summary id="other-title"></summary>
        <ul id="other-shops" class="shops"></ul>
      </details>
    </section>

    <footer><p>状态根据攻略时段推算。临时停业、节假日调整以门店公告为准。</p></footer>
  </main>
</body>
</html>
